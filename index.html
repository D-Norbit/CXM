<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sổ tay giảng dạy CXM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sổ tay hai cột – mục lục chương trình bên trái, trang nội dung bên phải; slide là "trang in" trắng đặt trên nền giấy xám xanh */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --ink:#1E2533; --muted:#5B6577; --line:#DCE0E6; --soft:#EEF0F3;
  --accent:#C9652B; --accent-soft:#FBEADF; --accent-ink:#8A3F14;
  --sans:'Be Vietnam Pro', 'Segoe UI', Arial, sans-serif; --mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13171F; --surface:#1B212C; --ink:#E8EBF0; --muted:#9AA3B2; --line:#2C3442; --soft:#232A36;
  --accent:#F0904F; --accent-soft:#3A271C; --accent-ink:#F6B88C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13171F; --surface:#1B212C; --ink:#E8EBF0; --muted:#9AA3B2; --line:#2C3442; --soft:#232A36;
  --accent:#F0904F; --accent-soft:#3A271C; --accent-ink:#F6B88C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.2;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand b{font-size:16px;font-weight:800;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.search{margin-left:auto;flex:1 1 260px;max-width:420px;display:flex}
.search input{width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.shell{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:calc(100vh - 60px)}
nav.toc{border-right:1px solid var(--line);background:var(--surface);padding:16px 12px 40px;position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
.toc h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 8px 6px}
.toc button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:6px 8px;cursor:pointer;color:var(--ink)}
.toc button:hover{background:var(--soft)}
.toc button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.toc .part{font-weight:600;font-size:13.5px;display:flex;gap:8px;align-items:baseline}
.toc .part small{color:var(--muted);font-weight:500;font-family:var(--mono);font-size:11px;margin-left:auto}
.toc .sl{font-size:13px;padding-left:22px;color:var(--muted);display:flex;gap:8px}
.toc .sl code{font-family:var(--mono);font-size:11px;flex:none;padding-top:2px}
.toc .sl.on{color:var(--accent-ink)}
.toc details summary{list-style:none;cursor:pointer}
.toc details summary::-webkit-details-marker{display:none}
main{padding:28px clamp(16px,4vw,48px) 80px;min-width:0}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1{font-size:clamp(26px,3.4vw,38px);line-height:1.15;letter-spacing:-.02em;margin:0;text-wrap:balance;font-weight:800}
h2{font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:16px;margin:0}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.lede{color:var(--muted);max-width:68ch;margin:6px 0 0}
.meta{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--muted);font-size:13px}
.meta b{color:var(--ink);font-family:var(--mono);font-weight:500}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.sessions{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.sess-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.parts{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.prow:hover .pname{color:var(--accent-ink)}
.prow>.chip{align-self:start;white-space:nowrap}
.brand:focus:not(:focus-visible){outline:none}
.prow .min{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px}
.pname{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.chip.act{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--soft);display:flex;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%}
.note{font-size:13px;color:var(--muted)}
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.case{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.case .num{font-family:var(--mono);font-size:12px;color:var(--accent)}
.slide-list{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:9px 4px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.srow:hover{background:var(--soft)}
.srow code{font-family:var(--mono);font-size:12px;color:var(--muted)}
.stage-wrap{width:100%;aspect-ratio:16/9;max-width:100%;position:relative;overflow:hidden;border-radius:10px;border:1px solid var(--line);background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(20,30,50,.08)}
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.stage>section{position:relative;width:1920px;height:1080px;overflow:hidden;box-sizing:border-box}
.stage h1,.stage h2,.stage h3,.stage p{margin:0}
.slide-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start}
.nav-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--accent)}
.crumb{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.crumb button{background:none;border:0;padding:0;cursor:pointer;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.pill{display:inline-block;background:var(--accent);color:#fff;font-weight:700;font-size:13px;border-radius:999px;padding:4px 12px}
.points{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.script{display:flex;flex-direction:column;gap:2px}
.script .sh{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--accent);margin-top:14px}
.script p{margin:4px 0;max-width:72ch}
.script .key{background:var(--accent-soft);color:var(--accent-ink);border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 8px 8px 0;font-weight:600;margin:10px 0}
.script ul{margin:4px 0;padding-left:20px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;border-top:0}
.tbl{overflow-x:auto}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{margin-top:4px;accent-color:var(--accent)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-family:var(--mono);font-size:12px}
mark{background:var(--accent-soft);color:var(--accent-ink);border-radius:3px}
.menu-btn{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  nav.toc{position:fixed;inset:60px 0 0 0;height:auto;z-index:4;display:none}
  nav.toc.open{display:block}
  .menu-btn{display:inline-block}
  .slide-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.toc button,.srow,.btn{transition:background .15s,border-color .15s}}

.lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px 16px}
.lock form{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(20,30,50,.10)}
.lock h1{font-size:24px}
.lock label{font-size:13px;font-weight:600}
.lock input{padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.lock button{padding:10px 14px;border-radius:8px;border:0;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
.lock button:disabled{opacity:.6;cursor:wait}
.lock .err{color:#B42318;font-size:14px;font-weight:600;min-height:1.4em;margin:0}
:root[data-theme="dark"] .lock .err{color:#FDA29B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lock .err{color:#FDA29B}}
</style>

</head>
<body>
<div class="lock" id="lock">
  <form id="lockForm" autocomplete="off">
    <div class="eyebrow">FPT MiniMBA 2026 · Quản trị trải nghiệm khách hàng</div>
    <h1>Sổ tay giảng dạy CXM</h1>
    <p class="note" style="margin:0">Nội dung dành cho giảng viên. Vui lòng nhập mật khẩu để truy cập.</p>
    <label for="nm">Tên</label>
    <input id="nm" type="text" required autofocus>
    <label for="pw">Mật khẩu</label>
    <input id="pw" type="password" required>
    <p class="err" id="err" role="alert"></p>
    <button type="submit" id="unlockBtn">Truy cập</button>
  </form>
</div>
<header class="top" hidden id="topbar">
  <button class="btn menu-btn" id="menuBtn" aria-label="Mở mục lục">Mục lục</button>
  <button class="brand" id="home"><b>Sổ tay giảng dạy CXM</b><span>Quản trị trải nghiệm khách hàng · FPT MiniMBA 2026 · GV. Đan Tuấn Anh</span></button>
  <div class="search"><input id="q" type="search" placeholder="Tìm slide, case, từ khóa trong script…" aria-label="Tìm kiếm"></div>
</header>
<div class="shell" hidden id="shellbox">
  <nav class="toc" id="toc" aria-label="Mục lục chương trình"></nav>
  <main><div class="wrap" id="view"></div></main>
</div>

<script type="application/json" id="data">{"parts": [{"id": "s1", "session": 1, "name": "Mở đầu: CXM Bingo, phân loại trải nghiệm, 10 từ về CX, mục tiêu và bốn case", "slides": ["b1-01", "b1-01b", "b1-01c", "b1-01d", "b1-02", "b1-03", "b1-04"]}, {"id": "s2", "session": 1, "name": "Phần 1: Vì sao trải nghiệm tạo ra mức sẵn sàng chi trả cao hơn?", "slides": ["b1-05", "b1-06", "b1-07", "b1-08", "b1-09", "b1-10", "b1-11", "b1-12", "b1-13"]}, {"id": "s3", "session": 1, "name": "Phần 2: CX khác gì chăm sóc khách hàng, và ai chịu trách nhiệm quản trị CX?", "slides": ["b1-14", "b1-15", "b1-16", "b1-17", "b1-18", "b1-19", "b1-20", "b1-21"]}, {"id": "s4", "session": 1, "name": "Giải lao", "slides": ["b1-22"]}, {"id": "s5", "session": 1, "name": "Phần 3: Doanh nghiệp thực sự hiểu khách hàng đến mức nào? – kèm workshop Persona & Empathy Map", "slides": ["b1-23", "b1-24", "b1-25", "b1-26", "b1-27", "b1-28", "b1-29", "b1-30", "b1-31", "b1-31b"]}, {"id": "s6", "session": 1, "name": "Phần 4: Khách hàng trải qua doanh nghiệp theo hành trình nào?", "slides": ["b1-32", "b1-33", "b1-34", "b1-35", "b1-36", "b1-37", "b1-38", "b1-39"]}, {"id": "s7", "session": 1, "name": "Tổng kết, thông điệp và hành động trước Buổi 2", "slides": ["b1-41", "b1-42", "b1-43"]}, {"id": "s8", "session": 2, "name": "Mở đầu: lựa chọn giữa làm khách thích thú và giúp khách bớt vất vả, mục tiêu, chia sẻ bài tập", "slides": ["b2-01", "b2-02", "b2-03", "b2-04"]}, {"id": "s9", "session": 2, "name": "Phần 1: Vì sao trải nghiệm tệ vẫn lặp lại dù nhân viên đều cố gắng?", "slides": ["b2-05", "b2-06", "b2-07", "b2-08", "b2-09", "b2-10"]}, {"id": "s10", "session": 2, "name": "Phần 2: Làm thế nào để thiết kế những khoảnh khắc khách hàng ghi nhớ?", "slides": ["b2-11", "b2-12", "b2-13", "b2-14", "b2-15", "b2-16", "b2-17"]}, {"id": "s11", "session": 2, "name": "Giải lao", "slides": ["b2-18"]}, {"id": "s12", "session": 2, "name": "Phần 3: Làm thế nào để đo lường trải nghiệm và gắn nó với kết quả kinh doanh?", "slides": ["b2-19", "b2-20", "b2-21", "b2-21a", "b2-21b", "b2-22", "b2-23", "b2-24", "b2-25"]}, {"id": "s13", "session": 2, "name": "Phần 4: Lãnh đạo và CX; trình bày sáng kiến; workshop và triển lãm bản đồ hành trình A1", "slides": ["b2-26", "b2-27", "b2-28", "b2-29", "b2-30", "b2-31", "b2-31a", "b2-31b"]}, {"id": "s14", "session": 2, "name": "Tổng kết học phần, thông điệp và hành động trong 30 ngày", "slides": ["b2-32", "b2-33", "b2-34"]}], "slides": [{"id": "b1-01", "label": "B1 · 01", "session": 1, "part": "s1", "title": "Trang bìa – Buổi 1", "activity": "", "points": ["FPT MiniMBA 2026", "Buổi 1 · GV. Đan Tuấn Anh"], "notes": "① MỞ\n\"Trước khi bắt đầu, xin anh chị nghĩ về một thương hiệu mà mình đã lặng lẽ không quay lại trong năm vừa qua – không phải vì giá. Anh chị còn nhớ khoảnh khắc khiến mình quyết định như vậy không?\" Dừng khoảng mười giây. Đừng vội gọi ai, chỉ để câu hỏi \"ngấm\".\n\n② GIẢNG\nGiới thiệu học phần gồm hai buổi. Buổi 1 trả lời ba câu hỏi: vì sao trải nghiệm khách hàng là chiến lược chứ không chỉ là dịch vụ; khách hàng của chúng ta thực sự là ai và họ nghĩ gì; khách hàng đi qua doanh nghiệp theo hành trình nào. Buổi 2 đi vào thiết kế, đo lường và vận hành. Cách học: ít định nghĩa, nhiều tình huống. Mỗi nhóm sẽ đóng vai ban điều hành của một doanh nghiệp đang gặp vấn đề về trải nghiệm, xuyên suốt hai buổi.\n\n③ MINH HỌA\nCon đường trên slide chính là một hành trình khách hàng. Mỗi chấm màu là một khoảnh khắc: có khoảnh khắc làm khách hài lòng, có khoảnh khắc khiến họ quay lưng. Ví dụ thực tiễn: \"United Breaks Guitars\". Năm 2008, nhạc sĩ người Canada Dave Carroll bay cùng United Airlines và phát hiện cây đàn guitar Taylor trị giá khoảng 3.500 USD bị nhân viên bốc xếp làm gãy. Anh theo đuổi khiếu nại suốt khoảng chín tháng, qua nhiều bộ phận, và đều bị từ chối bồi thường. Ngày 6/7/2009, anh đăng lên YouTube bài hát \"United Breaks Guitars\": khoảng 150.000 lượt xem trong ngày đầu và tới nay khoảng 30 triệu lượt. Chuyến bay đúng giờ, ghế ngồi ổn – nhưng một khoảnh khắc ở khoang hành lý và chín tháng bị từ chối đã trở thành điều cả thế giới nhớ về hãng. Lưu ý: con số \"cổ phiếu United mất 180 triệu USD\" thường được trích dẫn nhưng khó kiểm chứng, không nên dùng. Giảng viên có thể kết hợp thêm một trải nghiệm thật của chính mình.\n\n④ LIÊN HỆ\nVới một CEO, trải nghiệm khách hàng không phải là việc của phòng chăm sóc khách hàng. Nó là cách doanh nghiệp giữ doanh thu, bảo vệ biên lợi nhuận và xây dựng lợi thế mà đối thủ khó sao chép. Hai buổi này không nhằm biến anh chị thành chuyên gia vẽ bản đồ hành trình, mà giúp anh chị đặt đúng câu hỏi cho đội ngũ.\n\n★ CÂU CHỐT: \"Khách hàng hiếm khi nói lời chia tay. Họ chỉ lặng lẽ không quay lại.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Anh chị mong mang về điều gì cụ thể từ hai buổi học này cho doanh nghiệp của mình?\"\nNếu lớp im lặng: mời hai người ngồi gần nhất, hoặc đề nghị mỗi người nói một từ khóa.\nCâu trả lời thường gặp: \"đo NPS cho đúng\", \"giảm khiếu nại\", \"làm sao nhân viên phục vụ tận tâm\", \"giữ khách lâu hơn\". Phản hồi: ghi các từ khóa lên bảng, hứa sẽ trả lời ở phần cụ thể (đo lường ở Buổi 2 – Phần 3, nhân viên ở Buổi 2 – Phần 4). Cuối buổi 2 quay lại bảng này để \"đóng vòng\".\n\n⑥ CHUYỂN Ý\n\"Trước khi nói về khách hàng của doanh nghiệp, hãy bắt đầu từ chính chúng ta – ai trong phòng này cũng là khách hàng. Mời anh chị cầm thẻ Bingo lên.\"", "html": "<section id=\"b1-01\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; justify-content:center; gap:36px\">\n<p style=\"font-size:60px; font-weight:700; color:#E2783B\">FPT MiniMBA 2026<\/p>\n<h1 style=\"font-size:104px; font-weight:800; line-height:1.1; color:#1E2533\">Quản trị trải nghiệm khách hàng<\/h1>\n<p style=\"font-size:60px; color:#5B6577\">Buổi 1 · GV. Đan Tuấn Anh<\/p>\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Một con đường uốn lượn với các điểm dừng màu cam, xám nhạt và trắng, tượng trưng cho hành trình khách hàng\" width=\"1664\" height=\"220\" viewBox=\"0 0 1664 220\" style=\"width:1664px; height:220px\"><path d=\"M0 150 C 250 150, 300 40, 520 60 S 820 200, 1040 150 S 1400 40, 1664 70\" fill=\"none\" stroke=\"#D5DAE1\" stroke-width=\"8\" stroke-linecap=\"round\"/><circle cx=\"520\" cy=\"60\" r=\"26\" fill=\"#E2783B\"/><circle cx=\"1040\" cy=\"150\" r=\"26\" fill=\"#8A94A6\"/><circle cx=\"1630\" cy=\"68\" r=\"26\" fill=\"#1E2533\"/><circle cx=\"26\" cy=\"150\" r=\"18\" fill=\"#1E2533\"/><\/svg>\n<\/section>"}, {"id": "b1-01b", "label": "B1 · 02", "session": 1, "part": "s1", "title": "CXM Bingo: Ai trong lớp từng trải qua những trải nghiệm này?", "activity": "Cả lớp · 10 phút chơi · 8 phút chia sẻ", "points": ["Tìm người từng trải qua mỗi ô", "Xin tên và một chi tiết ngắn", "Kín 16 ô trước: Nhất · Nhì · Ba · Tư"], "notes": "① MỞ\nPhát thẻ CXM Bingo (in A4, chọn \"Fit to page\") cho mỗi học viên ngay khi vào lớp. \"Trước khi nói về khách hàng, hãy bắt đầu từ chính chúng ta – vì ai trong phòng này cũng là khách hàng, mỗi ngày.\"\n\n② HƯỚNG DẪN HOẠT ĐỘNG (10 phút chơi)\n– Mỗi ô là một trải nghiệm. Đứng dậy, đi gặp các bạn trong lớp, tìm người đã từng trải qua ô đó.\n– Xin bạn ghi tên vào ô và kể nhanh một chi tiết; ghi lại một từ khóa trên dòng kẻ.\n– Gợi ý luật công bằng: mỗi bạn chỉ ký tối đa 2 ô trên một thẻ, không tự ký cho mình.\n– Ai kín đủ 16 ô trước hô \"Bingo!\". Thứ tự về đích quyết định giải Nhất, Nhì, Ba, Tư cho nhóm của người đó.\nBáo thời gian ở phút 5 và phút 9. Nếu sau 10 phút chưa ai kín 16 ô, nhóm có người kín nhiều ô nhất thắng.\n\n③ DẪN DẮT TRONG LÚC CHƠI\nĐi quanh lớp, nghe các câu chuyện và ghi nhanh 2–3 câu chuyện hay để mời kể lại. Khuyến khích học viên tìm người ở nhóm khác để làm quen.\n\n④ CHIA SẺ (8 phút) – chọn 3–5 câu hỏi\n1. Ô 10 & 6: \"Ai từng kể lại vấn đề 3 lần cho 3 nhân viên? Đến lần thứ ba, anh chị bực người nhân viên đó hay bực cả công ty?\" → Khách hàng trải nghiệm cả tổ chức, không phải từng phòng ban.\n2. Ô 15: \"Có ai nhớ một thương hiệu nhờ… cái toilet? Doanh nghiệp đó có quảng cáo toilet không?\" → Trong mắt khách, không có điểm chạm nào là nhỏ.\n3. Ô 2 và ô 4: \"Cùng dùng dữ liệu tìm đến anh chị – vì sao một bên giống 'người yêu cũ đeo bám', một bên giống 'người bạn hiểu ý'?\" → Trải nghiệm nằm ở cảm nhận của khách, không ở việc doanh nghiệp làm.\n4. Ô 14 & 3: \"Nếu bạn nhân viên nhớ món của anh chị nghỉ việc, anh chị còn quay lại không?\" → Trải nghiệm tốt nhờ một người là may mắn; quản trị là biến nó thành điều lặp lại được.\n5. Câu kết: \"Ô vui hay ô bực kín chữ ký nhanh hơn? Nếu doanh nghiệp anh chị là một ô trên tờ Bingo của khách hàng, anh chị muốn là ô số mấy – và thực tế đang là ô số mấy?\"\nChưa vội đưa định nghĩa: ghi các ý học viên nói lên bảng, giữ lại cho hai hoạt động tiếp theo.\n\n★ CÂU CHỐT: \"Ai trong phòng này cũng là chuyên gia về trải nghiệm khách hàng – vì ai cũng đã từng là khách hàng. Câu hỏi là: doanh nghiệp của chúng ta đang tạo ra những ô nào trên tờ Bingo của khách hàng?\"\n\n⑤ TƯƠNG TÁC\nNếu lớp ngại đứng dậy: giảng viên làm mẫu, tự tìm người ký ô đầu tiên. Nếu thời gian gấp: dừng ở phút 7 và chỉ dùng câu hỏi 1, 4 và 5. Trao giải ngay để giữ năng lượng.\n\n⑥ CHUYỂN Ý\n\"Giữ nguyên thẻ Bingo trên bàn. Bây giờ mỗi nhóm sẽ sắp xếp 16 trải nghiệm này lại như một nhà quản trị.\"", "html": "<section id=\"b1-01b\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:40px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">CXM Bingo: Ai trong lớp từng trải qua những trải nghiệm này?<\/h2>\n<p style=\"align-self:start; font-weight:700; color:#FFFFFF; background:#E2783B; padding:8px 36px; border-radius:999px\">Cả lớp · 10 phút chơi · 8 phút chia sẻ<\/p>\n<div style=\"display:flex; flex-direction:row; gap:72px; align-items:center\">\n<svg aria-label=\"Thẻ CXM Bingo 4 x 4 ô: 12 trên 16 ô đã có dấu tích cam, còn 4 ô trống\" width=\"435\" height=\"465\" viewBox=\"0 0 435 465\" style=\"width:435px; height:465px\"><g transform=\"scale(0.75)\"><rect x=\"10\" y=\"10\" width=\"560\" height=\"600\" rx=\"28\" fill=\"#FFFFFF\" stroke=\"#1E2533\" stroke-width=\"8\"/><rect x=\"30\" y=\"34\" width=\"240\" height=\"30\" rx=\"15\" fill=\"#1E2533\"/><rect x=\"290\" y=\"40\" width=\"200\" height=\"18\" rx=\"9\" fill=\"#D5DAE1\"/><rect x=\"30\" y=\"90\" width=\"118\" height=\"118\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#D5DAE1\" stroke-width=\"6\"/><path d=\"M64 150 L82 168 L116 132\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"160\" y=\"90\" width=\"118\" height=\"118\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#D5DAE1\" stroke-width=\"6\"/><path d=\"M194 150 L212 168 L246 132\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"290\" y=\"90\" width=\"118\" height=\"118\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#D5DAE1\" stroke-width=\"6\"/><path d=\"M324 150 L342 168 L376 132\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"420\" y=\"90\" width=\"118\" height=\"118\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#D5DAE1\" stroke-width=\"6\"/><path d=\"M454 150 L472 168 L506 132\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"30\" y=\"220\" width=\"118\" height=\"118\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#D5DAE1\" stroke-width=\"6\"/><path d=\"M64 280 L82 298 L116 262\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"160\" y=\"220\" width=\"118\" height=\"118\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#D5DAE1\" stroke-width=\"6\"/><path d=\"M194 280 L212 298 L246 262\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"290\" y=\"220\" width=\"118\" height=\"118\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#D5DAE1\" stroke-width=\"6\"/><rect x=\"420\" y=\"220\" width=\"118\" height=\"118\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#D5DAE1\" stroke-width=\"6\"/><path d=\"M454 280 L472 298 L506 262\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"30\" y=\"350\" width=\"118\" height=\"118\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#D5DAE1\" stroke-width=\"6\"/><path d=\"M64 410 L82 428 L116 392\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"160\" y=\"350\" width=\"118\" height=\"118\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#D5DAE1\" stroke-width=\"6\"/><rect x=\"290\" y=\"350\" width=\"118\" height=\"118\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#D5DAE1\" stroke-width=\"6\"/><path d=\"M324 410 L342 428 L376 392\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"420\" y=\"350\" width=\"118\" height=\"118\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#D5DAE1\" stroke-width=\"6\"/><path d=\"M454 410 L472 428 L506 392\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"30\" y=\"480\" width=\"118\" height=\"118\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#D5DAE1\" stroke-width=\"6\"/><rect x=\"160\" y=\"480\" width=\"118\" height=\"118\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#D5DAE1\" stroke-width=\"6\"/><path d=\"M194 540 L212 558 L246 522\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"290\" y=\"480\" width=\"118\" height=\"118\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#D5DAE1\" stroke-width=\"6\"/><path d=\"M324 540 L342 558 L376 522\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"420\" y=\"480\" width=\"118\" height=\"118\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#D5DAE1\" stroke-width=\"6\"/><\/g><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:36px\">\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng tìm người\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"27\" cy=\"27\" r=\"17\"/><line x1=\"40\" y1=\"40\" x2=\"58\" y2=\"58\"/><\/g><\/svg><p>Tìm người từng trải qua mỗi ô<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng ký tên\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M40 8 L56 24 L22 58 H6 V42 Z\"/><line x1=\"32\" y1=\"16\" x2=\"48\" y2=\"32\"/><\/g><\/svg><p>Xin tên và một chi tiết ngắn<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng cúp\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 6 H46 V22 C 46 32, 40 38, 32 38 C 24 38, 18 32, 18 22 Z\"/><path d=\"M18 12 H8 C 8 22, 12 26, 18 26\"/><path d=\"M46 12 H56 C 56 22, 52 26, 46 26\"/><line x1=\"32\" y1=\"38\" x2=\"32\" y2=\"48\"/><path d=\"M20 58 H44 L40 48 H24 Z\"/><\/g><\/svg><p>Kín 16 ô trước: Nhất · Nhì · Ba · Tư<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-01c", "label": "B1 · 03", "session": 1, "part": "s1", "title": "Phân loại 16 trải nghiệm theo ba trục", "activity": "Nhóm · 10 phút · handout trang 7", "points": ["Chạm số · con người · vật lý", "Điểm đau · điểm wow", "Lý trí · cảm xúc"], "notes": "① MỞ\n\"Anh chị vừa thu thập 16 trải nghiệm thật của chính lớp mình. Bây giờ chúng ta làm việc của một nhà quản trị: sắp xếp chúng lại để nhìn ra quy luật.\"\n\n② HƯỚNG DẪN HOẠT ĐỘNG (10 phút, theo nhóm)\nDùng nửa trên trang 7 của bộ handout. Mỗi nhóm đặt số thứ tự các ô Bingo (1–16) vào ba trục:\n– Trục điểm chạm: Chạm số – Chạm con người – Chạm vật lý.\n– Trục kết quả: Điểm đau – Điểm wow.\n– Trục quyết định: Lý trí – Cảm xúc.\nMột ô có thể nằm ở nhiều vị trí; nhóm ghi lý do ngắn gọn khi phân vân. Phút 0–7 làm việc nhóm, phút 7–10 hai nhóm chia sẻ nhanh.\n\n③ GỢI Ý ĐÁP ÁN (để giảng viên tham khảo, không có đáp án duy nhất)\nChạm số: 1, 2, 4, 6, 8, 12, 13, 11 (livestream). Chạm con người: 3, 7, 10, 14, 16, 11 (MC). Chạm vật lý: 5, 9, 15, 7 (cửa hàng).\nĐiểm đau: 1, 2, 6, 7, 10, 12. Điểm wow: 3, 4, 5, 8, 9, 11, 14, 16. Cả hai: 13, 15.\nLý trí nổi trội: 1, 6, 8, 12, 16 (tiện, nhanh, tiết kiệm công sức). Cảm xúc nổi trội: 2, 3, 5, 7, 9, 10, 11, 13, 14 (được lắng nghe, bị phớt lờ, bất ngờ, bực bội). Ô 4 và 15 thường chia đôi.\n\n④ LIÊN HỆ – ĐIỀU CẦN RÚT RA\nBa quan sát thường xuất hiện:\n– Một trải nghiệm hiếm khi chỉ thuộc một kênh: mua online vẫn kết thúc bằng một hộp hàng vật lý và một người giao hàng.\n– Điểm đau thường gắn với công sức và lý trí (rối, chậm, phải lặp lại); điểm wow thường gắn với cảm xúc (được nhớ tên, được lắng nghe, bất ngờ).\n– Những ô \"vật lý\" như toilet, bao bì – điều doanh nghiệp coi là phụ – lại ở lại lâu trong trí nhớ khách hàng.\n\n★ CÂU CHỐT: \"Khách hàng không chia trải nghiệm thành kênh số hay cửa hàng, lý trí hay cảm xúc. Họ cảm nhận tất cả cùng lúc – và nhớ cảm xúc lâu nhất.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Ô nào làm nhóm tranh luận lâu nhất khi xếp loại? Vì sao?\"\nCâu trả lời có thể gặp: \"Ô 15 – toilet là vật lý, nhưng điều đọng lại là cảm xúc\" → phản hồi: đúng, kênh là nơi trải nghiệm xảy ra, còn cảm xúc là thứ khách mang về.\nNếu lớp im lặng: hỏi nhanh \"nhóm nào xếp ô 10 vào lý trí, nhóm nào xếp vào cảm xúc?\" để tạo tranh luận.\n\n⑥ CHUYỂN Ý\n\"Đã có 16 trải nghiệm và ba trục phân loại. Câu hỏi tiếp theo: nói đến trải nghiệm khách hàng, chúng ta đang nói đến những từ nào?\"", "html": "<section id=\"b1-01c\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:40px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Phân loại 16 trải nghiệm theo ba trục<\/h2>\n<p style=\"align-self:start; font-weight:700; color:#FFFFFF; background:#E2783B; padding:8px 36px; border-radius:999px\">Nhóm · 10 phút · handout trang 7<\/p>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg aria-label=\"Ba trục phân loại: bàn tay chạm nối tới ba ô số, con người, vật lý; hai khuôn mặt buồn và vui; bộ não hai nửa lý trí và cảm xúc\" width=\"520\" height=\"460\" viewBox=\"0 0 520 460\" style=\"width:520px; height:460px\"><circle cx=\"260\" cy=\"60\" r=\"44\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"8\"/><circle cx=\"260\" cy=\"60\" r=\"16\" fill=\"#E2783B\"/><path d=\"M260 104 V140 M260 140 H90 V170 M260 140 V170 M260 140 H430 V170\" fill=\"none\" stroke=\"#D5DAE1\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"40\" y=\"170\" width=\"100\" height=\"70\" rx=\"14\" fill=\"#E2783B\"/><rect x=\"210\" y=\"170\" width=\"100\" height=\"70\" rx=\"14\" fill=\"#1E2533\"/><rect x=\"380\" y=\"170\" width=\"100\" height=\"70\" rx=\"14\" fill=\"#8A94A6\"/><circle cx=\"90\" cy=\"360\" r=\"62\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"8\"/><path d=\"M62 388 Q90 364 118 388\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"8\" stroke-linecap=\"round\"/><circle cx=\"70\" cy=\"342\" r=\"7\" fill=\"#E2783B\"/><circle cx=\"110\" cy=\"342\" r=\"7\" fill=\"#E2783B\"/><circle cx=\"250\" cy=\"360\" r=\"62\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"8\"/><path d=\"M222 372 Q250 398 278 372\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"8\" stroke-linecap=\"round\"/><circle cx=\"230\" cy=\"342\" r=\"7\" fill=\"#1E2533\"/><circle cx=\"270\" cy=\"342\" r=\"7\" fill=\"#1E2533\"/><path d=\"M430 300 C 400 296, 380 318, 384 340 C 368 350, 372 380, 390 384 C 392 404, 414 414, 430 404 Z\" fill=\"#1E2533\"/><path d=\"M434 300 C 464 296, 484 318, 480 340 C 496 350, 492 380, 474 384 C 472 404, 450 414, 434 404 Z\" fill=\"#E2783B\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:32px\">\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng touch\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"30\" cy=\"20\" r=\"7\"/><path d=\"M16 20 A14 14 0 0 1 44 20\"/><path d=\"M30 20 V44 L23 38 M30 44 C 30 54, 48 56, 50 46 V34 C 50 30, 42 30, 42 34\"/><\/g><\/svg><p>Chạm số · con người · vật lý<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng faces\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"17\" cy=\"32\" r=\"13\"/><circle cx=\"47\" cy=\"32\" r=\"13\"/><path d=\"M11 39 Q17 34 23 39\"/><path d=\"M41 35 Q47 41 53 35\"/><circle cx=\"13\" cy=\"28\" r=\"2\" fill=\"#E2783B\" stroke=\"none\"/><circle cx=\"21\" cy=\"28\" r=\"2\" fill=\"#E2783B\" stroke=\"none\"/><circle cx=\"43\" cy=\"28\" r=\"2\" fill=\"#E2783B\" stroke=\"none\"/><circle cx=\"51\" cy=\"28\" r=\"2\" fill=\"#E2783B\" stroke=\"none\"/><\/g><\/svg><p>Điểm đau · điểm wow<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng brain\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M32 10 C 22 6, 10 12, 12 24 C 4 28, 6 42, 14 44 C 14 54, 26 58, 32 52 Z\"/><path d=\"M32 10 C 42 6, 54 12, 52 24 C 60 28, 58 42, 50 44 C 50 54, 38 58, 32 52\"/><\/g><\/svg><p>Lý trí · cảm xúc<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-01d", "label": "B1 · 04", "session": 1, "part": "s1", "title": "Nói đến trải nghiệm khách hàng là nói đến 10 từ nào?", "activity": "Nhóm · 7 phút · handout trang 7", "points": ["Khoanh đúng 10 từ", "So sánh giữa các nhóm", "Ghép thành một định nghĩa"], "notes": "① MỞ\n\"Quay lại câu hỏi ban đầu của buổi học. Nếu chỉ được dùng 10 từ để nói về trải nghiệm khách hàng, anh chị chọn 10 từ nào?\"\n\n② HƯỚNG DẪN HOẠT ĐỘNG (khoảng 7 phút)\nDùng hình trái tim ở nửa dưới trang 7. Mỗi nhóm thống nhất và khoanh tròn đúng 10 từ, không hơn. Phút 0–4: nhóm thảo luận và khoanh. Phút 4–7: mỗi nhóm đọc to 10 từ của mình, giảng viên ghi lên bảng, từ nào nhiều nhóm cùng chọn thì đánh dấu sao.\nGiới hạn 10 từ là có chủ đích: buộc nhóm phải chọn điều cốt lõi, giống như nhà quản lý phải chọn ưu tiên.\n\n③ DẪN DẮT – GOM TỪ THÀNH BA NHÓM\nKhi bảng đã có từ của bốn nhóm, giảng viên gom thành ba cột:\n– Khách hàng cảm nhận gì: Cảm xúc, Kỳ vọng, Hài lòng, Thất vọng, Wow moment, Kết nối, Trung thành.\n– Ở đâu và khi nào: Hành trình, Điểm chạm, Omnichannel, App, Website, Tổng đài, Mạng xã hội, Dịch vụ.\n– Doanh nghiệp làm gì để quản trị: Đo lường, CSAT, NPS, CES, Phản hồi, Insight, Data, CRM, Cá nhân hóa, Nhất quán.\nHai cột đầu trả lời câu hỏi \"Trải nghiệm khách hàng là gì\". Cột thứ ba trả lời \"Quản trị trải nghiệm khách hàng là gì\".\n\n④ LIÊN HỆ – HAI ĐỊNH NGHĨA LÀM VIỆC\nViết lên bảng:\n– Trải nghiệm khách hàng (CX): tổng hòa cảm nhận – lý trí và cảm xúc – của khách hàng qua mọi điểm chạm với doanh nghiệp, trên toàn bộ hành trình.\n– Quản trị trải nghiệm khách hàng (CXM): quá trình chủ động thấu hiểu, thiết kế, đo lường và cải tiến những cảm nhận đó một cách có hệ thống, có người chịu trách nhiệm, để tạo giá trị cho cả khách hàng và doanh nghiệp.\nNhận xét thường gặp: các nhóm chọn nhiều từ ở cột một và hai, ít từ ở cột ba. Đó là gợi ý tốt: chúng ta nói nhiều về cảm xúc của khách, nhưng ít nói về cách quản trị nó.\n\n★ CÂU CHỐT: \"Trải nghiệm là điều khách hàng cảm nhận. Quản trị trải nghiệm là điều doanh nghiệp chủ động làm để cảm nhận đó tốt hơn – một cách có hệ thống.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Có từ nào anh chị muốn khoanh nhưng không có trong trái tim không?\"\nCâu trả lời có thể gặp: \"Niềm tin\", \"Tôn trọng\", \"Thấu cảm\" → phản hồi: rất hay, đó là những từ nằm sau mọi điểm chạm; ghi thêm lên bảng.\nNếu lớp im lặng: hỏi nhóm có ít từ trùng với các nhóm khác nhất để giải thích lựa chọn.\n\n⑥ CHUYỂN Ý\n\"Chúng ta đã có định nghĩa. Giờ hãy xem vì sao điều này quan trọng với lợi nhuận – bắt đầu từ một con số khá khó chịu.\"", "html": "<section id=\"b1-01d\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:40px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Nói đến trải nghiệm khách hàng là nói đến 10 từ nào?<\/h2>\n<p style=\"align-self:start; font-weight:700; color:#FFFFFF; background:#E2783B; padding:8px 36px; border-radius:999px\">Nhóm · 7 phút · handout trang 7<\/p>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg aria-label=\"Trái tim chứa nhiều thanh từ khóa xám, một số thanh màu cam được khoanh tròn\" width=\"540\" height=\"480\" viewBox=\"0 0 540 480\" style=\"width:540px; height:480px\"><path d=\"M270 460 C 150 380, 20 300, 30 170 C 38 80, 140 40, 210 80 C 240 96, 260 120, 270 140 C 280 120, 300 96, 330 80 C 400 40, 502 80, 510 170 C 520 300, 390 380, 270 460 Z\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"8\" stroke-linejoin=\"round\"/><rect x=\"150\" y=\"150\" width=\"110\" height=\"24\" rx=\"12\" fill=\"#8A94A6\"/><rect x=\"280\" y=\"140\" width=\"90\" height=\"24\" rx=\"12\" fill=\"#E2783B\"/><ellipse cx=\"325\" cy=\"152\" rx=\"63\" ry=\"26\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"6\"/><rect x=\"380\" y=\"150\" width=\"80\" height=\"24\" rx=\"12\" fill=\"#D5DAE1\"/><rect x=\"120\" y=\"200\" width=\"70\" height=\"24\" rx=\"12\" fill=\"#8A94A6\"/><rect x=\"210\" y=\"200\" width=\"130\" height=\"24\" rx=\"12\" fill=\"#E2783B\"/><ellipse cx=\"275\" cy=\"212\" rx=\"83\" ry=\"26\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"6\"/><rect x=\"360\" y=\"200\" width=\"100\" height=\"24\" rx=\"12\" fill=\"#D5DAE1\"/><rect x=\"150\" y=\"250\" width=\"90\" height=\"24\" rx=\"12\" fill=\"#E2783B\"/><ellipse cx=\"195\" cy=\"262\" rx=\"63\" ry=\"26\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"6\"/><rect x=\"260\" y=\"250\" width=\"120\" height=\"24\" rx=\"12\" fill=\"#E2783B\"/><ellipse cx=\"320\" cy=\"262\" rx=\"78\" ry=\"26\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"6\"/><rect x=\"390\" y=\"250\" width=\"70\" height=\"24\" rx=\"12\" fill=\"#D5DAE1\"/><rect x=\"190\" y=\"300\" width=\"100\" height=\"24\" rx=\"12\" fill=\"#E2783B\"/><ellipse cx=\"240\" cy=\"312\" rx=\"68\" ry=\"26\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"6\"/><rect x=\"310\" y=\"300\" width=\"90\" height=\"24\" rx=\"12\" fill=\"#D5DAE1\"/><rect x=\"220\" y=\"350\" width=\"80\" height=\"24\" rx=\"12\" fill=\"#E2783B\"/><ellipse cx=\"260\" cy=\"362\" rx=\"58\" ry=\"26\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"6\"/><rect x=\"320\" y=\"350\" width=\"60\" height=\"24\" rx=\"12\" fill=\"#8A94A6\"/><rect x=\"250\" y=\"400\" width=\"60\" height=\"24\" rx=\"12\" fill=\"#D5DAE1\"/><rect x=\"100\" y=\"170\" width=\"40\" height=\"24\" rx=\"12\" fill=\"#D5DAE1\"/><rect x=\"430\" y=\"195\" width=\"40\" height=\"24\" rx=\"12\" fill=\"#8A94A6\"/><rect x=\"170\" y=\"395\" width=\"40\" height=\"24\" rx=\"12\" fill=\"#D5DAE1\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:32px\">\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng circle\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><ellipse cx=\"32\" cy=\"32\" rx=\"26\" ry=\"18\"/><path d=\"M14 30 H50\"/><\/g><\/svg><p>Khoanh đúng 10 từ<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng merge\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 10 C 8 30, 32 26, 32 46\"/><path d=\"M56 10 C 56 30, 32 26, 32 46\"/><path d=\"M32 46 V58\"/><\/g><\/svg><p>So sánh giữa các nhóm<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng quote\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 10 H56 V42 H30 L18 54 V42 H8 Z\"/><path d=\"M20 22 V30 M28 22 V30\"/><\/g><\/svg><p>Ghép thành một định nghĩa<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-02", "label": "B1 · 05", "session": 1, "part": "s1", "title": "Chỉ một trải nghiệm tiêu cực đủ khiến khách hàng rời bỏ", "activity": "", "points": ["32%", "khách hàng rời bỏ thương hiệu yêu thích sau một trải nghiệm tệ", "PwC · 2018"], "notes": "① MỞ\n\"Nếu tôi nói rằng cứ ba khách hàng trung thành nhất của công ty anh chị, thì có một người sẵn sàng bỏ đi chỉ sau một lần trải nghiệm tệ – anh chị có tin không?\" Để lớp phản ứng vài giây, thường sẽ có người lắc đầu.\n\n② GIẢNG\nCon số 32% đến từ khảo sát \"Experience is everything\" của PwC năm 2018 với khoảng 15.000 người tiêu dùng ở 12 quốc gia. Điều đáng chú ý không nằm ở con số, mà ở chữ \"yêu thích\": đây không phải khách mới dùng thử, mà là khách đã gắn bó. Cùng khảo sát đó, tại Mỹ có 59% người tiêu dùng nói họ sẽ rời bỏ sau vài trải nghiệm tệ. Nói cách khác, lòng trung thành mong manh hơn nhiều so với cảm nhận của chúng ta khi nhìn vào báo cáo doanh số. Ba hình người màu cam trên chín người: một phần ba.\n\n③ MINH HỌA\nHãy nhìn vào case DigiNet mà một nhóm sẽ làm. Cô Lan, 58 tuổi, dùng dịch vụ truyền hình ba năm. Một tối, TV bị lag. Cô gọi hotline: tổng đài tự động năm bước, chờ tám phút. Kỹ thuật viên hẹn đến nhưng ba ngày chưa thấy. Con trai cô bực mình, hủy hợp đồng của mẹ – và hủy luôn gói cước của chính anh ấy. Ba năm gắn bó bị xóa trong một tuần. Không ai trong công ty \"làm sai\" một cách cố ý; mỗi bộ phận chỉ làm chậm một chút.\n\n④ LIÊN HỆ\nNhà quản lý thường theo dõi tỷ lệ rời bỏ theo quý. Đó là chỉ số trễ: khi nó xuất hiện trên báo cáo thì khách đã đi rồi. Và phần lớn khách không phàn nàn; họ im lặng rời đi. Vì vậy tỷ lệ khiếu nại thấp chưa chắc là tin tốt.\n\n★ CÂU CHỐT: \"Lòng trung thành không phải tài sản doanh nghiệp đã sở hữu. Nó là khoản tiền gửi mà khách hàng có thể rút bất cứ lúc nào.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Ở doanh nghiệp anh chị, khi một khách hàng lâu năm rời đi, ai là người biết đầu tiên – và mất bao lâu để biết?\"\nNếu lớp im lặng: mời một anh chị trong ngành ngân hàng, bán lẻ hoặc dịch vụ thuê bao – nơi rời bỏ dễ quan sát.\nCâu trả lời có thể gặp: \"Sales biết khi khách không gia hạn\" → hỏi tiếp: \"Có ai hỏi khách vì sao không?\". \"Chúng tôi không thực sự biết\" → phản hồi: \"Đó là phát hiện quý nhất của buổi sáng nay, và là lý do chúng ta ở đây.\"\n\n⑥ CHUYỂN Ý\n\"Vậy hai buổi học này sẽ giúp chúng ta làm gì với con số ấy? Đây là ba mục tiêu của hôm nay.\"", "html": "<section id=\"b1-02\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Chỉ một trải nghiệm tiêu cực đủ khiến khách hàng rời bỏ<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<p style=\"width:600px; font-size:230px; font-weight:800; line-height:1; color:#E2783B\">32%<\/p>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:32px\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Chín hình người, ba người màu cam tượng trưng cho một phần ba khách hàng rời bỏ\" width=\"1000\" height=\"180\" viewBox=\"0 0 1000 180\" style=\"width:1000px; height:180px\"><g fill=\"#E2783B\"><circle cx=\"55\" cy=\"40\" r=\"26\"/><rect x=\"21\" y=\"76\" width=\"68\" height=\"100\" rx=\"30\"/><circle cx=\"165\" cy=\"40\" r=\"26\"/><rect x=\"131\" y=\"76\" width=\"68\" height=\"100\" rx=\"30\"/><circle cx=\"275\" cy=\"40\" r=\"26\"/><rect x=\"241\" y=\"76\" width=\"68\" height=\"100\" rx=\"30\"/><\/g><g fill=\"#D5DAE1\"><circle cx=\"385\" cy=\"40\" r=\"26\"/><rect x=\"351\" y=\"76\" width=\"68\" height=\"100\" rx=\"30\"/><circle cx=\"495\" cy=\"40\" r=\"26\"/><rect x=\"461\" y=\"76\" width=\"68\" height=\"100\" rx=\"30\"/><circle cx=\"605\" cy=\"40\" r=\"26\"/><rect x=\"571\" y=\"76\" width=\"68\" height=\"100\" rx=\"30\"/><circle cx=\"715\" cy=\"40\" r=\"26\"/><rect x=\"681\" y=\"76\" width=\"68\" height=\"100\" rx=\"30\"/><circle cx=\"825\" cy=\"40\" r=\"26\"/><rect x=\"791\" y=\"76\" width=\"68\" height=\"100\" rx=\"30\"/><circle cx=\"935\" cy=\"40\" r=\"26\"/><rect x=\"901\" y=\"76\" width=\"68\" height=\"100\" rx=\"30\"/><\/g><\/svg>\n<p style=\"color:#1E2533\">khách hàng rời bỏ thương hiệu <b>yêu thích<\/b> sau một trải nghiệm tệ<\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng cuốn sách – nguồn nghiên cứu\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M32 14 C 24 8, 12 8, 5 10 V52 C 12 50, 24 50, 32 56 C 40 50, 52 50, 59 52 V10 C 52 8, 40 8, 32 14 Z\"/><line x1=\"32\" y1=\"14\" x2=\"32\" y2=\"56\"/><\/g><\/svg><p style=\"color:#5B6577\">PwC · 2018<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-03", "label": "B1 · 06", "session": 1, "part": "s1", "title": "Mục tiêu buổi học", "activity": "", "points": ["Hiểu vì sao CX là chiến lược", "Thấu hiểu khách hàng thực sự nghĩ gì", "Vẽ hành trình khách hàng"], "notes": "① MỞ\n\"Ba tiếng rưỡi đủ dài để thay đổi cách anh chị nhìn khách hàng, nhưng không đủ để học hết các mô hình. Vì vậy hôm nay chúng ta chỉ theo đuổi ba mục tiêu.\"\n\n② GIẢNG\nMục tiêu 1 – Hiểu vì sao CX là chiến lược. Chúng ta sẽ nói bằng ngôn ngữ kinh tế: trải nghiệm tác động trực tiếp đến mức sẵn sàng chi trả của khách hàng, chứ không chỉ là một khoản chi phí dịch vụ. Đây là phần giúp anh chị thuyết phục ban điều hành và phòng tài chính.\nMục tiêu 2 – Thấu hiểu khách hàng. Nhiều doanh nghiệp có rất nhiều dữ liệu nhưng rất ít sự thấu hiểu. Chúng ta sẽ dùng Persona, Empathy Map và cách viết insight để đi từ \"khách hàng là ai\" sang \"vì sao họ hành động như vậy\".\nMục tiêu 3 – Vẽ hành trình khách hàng. Nhìn doanh nghiệp bằng mắt của khách: họ đi qua những điểm chạm nào, cảm xúc lên xuống ra sao, và hành trình đang \"vỡ\" ở đâu.\nCuối buổi, mỗi nhóm có hai sản phẩm cụ thể cho doanh nghiệp của nhóm – một Persona và một Empathy Map – và hiểu cách đọc một hành trình khách hàng; bản đồ hành trình sẽ được vẽ trên khổ A1 ở Buổi 2.\n\n③ MINH HỌA\nHãy nghe một câu hỏi thật từ case BizManage – một nền tảng phần mềm quản trị cho doanh nghiệp nhỏ. Anh Khoa, CEO một công ty nội thất 50 nhân viên, nói: \"Tôi đầu tư 200 triệu, năm tháng sau nhân viên vẫn dùng Excel.\" Ba mục tiêu hôm nay chính là ba cách trả lời: giá trị thực sự nằm ở đâu, ai là người dùng thật (không phải người ký hợp đồng), và hành trình bị đứt ở khoảnh khắc nào.\n\n④ LIÊN HỆ\nVới nhà quản lý cấp cao, điều quan trọng không phải là tự tay vẽ bản đồ, mà là biết đặt đúng câu hỏi cho đội ngũ và nhận ra khi nào một báo cáo CX chỉ đang \"trình diễn\" thay vì phản ánh sự thật.\n\n★ CÂU CHỐT: \"Mục tiêu hôm nay không phải để anh chị biết nhiều hơn về khách hàng, mà để anh chị bắt đầu nhìn bằng mắt của họ.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Trong ba mục tiêu này, doanh nghiệp anh chị đang yếu nhất ở mục tiêu nào? Xin giơ một, hai hoặc ba ngón tay.\"\nNếu lớp dồn vào mục tiêu 2: phản hồi \"Rất phổ biến – giàu dữ liệu, nghèo thấu hiểu.\" Nếu dồn vào mục tiêu 1: \"Nghĩa là CX vẫn đang được xem như chi phí, và Phần 1 được thiết kế cho chính điều này.\" Nếu lớp ngập ngừng, giảng viên giơ tay trước để làm mẫu.\n\n⑥ CHUYỂN Ý\n\"Để không học bằng lý thuyết suông, chúng ta sẽ có bốn doanh nghiệp đồng hành trong suốt hai buổi.\"", "html": "<section id=\"b1-03\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:56px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Mục tiêu buổi học<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px\">\n<div style=\"flex:1; display:flex; flex-direction:column; gap:24px\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Cây thước giá trị với mũi tên hướng lên\" width=\"200\" height=\"200\" viewBox=\"0 0 200 200\" style=\"width:200px; height:200px\"><rect x=\"70\" y=\"60\" width=\"60\" height=\"130\" rx=\"8\" fill=\"#8A94A6\"/><line x1=\"40\" y1=\"100\" x2=\"160\" y2=\"100\" stroke=\"#1E2533\" stroke-width=\"8\"/><line x1=\"40\" y1=\"145\" x2=\"160\" y2=\"145\" stroke=\"#1E2533\" stroke-width=\"8\"/><path d=\"M100 8 L140 50 L112 50 L112 60 L88 60 L88 50 L60 50 Z\" fill=\"#E2783B\"/><\/svg>\n<p style=\"font-weight:800; color:#E2783B\">1<\/p>\n<p>Hiểu vì sao CX là chiến lược<\/p>\n<\/div>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:24px\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Đầu người với trái tim bên trong\" width=\"200\" height=\"200\" viewBox=\"0 0 200 200\" style=\"width:200px; height:200px\"><path d=\"M60 190 L60 150 C 30 130, 30 60, 80 30 C 130 5, 185 40, 175 95 L185 125 L165 128 L165 160 L130 160 L130 190 Z\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"8\" stroke-linejoin=\"round\"/><path d=\"M108 118 C 80 98, 78 76, 94 70 C 102 67, 108 72, 108 78 C 108 72, 114 67, 122 70 C 138 76, 136 98, 108 118 Z\" fill=\"#E2783B\"/><\/svg>\n<p style=\"font-weight:800; color:#E2783B\">2<\/p>\n<p>Thấu hiểu khách hàng thực sự nghĩ gì<\/p>\n<\/div>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:24px\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Con đường có hai điểm ghim\" width=\"200\" height=\"200\" viewBox=\"0 0 200 200\" style=\"width:200px; height:200px\"><path d=\"M20 180 C 80 180, 40 110, 100 110 S 130 50, 180 40\" fill=\"none\" stroke=\"#D5DAE1\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-dasharray=\"4 18\"/><circle cx=\"20\" cy=\"178\" r=\"16\" fill=\"#8A94A6\"/><path d=\"M168 8 C 150 8, 142 22, 146 34 C 150 46, 168 66, 168 66 C 168 66, 186 46, 190 34 C 194 22, 186 8, 168 8 Z\" fill=\"#1E2533\"/><\/svg>\n<p style=\"font-weight:800; color:#E2783B\">3<\/p>\n<p>Vẽ hành trình khách hàng<\/p>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-04", "label": "B1 · 07", "session": 1, "part": "s1", "title": "Bốn doanh nghiệp, bốn nhóm, một hành trình học tập", "activity": "", "points": ["1 · DigiNet", "Churn 18–22% mỗi năm", "2 · TechPharma", "95% không được liên hệ sau mua", "3 · BizManage", "60% rời bỏ trong 6 tháng đầu"], "notes": "① MỞ\n\"Trong hai buổi này, mỗi nhóm sẽ là ban điều hành của một doanh nghiệp đang có vấn đề về trải nghiệm khách hàng. Anh chị sẽ phải ra quyết định như chính mình đang ngồi ghế CEO.\"\n\n② GIẢNG\nGiới thiệu bốn case (phát bản in cho từng nhóm). Mỗi nhóm giữ một doanh nghiệp xuyên suốt:\n– Buổi 1: đọc case (handout trang 1–4) → chọn một nhân vật → xây Persona và Empathy Map (trang 5) → trình bày trước lớp.\n– Buổi 2: chọn một tình huống trong \"Problem Canvas\" → phân tích nguyên nhân gốc rễ → thiết kế khoảnh khắc vượt kỳ vọng và kịch bản phục hồi → đề xuất ba sáng kiến CX kèm chỉ số → vẽ bản đồ hành trình khổ A1 (trang 6) và trình bày.\nMỗi nhóm cử một \"CEO\" điều phối và một người ghi chép.\n\n③ MINH HỌA\nĐọc nhanh \"vết thương\" của từng doanh nghiệp:\nDigiNet – nhà cung cấp Internet và truyền hình với khoảng 2 triệu thuê bao, mất 18–22% khách mỗi năm, NPS chỉ 6,2 trên 10.\nTechPharma – chuỗi 350 nhà thuốc, 1,2 triệu thành viên, nhưng 95% khách mua xong không bao giờ được liên hệ lại: \"bán xong là xong\".\nBizManage – nền tảng phần mềm cho 5.200 doanh nghiệp nhỏ; 60% khách rời bỏ ngay trong 6 tháng đầu vì không triển khai được.\nLife Biz School – trường MBA với khoảng 8.000 cựu học viên; chỉ 12% người quan tâm trở thành học viên, 40% cựu học viên cảm thấy \"bị bỏ rơi\".\nĐiểm chung: không doanh nghiệp nào có sản phẩm tệ. Vấn đề nằm ở trải nghiệm xung quanh sản phẩm. Bốn case cũng đủ đa dạng: dịch vụ thuê bao, bán lẻ sức khỏe, phần mềm B2B và giáo dục.\n\n④ LIÊN HỆ\nHãy đóng vai nghiêm túc: ra quyết định với thông tin chưa đầy đủ, chấp nhận đánh đổi, và luôn tự hỏi \"doanh nghiệp của mình có đang giống case này không?\". Những so sánh đó mới là giá trị lớn nhất anh chị mang về.\n\n★ CÂU CHỐT: \"Không doanh nghiệp nào trong bốn case có sản phẩm tệ. Họ chỉ đang để trải nghiệm làm rò rỉ giá trị mà sản phẩm tạo ra.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Case nào giống doanh nghiệp của anh chị nhất – và giống ở điểm nào?\"\nNếu lớp im lặng: hỏi trực tiếp người làm trong ngành viễn thông, dược, phần mềm hoặc giáo dục.\nCâu trả lời có thể gặp: \"Công ty tôi cũng 'bán xong là xong' như TechPharma\" → ghi nhận và hẹn quay lại ở phần hành trình. \"Chúng tôi giống BizManage: người mua và người dùng là hai người khác nhau\" → rất tốt, đó chính là chủ đề hành trình B2B ở Phần 4.\n\n⑥ CHUYỂN Ý\n\"Giờ chúng ta bước vào câu hỏi lớn đầu tiên.\"", "html": "<section id=\"b1-04\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Bốn doanh nghiệp, bốn nhóm, một hành trình học tập<\/h2>\n<div style=\"display:grid; grid-template-columns:1fr 1fr; gap:32px 40px\">\n<div style=\"display:flex; flex-direction:row; gap:28px; align-items:center; padding:24px 28px; border-left:10px solid #D5DAE1\">\n<svg aria-label=\"Biểu tượng wifi – case DigiNet\" width=\"120\" height=\"120\" viewBox=\"0 0 120 120\" style=\"flex:none; width:120px; height:120px\"><g transform=\"scale(1.875)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 26 A34 34 0 0 1 56 26\"/><path d=\"M16 35 A22 22 0 0 1 48 35\"/><path d=\"M24 44 A11 11 0 0 1 40 44\"/><circle cx=\"32\" cy=\"53\" r=\"4\" fill=\"#E2783B\" stroke=\"none\"/><\/g><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column\"><p style=\"font-weight:700; color:#1E2533\">1 · DigiNet<\/p><p>Churn 18–22% mỗi năm<\/p><\/div>\n<\/div>\n<div style=\"display:flex; flex-direction:row; gap:28px; align-items:center; padding:24px 28px; border-left:10px solid #D5DAE1\">\n<svg aria-label=\"Biểu tượng viên thuốc – case TechPharma\" width=\"120\" height=\"120\" viewBox=\"0 0 120 120\" style=\"flex:none; width:120px; height:120px\"><g transform=\"scale(1.875)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><g transform=\"rotate(-40 32 32)\"><rect x=\"6\" y=\"21\" width=\"52\" height=\"22\" rx=\"11\"/><line x1=\"32\" y1=\"21\" x2=\"32\" y2=\"43\"/><\/g><\/g><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column\"><p style=\"font-weight:700; color:#1E2533\">2 · TechPharma<\/p><p>95% không được liên hệ sau mua<\/p><\/div>\n<\/div>\n<div style=\"display:flex; flex-direction:row; gap:28px; align-items:center; padding:24px 28px; border-left:10px solid #D5DAE1\">\n<svg aria-label=\"Biểu tượng màn hình phần mềm – case BizManage\" width=\"120\" height=\"120\" viewBox=\"0 0 120 120\" style=\"flex:none; width:120px; height:120px\"><g transform=\"scale(1.875)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"6\" y=\"8\" width=\"52\" height=\"36\" rx=\"5\"/><line x1=\"22\" y1=\"56\" x2=\"42\" y2=\"56\"/><line x1=\"32\" y1=\"44\" x2=\"32\" y2=\"56\"/><line x1=\"20\" y1=\"36\" x2=\"20\" y2=\"28\"/><line x1=\"32\" y1=\"36\" x2=\"32\" y2=\"18\"/><line x1=\"44\" y1=\"36\" x2=\"44\" y2=\"24\"/><\/g><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column\"><p style=\"font-weight:700; color:#1E2533\">3 · BizManage<\/p><p>60% rời bỏ trong 6 tháng đầu<\/p><\/div>\n<\/div>\n<div style=\"display:flex; flex-direction:row; gap:28px; align-items:center; padding:24px 28px; border-left:10px solid #D5DAE1\">\n<svg aria-label=\"Biểu tượng mũ tốt nghiệp – case Life Biz School\" width=\"120\" height=\"120\" viewBox=\"0 0 120 120\" style=\"flex:none; width:120px; height:120px\"><g transform=\"scale(1.875)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 24 L32 12 L60 24 L32 36 Z\"/><path d=\"M16 30 V42 C 24 50, 40 50, 48 42 V30\"/><line x1=\"56\" y1=\"26\" x2=\"56\" y2=\"42\"/><\/g><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column\"><p style=\"font-weight:700; color:#1E2533\">4 · Life Biz School<\/p><p>Chuyển đổi 12%<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-05", "label": "B1 · 08", "session": 1, "part": "s2", "title": "Vì sao trải nghiệm tạo ra mức sẵn sàng chi trả cao hơn?", "activity": "", "points": [], "notes": "① MỞ\n\"Một ly cà phê vỉa hè khoảng hai mươi nghìn đồng. Cách đó vài bước chân, một ly ở chuỗi cà phê có thể năm, sáu mươi nghìn. Hạt cà phê không khác nhau gấp ba lần. Vậy khách hàng đang trả tiền cho điều gì?\" Để câu hỏi treo lơ lửng, không trả lời ngay.\n\n② GIẢNG\nGiới thiệu Phần 1, khoảng 40 phút. Đây là phần \"ngôn ngữ của giám đốc tài chính\": chúng ta biến trải nghiệm khách hàng từ một chủ đề cảm tính thành một chủ đề kinh tế. Ba ý sẽ đi qua:\n– Khi sản phẩm bị hàng hóa hóa, khác biệt dịch chuyển sang trải nghiệm.\n– Một công cụ để nhìn thấy giá trị được tạo ra và phân chia như thế nào: Value Stick.\n– Hai con đường làm khách hàng hài lòng hơn: hạ giá bán, hoặc nâng mức sẵn sàng chi trả. Con đường nào bền vững?\nCuối phần có một cuộc bình chọn nhanh để mỗi người tự định vị doanh nghiệp của mình.\n\n③ MINH HỌA\nNăm 1998, hai tác giả Joseph Pine và James Gilmore viết bài \"Welcome to the Experience Economy\" trên Harvard Business Review, dùng đúng ví dụ ly cà phê. Hạt cà phê dưới dạng hàng hóa chỉ đáng vài xu cho mỗi ly. Khi được rang, xay, đóng gói, giá tăng lên vài chục xu. Khi được pha tại một quán ăn, khách trả khoảng một đô la. Và khi được phục vụ trong một không gian cao cấp, khách vui vẻ trả vài đô la. Cùng một nguyên liệu – giá trị tăng lên nhiều lần nhờ những gì bao quanh nó.\n\n④ LIÊN HỆ\nNhiều cuộc họp chiến lược ở doanh nghiệp Việt Nam xoay quanh câu hỏi \"tăng giá hay giảm giá\". Phần này mời anh chị đặt câu hỏi thứ ba, quan trọng hơn: \"Làm gì để khách hàng cảm thấy xứng đáng hơn?\"\n\n★ CÂU CHỐT: \"Khách hàng không trả tiền cho sản phẩm. Họ trả tiền cho giá trị mà họ cảm nhận được.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Sản phẩm hoặc dịch vụ nào của anh chị mà khách hàng sẵn sàng trả cao hơn đối thủ? Vì sao họ chấp nhận?\"\nNếu lớp im lặng: gợi ý bằng ví dụ của chính giảng viên, rồi mời một người ở hàng đầu.\nCâu trả lời thường gặp: \"vì thương hiệu\", \"vì dịch vụ sau bán hàng\", \"vì quan hệ lâu năm\". Phản hồi: ghi ba từ khóa lên bảng – đó chính là những \"lớp trải nghiệm\" mà chúng ta sẽ gặp lại ở biểu đồ ly cà phê trong vài phút nữa.\n\n⑥ CHUYỂN Ý\n\"Hãy bắt đầu từ một hiện tượng mà gần như ngành nào cũng đang trải qua: hàng hóa hóa.\"", "html": "<section id=\"b1-05\" data-transition=\"push\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; justify-content:center; gap:24px\">\n<div style=\"display:flex; flex-direction:row; align-items:center; justify-content:space-between\"><p style=\"font-size:280px; font-weight:800; line-height:1; color:#E2783B\">01<\/p><svg aria-label=\"Thẻ giá với mũi tên đi lên\" width=\"320\" height=\"320\" viewBox=\"0 0 320 320\" style=\"width:320px; height:320px\"><g transform=\"scale(5)\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M34 6 H56 V28 L30 54 L8 32 Z\"/><circle cx=\"46\" cy=\"16\" r=\"4\"/><path d=\"M26 40 V22\" stroke=\"#E2783B\"/><path d=\"M19 29 L26 22 L33 29\" stroke=\"#E2783B\"/><\/g><\/svg><\/div>\n<h1 style=\"font-size:88px; font-weight:700; line-height:1.15; color:#1E2533\">Vì sao trải nghiệm tạo ra mức sẵn sàng chi trả cao hơn?<\/h1>\n<\/section>"}, {"id": "b1-06", "label": "B1 · 09", "session": 1, "part": "s2", "title": "Khi sản phẩm bị hàng hóa hóa, trải nghiệm trở thành lợi thế khác biệt", "activity": "", "points": ["Cà phê vỉa hè ~20K · chuỗi cà phê 50–60K", "Hàng hóa", "Sản phẩm", "Dịch vụ", "Trải nghiệm"], "notes": "① MỞ\n\"Anh chị còn nhớ lần cuối mình chọn nhà mạng vì tốc độ Internet nhanh hơn không?\" Thường sẽ có người cười. \"Khó nhớ, đúng không – vì nhà nào cũng nhanh gần như nhau.\"\n\n② GIẢNG\nHàng hóa hóa (commoditization) xảy ra khi tính năng bị sao chép nhanh đến mức khách hàng không còn thấy khác biệt giữa các nhà cung cấp. Khi đó, họ chỉ còn một tiêu chí để so sánh: giá. Bậc thang trên slide là mô hình của Pine và Gilmore. Hàng hóa – thứ ai cũng có. Sản phẩm – đã được chế biến, có thương hiệu. Dịch vụ – có con người phục vụ. Trải nghiệm – tổng hòa của không gian, con người, cảm xúc và ký ức. Mỗi bậc đi lên, giá trị cảm nhận và mức giá khách chấp nhận đều tăng. Bậc cao nhất khó sao chép nhất, vì nó không nằm ở một tính năng mà ở cả một hệ thống.\n\n③ MINH HỌA\nLy cà phê vỉa hè khoảng 20 nghìn, ly ở các chuỗi cà phê phổ biến 50–60 nghìn (giá tham khảo, anh chị có thể cập nhật theo thời điểm). Starbucks gọi mô hình của mình là \"nơi chốn thứ ba\" – một không gian giữa nhà và nơi làm việc. Quay về case DigiNet: khách hàng coi Internet là \"tiện ích cơ bản\" như điện nước – dấu hiệu rõ ràng của hàng hóa hóa. Cơ hội mà case gợi ra là chuyển từ \"nhà cung cấp kết nối\" sang \"nền tảng giải trí và nhà thông minh\" – tức là leo lên bậc trải nghiệm.\n\n④ LIÊN HỆ\nMột phép thử đơn giản cho CEO: nếu đối thủ có thể sao chép sản phẩm chủ lực của anh chị trong vòng sáu tháng, anh chị đang đứng ở bậc thấp của cầu thang. Lợi thế bền vững phải nằm ở những bậc cao hơn.\n\n★ CÂU CHỐT: \"Tính năng có thể bị sao chép trong vài tháng. Một trải nghiệm được thiết kế có chủ đích cần nhiều năm để bắt chước.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Trong ngành của anh chị, tính năng nào từng là lợi thế cạnh tranh nhưng nay ai cũng có?\"\nNếu lớp im lặng: gợi ý ngành ngân hàng – chuyển khoản miễn phí, mở tài khoản online – từng là khác biệt, nay là mặc định.\nCâu trả lời có thể gặp: \"miễn phí giao hàng\", \"bảo hành 12 tháng\", \"ứng dụng di động\". Phản hồi: \"Đó đã trở thành 'vé vào cửa'. Không có thì mất khách, nhưng có cũng không còn là lý do để khách chọn anh chị.\"\n\n⑥ CHUYỂN Ý\n\"Khi sản phẩm ngày càng giống nhau, ai đang nắm quyền lựa chọn? Khách hàng.\"", "html": "<section id=\"b1-06\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Khi sản phẩm bị hàng hóa hóa, trải nghiệm trở thành lợi thế khác biệt<\/h2>\n<div style=\"position:relative; width:1664px; height:480px\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Bậc thang bốn bậc đi lên từ hàng hóa, sản phẩm, dịch vụ đến trải nghiệm\" width=\"1664\" height=\"480\" viewBox=\"0 0 1664 480\" style=\"position:absolute; left:0; top:0; width:1664px; height:480px\"><rect x=\"0\" y=\"360\" width=\"400\" height=\"120\" fill=\"#D5DAE1\"/><rect x=\"421\" y=\"280\" width=\"400\" height=\"200\" fill=\"#8A94A6\"/><rect x=\"842\" y=\"200\" width=\"400\" height=\"280\" fill=\"#1E2533\"/><rect x=\"1263\" y=\"120\" width=\"400\" height=\"360\" fill=\"#E2783B\"/><\/svg>\n<div style=\"position:absolute; left:0; top:0; width:1180px; display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng tách cà phê\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 20 H46 L42 56 H16 Z\"/><path d=\"M46 26 C 58 26, 58 42, 44 42\"/><path d=\"M22 12 C 20 8, 26 6, 24 2\"/><path d=\"M34 12 C 32 8, 38 6, 36 2\"/><\/g><\/svg><p style=\"width:1080px; color:#5B6577\">Cà phê vỉa hè ~20K · chuỗi cà phê 50–60K<\/p><\/div>\n<p style=\"position:absolute; left:0; top:384px; width:400px; text-align:center; font-weight:600; color:#1E2533\">Hàng hóa<\/p>\n<p style=\"position:absolute; left:421px; top:304px; width:400px; text-align:center; font-weight:600; color:#FFFFFF\">Sản phẩm<\/p>\n<p style=\"position:absolute; left:842px; top:224px; width:400px; text-align:center; font-weight:600; color:#FFFFFF\">Dịch vụ<\/p>\n<p style=\"position:absolute; left:1263px; top:144px; width:400px; text-align:center; font-weight:700; color:#1E2533\">Trải nghiệm<\/p>\n<\/div>\n<\/section>"}, {"id": "b1-07", "label": "B1 · 10", "session": 1, "part": "s2", "title": "Quyền lực thị trường đã chuyển sang khách hàng", "activity": "", "points": ["Chuyển đổi gần như miễn phí", "Lời khách hàng mạnh hơn quảng cáo", "DigiNet: một bài \"bẫy giá\", 500 lượt chia sẻ"], "notes": "① MỞ\n\"Tối nay nếu đặt bàn ở một nhà hàng mới, anh chị có xem đánh giá trước không?\" Hầu hết sẽ gật đầu. \"Mười năm trước chúng ta hỏi bạn bè. Bây giờ chúng ta hỏi hàng nghìn người lạ – và tin họ hơn quảng cáo.\"\n\n② GIẢNG\nCác nhà nghiên cứu kịch bản chiến lược tại Đại học Oxford dùng cụm từ TUNA để mô tả môi trường hiện nay: Turbulent – hỗn loạn, Uncertain – bất định, Novel – mới lạ, Ambiguous – mơ hồ. Trong môi trường đó, khách hàng nắm ba loại quyền lực: quyền thông tin (so sánh tức thì trên điện thoại), quyền rời đi (chi phí chuyển đổi rất thấp), và quyền lên tiếng (một đánh giá có thể lan tới hàng nghìn khách tiềm năng). Slide nhấn hai quyền quan trọng nhất: chuyển đổi gần như miễn phí, và lời khách hàng mạnh hơn lời quảng cáo.\n\n③ MINH HỌA\nTrong case DigiNet, đặc thù ngành được ghi rõ: đổi nhà cung cấp gần như miễn phí, ba \"ông lớn\" chiếm khoảng 85% thị phần. Tình huống của Hùng – freelancer Gen Z: đăng ký gói khuyến mãi 99 nghìn, đến tháng thứ 13 hóa đơn thành 199 nghìn mà không được báo trước. Hùng viết một bài đăng về \"bẫy giá\", được chia sẻ 500 lần, rồi chuyển sang đối thủ. Hệ quả không dừng ở một thuê bao: đó là một cuộc khủng hoảng truyền thông trong đúng phân khúc trẻ mà DigiNet muốn chinh phục. Chi phí để có lại những khách hàng đã đọc bài đăng đó lớn hơn rất nhiều so với khoản chênh lệch 100 nghìn.\n\n④ LIÊN HỆ\nKhi quyền lực dịch chuyển, mô hình quản trị cũng phải dịch chuyển: từ \"bán được bao nhiêu\" sang \"giữ được bao lâu và khách nói gì về chúng ta\". Chỉ số tăng trưởng không còn chỉ nằm ở phòng kinh doanh.\n\n★ CÂU CHỐT: \"Doanh nghiệp không còn kiểm soát câu chuyện về thương hiệu của mình. Khách hàng đang kể câu chuyện đó.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Lần gần nhất một đánh giá tiêu cực trên mạng ảnh hưởng đến doanh nghiệp anh chị là khi nào, và tổ chức đã phản ứng ra sao?\"\nNếu lớp im lặng: gợi ý ngành F&B, bán lẻ, bất động sản – nơi đánh giá trực tuyến rất mạnh.\nCâu trả lời có thể gặp: \"Chúng tôi liên hệ để khách gỡ bài\" hoặc \"ẩn bình luận\" → hỏi lại nhẹ nhàng: \"Nguyên nhân khiến khách viết bài đó đã được sửa chưa?\". \"Chúng tôi xin lỗi công khai và sửa quy trình\" → khen ngợi, đó là tiền đề của Service Recovery ở Buổi 2.\n\n⑥ CHUYỂN Ý\n\"Nếu khách hàng nắm quyền, chúng ta cần một công cụ để thấy giá trị được tạo ra và được chia như thế nào. Công cụ đó là Value Stick.\"", "html": "<section id=\"b1-07\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Quyền lực thị trường đã chuyển sang khách hàng<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Cán cân nghiêng hẳn về phía khách hàng, phía doanh nghiệp bị nâng lên\" width=\"760\" height=\"520\" viewBox=\"0 0 760 520\" style=\"width:760px; height:520px\"><rect x=\"280\" y=\"480\" width=\"200\" height=\"24\" rx=\"6\" fill=\"#1E2533\"/><rect x=\"370\" y=\"200\" width=\"20\" height=\"282\" fill=\"#1E2533\"/><line x1=\"100\" y1=\"260\" x2=\"660\" y2=\"140\" stroke=\"#1E2533\" stroke-width=\"14\" stroke-linecap=\"round\"/><circle cx=\"380\" cy=\"200\" r=\"18\" fill=\"#E2783B\"/><line x1=\"100\" y1=\"260\" x2=\"40\" y2=\"400\" stroke=\"#1E2533\" stroke-width=\"8\"/><line x1=\"100\" y1=\"260\" x2=\"160\" y2=\"400\" stroke=\"#1E2533\" stroke-width=\"8\"/><path d=\"M30 400 Q100 470 170 400 Z\" fill=\"#E2783B\"/><circle cx=\"100\" cy=\"338\" r=\"22\" fill=\"#E2783B\"/><rect x=\"80\" y=\"362\" width=\"40\" height=\"34\" rx=\"14\" fill=\"#E2783B\"/><line x1=\"660\" y1=\"140\" x2=\"600\" y2=\"280\" stroke=\"#1E2533\" stroke-width=\"8\"/><line x1=\"660\" y1=\"140\" x2=\"720\" y2=\"280\" stroke=\"#1E2533\" stroke-width=\"8\"/><path d=\"M590 280 Q660 340 730 280 Z\" fill=\"#D5DAE1\"/><rect x=\"632\" y=\"238\" width=\"56\" height=\"42\" rx=\"4\" fill=\"#D5DAE1\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:40px\">\n<p>Chuyển đổi gần như <b>miễn phí<\/b><\/p>\n<p>Lời khách hàng mạnh hơn <b>quảng cáo<\/b><\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng wifi – case DigiNet\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 26 A34 34 0 0 1 56 26\"/><path d=\"M16 35 A22 22 0 0 1 48 35\"/><path d=\"M24 44 A11 11 0 0 1 40 44\"/><circle cx=\"32\" cy=\"53\" r=\"4\" fill=\"#E2783B\" stroke=\"none\"/><\/g><\/svg><p style=\"color:#5B6577\">DigiNet: một bài \"bẫy giá\", 500 lượt chia sẻ<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-08", "label": "B1 · 11", "session": 1, "part": "s2", "title": "Giá trị được kiến tạo trên bốn mốc: WTP, giá bán, chi phí, WTS", "activity": "", "points": ["WTP · mức khách sẵn sàng chi trả", "Giá bán", "Chi phí · lương, nhà cung cấp", "WTS · mức sẵn sàng cung ứng, cống hiến", "Tổng giá trị kiến tạo = WTP − WTS"], "notes": "① MỞ\n\"Khi bàn về giá, phòng tài chính nói về chi phí, phòng kinh doanh nói về giá bán. Nhưng có một con số quan trọng hơn cả mà rất ít doanh nghiệp đo: khách hàng thực sự sẵn sàng trả bao nhiêu?\"\n\n② GIẢNG\nĐây là Value Stick – công cụ của giáo sư Felix Oberholzer-Gee (Harvard Business School) trong cuốn \"Better, Simpler Strategy\" (2021). Đọc từ trên xuống:\n– WTP (Willingness to Pay): mức giá tối đa khách hàng sẵn sàng trả.\n– Giá bán: mức giá thực tế.\n– Chi phí: gồm lương thưởng nhân viên và tiền trả nhà cung cấp.\n– WTS (Willingness to Sell): mức tối thiểu mà nhân viên, nhà cung cấp chấp nhận để làm việc với doanh nghiệp.\nBa đoạn màu là ba phần giá trị. Đoạn xám nhạt (WTP trừ giá) là phần khách hàng được hưởng – sự hài lòng. Đoạn trắng (giá trừ chi phí) là biên lợi nhuận. Đoạn cam (chi phí trừ WTS) là phần nhân viên và đối tác được hưởng. Tổng giá trị kiến tạo là toàn bộ cây thước: WTP trừ WTS. Điểm then chốt: thay đổi giá bán chỉ làm thay đổi cách chia chiếc bánh. Muốn chiếc bánh lớn hơn, phải đẩy WTP lên hoặc kéo WTS xuống.\n\n③ MINH HỌA\nCase TechPharma: anh Tuấn, dân văn phòng 28 tuổi, chi khoảng 36 triệu cho thực phẩm chức năng trong hai năm. Nếu anh cảm thấy được trân trọng, WTP của anh với TechPharma cao – anh sẽ không chuyển đi dù đối thủ rẻ hơn một chút. Nhưng anh chỉ được giảm 2%, sinh nhật không ai chúc, trong khi đối thủ tặng gói kiểm tra sức khỏe. WTP của anh với TechPharma giảm dần – và một ngày anh rời đi mà không nói lời nào.\n\n④ LIÊN HỆ\nMột câu hỏi rất hữu ích trong mọi cuộc họp phê duyệt sáng kiến: \"Sáng kiến này di chuyển mốc nào trên cây thước?\" Phần lớn chương trình khuyến mãi chỉ di chuyển giá bán. Phần lớn dự án cắt giảm chỉ di chuyển chi phí. Rất ít sáng kiến thực sự nâng WTP.\n\n★ CÂU CHỐT: \"Giá bán chỉ quyết định cách chia chiếc bánh. Trải nghiệm quyết định chiếc bánh lớn đến đâu.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Sáng kiến lớn nhất năm nay của doanh nghiệp anh chị đang tác động vào mốc nào trên cây thước?\"\nNếu lớp im lặng: gợi ý ba ví dụ – chương trình khuyến mãi (giá bán), tự động hóa (chi phí), chương trình thành viên (WTP) – rồi mời mọi người tự xếp loại.\nCâu trả lời có thể gặp: \"chuyển đổi số\" → hỏi tiếp: \"Để giảm chi phí vận hành, hay để khách thấy đáng tiền hơn? Hai mục tiêu này dẫn tới hai thiết kế rất khác nhau.\"\n\n⑥ CHUYỂN Ý\n\"Và đây là cái bẫy mà rất nhiều doanh nghiệp đang mắc phải khi cố làm khách hàng hài lòng hơn.\"", "html": "<section id=\"b1-08\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:40px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Giá trị được kiến tạo trên bốn mốc: WTP, giá bán, chi phí, WTS<\/h2>\n<div style=\"position:relative; width:1664px; height:480px\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Cây thước dọc gồm ba đoạn xám tối nhạt, trắng, cam, phân cách bởi bốn vạch mốc\" width=\"260\" height=\"480\" viewBox=\"0 0 260 480\" style=\"position:absolute; left:0; top:0; width:260px; height:480px\"><rect x=\"70\" y=\"40\" width=\"130\" height=\"130\" fill=\"#8A94A6\"/><rect x=\"70\" y=\"170\" width=\"130\" height=\"130\" fill=\"#1E2533\"/><rect x=\"70\" y=\"300\" width=\"130\" height=\"130\" fill=\"#E2783B\"/><line x1=\"20\" y1=\"40\" x2=\"250\" y2=\"40\" stroke=\"#1E2533\" stroke-width=\"8\"/><line x1=\"20\" y1=\"170\" x2=\"250\" y2=\"170\" stroke=\"#1E2533\" stroke-width=\"8\"/><line x1=\"20\" y1=\"300\" x2=\"250\" y2=\"300\" stroke=\"#1E2533\" stroke-width=\"8\"/><line x1=\"20\" y1=\"430\" x2=\"250\" y2=\"430\" stroke=\"#1E2533\" stroke-width=\"8\"/><\/svg>\n<p style=\"position:absolute; left:320px; top:1px; width:1340px\"><b>WTP<\/b> · mức khách sẵn sàng chi trả<\/p>\n<p style=\"position:absolute; left:320px; top:131px; width:1340px\"><b>Giá bán<\/b><\/p>\n<p style=\"position:absolute; left:320px; top:261px; width:1340px\"><b>Chi phí<\/b> · lương, nhà cung cấp<\/p>\n<p style=\"position:absolute; left:320px; top:391px; width:1340px\"><b style=\"color:#E2783B\">WTS<\/b> · mức sẵn sàng cung ứng, cống hiến<\/p>\n<\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng đồng xu – giá trị\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><ellipse cx=\"32\" cy=\"16\" rx=\"22\" ry=\"9\"/><path d=\"M10 16 V32 C 10 37, 20 41, 32 41 C 44 41, 54 37, 54 32 V16\"/><path d=\"M10 32 V48 C 10 53, 20 57, 32 57 C 44 57, 54 53, 54 48 V32\"/><\/g><\/svg><p style=\"font-weight:700; color:#E2783B\">Tổng giá trị kiến tạo = WTP − WTS<\/p><\/div>\n<\/section>"}, {"id": "b1-09", "label": "B1 · 12", "session": 1, "part": "s2", "title": "Cạnh tranh bằng giá bào mòn giá trị của mọi bên", "activity": "", "points": ["1. Giảm giá bán", "2. Biên lợi nhuận thu hẹp", "3. Cắt chi phí, chất lượng suy giảm", "DigiNet: 28% đánh giá kỹ thuật viên dưới 3/5"], "notes": "① MỞ\n\"Có bao nhiêu anh chị từng ngồi trong một cuộc họp mà kết luận là: đối thủ giảm giá, chúng ta cũng phải giảm?\" Thường sẽ có nhiều cánh tay. \"Và sau đó thì sao?\"\n\n② GIẢNG\nHãy theo dõi chuỗi phản ứng trên slide. Bước 1: doanh nghiệp giảm giá để khách hàng hài lòng hơn. Trên Value Stick, việc này chỉ chuyển một phần giá trị từ doanh nghiệp sang khách hàng – không tạo thêm giá trị mới. Bước 2: biên lợi nhuận thu hẹp. Bước 3: để bù lại, doanh nghiệp cắt chi phí – giảm nhân sự tuyến đầu, cắt đào tạo, dùng vật tư rẻ hơn. Chất lượng trải nghiệm giảm, WTP của khách cũng giảm theo, và khách lại đòi giá thấp hơn. Vòng xoáy tiếp tục. Giới quản trị gọi đó là \"cuộc đua xuống đáy\" (race to the bottom).\n\n③ MINH HỌA\nCase DigiNet mô tả đúng vòng xoáy này. Thị trường viễn thông bão hòa, cuộc chiến giá làm biên lợi nhuận mỏng. Hệ quả nằm ở tuyến đầu: 28% khách chấm kỹ thuật viên dưới 3/5 – đến muộn, không gọi báo trước, thái độ chưa chuyên nghiệp. Hotline có thời gian chờ trung bình 3,5 phút và 40% khách phải gọi lại lần hai. Không ai ra quyết định \"làm trải nghiệm tệ đi\"; đó là hệ quả tích lũy của những lần cắt giảm để bù cho giá.\n\n④ LIÊN HỆ\nGiảm giá không sai trong mọi trường hợp: thâm nhập thị trường, xả hàng tồn kho, phản ứng chiến thuật. Nó trở thành sai khi được dùng làm chiến lược mặc định. Câu hỏi CEO nên đặt ra: \"Chương trình giảm giá này đang mua về khách hàng trung thành, hay khách hàng săn khuyến mãi?\"\n\n★ CÂU CHỐT: \"Khách hàng đến vì giá rẻ sẽ rời đi khi có nơi rẻ hơn.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Doanh nghiệp anh chị đã từng rơi vào vòng giảm giá nào? Điều gì giúp thoát ra – hoặc vì sao vẫn chưa thoát được?\"\nNếu lớp im lặng: hỏi trực tiếp các anh chị trong ngành bán lẻ, điện máy, logistics – nơi áp lực giá rất lớn.\nCâu trả lời có thể gặp: \"Không giảm thì mất thị phần\" → phản hồi: \"Đúng trong ngắn hạn. Nhưng thị phần đó có mang lại lợi nhuận không, và khách có ở lại khi hết khuyến mãi không?\". \"Chúng tôi chuyển sang bán gói dịch vụ trọn gói thay vì giảm giá\" → rất tốt, đó chính là con đường ở slide tiếp theo.\n\n⑥ CHUYỂN Ý\n\"Vậy có con đường nào khác không? Có – thay vì hạ giá bán xuống, hãy nâng mức sẵn sàng chi trả lên.\"", "html": "<section id=\"b1-09\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Cạnh tranh bằng giá bào mòn giá trị của mọi bên<\/
