\"376\" r=\"26\" fill=\"#E2783B\"/><path d=\"M24 454 Q60 396 96 454 Z\" fill=\"#E2783B\"/><path d=\"M110 100 C 300 100, 420 200, 540 236\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"8\" stroke-dasharray=\"4 0\"/><path d=\"M110 260 C 220 300, 300 180, 400 250 S 500 250, 540 244\" fill=\"none\" stroke=\"#8A94A6\" stroke-width=\"8\"/><path d=\"M110 420 C 220 470, 260 330, 330 400 S 440 470, 460 360 S 520 270, 540 252\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"8\"/><circle cx=\"600\" cy=\"244\" r=\"66\" fill=\"#FFFFFF\" stroke=\"#D5DAE1\" stroke-width=\"8\"/><circle cx=\"600\" cy=\"244\" r=\"38\" fill=\"#FFFFFF\" stroke=\"#D5DAE1\" stroke-width=\"8\"/><circle cx=\"600\" cy=\"244\" r=\"14\" fill=\"#1E2533\"/><\/g><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:28px\">\n<p><b>Người mua<\/b> · hiệu quả đầu tư, rủi ro<\/p>\n<p><b style=\"color:#E2783B\">Người dùng<\/b> · dễ dùng, ít xáo trộn<\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng màn hình phần mềm – case BizManage\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"6\" y=\"8\" width=\"52\" height=\"36\" rx=\"5\"/><line x1=\"22\" y1=\"56\" x2=\"42\" y2=\"56\"/><line x1=\"32\" y1=\"44\" x2=\"32\" y2=\"56\"/><line x1=\"20\" y1=\"36\" x2=\"20\" y2=\"28\"/><line x1=\"32\" y1=\"36\" x2=\"32\" y2=\"18\"/><line x1=\"44\" y1=\"36\" x2=\"44\" y2=\"24\"/><\/g><\/svg><p style=\"color:#5B6577\">BizManage: CEO ký hợp đồng, kế toán vẫn dùng Excel<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-39", "label": "B1 · 43", "session": 1, "part": "s6", "title": "Khách hàng đi một hành trình; doanh nghiệp vận hành theo phòng ban", "activity": "", "points": ["80% doanh nghiệp tin mình vượt trội", "8% khách hàng đồng ý", "DigiNet: hứa lắp trong 24 giờ, ngày thứ 5 mới xong"], "notes": "① MỞ\n\"Nếu tôi hỏi từng trưởng phòng trong công ty anh chị: 'Bộ phận của anh chị có làm tốt không?', gần như ai cũng sẽ trả lời 'có', với số liệu KPI chứng minh. Vậy tại sao khách hàng vẫn không hài lòng?\"\n\n② GIẢNG\nNăm 2005, Bain & Company công bố một khảo sát với hơn 360 doanh nghiệp: 80% tin rằng mình mang lại trải nghiệm vượt trội cho khách hàng, nhưng chỉ 8% khách hàng của họ đồng ý. Khoảng cách này được gọi là \"khoảng cách trải nghiệm\". Một nguyên nhân chính là cấu trúc tổ chức theo chức năng – các \"silo\". Mỗi phòng ban tối ưu KPI của mình: bán hàng tối ưu số hợp đồng, kỹ thuật tối ưu số lượt lắp đặt mỗi ngày, tổng đài tối ưu thời gian xử lý cuộc gọi. Mỗi đoạn có thể \"xanh\", nhưng hành trình của khách vẫn \"đỏ\" – vì trải nghiệm tệ nhất thường xảy ra ở chỗ chuyển giao giữa hai phòng ban, nơi không ai có KPI. Đó là những đoạn đứt nét trên hình. Tư duy cần chuyển từ \"từ trong ra\" – chúng ta được tổ chức thế nào – sang \"từ ngoài vào\" – khách hàng đi qua chúng ta thế nào.\n\n③ MINH HỌA\nCase DigiNet, anh Minh – gia đình trẻ, hai vợ chồng làm việc tại nhà. Nhân viên bán hàng hứa lắp đặt trong 24 giờ. Đến ngày thứ năm mới lắp xong, WiFi chỉ mạnh ở một phòng; anh phải dùng 4G và lỡ một cuộc họp quan trọng. Anh kể lại trong nhóm cư dân chung cư khoảng 2.000 người. Hãy nhìn vào các silo: bán hàng hứa theo chỉ tiêu doanh số; bộ phận kỹ thuật – với 28% lượt lắp đặt bị đánh giá dưới 3 trên 5, đến muộn, không gọi trước – xếp lịch theo năng lực của mình; tổng đài bắt khách chờ trung bình 3,5 phút và 40% phải gọi lại. Không phòng nào sai theo KPI của mình. Nhưng hành trình của anh Minh thì hỏng.\n\n④ LIÊN HỆ\nĐây là lý do CX phải là trách nhiệm của ban điều hành, như đã bàn ở Phần 2. Chỉ cấp điều hành mới có thể đặt ra một chỉ số chung cho cả hành trình, và chỉ định người \"sở hữu\" những đoạn chuyển giao.\n\n★ CÂU CHỐT: \"Khách hàng không quan tâm sơ đồ tổ chức của anh chị. Họ chỉ quan tâm vấn đề của mình có được giải quyết trọn vẹn hay không.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Trong doanh nghiệp anh chị, đâu là một điểm chuyển giao giữa hai phòng ban mà khách hàng hay 'rơi' vào khoảng trống?\"\nNếu lớp im lặng: gợi ý các điểm chuyển giao phổ biến – bán hàng sang triển khai, triển khai sang chăm sóc khách hàng, chăm sóc khách hàng sang kỹ thuật.\nCâu trả lời có thể gặp: \"Sau khi ký hợp đồng, bán hàng chuyển cho vận hành và khách bị hỏi lại mọi thông tin\" → phản hồi: đây là một điểm đau rất phổ biến; ghi lại để dùng ở Buổi 2.\n\n⑥ CHUYỂN Ý\n\"Ở Buổi 2, các nhóm sẽ tự vẽ hành trình cho persona của mình và tìm ra những điểm đứt gãy trong case. Còn bây giờ, hãy cùng nhìn lại những gì đã học hôm nay.\"\n\nTÓM TẮT PHẦN 4 (một câu): Khách hàng trải qua một hành trình vòng lặp xuyên qua nhiều phòng ban; bản đồ hành trình và đường cảm xúc giúp nhà quản lý thấy nơi cần can thiệp và ai phải chịu trách nhiệm.", "html": "<section id=\"b1-39\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Khách hàng đi một hành trình; doanh nghiệp vận hành theo phòng ban<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Bốn cột phòng ban xám tối; mũi tên hành trình màu cam đi ngang qua, bị đứt quãng ở khoảng trống giữa các cột\" width=\"680\" height=\"480\" viewBox=\"0 0 680 480\" style=\"width:680px; height:480px\"><rect x=\"30\" y=\"40\" width=\"120\" height=\"400\" rx=\"14\" fill=\"#D5DAE1\"/><rect x=\"30\" y=\"40\" width=\"120\" height=\"44\" rx=\"14\" fill=\"#1E2533\"/><rect x=\"190\" y=\"40\" width=\"120\" height=\"400\" rx=\"14\" fill=\"#D5DAE1\"/><rect x=\"190\" y=\"40\" width=\"120\" height=\"44\" rx=\"14\" fill=\"#1E2533\"/><rect x=\"350\" y=\"40\" width=\"120\" height=\"400\" rx=\"14\" fill=\"#D5DAE1\"/><rect x=\"350\" y=\"40\" width=\"120\" height=\"44\" rx=\"14\" fill=\"#1E2533\"/><rect x=\"510\" y=\"40\" width=\"120\" height=\"400\" rx=\"14\" fill=\"#D5DAE1\"/><rect x=\"510\" y=\"40\" width=\"120\" height=\"44\" rx=\"14\" fill=\"#1E2533\"/><line x1=\"38\" y1=\"260\" x2=\"142\" y2=\"260\" stroke=\"#E2783B\" stroke-width=\"16\" stroke-linecap=\"round\"/><line x1=\"198\" y1=\"260\" x2=\"302\" y2=\"260\" stroke=\"#E2783B\" stroke-width=\"16\" stroke-linecap=\"round\"/><line x1=\"358\" y1=\"260\" x2=\"462\" y2=\"260\" stroke=\"#E2783B\" stroke-width=\"16\" stroke-linecap=\"round\"/><line x1=\"518\" y1=\"260\" x2=\"622\" y2=\"260\" stroke=\"#E2783B\" stroke-width=\"16\" stroke-linecap=\"round\"/><line x1=\"150\" y1=\"260\" x2=\"190\" y2=\"260\" stroke=\"#E2783B\" stroke-width=\"8\" stroke-dasharray=\"6 8\"/><line x1=\"310\" y1=\"260\" x2=\"350\" y2=\"260\" stroke=\"#E2783B\" stroke-width=\"8\" stroke-dasharray=\"6 8\"/><line x1=\"470\" y1=\"260\" x2=\"510\" y2=\"260\" stroke=\"#E2783B\" stroke-width=\"8\" stroke-dasharray=\"6 8\"/><path d=\"M636 236 L676 260 L636 284 Z\" fill=\"#E2783B\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:40px\">\n<p><b style=\"color:#E2783B\">80%<\/b> doanh nghiệp tin mình vượt trội<\/p>\n<p><b>8%<\/b> khách hàng đồng ý<\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng wifi – case DigiNet\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 26 A34 34 0 0 1 56 26\"/><path d=\"M16 35 A22 22 0 0 1 48 35\"/><path d=\"M24 44 A11 11 0 0 1 40 44\"/><circle cx=\"32\" cy=\"53\" r=\"4\" fill=\"#E2783B\" stroke=\"none\"/><\/g><\/svg><p style=\"color:#5B6577\">DigiNet: hứa lắp trong 24 giờ, ngày thứ 5 mới xong<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-41", "label": "B1 · 44", "session": 1, "part": "s7", "title": "Bốn điều cần mang về từ Buổi 1", "activity": "", "points": ["01 Trải nghiệm nâng mức sẵn sàng chi trả", "02 CX là việc của toàn tổ chức", "03 Hiểu khách từ hành vi và mâu thuẫn", "04 Hành trình cắt ngang mọi phòng ban"], "notes": "① MỞ\n\"Ba tiếng rưỡi vừa qua, chúng ta đã đi qua bốn câu hỏi lớn. Nếu mỗi câu hỏi anh chị chỉ mang về một câu trả lời, thì đó là bốn câu trên màn hình.\"\n\n② GIẢNG – NHẮC LẠI TỪNG PHẦN\n01 – Vì sao trải nghiệm tạo ra mức sẵn sàng chi trả cao hơn? Khi sản phẩm bị hàng hóa hóa, trải nghiệm là cách chính để nâng mức sẵn sàng chi trả của khách hàng mà không phải tham gia cuộc chiến giá. Trải nghiệm là một đòn bẩy kinh tế, không phải một khoản chi phí dịch vụ.\n02 – CX khác gì chăm sóc khách hàng, và ai chịu trách nhiệm? Chăm sóc khách hàng chỉ là phần nổi của tảng băng. CX là tổng cảm nhận qua mọi điểm chạm, và vì vậy nó cần được quản trị ở cấp điều hành, dựa trên nền tảng văn hóa, con người và quy trình.\n03 – Doanh nghiệp thực sự hiểu khách hàng đến mức nào? Khách hàng mua kết quả, không mua công cụ. Sự thấu hiểu đến từ hành vi thật trong quá khứ, từ việc kết hợp con số với câu chuyện, và được chắt lọc thành insight có mâu thuẫn và động lực.\n04 – Khách hàng trải qua doanh nghiệp theo hành trình nào? Một hành trình vòng lặp, quyết định nhiều khi đã diễn ra trước khi gặp doanh nghiệp, cảm xúc lên xuống với những điểm đáy – và luôn đi xuyên qua nhiều phòng ban.\n\n③ MINH HỌA\nBậc thang trên hình thể hiện mạch logic của buổi học: từ \"vì sao\" (lý do kinh tế), đến \"ai\" (trách nhiệm quản trị), đến \"hiểu\" (khách hàng), và cuối cùng là \"nhìn\" (hành trình). Buổi 2 sẽ đi tiếp từ \"nhìn\" sang \"làm\": thiết kế, đo lường và dẫn dắt thay đổi.\n\n④ LIÊN HỆ\nMời mỗi nhóm nhìn lại case của mình: sau hôm nay, nhóm đã có một persona, một empathy map và một insight. Đó là \"người khách\" mà nhóm sẽ dẫn đi trên bản đồ hành trình khổ A1 ở Buổi 2.\n\n★ CÂU CHỐT: \"Trải nghiệm là một lựa chọn chiến lược – và nó bắt đầu bằng việc nhìn doanh nghiệp qua đôi mắt của khách hàng.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Trong bốn ý này, ý nào anh chị thấy doanh nghiệp mình đang yếu nhất?\" Mời ba đến bốn học viên trả lời nhanh bằng một con số, 01 đến 04.\nNếu lớp im lặng: đề nghị cả lớp giơ tay theo từng con số.\nCâu trả lời có thể gặp: đa số chọn 02 hoặc 04 → phản hồi: đó là những vấn đề tổ chức, không phải vấn đề kỹ thuật; và đó chính là trọng tâm của phần \"dẫn dắt thay đổi\" trong Buổi 2.\n\n⑥ CHUYỂN Ý\n\"Nếu chỉ được giữ lại một thông điệp duy nhất từ hôm nay, tôi mong anh chị giữ lại câu sau.\"", "html": "<section id=\"b1-41\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Bốn điều cần mang về từ Buổi 1<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Bậc thang bốn nấc đi lên với bốn chấm tròn cam, xám nhạt, trắng và trắng\" width=\"560\" height=\"600\" viewBox=\"0 0 560 600\" style=\"width:560px; height:600px\"><path d=\"M20 580 H160 V430 H300 V280 H440 V130 H540\" fill=\"none\" stroke=\"#D5DAE1\" stroke-width=\"8\" stroke-linejoin=\"round\"/><circle cx=\"90\" cy=\"540\" r=\"32\" fill=\"#E2783B\"/><circle cx=\"230\" cy=\"390\" r=\"32\" fill=\"#8A94A6\"/><circle cx=\"370\" cy=\"240\" r=\"32\" fill=\"#1E2533\"/><circle cx=\"490\" cy=\"90\" r=\"32\" fill=\"#1E2533\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:32px\">\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng coin\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><ellipse cx=\"32\" cy=\"16\" rx=\"22\" ry=\"9\"/><path d=\"M10 16 V32 C 10 37, 20 41, 32 41 C 44 41, 54 37, 54 32 V16\"/><path d=\"M10 32 V48 C 10 53, 20 57, 32 57 C 44 57, 54 53, 54 48 V32\"/><\/g><\/svg><p><b style=\"color:#E2783B\">01<\/b> Trải nghiệm nâng mức sẵn sàng chi trả<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng group\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"32\" cy=\"18\" r=\"8\"/><path d=\"M17 52 C 17 36, 47 36, 47 52\"/><circle cx=\"11\" cy=\"26\" r=\"6\"/><circle cx=\"53\" cy=\"26\" r=\"6\"/><path d=\"M2 50 C 2 42, 12 38, 19 41\"/><path d=\"M62 50 C 62 42, 52 38, 45 41\"/><\/g><\/svg><p><b>02<\/b> CX là việc của toàn tổ chức<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng search\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"27\" cy=\"27\" r=\"17\"/><line x1=\"40\" y1=\"40\" x2=\"58\" y2=\"58\"/><\/g><\/svg><p><b>03<\/b> Hiểu khách từ hành vi và mâu thuẫn<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng route\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"50\" r=\"6\"/><circle cx=\"52\" cy=\"14\" r=\"6\"/><path d=\"M18 50 H40 C 50 50, 50 32, 40 32 H24 C 14 32, 14 14, 24 14 H46\"/><\/g><\/svg><p><b>04<\/b> Hành trình cắt ngang mọi phòng ban<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-42", "label": "B1 · 45", "session": 1, "part": "s7", "title": "Khách hàng ghi nhớ cảm nhận, không chỉ ghi nhớ sản phẩm", "activity": "", "points": [], "notes": "① MỞ\nDừng lại vài giây trước khi nói. Để câu thông điệp tự đứng trên màn hình. Sau đó nói chậm: \"Nếu chỉ mang về một câu từ buổi hôm nay, tôi mong đó là câu này.\"\n\n② GIẢNG\nQuay lại con số chúng ta bắt đầu buổi học: 32% khách hàng sẵn sàng rời bỏ thương hiệu yêu thích chỉ sau một trải nghiệm tệ. Họ không rời đi vì sản phẩm đột nhiên kém đi. Họ rời đi vì một cảm nhận: bị coi thường, bị bỏ rơi, bị \"gài bẫy\", hoặc đơn giản là mệt mỏi. Cả bốn case của lớp đều cho thấy điều này. Không doanh nghiệp nào có sản phẩm tệ: đường truyền của DigiNet vẫn chạy, thuốc của TechPharma vẫn đúng chất lượng, phần mềm của BizManage vẫn đủ tính năng, chương trình của Life Biz School vẫn có giá trị. Nhưng điều khách hàng mang theo và kể lại là cảm nhận: \"hứa 24 giờ mà năm ngày\", \"hai giờ sáng không ai nghe máy\", \"đầu tư 200 triệu mà nhân viên vẫn dùng Excel\", \"220 triệu mà im lặng sáu tuần\". Quy luật Peak-End nhắc chúng ta: trí nhớ của khách hàng không phải là bảng điểm trung bình, mà là một vài khoảnh khắc mạnh nhất.\n\n③ MINH HỌA\nCó một câu thường được gán cho nhà thơ Maya Angelou: \"Người ta sẽ quên những gì bạn nói, quên những gì bạn làm, nhưng sẽ không bao giờ quên bạn đã khiến họ cảm thấy thế nào.\" Dù nguồn gốc chính xác của câu nói còn được bàn luận, ý nghĩa của nó đúng với trải nghiệm khách hàng. Ví dụ thực tiễn: tháng 6/2022, họa sĩ Anna Brose ở Mỹ liên hệ Chewy – nhà bán lẻ đồ thú cưng trực tuyến – để trả lại túi thức ăn chưa mở vì chú chó Gus của cô vừa mất. Chewy hoàn tiền, đề nghị cô tặng túi thức ăn cho trại cứu hộ, và vài ngày sau gửi tới một bó hoa kèm tấm thiệp viết tay của nhân viên chăm sóc khách hàng. Dòng tweet của cô lan truyền, và nhiều khách hàng khác kể đã nhận được hoa, thậm chí tranh vẽ chân dung thú cưng. Chewy cho biết đây là cách làm có từ những ngày đầu của công ty. Khách hàng không nhớ giá thức ăn; họ nhớ doanh nghiệp đã ở bên họ lúc buồn.\n\n④ LIÊN HỆ\nVới nhà quản lý, thông điệp này có một hàm ý rất thực tế: các chỉ số vận hành – thời gian xử lý, tỷ lệ lắp đặt đúng hạn, số tính năng – là cần thiết nhưng chưa đủ. Cần hỏi thêm: ở mỗi khoảnh khắc quan trọng, khách hàng cảm thấy thế nào? Và chúng ta có đo được điều đó không? Đó là câu hỏi mở đầu cho Buổi 2.\n\n★ CÂU CHỐT: \"Sản phẩm đưa khách hàng đến với chúng ta. Cảm nhận quyết định họ có ở lại và giới thiệu người khác hay không.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Nếu khách hàng của anh chị chỉ được dùng ba từ để mô tả cảm nhận về doanh nghiệp, anh chị mong đó là ba từ nào – và anh chị nghĩ thực tế họ sẽ dùng ba từ nào?\"\nNếu lớp im lặng: đề nghị mỗi người viết ba từ ra giấy, không cần chia sẻ – giữ lại để dùng cho bài tập tuần này.\nCâu trả lời có thể gặp: \"Mong là 'tin cậy', thực tế có thể là 'chậm'\" → phản hồi: khoảng cách giữa hai bộ ba từ đó chính là chương trình hành động CX của anh chị.\n\n⑥ CHUYỂN Ý\n\"Để Buổi 2 thực sự hữu ích, tôi đề nghị anh chị làm ba việc trong tuần này.\"", "html": "<section id=\"b1-42\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:56px\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Hình đầu người nhìn nghiêng màu trắng với trái tim màu cam bên trong\" width=\"360\" height=\"360\" viewBox=\"0 0 200 200\" style=\"width:360px; height:360px\"><path d=\"M60 190 L60 150 C 30 130, 30 60, 80 30 C 130 5, 185 40, 175 95 L185 125 L165 128 L165 160 L130 160 L130 190 Z\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"8\" stroke-linejoin=\"round\"/><path d=\"M108 118 C 80 98, 78 76, 94 70 C 102 67, 108 72, 108 78 C 108 72, 114 67, 122 70 C 138 76, 136 98, 108 118 Z\" fill=\"#E2783B\"/><\/svg>\n<h1 style=\"font-size:96px; font-weight:800; line-height:1.15; color:#1E2533; text-align:center; width:1500px\">Khách hàng ghi nhớ cảm nhận, không chỉ ghi nhớ sản phẩm<\/h1>\n<\/section>"}, {"id": "b1-43", "label": "B1 · 46", "session": 1, "part": "s7", "title": "Hành động trước Buổi 2", "activity": "", "points": ["1. Tự đi một hành trình của chính doanh nghiệp mình", "2. Phỏng vấn một khách hàng theo Mom Test", "3. Nhóm: chọn một tình huống Problem Canvas"], "notes": "① MỞ\n\"Kiến thức hôm nay chỉ thật sự thuộc về anh chị khi anh chị áp dụng nó vào doanh nghiệp của mình. Vì vậy, bài tập tuần này không nằm trên giấy, mà nằm trong chính công ty anh chị.\"\n\n② GIẢNG – BA HÀNH ĐỘNG\nHành động 1 – Tự đi một hành trình của chính doanh nghiệp mình. Hãy đóng vai một khách hàng bình thường: gọi tổng đài, đặt một đơn hàng, gửi một email khiếu nại, hoặc tìm thông tin trên website lúc 11 giờ đêm. Đừng xưng danh. Ghi lại ba điều: điểm chạm nào khiến anh chị bất ngờ, điểm nào khiến anh chị bực mình, và anh chị cảm thấy thế nào ở cuối hành trình.\nHành động 2 – Phỏng vấn một khách hàng theo nguyên tắc Mom Test. Chỉ 20 phút. Hỏi về hành vi trong quá khứ: \"Lần gần nhất anh chị gặp vấn đề này là khi nào, đã xử lý ra sao?\" Không hỏi \"Anh chị có thích sản phẩm của chúng tôi không?\". Ghi lại một câu nói nguyên văn của khách hàng khiến anh chị suy nghĩ.\nHành động 3 – Dành cho nhóm: dựa trên persona và empathy map vừa trình bày, chọn MỘT tình huống trong phần \"Tình huống Problem Canvas\" của case – tốt nhất là tình huống gắn với nỗi đau lớn nhất của persona. Đó sẽ là đầu vào cho phân tích nguyên nhân gốc rễ ở đầu Buổi 2.\n\n③ MINH HỌA\nNhiều lãnh đạo doanh nghiệp định kỳ tự trải nghiệm dịch vụ như một khách hàng bình thường, hoặc dành thời gian trực tổng đài, nghe cuộc gọi khách hàng. Chỉ một lần như vậy thường mang lại nhiều nhận thức hơn một báo cáo dài. Ví dụ thực tiễn: tháng 6/2010, Brian Chesky – đồng sáng lập và CEO Airbnb – trả lại căn hộ của mình và sống hoàn toàn bằng các chỗ ở đặt qua Airbnb tới hết năm, mỗi nơi hai, ba đêm, để tự trải nghiệm sản phẩm như một khách hàng và gặp trực tiếp các chủ nhà. Ở Việt Nam, học viên có thể tự thử với chính doanh nghiệp mình theo cùng tinh thần.\n\n④ LIÊN HỆ – GIỚI THIỆU BUỔI 2\nBuổi 2 sẽ đi từ \"nhìn thấy\" sang \"hành động\": vì sao vấn đề xảy ra (nguyên nhân gốc rễ), thiết kế những khoảnh khắc vượt kỳ vọng và kịch bản phục hồi khi có sự cố, đo lường trải nghiệm bằng những chỉ số nào, và làm thế nào để dẫn dắt tổ chức thay đổi. Buổi học kết thúc bằng phần trình bày ba phút của mỗi nhóm với ba sáng kiến CX.\n\n★ CÂU CHỐT: \"Hãy làm khách hàng của chính mình một lần trong tuần này – anh chị sẽ thấy những điều không báo cáo nào cho anh chị thấy.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Anh chị sẽ tự đi hành trình nào trong tuần này? Hãy nói to một hành trình cụ thể.\"\nNếu lớp im lặng: mời hai học viên cam kết trước lớp, ghi tên lên bảng để hỏi lại ở đầu Buổi 2.\nCâu trả lời có thể gặp: \"Tôi sẽ gọi tổng đài của công ty mình\" → khuyến khích: hãy gọi vào giờ cao điểm và thử một yêu cầu không có trong kịch bản.\n\n⑥ KẾT THÚC BUỔI\nCảm ơn lớp. Nhắc các nhóm giữ lại bản giấy persona và empathy map, mang theo ở Buổi 2 – đó là đầu vào cho bản đồ hành trình khổ A1. \"Hẹn gặp lại anh chị tuần sau, với những câu chuyện thật từ chính doanh nghiệp của mình.\"", "html": "<section id=\"b1-43\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Hành động trước Buổi 2<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Tờ lịch màu trắng với ba dấu tích: cam, xám nhạt và trắng\" width=\"480\" height=\"500\" viewBox=\"0 0 480 500\" style=\"width:480px; height:500px\"><rect x=\"20\" y=\"50\" width=\"440\" height=\"430\" rx=\"24\" fill=\"#FFFFFF\" stroke=\"#1E2533\" stroke-width=\"8\"/><rect x=\"20\" y=\"50\" width=\"440\" height=\"90\" rx=\"24\" fill=\"#1E2533\"/><rect x=\"100\" y=\"20\" width=\"22\" height=\"70\" rx=\"10\" fill=\"#8A94A6\"/><rect x=\"358\" y=\"20\" width=\"22\" height=\"70\" rx=\"10\" fill=\"#8A94A6\"/><path d=\"M70 225 L105 260 L165 190\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"16\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"200\" y=\"210\" width=\"220\" height=\"24\" rx=\"10\" fill=\"#D5DAE1\"/><path d=\"M70 320 L105 355 L165 285\" fill=\"none\" stroke=\"#8A94A6\" stroke-width=\"16\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"200\" y=\"305\" width=\"190\" height=\"24\" rx=\"10\" fill=\"#D5DAE1\"/><path d=\"M70 415 L105 450 L165 380\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"16\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"200\" y=\"400\" width=\"205\" height=\"24\" rx=\"10\" fill=\"#D5DAE1\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:40px\">\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng route\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"50\" r=\"6\"/><circle cx=\"52\" cy=\"14\" r=\"6\"/><path d=\"M18 50 H40 C 50 50, 50 32, 40 32 H24 C 14 32, 14 14, 24 14 H46\"/><\/g><\/svg><p><b style=\"color:#E2783B\">1.<\/b> Tự đi một hành trình của chính doanh nghiệp mình<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng mic\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"22\" y=\"6\" width=\"20\" height=\"32\" rx=\"10\"/><path d=\"M12 30 C 12 42, 20 48, 32 48 C 44 48, 52 42, 52 30\"/><line x1=\"32\" y1=\"48\" x2=\"32\" y2=\"58\"/><line x1=\"22\" y1=\"58\" x2=\"42\" y2=\"58\"/><\/g><\/svg><p><b>2.<\/b> Phỏng vấn một khách hàng theo Mom Test<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng group\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"32\" cy=\"18\" r=\"8\"/><path d=\"M17 52 C 17 36, 47 36, 47 52\"/><circle cx=\"11\" cy=\"26\" r=\"6\"/><circle cx=\"53\" cy=\"26\" r=\"6\"/><path d=\"M2 50 C 2 42, 12 38, 19 41\"/><path d=\"M62 50 C 62 42, 52 38, 45 41\"/><\/g><\/svg><p><b>3.<\/b> Nhóm: chọn một tình huống Problem Canvas<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b2-01", "label": "B2 · 01", "session": 2, "part": "s8", "title": "Trang bìa – Buổi 2", "activity": "", "points": ["FPT MiniMBA 2026", "Buổi 2 · GV. Đan Tuấn Anh"], "notes": "① MỞ\n\"Chào mừng anh chị quay lại. Tuần trước chúng ta kết thúc với một câu: khách hàng ghi nhớ cảm nhận, không chỉ ghi nhớ sản phẩm. Hôm nay chúng ta trả lời câu hỏi tiếp theo, và cũng là câu hỏi mà mọi CEO sẽ hỏi: vậy thì làm gì?\" Dừng một nhịp.\n\n② GIẢNG\nNhắc lại mạch của học phần. Buổi 1 là buổi \"nhìn thấy\": vì sao trải nghiệm là chiến lược, ai chịu trách nhiệm, khách hàng thực sự nghĩ gì, và họ đi qua doanh nghiệp theo hành trình nào. Mỗi nhóm đã có trong tay một persona, một empathy map và một insight, và đã chọn một tình huống Problem Canvas gắn với nỗi đau lớn nhất của persona. Buổi 2 là buổi \"hành động\": tìm ra vì sao nỗi đau đó xảy ra, thiết kế lại trải nghiệm – cả khi mọi việc suôn sẻ lẫn khi có sự cố, đo lường kết quả, và dẫn dắt tổ chức thay đổi. Cuối buổi, mỗi nhóm trình bày ba sáng kiến trải nghiệm khách hàng như trước hội đồng quản trị, rồi dựng bản đồ hành trình khổ A1 cho persona của mình và trình bày trong \"triển lãm hành trình\".\n\n③ MINH HỌA\nCon đường trên màn hình vẫn là con đường của buổi trước, nhưng lần này có một điểm đích. Hành trình khách hàng không có điểm kết thúc, nhưng hành trình học tập của hai buổi thì có: một kế hoạch hành động cụ thể mà mỗi anh chị có thể mang về doanh nghiệp của mình vào sáng thứ Hai.\n\n④ LIÊN HỆ\nNhắc học viên: phần giá trị nhất của hôm nay không nằm ở mô hình, mà ở câu hỏi \"doanh nghiệp của mình sẽ làm gì khác đi\". Mời mọi người ghi sẵn một trang giấy với tiêu đề \"Việc tôi sẽ làm\" và bổ sung dần trong suốt buổi học. Cuối buổi, giảng viên sẽ dành vài phút để mỗi người chọn ra một việc quan trọng nhất trong danh sách đó và cam kết thực hiện trong ba mươi ngày tới.\n\n★ CÂU CHỐT: \"Buổi 1 giúp chúng ta nhìn thấy khách hàng. Buổi 2 giúp chúng ta hành động vì khách hàng.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Sau một tuần, có ai đã nhìn một trải nghiệm quen thuộc – ở doanh nghiệp mình hoặc ở một thương hiệu khác – theo cách khác đi không?\"\nNếu lớp im lặng: kể một ví dụ về một trải nghiệm quen thuộc được nhìn lại. Domino's Pizza ra mắt \"Pizza Tracker\" năm 2008: khách theo dõi đơn hàng qua năm bước – nhận đơn, chuẩn bị, vào lò, đóng hộp, đang giao – và biết tên người giao. Chiếc bánh không nhanh hơn, nhưng khoảng thời gian chờ không còn là \"vùng im lặng\". Ngày nay, gần như mọi ứng dụng giao hàng đều làm theo.\nCâu trả lời có thể gặp: \"Tôi để ý hơn tới lúc chờ đợi\" → phản hồi: đó chính là \"vùng im lặng\" trên đường cảm xúc; chúng ta sẽ quay lại nó.\n\n⑥ CHUYỂN Ý\n\"Hãy bắt đầu hôm nay bằng một lựa chọn mà nhiều ban điều hành đã chọn sai.\"", "html": "<section id=\"b2-01\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; justify-content:center; gap:36px\">\n<p style=\"font-size:60px; font-weight:700; color:#E2783B\">FPT MiniMBA 2026<\/p>\n<h1 style=\"font-size:104px; font-weight:800; line-height:1.1; color:#1E2533\">Quản trị trải nghiệm khách hàng<\/h1>\n<p style=\"font-size:60px; color:#5B6577\">Buổi 2 · GV. Đan Tuấn Anh<\/p>\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Con đường uốn lượn đi tiếp, các điểm dừng cam, xám nhạt, trắng và một điểm đích trắng lớn ở cuối\" width=\"1664\" height=\"220\" viewBox=\"0 0 1664 220\" style=\"width:1664px; height:220px\"><path d=\"M0 150 C 250 150, 300 40, 520 60 S 820 200, 1040 150 S 1400 40, 1664 70\" fill=\"none\" stroke=\"#D5DAE1\" stroke-width=\"8\" stroke-linecap=\"round\"/><circle cx=\"26\" cy=\"150\" r=\"18\" fill=\"#E2783B\"/><circle cx=\"520\" cy=\"60\" r=\"18\" fill=\"#8A94A6\"/><circle cx=\"1040\" cy=\"150\" r=\"18\" fill=\"#1E2533\"/><circle cx=\"1620\" cy=\"68\" r=\"38\" fill=\"#1E2533\"/><\/svg>\n<\/section>"}, {"id": "b2-02", "label": "B2 · 02", "session": 2, "part": "s8", "title": "Làm khách hàng thích thú, hay giúp họ bớt vất vả: điều nào giữ chân khách tốt hơn?", "activity": "", "points": ["96% kém trung thành hơn khi phải nỗ lực nhiều", "9% khi được phục vụ dễ dàng", "Dixon, Freeman & Toman · HBR 2010"], "notes": "① MỞ\n\"Tôi xin anh chị một lựa chọn nhanh. Nếu năm sau chỉ còn ngân sách cho một trong hai: A – tạo ra những khoảnh khắc khiến khách hàng bất ngờ thích thú; B – giúp khách hàng giải quyết việc của họ với ít công sức nhất. Anh chị chọn A hay B?\" Mời cả lớp giơ tay. Thường đa số sẽ chọn A.\n\n② GIẢNG\nNăm 2010, Matthew Dixon, Karen Freeman và Nicholas Toman công bố trên Harvard Business Review bài \"Stop Trying to Delight Your Customers\", dựa trên nghiên cứu của CEB với hàng chục nghìn khách hàng tương tác qua tổng đài và kênh tự phục vụ. Kết quả: 96% khách hàng trải qua một tương tác \"tốn nhiều công sức\" trở nên kém trung thành hơn; con số này chỉ là 9% với những khách được phục vụ dễ dàng. Nghiên cứu cũng cho thấy việc \"vượt kỳ vọng\" trong dịch vụ hỗ trợ ít làm tăng lòng trung thành so với kỳ vọng. Công sức ở đây gồm: phải gọi lại nhiều lần, bị chuyển máy, phải lặp lại thông tin, phải đổi kênh. Lưu ý quan trọng: nghiên cứu này tập trung vào các tình huống dịch vụ và hỗ trợ. Nó không nói rằng những khoảnh khắc đáng nhớ là vô ích – mà nói rằng không thể xây khoảnh khắc đáng nhớ trên một nền tảng khiến khách hàng mệt mỏi.\n\n③ MINH HỌA\nCase DigiNet: khách chờ tổng đài trung bình 3,5 phút, 40% phải gọi lại, hệ thống trả lời tự động có bốn đến năm bước. Cô Lan, 58 tuổi, gặp sự cố truyền hình: năm bước trả lời tự động, chờ tám phút, kỹ thuật viên ba ngày chưa đến – con trai cô nổi giận và hủy hợp đồng. Không một chương trình quà tặng nào có thể bù đắp cho trải nghiệm đó.\n\n④ LIÊN HỆ\nCâu hỏi cho ban điều hành: chúng ta đang đầu tư bao nhiêu vào \"làm khách hàng thích thú\", và bao nhiêu vào \"loại bỏ những việc khiến khách hàng vất vả\"? Thứ tự đúng thường là: loại bỏ điểm đau trước, rồi mới thiết kế điểm nhấn.\n\n★ CÂU CHỐT: \"Trước khi làm khách hàng bất ngờ, hãy thôi làm khách hàng vất vả.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Trong doanh nghiệp anh chị, khách hàng đang phải làm điều gì tốn công sức nhất – mà thực ra doanh nghiệp có thể làm thay?\"\nNếu lớp im lặng: gợi ý – điền lại thông tin đã cung cấp, phải tự theo dõi tình trạng đơn hàng, phải gọi nhiều số điện thoại khác nhau.\nCâu trả lời có thể gặp: \"Khách phải nộp lại giấy tờ mỗi lần giao dịch\" → phản hồi: một ví dụ điển hình của công sức do hệ thống tạo ra; chúng ta sẽ tìm nguyên nhân gốc rễ của những điều như vậy ở Phần 1.\n\n⑥ CHUYỂN Ý\n\"Vậy hôm nay chúng ta sẽ đạt được gì? Ba mục tiêu.\"", "html": "<section id=\"b2-02\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Làm khách hàng thích thú, hay giúp họ bớt vất vả: điều nào giữ chân khách tốt hơn?<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Hai cột: cột cam cao gần tối đa tượng trưng 96 phần trăm, cột xám rất thấp tượng trưng 9 phần trăm\" width=\"560\" height=\"440\" viewBox=\"0 0 560 440\" style=\"width:560px; height:440px\"><line x1=\"20\" y1=\"430\" x2=\"540\" y2=\"430\" stroke=\"#1E2533\" stroke-width=\"8\"/><rect x=\"70\" y=\"30\" width=\"170\" height=\"400\" rx=\"12\" fill=\"#E2783B\"/><rect x=\"320\" y=\"392\" width=\"170\" height=\"38\" rx=\"12\" fill=\"#D5DAE1\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:40px\">\n<p><b style=\"color:#E2783B\">96%<\/b> kém trung thành hơn khi phải nỗ lực nhiều<\/p>\n<p><b>9%<\/b> khi được phục vụ dễ dàng<\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng cuốn sách – nguồn nghiên cứu\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M32 14 C 24 8, 12 8, 5 10 V52 C 12 50, 24 50, 32 56 C 40 50, 52 50, 59 52 V10 C 52 8, 40 8, 32 14 Z\"/><line x1=\"32\" y1=\"14\" x2=\"32\" y2=\"56\"/><\/g><\/svg><p style=\"color:#5B6577\">Dixon, Freeman &amp; Toman · HBR 2010<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b2-03", "label": "B2 · 03", "session": 2, "part": "s8", "title": "Mục tiêu buổi học", "activity": "", "points": ["Tìm nguyên nhân gốc rễ của điểm đau", "Thiết kế khoảnh khắc đáng nhớ", "Đo lường và dẫn dắt thay đổi"], "notes": "① MỞ\n\"Buổi hôm nay cũng chỉ có ba mục tiêu. Nếu cuối buổi anh chị làm được ba việc này cho doanh nghiệp của mình, học phần đã hoàn thành nhiệm vụ.\"\n\n② GIẢNG\nMục tiêu 1 – Tìm nguyên nhân gốc rễ của điểm đau. Tuần trước, mỗi nhóm đã xây dựng persona và chọn một tình huống Problem Canvas gắn với nỗi đau lớn nhất của persona. Hôm nay chúng ta hỏi: vì sao nỗi đau đó xảy ra, và vì sao nó cứ lặp lại dù nhân viên đều cố gắng? Công cụ: bản thiết kế dịch vụ (service blueprint), kỹ thuật \"5 lần vì sao\", và cách lượng hóa chi phí của một điểm đau.\nMục tiêu 2 – Thiết kế khoảnh khắc đáng nhớ. Sau khi loại bỏ điểm đau, làm thế nào để tạo ra một khoảnh khắc khách hàng nhớ và kể lại? Và khi sự cố xảy ra – vì chắc chắn sẽ xảy ra – làm thế nào để biến nó thành cơ hội củng cố niềm tin?\nMục tiêu 3 – Đo lường và dẫn dắt thay đổi. Dùng chỉ số nào để biết trải nghiệm đang tốt lên, làm sao nối chỉ số đó với kết quả tài chính, và lãnh đạo cần làm gì để CX trở thành năng lực của cả tổ chức – bắt đầu từ trải nghiệm của chính nhân viên.\n\n③ MINH HỌA\nBa biểu tượng trên màn hình tương ứng với ba mục tiêu: kính lúp soi vào gốc rễ, ngôi sao trên đường cảm xúc, và chiếc đồng hồ đo. Nhắc lại ví dụ BizManage: anh Khoa đầu tư 200 triệu nhưng nhân viên vẫn dùng Excel. Ba mục tiêu hôm nay giúp trả lời: vì sao nhân viên không dùng (gốc rễ), làm sao để 90 ngày đầu trở thành trải nghiệm tích cực (thiết kế), và làm sao chứng minh được hiệu quả đầu tư cho anh Khoa (đo lường).\n\n④ LIÊN HỆ\nMỗi mục tiêu gắn với một quyết định của nhà quản lý: sửa ở đâu, đầu tư vào đâu, và đo bằng gì. Đó cũng chính là cấu trúc của phần trình bày ba phút cuối buổi.\n\n★ CÂU CHỐT: \"Hiểu đúng nguyên nhân, thiết kế có chủ đích, đo lường nhất quán – đó là cách trải nghiệm trở thành năng lực quản trị.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Doanh nghiệp anh chị đang mạnh nhất ở mục tiêu nào và yếu nhất ở mục tiêu nào? Xin giơ tay cho mục tiêu yếu nhất.\"\nNếu lớp dồn vào mục tiêu 3: phản hồi \"Rất phổ biến – nhiều doanh nghiệp có chỉ số nhưng chưa dùng chỉ số để ra quyết định.\" Nếu dồn vào mục tiêu 1: \"Nghĩa là chúng ta đang chữa triệu chứng; Phần 1 được thiết kế cho chính điều này.\"\n\n⑥ CHUYỂN Ý\n\"Trước khi bắt đầu, tôi muốn nghe về bài tập tuần trước.\"", "html": "<section id=\"b2-03\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:56px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Mục tiêu buổi học<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px\">\n<div style=\"flex:1; display:flex; flex-direction:column; gap:24px\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Kính lúp soi vào bộ rễ cây\" width=\"200\" height=\"200\" viewBox=\"0 0 200 200\" style=\"width:200px; height:200px\"><line x1=\"100\" y1=\"20\" x2=\"100\" y2=\"90\" stroke=\"#1E2533\" stroke-width=\"8\" stroke-linecap=\"round\"/><path d=\"M100 90 L60 150 M100 90 L100 170 M100 90 L140 150\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"8\" stroke-linecap=\"round\"/><circle cx=\"130\" cy=\"130\" r=\"40\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"8\"/><line x1=\"160\" y1=\"160\" x2=\"190\" y2=\"190\" stroke=\"#E2783B\" stroke-width=\"14\" stroke-linecap=\"round\"/><\/svg>\n<p style=\"font-weight:800; color:#E2783B\">1<\/p>\n<p>Tìm nguyên nhân gốc rễ của điểm đau<\/p>\n<\/div>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:24px\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Ngôi sao màu cam trên đường cảm xúc\" width=\"200\" height=\"200\" viewBox=\"0 0 200 200\" style=\"width:200px; height:200px\"><path d=\"M10 160 C 50 160, 60 120, 100 120 S 150 170, 190 150\" fill=\"none\" stroke=\"#D5DAE1\" stroke-width=\"8\"/><path d=\"M100 18 L116 62 L162 62 L125 90 L139 134 L100 108 L61 134 L75 90 L38 62 L84 62 Z\" fill=\"#E2783B\"/><\/svg>\n<p style=\"font-weight:800; color:#E2783B\">2<\/p>\n<p>Thiết kế khoảnh khắc đáng nhớ<\/p>\n<\/div>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:24px\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Đồng hồ đo với kim chỉ về vùng xanh\" width=\"200\" height=\"200\" viewBox=\"0 0 200 200\" style=\"width:200px; height:200px\"><path d=\"M20 150 A 80 80 0 0 1 180 150\" fill=\"none\" stroke=\"#D5DAE1\" stroke-width=\"18\"/><path d=\"M130 76 A 80 80 0 0 1 180 150\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"18\"/><line x1=\"100\" y1=\"150\" x2=\"150\" y2=\"95\" stroke=\"#1E2533\" stroke-width=\"8\" stroke-linecap=\"round\"/><circle cx=\"100\" cy=\"150\" r=\"14\" fill=\"#1E2533\"/><\/svg>\n<p style=\"font-weight:800; color:#E2783B\">3<\/p>\n<p>Đo lường và dẫn dắt thay đổi<\/p>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b2-04", "label": "B2 · 04", "session": 2, "part": "s8", "title": "Anh chị đã thấy gì khi là khách hàng của chính mình?", "activity": "Cả lớp · 5 phút", "points": ["1. Một điều bất ngờ", "2. Một câu nói của khách hàng", "Mỗi nhóm: tình huống Problem Canvas đã chọn"], "notes": "① MỞ\n\"Tuần trước tôi đề nghị anh chị làm hai việc: tự đi một hành trình của chính doanh nghiệp mình, và phỏng vấn một khách hàng theo nguyên tắc Mom Test. Tôi không hỏi ai đã làm – tôi hỏi anh chị đã thấy gì.\"\n\n② HƯỚNG DẪN HOẠT ĐỘNG (5 phút)\nMời ba đến bốn học viên chia sẻ, mỗi người không quá một phút, theo đúng hai ý trên màn hình. Một: một điều bất ngờ khi tự trải nghiệm – tốt hoặc xấu. Hai: một câu nói nguyên văn của khách hàng khiến anh chị phải suy nghĩ. Giảng viên ghi nhanh lên bảng các từ khóa, chia làm hai cột: \"điểm đau do con người\" và \"điểm đau do hệ thống\". Không bình luận ngay; cột này sẽ được dùng lại ở slide về lỗi hệ thống.\nSau đó, mời đại diện mỗi nhóm nói trong một câu: nhóm đã chọn tình huống nào trong Problem Canvas của case. Gợi ý nếu nhóm chưa chọn: DigiNet – anh Minh chờ lắp đặt năm ngày; TechPharma – chị Mai nhận sai thuốc lúc 2 giờ sáng; BizManage – CEO Khoa \"đầu tư 200 triệu, nhân viên vẫn dùng Excel\"; Life Biz School – anh Minh và \"vùng chết\" sáu tuần sau khi đóng học phí.\n\n③ MINH HỌA\nHình ảnh chiếc gương: khi làm khách hàng của chính mình, nhà quản lý nhìn thấy doanh nghiệp theo cách mà báo cáo không cho thấy. Nếu lớp cần một ví dụ mở màn: theo cuốn \"The Everything Store\" của Brad Stone (2013), trong một cuộc họp những năm đầu của Amazon, phó chủ tịch phụ trách chăm sóc khách hàng báo cáo rằng thời gian chờ tổng đài dưới một phút. Jeff Bezos lập tức gọi vào số tổng đài ngay giữa phòng họp khoảng ba mươi người. Cả phòng im lặng chờ – khoảng bốn phút rưỡi mới có người nghe máy. Một cuộc gọi thử nói nhiều hơn mọi bảng báo cáo.\n\n④ LIÊN HỆ\nNhững gì học viên chia sẻ thường rơi vào ba nhóm: thời gian chờ đợi không được thông báo, phải lặp lại thông tin nhiều lần, và nhân viên muốn giúp nhưng \"không được phép\". Hãy chỉ ra điểm chung: phần lớn đều không phải do một nhân viên cụ thể làm sai.\n\n★ CÂU CHỐT: \"Mười phút làm khách hàng của chính mình thường dạy nhà quản lý nhiều hơn mười trang báo cáo.\"\n\n⑤ TƯƠNG TÁC\nNếu lớp im lặng vì chưa làm bài tập: không phê phán; hỏi \"Nếu tối nay anh chị gọi tổng đài của công ty mình, anh chị đoán điều gì sẽ xảy ra?\" – để lớp tự hình dung.\nCâu trả lời có thể gặp: \"Tôi gọi tổng đài, bị chuyển máy ba lần\" → phản hồi: hãy giữ lại ví dụ này, chúng ta sẽ hỏi \"vì sao\" năm lần với nó. \"Khách nói: tôi không phàn nàn vì biết phàn nàn cũng vậy thôi\" → phản hồi: sự im lặng của khách hàng là dữ liệu đáng lo nhất.\n\n⑥ CHUYỂN Ý\n\"Những gì anh chị vừa kể dẫn thẳng tới câu hỏi lớn đầu tiên của hôm nay.\"", "html": "<section id=\"b2-04\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:40px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Anh chị đã thấy gì khi là khách hàng của chính mình?<\/h2>\n<p style=\"align-self:start; font-weight:700; color:#FFFFFF; background:#E2783B; padding:8px 36px; border-radius:999px\">Cả lớp · 5 phút<\/p>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Một người màu trắng đứng trước tấm gương, hình phản chiếu màu cam\" width=\"560\" height=\"440\" viewBox=\"0 0 560 440\" style=\"width:560px; height:440px\"><circle cx=\"130\" cy=\"130\" r=\"48\" fill=\"#1E2533\"/><path d=\"M60 330 Q130 170 200 330 Z\" fill=\"#1E2533\"/><rect x=\"300\" y=\"15\" width=\"230\" height=\"410\" rx=\"115\" fill=\"#FFFFFF\" stroke=\"#D5DAE1\" stroke-width=\"8\"/><circle cx=\"415\" cy=\"150\" r=\"42\" fill=\"#E2783B\"/><path d=\"M355 330 Q415 190 475 330 Z\" fill=\"#E2783B\"/><rect x=\"40\" y=\"400\" width=\"200\" height=\"16\" rx=\"8\" fill=\"#D5DAE1\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:40px\">\n<p><b style=\"color:#E2783B\">1.<\/b> Một điều bất ngờ<\/p>\n<p><b style=\"color:#E2783B\">2.<\/b> Một câu nói của khách hàng<\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng nhóm học viên\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"32\" cy=\"18\" r=\"8\"/><path d=\"M17 52 C 17 36, 47 36, 47 52\"/><circle cx=\"11\" cy=\"26\" r=\"6\"/><circle cx=\"53\" cy=\"26\" r=\"6\"/><path d=\"M2 50 C 2 42, 12 38, 19 41\"/><path d=\"M62 50 C 62 42, 52 38, 45 41\"/><\/g><\/svg><p style=\"color:#5B6577\">Mỗi nhóm: tình huống Problem Canvas đã chọn<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b2-05", "label": "B2 · 05", "session": 2, "part": "s9", "title": "Vì sao trải nghiệm tệ vẫn lặp lại dù nhân viên đều cố gắng?", "activity": "", "points": [], "notes": "① MỞ\n\"Trong các câu chuyện anh chị vừa kể, có bao nhiêu trường hợp mà nhân viên trực tiếp phục vụ là người xấu, lười biếng hay cố tình gây khó dễ? Rất ít. Vậy vì sao trải nghiệm vẫn tệ – và vì sao nó cứ lặp lại?\"\n\n② GIẢNG\nPhần 1 kéo dài khoảng 35 phút. Đây là phần \"chẩn đoán\" trước khi \"kê đơn\". Nhiều doanh nghiệp phản ứng với một trải nghiệm tệ bằng cách đào tạo lại nhân viên, thêm một bước kiểm tra, hoặc gửi lời xin lỗi kèm voucher. Những việc đó có thể cần, nhưng thường chỉ chữa triệu chứng. Chúng ta sẽ đi qua bốn ý:\n– Triệu chứng xuất hiện trước mặt khách hàng, nhưng nguyên nhân nằm ở hậu trường – công cụ bản thiết kế dịch vụ.\n– Kỹ thuật hỏi \"vì sao\" nhiều lần để đi tới nguyên nhân gốc.\n– Phần lớn lỗi thuộc về hệ thống, không thuộc về cá nhân.\n– Mỗi điểm đau đều có chi phí có thể lượng hóa – đây là ngôn ngữ để thuyết phục ban điều hành đầu tư.\nPhần này kết thúc bằng hoạt động nhóm 15 phút: phân tích nguyên nhân gốc rễ cho tình huống Problem Canvas mà nhóm đã chọn.\n\n③ MINH HỌA\nMột hình ảnh quen thuộc: một bác sĩ chỉ kê thuốc hạ sốt mà không tìm nguyên nhân gây sốt. Bệnh nhân sẽ đỡ trong vài giờ, rồi sốt lại. Doanh nghiệp cũng vậy: tổng đài xin lỗi, tặng voucher, khách tạm nguôi – rồi tháng sau, một khách hàng khác gặp đúng sự cố đó.\n\n④ LIÊN HỆ\nVới nhà quản lý cấp cao, câu hỏi quan trọng không phải là \"ai làm sai\", mà là \"hệ thống nào đã cho phép điều này xảy ra, và sẽ tiếp tục cho phép nó xảy ra\". Câu hỏi thứ nhất dẫn tới kỷ luật; câu hỏi thứ hai dẫn tới cải tiến. Một tổ chức chỉ hỏi câu thứ nhất sẽ dần dạy nhân viên che giấu sự cố thay vì báo cáo nó.\n\n★ CÂU CHỐT: \"Nếu một sự cố lặp lại, đó không còn là sự cố – đó là cách hệ thống đang được thiết kế.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Lần gần nhất doanh nghiệp anh chị xử lý một khiếu nại lớn, kết luận cuối cùng là 'do nhân viên' hay 'do quy trình'?\"\nNếu lớp im lặng: hỏi giơ tay theo hai lựa chọn.\nCâu trả lời có thể gặp: \"Thường là do nhân viên, và chúng tôi xử lý kỷ luật\" → phản hồi: hãy thử hỏi – nhân viên thay thế có gặp lại đúng tình huống đó không?\n\n⑥ CHUYỂN Ý\n\"Để thấy được hậu trường, chúng ta cần một công cụ khác với bản đồ hành trình.\"", "html": "<section id=\"b2-05\" data-transition=\"push\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; justify-content:center; gap:24px\">\n<div style=\"display:flex; flex-direction:row; align-items:center; justify-content:space-between\"><p style=\"font-size:280px; font-weight:800; line-height:1; color:#E2783B\">01<\/p><svg aria-label=\"Thân cây và bộ rễ màu cam\" width=\"320\" height=\"320\" viewBox=\"0 0 320 320\" style=\"width:320px; height:320px\"><g transform=\"scale(5)\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M32 4 V30\"/><path d=\"M20 14 H44\"/><path d=\"M32 30 L16 50 M32 30 L32 58 M32 30 L48 50 M24 40 L10 44 M40 40 L54 44\" stroke=\"#E2783B\"/><\/g><\/svg><\/div>\n<h1 style=\"font-size:88px; font-weight:700; line-height:1.15; color:#1E2533\">Vì sao trải nghiệm tệ vẫn lặp lại dù nhân viên đều cố gắng?<\/h1>\n<\/section>"}, {"id": "b2-06", "label": "B2 · 06", "session": 2, "part": "s9", "title": "Triệu chứng xuất hiện trước mặt khách hàng; nguyên nhân nằm ở hậu trường", "activity": "", "points": ["Tiền sảnh · điều khách thấy", "Hậu trường · nơi lỗi bắt đầu", "DigiNet: lời hứa 24 giờ, ngày thứ 5 mới lắp xong"], "notes": "① MỞ\n\"Trong một nhà hàng, khách chỉ thấy phòng ăn và người phục vụ. Nhưng một món ăn ra muộn hai mươi phút gần như không bao giờ là lỗi của người phục vụ. Nó bắt đầu từ trong bếp, từ khâu nhập hàng, hay từ cách xếp ca.\"\n\n② GIẢNG\nBản thiết kế dịch vụ (service blueprint) được G. Lynn Shostack giới thiệu trên Harvard Business Review năm 1984, sau đó được Mary Jo Bitner và cộng sự phát triển thêm. Nếu bản đồ hành trình nhìn từ phía khách hàng, thì bản thiết kế dịch vụ đặt hành trình đó lên trên bộ máy vận hành. Có bốn lớp. Trên cùng là hành động của khách hàng. Tiếp theo là tiền sảnh: những gì khách nhìn thấy và tương tác – nhân viên bán hàng, kỹ thuật viên, ứng dụng. Đường nét đứt ở giữa là \"ranh giới nhìn thấy\". Bên dưới là hậu trường: những hoạt động khách không thấy – xếp lịch, duyệt đơn, kiểm kho. Cuối cùng là các quy trình và hệ thống hỗ trợ: phần mềm, chính sách, KPI. Nguyên tắc đọc: bắt đầu từ điểm đau ở hàng trên cùng, rồi đi thẳng xuống dưới để tìm xem ô nào ở hậu trường đã gây ra nó.\n\n③ MINH HỌA\nCase DigiNet, anh Minh: nhân viên bán hàng hứa lắp đặt trong 24 giờ; ngày thứ năm mới lắp xong, WiFi chỉ mạnh ở một phòng. Trên bản đồ hành trình, đó là một điểm đáy cảm xúc. Trên bản thiết kế dịch vụ, chúng ta có thể đặt giả thuyết: ở tiền sảnh, người bán hàng hứa theo kịch bản bán hàng; ở hậu trường, lịch của đội kỹ thuật không kết nối với hệ thống bán hàng, nên không ai biết lời hứa có thực hiện được không; ở tầng hỗ trợ, KPI của bán hàng là số hợp đồng, KPI của kỹ thuật là số lượt lắp đặt mỗi ngày, không ai đo \"lắp đúng hẹn\". Đây là giả thuyết cần được nhóm kiểm chứng – nhưng nó cho thấy vì sao đào tạo lại nhân viên bán hàng sẽ không giải quyết được vấn đề.\n\n④ LIÊN HỆ\nNhà quản lý cấp cao thường nhìn thấy doanh nghiệp theo sơ đồ tổ chức. Bản thiết kế dịch vụ giúp nhìn theo chiều dọc: một khoảnh khắc của khách hàng phụ thuộc vào những bộ phận nào, hệ thống nào, chính sách nào. Đó là bản đồ để phân bổ trách nhiệm và nguồn lực cải tiến.\n\n★ CÂU CHỐT: \"Khách hàng thấy triệu chứng ở tiền sảnh. Nhà quản lý phải tìm nguyên nhân ở hậu trường.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Hãy nghĩ về điểm chạm bị khách phàn nàn nhiều nhất ở doanh nghiệp anh chị. Ở hậu trường của nó có những bộ phận nào tham gia?\"\nNếu lớp im lặng: gợi ý với ngân hàng – khách chờ giải ngân: tiền sảnh là chuyên viên tư vấn, hậu trường là thẩm định, pháp chế, kho quỹ.\nCâu trả lời có thể gặp: \"Khiếu nại về giao hàng chậm, nhưng nguyên nhân là kho\" → phản hồi: đúng; và thêm một tầng nữa – kho chậm vì đâu?\n\n⑥ CHUYỂN Ý\n\"Để đi tiếp từ 'kho chậm' tới nguyên nhân thật, chúng ta dùng một kỹ thuật rất đơn giản: hỏi vì sao.\"", "html": "<section id=\"b2-06\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Triệu chứng xuất hiện trước mặt khách hàng; nguyên nhân nằm ở hậu trường<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Bản thiết kế dịch vụ: hàng trên là các bước của khách hàng màu cam, đường nét đứt ranh giới nhìn thấy, hàng tiền sảnh xám nhạt, hàng hậu trường trắng với một ô được khoanh cam, hàng hỗ trợ xám tối\" width=\"608\" height=\"384\" viewBox=\"0 0 608 384\" style=\"width:608px; height:384px\"><g transform=\"scale(0.800)\"><line x1=\"60\" y1=\"60\" x2=\"660\" y2=\"60\" stroke=\"#D5DAE1\" stroke-width=\"8\"/><circle cx=\"90\" cy=\"60\" r=\"30\" fill=\"#E2783B\"/><circle cx=\"270\" cy=\"60\" r=\"30\" fill=\"#E2783B\"/><circle cx=\"450\" cy=\"60\" r=\"30\" fill=\"#E2783B\"/><circle cx=\"630\" cy=\"60\" r=\"30\" fill=\"#E2783B\"/><line x1=\"10\" y1=\"140\" x2=\"750\" y2=\"140\" stroke=\"#1E2533\" stroke-width=\"8\" stroke-dasharray=\"20 14\"/><rect x=\"30\" y=\"175\" width=\"120\" height=\"70\" rx=\"12\" fill=\"#8A94A6\"/><rect x=\"210\" y=\"175\" width=\"120\" height=\"70\" rx=\"12\" fill=\"#8A94A6\"/><rect x=\"390\" y=\"175\" width=\"120\" height=\"70\" rx=\"12\" fill=\"#8A94A6\"/><rect x=\"570\" y=\"175\" width=\"120\" height=\"70\" rx=\"12\" fill=\"#8A94A6\"/><line x1=\"10\" y1=\"285\" x2=\"750\" y2=\"285\" stroke=\"#1E2533\" stroke-width=\"8\" stroke-dasharray=\"20 14\"/><rect x=\"30\" y=\"320\" width=\"120\" height=\"70\" rx=\"12\" fill=\"#1E2533\"/><rect x=\"210\" y=\"320\" width=\"120\" height=\"70\" rx=\"12\" fill=\"#1E2533\"/><rect x=\"390\" y=\"320\" width=\"120\" height=\"70\" rx=\"12\" fill=\"#1E2533\"/><rect x=\"570\" y=\"320\" width=\"120\" height=\"70\" rx=\"12\" fill=\"#1E2533\"/><rect x=\"200\" y=\"310\" width=\"140\" height=\"90\" rx=\"16\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"8\"/><rect x=\"30\" y=\"420\" width=\"120\" height=\"44\" rx=\"10\" fill=\"#D5DAE1\"/><rect x=\"210\" y=\"420\" width=\"120\" height=\"44\" rx=\"10\" fill=\"#D5DAE1\"/><rect x=\"390\" y=\"420\" width=\"120\" height=\"44\" rx=\"10\" fill=\"#D5DAE1\"/><rect x=\"570\" y=\"420\" width=\"120\" height=\"44\" rx=\"10\" fill=\"#D5DAE1\"/><line x1=\"90\" y1=\"90\" x2=\"90\" y2=\"175\" stroke=\"#D5DAE1\" stroke-width=\"8\"/><line x1=\"270\" y1=\"90\" x2=\"270\" y2=\"175\" stroke=\"#D5DAE1\" stroke-width=\"8\"/><line x1=\"450\" y1=\"90\" x2=\"450\" y2=\"175\" stroke=\"#D5DAE1\" stroke-width=\"8\"/><line x1=\"630\" y1=\"90\" x2=\"630\" y2=\"175\" stroke=\"#D5DAE1\" stroke-width=\"8\"/><\/g><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:28px\">\n<p><b>Tiền sảnh<\/b> · điều khách thấy<\/p>\n<p><b>Hậu trường<\/b> · nơi lỗi bắt đầu<\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng wifi – case DigiNet\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 26 A34 34 0 0 1 56 26\"/><path d=\"M16 35 A22 22 0 0 1 48 35\"/><path d=\"M24 44 A11 11 0 0 1 40 44\"/><circle cx=\"32\" cy=\"53\" r=\"4\" fill=\"#E2783B\" stroke=\"none\"/><\/g><\/svg><p style=\"color:#5B6577\">DigiNet: lời hứa 24 giờ, ngày thứ 5 mới lắp xong<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b2-07", "label": "B2 · 07", "session": 2, "part": "s9", "title": "Hỏi \"vì sao\" nhiều lần để đi từ triệu chứng tới nguyên nhân gốc", "activity": "", "points": ["Triệu chứng · điều khách thấy", "Gốc rễ · điều hệ thống cho phép", "TechPharma: đặt siro trẻ em, nhận thuốc viên người lớn"], "notes": "① MỞ\n\"Có một cách phân tích mà trẻ em ba tuổi làm rất giỏi, còn người lớn lại thường quên: hỏi 'vì sao' – và tiếp tục hỏi.\"\n\n② GIẢNG\nKỹ thuật \"5 lần vì sao\" gắn với Taiichi Ohno và Hệ thống sản xuất Toyota. Khi một sự cố xảy ra, đội ngũ hỏi \"vì sao\" liên tiếp, mỗi câu trả lời trở thành đối tượng của câu hỏi tiếp theo, cho tới khi chạm tới một nguyên nhân mà nếu xử lý, sự cố sẽ không lặp lại. Con số năm không phải là quy tắc cứng; có khi ba lần là đủ, có khi cần bảy. Ba nguyên tắc để dùng đúng: một, bắt đầu từ một sự việc cụ thể, không phải một vấn đề chung chung; hai, mỗi câu trả lời phải dựa trên dữ kiện, không dựa trên phỏng đoán; ba, dừng lại khi chạm tới một quy trình, một chính sách hay một hệ thống – không dừng lại ở tên một người. Nếu chuỗi câu hỏi kết thúc bằng \"vì nhân viên bất cẩn\", thì chúng ta chưa hỏi đủ.\n\n③ MINH HỌA\nCase TechPharma, chị Mai: đặt siro hạ sốt cho con hai tuổi, nhận được thuốc viên dành cho người lớn, phát hiện lúc 2 giờ sáng. Một chuỗi câu hỏi minh họa – nhóm sẽ phải kiểm chứng bằng dữ liệu thật. Vì sao giao sai? Nhân viên lấy nhầm sản phẩm. Vì sao lấy nhầm? Hai sản phẩm cùng hoạt chất, tên gần giống, xếp cạnh nhau. Vì sao không phát hiện trước khi giao? Không có bước dược sĩ kiểm tra lại đơn hàng dành cho trẻ em. Vì sao không có bước đó? Quy trình giao trong hai giờ được thiết kế để tối ưu tốc độ. Vì sao? KPI của chuỗi chỉ đo thời gian giao, không đo độ chính xác của đơn. Kết luận: nếu chỉ kỷ luật nhân viên lấy hàng, sự cố sẽ lặp lại với người khác. Giải pháp nằm ở KPI và ở một bước kiểm tra bắt buộc cho đơn thuốc trẻ em.\n\n④ LIÊN HỆ\nNhà quản lý có thể dùng \"5 lần vì sao\" ngay trong cuộc họp giao ban: khi nghe báo cáo về một khiếu nại, thay vì hỏi \"ai phụ trách\", hãy hỏi \"vì sao\" – và đếm xem đội ngũ trả lời được mấy tầng.\n\n★ CÂU CHỐT: \"Nếu câu trả lời cuối cùng là tên một người, chúng ta chưa hỏi đủ số lần 'vì sao'.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Lấy ví dụ anh chị vừa chia sẻ lúc đầu buổi. Chúng ta thử hỏi 'vì sao' cùng nhau – anh chị trả lời được đến tầng thứ mấy?\"\nNếu lớp im lặng: làm mẫu với ví dụ \"bị chuyển máy ba lần\" – vì sao? Nhân viên tổng đài không có quyền xử lý. Vì sao? Phân quyền theo phòng ban. Vì sao? ...\nCâu trả lời có thể gặp: \"Đến tầng thứ ba thì không biết nữa\" → phản hồi: đó chính là chỗ cần đi thu thập dữ liệu, không phải chỗ để phỏng đoán.\n\n⑥ CHUYỂN Ý\n\"Khi hỏi đủ sâu, anh chị sẽ nhận ra một quy luật mà Deming đã nói từ bốn mươi năm trước.\"", "html": "<section id=\"b2-07\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Hỏi \"vì sao\" nhiều lần để đi từ triệu chứng tới nguyên nhân gốc<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Năm vòng tròn đi xuống theo bậc: bốn vòng xám, vòng thứ năm màu cam có rễ tỏa ra; bắt đầu từ một ô xám nhạt\" width=\"560\" height=\"520\" viewBox=\"0 0 560 520\" style=\"width:560px; height:520px\"><circle cx=\"120\" cy=\"50\" r=\"36\" fill=\"#D5DAE1\"/><circle cx=\"190\" cy=\"140\" r=\"36\" fill=\"#D5DAE1\"/><circle cx=\"260\" cy=\"230\" r=\"36\" fill=\"#D5DAE1\"/><circle cx=\"330\" cy=\"320\" r=\"36\" fill=\"#D5DAE1\"/><circle cx=\"400\" cy=\"410\" r=\"36\" fill=\"#E2783B\"/><line x1=\"146\" y1=\"76\" x2=\"164\" y2=\"114\" stroke=\"#1E2533\" stroke-width=\"8\" stroke-linecap=\"round\"/><line x1=\"216\" y1=\"166\" x2=\"234\" y2=\"204\" stroke=\"#1E2533\" stroke-width=\"8\" stroke-linecap=\"round\"/><line x1=\"286\" y1=\"256\" x2=\"304\" y2=\"294\" stroke=\"#1E2533\" stroke-width=\"8\" stroke-linecap=\"round\"/><line x1=\"356\" y1=\"346\" x2=\"374\" y2=\"384\" stroke=\"#1E2533\" stroke-width=\"8\" stroke-linecap=\"round\"/><path d=\"M400 446 L360 500 M400 446 L400 510 M400 446 L440 500 M400 446 L470 480 M400 446 L330 480\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"8\" stroke-linecap=\"round\"/><rect x=\"20\" y=\"30\" width=\"60\" height=\"40\" rx=\"10\" fill=\"#8A94A6\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:40px\">\n<p><b>Triệu chứng<\/b> · điều khách thấy<\/p>\n<p><b style=\"color:#E2783B\">Gốc rễ<\/b> · điều hệ thống cho phép<\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng viên thuốc – case TechPharma\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><g transform=\"rotate(-40 32 32)\"><rect x=\"6\" y=\"21\" width=\"52\" height=\"22\" rx=\"11\"/><line x1=\"32\" y1=\"21\" x2=\"32\" y2=\"43\"/><\/g><\/g><\/svg><p style=\"color:#5B6577\">TechPharma: đặt siro trẻ em, nhận thuốc viên người lớn<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b2-08", "label": "B2 · 08", "session": 2, "part": "s9", "title": "Phần lớn lỗi trải nghiệm thuộc về hệ thống, không thuộc về cá nhân", "activity": "", "points": ["94% vấn đề thuộc về hệ thống", "Sửa quy trình, không chỉ nhắc nhở nhân viên", "BizManage: không có kênh ưu tiên cho kế toán cuối kỳ"], "notes": "① MỞ\n\"Hãy đặt một người giỏi vào một hệ thống tệ. Anh chị nghĩ ai sẽ thắng?\" Để lớp trả lời. Thường sẽ có người nói \"hệ thống\".\n\n② GIẢNG\nW. Edwards Deming, người có ảnh hưởng lớn tới phong trào quản lý chất lượng ở Nhật Bản, viết trong cuốn \"Out of the Crisis\" (1986) rằng theo kinh nghiệm của ông, khoảng 94% các vấn đề và cơ hội cải tiến thuộc về hệ thống – tức là trách nhiệm của quản lý – và chỉ khoảng 6% đến từ nguyên nhân đặc biệt. Con số là ước lượng từ kinh nghiệm, không phải kết quả đo đạc, nhưng thông điệp rất rõ: khi một trải nghiệm tệ lặp lại, nguyên nhân thường nằm ở quy trình, công cụ, chính sách, cách giao KPI và phân quyền – những thứ do quản lý thiết kế. Hệ quả thực tiễn: đào tạo lại, nhắc nhở, kỷ luật chỉ có tác dụng hạn chế nếu hệ thống không thay đổi. Và ngược lại, đổ lỗi cho cá nhân khiến nhân viên che giấu sự cố, làm mất đi nguồn thông tin quý nhất để cải tiến.\n\n③ MINH HỌA\nCase BizManage: chị Nga, kế toán trưởng, gặp lỗi phần mềm tính sai thuế GTGT đúng kỳ quyết toán. Chị gửi yêu cầu hỗ trợ \"khẩn cấp\", 24 giờ sau vẫn chưa có phản hồi, và phải tính tay ba đêm. Thời gian phản hồi trung bình của BizManage là 38 giờ, trong khi cam kết là 24 giờ. Nhìn bề ngoài, có thể nói \"nhân viên hỗ trợ chậm\". Nhưng case cho thấy: tỷ lệ nhân viên chăm sóc trên khách hàng là 1 trên 130, trong khi mức tham chiếu của ngành là 1 trên 50 đến 80; và không có kênh ưu tiên cho kế toán vào cuối kỳ – thời điểm mà một lỗi nhỏ trở thành khủng hoảng. Đó là lỗi thiết kế hệ thống, không phải lỗi của người trực hỗ trợ. Hậu quả: một người dùng cuối trở thành người phản đối, và thuyết phục CEO hủy hợp đồng.\n\n④ LIÊN HỆ\nVới nhà quản lý cấp cao, câu hỏi cần đặt ra trong mỗi cuộc họp về sự cố là: \"Điều gì trong hệ thống của chúng ta đã khiến một người bình thường, làm đúng quy trình, vẫn tạo ra kết quả tệ cho khách hàng?\" Quay lại hai cột trên bảng lúc đầu buổi – \"do con người\" và \"do hệ thống\" – và hỏi lớp: bao nhiêu mục trong cột \"con người\" thực ra thuộc về cột \"hệ thống\"?\n\n★ CÂU CHỐT: \"Một hệ thống tệ sẽ đánh bại một nhân viên giỏi gần như mọi lúc.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Có KPI nào trong doanh nghiệp anh chị đang vô tình khuyến khích nhân viên làm điều không tốt cho khách hàng?\"\nNếu lớp im lặng: gợi ý – KPI thời gian xử lý cuộc gọi khiến tổng đài viên kết thúc cuộc gọi sớm; KPI số hợp đồng khiến bán hàng hứa quá mức.\nCâu trả lời có thể gặp: \"Chúng tôi thưởng theo doanh số nên nhân viên bán cả gói khách không cần\" → phản hồi: đây là nguồn gốc của rất nhiều khiếu nại ở giai đoạn sử dụng.\n\n⑥ CHUYỂN Ý\n\"Sửa hệ thống thì tốn tiền. Để ban điều hành đồng ý chi, chúng ta cần nói bằng ngôn ngữ của họ: chi phí.\"", "html": "<section id=\"b2-08\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Phần lớn lỗi trải nghiệm thuộc về hệ thống, không thuộc về cá nhân<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Một khung lớn màu trắng chứa ba bánh răng xám và xám nhạt, một người nhỏ màu cam đứng ở góc\" width=\"640\" height=\"500\" viewBox=\"0 0 640 500\" style=\"width:640px; height:500px\"><rect x=\"10\" y=\"10\" width=\"620\" height=\"480\" rx=\"24\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"8\"/><rect x=\"192\" y=\"84\" width=\"16\" height=\"24\" rx=\"4\" fill=\"#D5DAE1\" transform=\"rotate(0 200 190)\"/><rect x=\"192\" y=\"84\" width=\"16\" height=\"24\" rx=\"4\" fill=\"#D5DAE1\" transform=\"rotate(45 200 190)\"/><rect x=\"192\" y=\"84\" width=\"16\" height=\"24\" rx=\"4\" fill=\"#D5DAE1\" transform=\"rotate(90 200 190)\"/><rect x=\"192\" y=\"84\" width=\"16\" height=\"24\" rx=\"4\" fill=\"#D5DAE1\" transform=\"rotate(135 200 190)\"/><rect x=\"192\" y=\"84\" width=\"16\" height=\"24\" rx=\"4\" fill=\"#D5DAE1\" transform=\"rotate(180 200 190)\"/><rect x=\"192\" y=\"84\" width=\"16\" height=\"24\" rx=\"4\" fill=\"#D5DAE1\" transform=\"rotate(225 200 190)\"/><rect x=\"192\" y=\"84\" width=\"16\" height=\"24\" rx=\"4\" fill=\"#D5DAE1\" transform=\"rotate(270 200 190)\"/><rect x=\"192\" y=\"84\" width=\"16\" height=\"24\" rx=\"4\" fill=\"#D5DAE1\" transform=\"rotate(315 200 190)\"/><circle cx=\"200\" cy=\"190\" r=\"90\" fill=\"#D5DAE1\"/><circle cx=\"200\" cy=\"190\" r=\"30\" fill=\"#FFFFFF\"/><rect x=\"362\" y=\"214\" width=\"16\" height=\"24\" rx=\"4\" fill=\"#8A94A6\" transform=\"rotate(0 370 300)\"/><rect x=\"362\" y=\"214\" width=\"16\" height=\"24\" rx=\"4\" fill=\"#8A94A6\" transform=\"rotate(45 370 300)\"/><rect x=\"362\" y=\"214\" width=\"16\" height=\"24\" rx=\"4\" fill=\"#8A94A6\" transform=\"rotate(90 370 300)\"/><rect x=\"362\" y=\"214\" width=\"16\" height=\"24\" rx=\"4\" fill=\"#8A94A6\" transform=\"rotate(135 370 300)\"/><rect x=\"362\" y=\"214\" width=\"16\" height=\"24\" rx=\"4\" fill=\"#8A94A6\" transform=\"rotate(180 370 300)\"/><rect x=\"362\" y=\"214\" width=\"16\" height=\"24\" rx=\"4\" fill=\"#8A94A6\" transform=\"rotate(225 370 300)\"/><rect x=\"362\" y=\"214\" width=\"16\" height=\"24\" rx=\"4\" fill=\"#8A94A6\" transform=\"rotate(270 370 300)\"/><rect x=\"362\" y=\"214\" width=\"16\" height=\"24\" rx=\"4\" fill=\"#8A94A6\" transform=\"rotate(315 370 300)\"/><circle cx=\"370\" cy=\"300\" r=\"70\" fill=\"#8A94A6\"/><circle cx=\"370\" cy=\"300\" r=\"23\" fill=\"#FFFFFF\"/><rect x=\"462\" y=\"79\" width=\"16\" height=\"24\" rx=\"4\" fill=\"#D5DAE1\" transform=\"rotate(0 470 150)\"/><rect x=\"462\" y=\"79\" width=\"16\" height=\"24\" rx=\"4\" fill=\"#D5DAE1\" transform=\"rotate(45 470 150)\"/><rect x=\"462\" y=\"79\" width=\"16\" height=\"24\" rx=\"4\" fill=\"#D5DAE1\" transform=\"rotate(90 470 150)\"/><rect x=\"462\" y=\"79\" width=\"16\" height=\"24\" rx=\"4\" fill=\"#D5DAE1\" transform=\"rotate(135 470 150)\"/><rect x=\"462\" y=\"79\" width=\"16\" height=\"24\" rx=\"4\" fill=\"#D5DAE1\" transform=\"rotate(180 470 150)\"/><rect x=\"462\" y=\"79\" width=\"16\" height=\"24\" rx=\"4\" fill=\"#D5DAE1\" transform=\"rotate(225 470 150)\"/><rect x=\"462\" y=\"79\" width=\"16\" height=\"24\" rx=\"4\" fill=\"#D5DAE1\" transform=\"rotate(270 470 150)\"/><rect x=\"462\" y=\"79\" width=\"16\" height=\"24\" rx=\"4\" fill=\"#D5DAE1\" transform=\"rotate(315 470 150)\"/><circle cx=\"470\" cy=\"150\" r=\"55\" fill=\"#D5DAE1\"/><circle cx=\"470\" cy=\"150\" r=\"18\" fill=\"#FFFFFF\"/><circle cx=\"110\" cy=\"385\" r=\"22\" fill=\"#E2783B\"/><path d=\"M80 460 Q110 405 140 460 Z\" fill=\"#E2783B\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:40px\">\n<p><b>94%<\/b> vấn đề thuộc về hệ thống<\/p>\n<p>Sửa quy trình, không chỉ nhắc nhở nhân viên<\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng màn hình phần mềm – case BizManage\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"6\" y=\"8\" width=\"52\" height=\"36\" rx=\"5\"/><line x1=\"22\" y1=\"56\" x2=\"42\" y2=\"56\"/><line x1=\"32\" y1=\"44\" x2=\"32\" y2=\"56\"/><line x1=\"20\" y1=\"36\" x2=\"20\" y2=\"28\"/><line x1=\"32\" y1=\"36\" x2=\"32\" y2=\"18\"/><line x1=\"44\" y1=\"36\" x2=\"44\" y2=\"24\"/><\/g><\/svg><p style=\"color:#5B6577\">BizManage: không có kênh ưu tiên cho kế toán cuối kỳ<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b2-09", "label": "B2 · 09", "session": 2, "part": "s9", "title": "Mỗi điểm đau đều có chi phí có thể lượng hóa", "activity": "", "points": ["Khách rời đi · doanh thu mất", "Khách ở lại · chi phí xử lý lặp lại", "DigiNet: churn 20% ≈ 400.000 thuê bao mỗi năm"], "notes": "① MỞ\n\"Nếu anh chị đề xuất với giám đốc tài chính 'chúng ta cần cải thiện trải nghiệm', câu hỏi đầu tiên sẽ là gì? – 'Bao nhiêu tiền, và thu về bao nhiêu?'\"\n\n② GIẢNG\nMột điểm đau có ít nhất ba loại chi phí. Một, chi phí rời bỏ: doanh thu mất đi từ khách rời đi, cộng với chi phí để thu hút một khách mới thay thế – Amy Gallo tổng hợp trên HBR (2014) rằng chi phí có khách mới có thể gấp năm đến hai mươi lăm lần chi phí giữ khách cũ, tùy ngành. Nghiên cứu kinh điển của Reichheld và Sasser (1990) cho thấy tăng tỷ lệ giữ chân khách hàng thêm 5% có thể làm lợi nhuận tăng từ 25% đến 85% trong các ngành họ khảo sát. Hai, chi phí vận hành lặp lại: mỗi cuộc gọi lại, mỗi lần kỹ thuật viên đến lần hai, mỗi đơn hàng đổi trả là chi phí mà khách hàng không trả tiền. Ba, chi phí lan truyền: khách hàng không hài lòng chia sẻ trải nghiệm, làm tăng chi phí thu hút khách mới. Hình ảnh chiếc xô thủng: doanh nghiệp đổ ngân sách marketing vào miệng xô, nhưng lại để khách hàng rò rỉ qua đáy.\n\n③ MINH HỌA\nCase DigiNet có khoảng 2 triệu thuê bao và tỷ lệ rời bỏ 18–22% mỗi năm – tức khoảng 400.000 thuê bao phải thay thế mỗi năm. Một phép tính minh họa, giả định mức cước 199 nghìn đồng mỗi tháng: mỗi thuê bao mất đi là khoảng 2,4 triệu đồng doanh thu một năm; nhân với 400.000 là gần một nghìn tỷ đồng doanh thu cần bù đắp mỗi năm, chưa tính chi phí bán hàng và lắp đặt cho khách mới. Chỉ cần giảm tỷ lệ rời bỏ từ 20% xuống 12% – mục tiêu trong câu hỏi thảo luận của case – là giữ lại khoảng 160.000 thuê bao. Thêm vào đó là chi phí vận hành: 40% khách phải gọi lại tổng đài, nghĩa là gần một nửa số cuộc gọi là chi phí lặp lại. Lưu ý: đây là ước tính để minh họa phương pháp; nhóm DigiNet nên làm lại với giả định của mình.\n\n④ LIÊN HỆ\nNhà quản lý nên yêu cầu mọi đề xuất cải tiến trải nghiệm đi kèm một phép tính đơn giản: điểm đau này ảnh hưởng tới bao nhiêu khách, mỗi khách mất bao nhiêu, và giải pháp tốn bao nhiêu. Phép tính không cần chính xác tuyệt đối – nó cần đủ tin cậy để đặt lên bàn cân với các khoản đầu tư khác.\n\n★ CÂU CHỐT: \"Khi nói về trải nghiệm bằng ngôn ngữ tài chính, CX không còn là chi phí – nó trở thành một khoản đầu tư có thể so sánh.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Doanh nghiệp anh chị có biết chính xác mất một khách hàng thì mất bao nhiêu tiền không?\"\nNếu lớp im lặng: đề nghị một học viên ước tính nhanh ngay tại lớp: doanh thu trung bình mỗi khách mỗi năm nhân với số năm trung bình khách ở lại.\nCâu trả lời có thể gặp: \"Chúng tôi chỉ đo doanh thu mới, không đo doanh thu mất\" → phản hồi: đó là điểm mù rất phổ biến; báo cáo tăng trưởng có thể che giấu một chiếc xô đang thủng.\n\n⑥ CHUYỂN Ý\n\"Bây giờ đến lượt các nhóm: tìm gốc rễ và định giá điểm đau trong case của mình.\"", "html": "<section id=\"b2-09\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Mỗi điểm đau đều có chi phí có thể lượng hóa<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Chiếc xô xám nhạt bị thủng ở đáy, những giọt nước màu cam rơi xuống\" width=\"560\" height=\"520\" viewBox=\"0 0 560 520\" style=\"width:560px; height:520px\"><path d=\"M90 60 L470 60 L420 370 L140 370 Z\" fill=\"#8A94A6\"/><ellipse cx=\"280\" cy=\"60\" rx=\"190\" ry=\"30\" fill=\"#1E2533\"/><path d=\"M130 60 C 130 -10, 430 -10, 430 60\" fill=\"none\" stroke=\"#D5DAE1\" stroke-width=\"8\"/><circle cx=\"200\" cy=\"340\" r=\"12\" fill=\"#FFFFFF\"/><circle cx=\"280\" cy=\"355\" r=\"12\" fill=\"#FFFFFF\"/><circle cx=\"360\" cy=\"340\" r=\"12\" fill=\"#FFFFFF\"/><path d=\"M170 400 C 156 422, 156 440, 170 440 C 184 440, 184 422, 170 400 Z\" fill=\"#E2783B\"/><path d=\"M270 430 C 256 452, 256 470, 270 470 C 284 470, 284 452, 270 430 Z\" fill=\"#E2783B\"/><path d=\"M370 410 C 356 432, 356 450, 370 450 C 384 450, 384 432, 370 410 Z\" fill=\"#E2783B\"/><path d=\"M230 470 C 216 492, 216 510, 230 510 C 244 510, 244 492, 230 470 Z\" fill=\"#E2783B\"/><path d=\"M330 470 C 316 492, 316 510, 330 510 C 344 510, 344 492, 330 470 Z\" fill=\"#E2783B\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:40px\">\n<p><b style=\"color:#E2783B\">Khách rời đi<\/b> · doanh thu mất<\/p>\n<p><b>Khách ở lại<\/b> · chi phí xử lý lặp lại<\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng wifi – case DigiNet\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 26 A34 34 0 0 1 56 26\"/><path d=\"M16 35 A22 22 0 0 1 48 35\"/><path d=\"M24 44 A11 11 0 0 1 40 44\"/><circle cx=\"32\" cy=\"53\" r=\"4\" fill=\"#E2783B\" stroke=\"none\"/><\/g><\/svg><p style=\"color:#5B6577\">DigiNet: churn 20% ≈ 400.000 thuê bao mỗi năm<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b2-10", "label": "B2 · 10", "session": 2, "part": "s9", "title": "Thảo luận nhóm: Tìm nguyên nhân gốc rễ của một điểm đau", "activity": "Nhóm 4 người · 15 phút", "points": ["1. Mô tả triệu chứng cụ thể", "2. Hỏi \"vì sao\" tới tầng hệ thống", "3. Ước tính chi phí, chỉ ra người sở hữu"], "notes": "① MỞ\n\"Mười lăm phút tới, mỗi nhóm là một đội điều tra. Nhiệm vụ không phải là tìm người có lỗi, mà là tìm ra điều trong hệ thống khiến sự cố này sẽ còn lặp lại.\"\n\n② HƯỚNG DẪN HOẠT ĐỘNG\nDùng tình huống Problem Canvas nhóm đã chọn, gắn với nỗi đau lớn nhất của persona tuần trước. Có thể dùng luôn Problem Definition Canvas ở cuối handout trang 6 – kết quả sẽ được đưa vào bản đồ A1 cuối buổi.\n– Phút 0–3: viết triệu chứng trong một câu cụ thể: ai, gặp chuyện gì, lúc nào, hậu quả ra sao. Ví dụ: \"Chị Mai nhận thuốc viên người lớn thay vì siro trẻ em, phát hiện lúc 2 giờ sáng, không liên lạc được hotline.\"\n– Phút 3–10: hỏi \"vì sao\" liên tiếp. Với mỗi tầng, ghi rõ đó là dữ kiện từ case hay giả định. Dừng khi chạm tới một quy trình, chính sách, KPI hoặc hệ thống. Nếu có thể, đặt nguyên nhân lên đúng tầng của bản thiết kế dịch vụ: tiền sảnh, hậu trường hay hỗ trợ.\n– Phút 10–13: ước tính chi phí bằng số liệu trong case: bao nhiêu khách bị ảnh hưởng, mỗi khách mất bao nhiêu.\n– Phút 13–15: chỉ ra bộ phận \"sở hữu\" nguyên nhân gốc, và bộ phận đó hiện có KPI nào liên quan không.\n\n③ DẪN DẮT TRONG LÚC NHÓM LÀM\nĐi quanh các nhóm. Nếu chuỗi \"vì sao\" dừng ở một cá nhân: \"Nếu thay người này bằng người khác, sự cố có lặp lại không?\" Nếu nhóm tranh luận quá lâu về số liệu: \"Ước tính theo thứ tự độ lớn là đủ – hàng triệu, hàng tỷ hay hàng trăm tỷ?\"\nGợi ý nguyên nhân gốc có thể gặp:\nDigiNet – anh Minh: lời hứa của bán hàng không nối với lịch kỹ thuật; KPI bán hàng và kỹ thuật tách rời. Hùng: chính sách giá không có bước thông báo trước khi hết khuyến mãi.\nTechPharma – chị Mai: KPI giao hàng chỉ đo tốc độ; không có bước kiểm tra đơn thuốc trẻ em; hotline không trực đêm dù dịch vụ giao hàng nhanh chạy đến khuya.\nBizManage – CEO Khoa: triển khai tập trung vào cài đặt, không có lộ trình cho người dùng cuối; không có chỉ số tỷ lệ sử dụng để báo sớm.\nLife Biz School – anh Minh: không bộ phận nào sở hữu giai đoạn từ khi đóng học phí đến khai giảng; tuyển sinh kết thúc nhiệm vụ khi thu tiền, đào tạo chỉ bắt đầu khi khai giảng.\n\n④ LIÊN HỆ – CHIA SẺ NHANH\nMời hai nhóm chia sẻ, mỗi nhóm một phút: triệu chứng, nguyên nhân gốc, chi phí ước tính. Hai nhóm còn lại sẽ chia sẻ ở hoạt động của Phần 2. Chỉ ra điểm chung: nguyên nhân gốc thường nằm ở khoảng trống giữa các phòng ban, hoặc ở một KPI được thiết kế cho từng bộ phận.\n\n★ CÂU CHỐT: \"Một nguyên nhân gốc tốt khiến cả phòng họp im lặng – vì ai cũng nhận ra mình là một phần của nó.\"\n\n⑤ TƯƠNG TÁC\nNếu nhóm bế tắc ở tầng thứ hai: gợi ý dùng bốn hướng – con người, quy trình, công cụ, chính sách – để tìm câu trả lời tiếp theo.\n\n⑥ CHUYỂN Ý\n\"Đã biết vì sao nó hỏng. Câu hỏi tiếp theo: thiết kế lại thế nào để khách hàng không chỉ hết khó chịu, mà còn nhớ tới chúng ta?\"\n\nTÓM TẮT PHẦN 1 (một câu): Trải nghiệm tệ lặp lại vì nguyên nhân nằm ở hậu trường và ở hệ thống do quản lý thiết kế; tìm gốc rễ và lượng hóa chi phí là bước đầu tiên để cải tiến có trọng tâm.", "html": "<section id=\"b2-10\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:40px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Thảo luận nhóm: Tìm nguyên nhân gốc rễ của một điểm đau<\/h2>\n<p style=\"align-self:start; font-weight:700; color:#FFFFFF; background:#E2783B; padding:8px 36px; border-radius:999px\">Nhóm 4 người · 15 phút<\/p>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Một ô xám nhạt nối xuống chuỗi năm vòng tròn nhỏ, vòng cuối màu cam, bên cạnh là một đồng xu màu trắng\" width=\"520\" height=\"440\" viewBox=\"0 0 520 440\" style=\"width:520px; height:440px\"><rect x=\"20\" y=\"20\" width=\"200\" height=\"80\" rx=\"14\" fill=\"#8A94A6\"/><circle cx=\"80\" cy=\"150\" r=\"24\" fill=\"#D5DAE1\"/><circle cx=\"124\" cy=\"208\" r=\"24\" fill=\"#D5DAE1\"/><circle cx=\"168\" cy=\"266\" r=\"24\" fill=\"#D5DAE1\"/><circle cx=\"212\" cy=\"324\" r=\"24\" fill=\"#D5DAE1\"/><circle cx=\"256\" cy=\"382\" r=\"24\" fill=\"#E2783B\"/><circle cx=\"410\" cy=\"300\" r=\"90\" fill=\"#1E2533\"/><circle cx=\"410\" cy=\"300\" r=\"60\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"8\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:40px\">\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng search\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"27\" cy=\"27\" r=\"17\"/><line x1=\"40\" y1=\"40\" x2=\"58\" y2=\"58\"/><\/g><\/svg><p><b style=\"color:#E2783B\">1.<\/b> Mô tả triệu chứng cụ thể<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng roots\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M32 4 V26\"/><path d=\"M22 12 H42\"/><path d=\"M32 26 L16 46 M32 26 L32 58 M32 26 L48 46 M24 36 L8 40 M40 36 L56 40\"/><\/g><\/svg><p><b style=\"color:#E2783B\">2.<\/b> Hỏi \"vì sao\" tới tầng hệ thống<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng coin\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><ellipse cx=\"32\" cy=\"16\" rx=\"22\" ry=\"9\"/><path d=\"M10 16 V32 C 10 37, 20 41, 32 41 C 44 41, 54 37, 54 32 V16\"/><path d=\"M10 32 V48 C 10 53, 20 57, 32 57 C 44 57, 54 53, 54 48 V32\"/><\/g><\/svg><p><b style=\"color:#E2783B\">3.<\/b> Ước tính chi phí, chỉ ra người sở hữu<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b2-11", "label": "B2 · 11", "session": 2, "part": "s10", "title": "Làm thế nào để thiết kế những khoảnh khắc khách hàng ghi nhớ?", "activity": "", "points": [], "notes": "① MỞ\n\"Ở Phần 1, chúng ta đã tìm ra vì sao trải nghiệm hỏng. Nhưng sửa xong chỗ hỏng mới chỉ đưa khách hàng từ 'khó chịu' về 'bình thường'. Và khách hàng hiếm khi kể cho ai nghe về một trải nghiệm bình thường.\"\n\n② GIẢNG\nPhần 2 kéo dài khoảng 40 phút và chuyển từ \"chẩn đoán\" sang \"thiết kế\". Chúng ta sẽ đi qua bốn ý:\n– Thứ tự ưu tiên: loại bỏ điểm đau trước, tạo điểm nhấn sau – nối tiếp với kết quả nghiên c
