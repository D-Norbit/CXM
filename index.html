const view = document.getElementById('view');
let store = {}; try { store = JSON.parse(localStorage.getItem('cxm-hub') || '{}'); } catch (e) {}
const save = () => { try { localStorage.setItem('cxm-hub', JSON.stringify(store)); } catch (e) {} };

function toc(active) {
  const t = document.getElementById('toc');
  let h = `<button class="${active==='home'?'on':''}" data-go="home">Tổng quan chương trình</button>
           <button class="${active==='mats'?'on':''}" data-go="mats">Tài liệu & handout cần chuẩn bị</button>`;
  [1,2].forEach(n => {
    h += `<h4>Buổi ${n} · ${sessMin(n)} phút</h4><button class="${active==='b'+n?'on':''}" data-go="b${n}">Xem toàn buổi ${n}</button>`;
    sessParts(n).forEach(p => {
      const open = active && (active === p.id || (S[active] && S[active].part === p.id));
      h += `<details ${open?'open':''}><summary><button class="part ${active===p.id?'on':''}" data-go="${p.id}">${esc(p.name.split(':')[0])}<small>${META[p.id].min}′</small></button></summary>`;
      p.slides.forEach(id => { const s = S[id]; h += `<button class="sl ${active===id?'on':''}" data-go="${id}"><code>${s.label.slice(5)}</code><span>${esc(s.title)}</span></button>`; });
      h += `</details>`;
    });
  });
  t.innerHTML = h;
}

function slideRows(ids) {
  return ids.map(id => { const s = S[id];
    return `<button class="srow" data-go="${id}"><code>${s.label}</code><span>${esc(s.title)}</span>${s.activity?`<span class="chip act">${esc(s.activity)}</span>`:'<span></span>'}</button>`; }).join('');
}

function home() {
  const tot = DATA.slides.length;
  const actAll = DATA.slides.filter(s => s.activity).length;
  view.innerHTML = `
  <div><div class="eyebrow">Tổng quan chương trình</div>
  <h1>Quản trị trải nghiệm khách hàng</h1>
  <p class="lede">Hai buổi học cho học viên MiniMBA là CEO và quản lý cấp cao. Mỗi slide có kịch bản giảng 6 bước: Mở, Giảng, Minh họa, Liên hệ, Tương tác, Chuyển ý, kèm câu chốt.</p></div>
  <div class="meta"><span><b>2</b> buổi</span><span><b>${tot}</b> slide</span><span><b>${DATA.parts.length}</b> phần</span><span><b>${actAll}</b> hoạt động/workshop</span><span><b>4</b> case xuyên suốt</span></div>
  <div class="sessions">${[1,2].map(n => sessCard(n)).join('')}</div>
  <div class="panel"><div class="sess-head"><h2>Bốn case xuyên suốt hai buổi</h2><span class="note">Handout trang 1–4</span></div>
  <div class="cases">${CASES.map(c => `<div class="case"><span class="num">${c.n}</span><h3>${c.name}</h3><span class="note">${c.kind}</span><span>${c.fig}</span><span class="note">Persona: ${c.who}</span></div>`).join('')}</div></div>
  <div class="panel"><div class="sess-head"><h2>Mạch học của nhóm</h2></div>
  <div class="tbl"><table><tr><th>Bước</th><th>Sản phẩm của nhóm</th><th>Handout</th><th>Slide</th></tr>
  ${[['Buổi 1 · Mở đầu','Thẻ Bingo, phân loại 16 trải nghiệm, 10 từ về CX','Bingo A4, trang 7',['b1-01b','b1-01c','b1-01d']],
     ['Buổi 1 · Phần 3','Persona + Empathy Map + một insight cho nhân vật trong case','Trang 1–5',['b1-31','b1-31b']],
     ['Buổi 1 · Kết','Chọn một tình huống Problem Canvas gắn với nỗi đau của persona','Trang 1–4',['b1-43']],
     ['Buổi 2 · Phần 1','Nguyên nhân gốc (5 lần vì sao) và chi phí của điểm đau','Trang 6 (Problem Canvas)',['b2-10']],
     ['Buổi 2 · Phần 2','Một khoảnh khắc đáng nhớ + kịch bản phục hồi 5 bước','—',['b2-17']],
     ['Buổi 2 · Phần 3','Chỉ số cho ba sáng kiến CX','—',['b2-25']],
     ['Buổi 2 · Phần 4','Pitch ba sáng kiến; bản đồ hành trình A1 với điểm đau, giải pháp, phòng ban, điểm wow; triển lãm','Trang 6 khổ A1',['b2-31','b2-31a','b2-31b']]]
    .map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3].map(id => `<button class="linkbtn" data-go="${id}">${S[id].label}</button>`).join(' ')}</td></tr>`).join('')}
  </table></div></div>`;
}

function sessCard(n) {
  const ps = sessParts(n), tot = sessMin(n);
  const cols = ['var(--accent)','var(--muted)'];
  return `<div class="panel"><div class="sess-head"><div><div class="eyebrow">Buổi ${n}</div><h2>${n===1?'Nhìn thấy khách hàng':'Hành động vì khách hàng'}</h2></div>
    <button class="btn" data-go="b${n}">Mở buổi ${n}</button></div>
    <div class="note">Thời lượng ước tính ${tot} phút (khung buổi 210 phút${tot>210?` – vượt ${tot-210} phút, cần cân đối`:''})</div>
    <div class="bar">${ps.map((p,i) => `<i title="${esc(p.name)}" style="width:${META[p.id].min/tot*100}%;background:${acts(p).length?'var(--accent)':(p.name.startsWith('Giải lao')?'var(--line)':'var(--muted)')};opacity:${i%2?0.75:1}"></i>`).join('')}</div>
    <div class="parts" style="margin-top:12px">${ps.map(p => `<button class="prow" data-go="${p.id}"><span class="min">${META[p.id].min}′</span>
      <span><span class="pname">${esc(p.name.split(':')[0])}</span><br><span class="note">${esc(META[p.id].q)}</span>
      ${acts(p).length?`<span class="chips">${acts(p).map(s => `<span class="chip act">${esc(s.title.split(':')[0])}</span>`).join('')}</span>`:''}</span>
      <span class="chip">${p.slides.length} slide</span></button>`).join('')}</div></div>`;
}

function session(n) {
  view.innerHTML = `<div><div class="crumb"><button data-go="home">Tổng quan</button><span>›</span><span>Buổi ${n}</span></div>
    <h1>Buổi ${n} · ${n===1?'Nhìn thấy khách hàng':'Hành động vì khách hàng'}</h1>
    <p class="lede">${sessParts(n).length} phần · ${sessParts(n).reduce((a,p)=>a+p.slides.length,0)} slide · ước tính ${sessMin(n)} phút.</p></div>
    ${sessParts(n).map(p => `<div class="panel"><div class="sess-head"><div><div class="eyebrow">${META[p.id].min} phút</div><h2>${esc(p.name)}</h2></div><button class="btn" data-go="${p.id}">Mở phần</button></div>
      <div class="slide-list">${slideRows(p.slides)}</div></div>`).join('')}
    ${matsTable(n)}`;
}

function part(id) {
  const p = P[id];
  view.innerHTML = `<div><div class="crumb"><button data-go="home">Tổng quan</button><span>›</span><button data-go="b${p.session}">Buổi ${p.session}</button><span>›</span><span>${esc(p.name.split(':')[0])}</span></div>
    <h1>${esc(p.name)}</h1><p class="lede">${esc(META[p.id].q)} · ước tính ${META[p.id].min} phút · ${p.slides.length} slide.</p></div>
    <div class="panel"><div class="slide-list">${slideRows(p.slides)}</div></div>
    ${p.slides.map(id => { const s = S[id]; return `<div class="panel"><div class="sess-head"><div><div class="eyebrow">${s.label}</div><h2>${esc(s.title)}</h2></div><button class="btn" data-go="${id}">Mở slide</button></div>
      ${s.activity?`<span class="pill">${esc(s.activity)}</span>`:''}
      <div class="script" style="margin-top:8px">${script(s.notes)}</div></div>`; }).join('')}`;
}

function script(notes) {
  const lines = notes.split('\n'); let h = '', ul = false;
  for (let raw of lines) {
    const l = raw.trim(); if (!l) continue;
    if (!l.startsWith('–') && ul) { h += '</ul>'; ul = false; }
    if (/^[①②③④⑤⑥]/.test(l) || (/^(TÓM TẮT|TRƯỚC KHI NGHỈ|CÂU HỎI TRÊN MÀN HÌNH|GỢI Ý CHO GIẢNG VIÊN)/.test(l) && l.length < 60)) h += `<div class="sh">${esc(l)}</div>`;
    else if (l.startsWith('★')) h += `<div class="key">${esc(l)}</div>`;
    else if (l.startsWith('–')) { if (!ul) { h += '<ul>'; ul = true; } h += `<li>${esc(l.slice(1).trim())}</li>`; }
    else h += `<p>${esc(l)}</p>`;
  }
  return h + (ul ? '</ul>' : '');
}

function slide(id) {
  const s = S[id], p = P[s.part], prev = DATA.slides[s.i-1], next = DATA.slides[s.i+1];
  const used = MATS.filter(m => m.at.includes(id));
  view.innerHTML = `<div class="nav-row" style="justify-content:space-between">
      <div class="crumb"><button data-go="home">Tổng quan</button><span>›</span><button data-go="b${s.session}">Buổi ${s.session}</button><span>›</span><button data-go="${p.id}">${esc(p.name.split(':')[0])}</button><span>›</span><span>${s.label}</span></div>
      <div class="nav-row">${prev?`<button class="btn" data-go="${prev.id}">← ${prev.label}</button>`:''}${next?`<button class="btn" data-go="${next.id}">${next.label} →</button>`:''}</div></div>
    <div><div class="eyebrow">${s.label}</div><h1>${esc(s.title)}</h1></div>
    <div class="slide-grid">
      <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
        <div class="stage-wrap" id="sw"><div class="stage" id="st">${s.html}</div></div>
        ${s.activity?`<div><span class="pill">${esc(s.activity)}</span></div>`:''}
        ${s.points.length?`<div class="panel"><h3>Nội dung trên slide</h3><ul class="points">${s.points.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
        ${used.length?`<div class="panel"><h3>Tài liệu cần cho slide này</h3><ul class="points">${used.map(m => `<li>${esc(m.item)} – ${esc(m.qty)}</li>`).join('')}</ul></div>`:''}
      </div>
      <div class="panel" style="min-width:0"><h3>Kịch bản giảng</h3><div class="script">${script(s.notes)}</div></div>
    </div>`;
  fit();
}
function fit() { const w = document.getElementById('sw'), st = document.getElementById('st'); if (!w || !st) return; st.style.transform = `scale(${w.clientWidth/1920})`; }
window.addEventListener('resize', fit);

function matsTable(only) {
  return [1,2].filter(n => !only || n === only).map(n => `<div class="panel"><div class="sess-head"><h2>Chuẩn bị cho Buổi ${n}</h2><span class="note">Đánh dấu khi đã chuẩn bị</span></div>
    <div class="tbl"><table><tr><th></th><th>Tài liệu / vật dụng</th><th>Quy cách</th><th>Số lượng</th><th>Dùng ở</th></tr>
    ${MATS.filter(m => m.s === n).map((m, i) => { const k = n+'-'+i; return `<tr><td><span class="check"><input type="checkbox" id="m${k}" data-k="${k}" ${store[k]?'checked':''}></span></td><td><label for="m${k}">${esc(m.item)}</label></td><td>${esc(m.spec)}</td><td>${esc(m.qty)}</td><td>${m.at.map(id => `<button class="linkbtn" data-go="${id}">${S[id].label}</button>`).join(' ')}</td></tr>`; }).join('')}
    </table></div></div>`).join('');
}
function mats() {
  view.innerHTML = `<div><div class="crumb"><button data-go="home">Tổng quan</button><span>›</span><span>Tài liệu & handout</span></div>
    <h1>Tài liệu & handout cần chuẩn bị</h1>
    <p class="lede">Bộ handout in "FCU89 CXM V.5.0": trang 1–4 là bốn case kèm câu hỏi thảo luận, trang 5 là template Persona và Empathy Map, trang 6 là bản đồ hành trình và Problem Definition Canvas (in A1), trang 7 là phân loại trải nghiệm và trái tim 10 từ. Thẻ CXM Bingo in riêng khổ A4.</p></div>
    ${matsTable(0)}
    <div class="panel"><div class="sess-head"><h2>Tất cả hoạt động trên lớp</h2></div><div class="slide-list">${slideRows(DATA.slides.filter(s => s.activity).map(s => s.id))}</div></div>`;
}

function search(q) {
  const t = q.toLowerCase().trim(); if (!t) return route();
  const hits = DATA.slides.filter(s => (s.title + ' ' + s.notes + ' ' + s.points.join(' ')).toLowerCase().includes(t));
  view.innerHTML = `<div><div class="eyebrow">Kết quả tìm kiếm</div><h1>${hits.length} slide có "${esc(q)}"</h1></div>
    <div class="panel"><div class="slide-list">${hits.map(s => { const i = s.notes.toLowerCase().indexOf(t);
      const snip = i >= 0 ? esc(s.notes.slice(Math.max(0, i-60), i+90)).replace(new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m => `<mark>${m}</mark>`) : '';
      return `<button class="srow" data-go="${s.id}"><code>${s.label}</code><span>${esc(s.title)}${snip?`<br><span class="note">…${snip}…</span>`:''}</span><span></span></button>`; }).join('')}</div></div>`;
}

function route() {
  const h = decodeURIComponent(location.hash.slice(1)) || 'home';
  if (h === 'home') home(); else if (h === 'mats') mats(); else if (h === 'b1' || h === 'b2') session(+h[1]);
  else if (P[h]) part(h); else if (S[h]) slide(h); else home();
  toc(h); document.getElementById('toc').classList.remove('open'); window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if (!b) return;
  e.preventDefault(); document.getElementById('q').value = '';
  if (location.hash.slice(1) === b.dataset.go) route(); else location.hash = b.dataset.go;
});
document.addEventListener('change', e => { if (e.target.dataset.k) { store[e.target.dataset.k] = e.target.checked; save(); } });
document.getElementById('home').onclick = () => { location.hash = 'home'; };
document.getElementById('menuBtn').onclick = () => document.getElementById('toc').classList.toggle('open');
document.getElementById('q').addEventListener('input', e => search(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const h = location.hash.slice(1); if (!S[h]) return;
  const i = S[h].i; if (e.key === 'ArrowRight' && DATA.slides[i+1]) location.hash = DATA.slides[i+1].id; if (e.key === 'ArrowLeft' && DATA.slides[i-1]) location.hash = DATA.slides[i-1].id;
});
window.addEventListener('hashchange', route);
route();
}
</script>
