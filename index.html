30 L700 230\" stroke=\"#D5DAE1\" stroke-width=\"8\"/><path d=\"M700 210 L740 230 L700 250 Z\" fill=\"#D5DAE1\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:32px\">\n<p><b>Nhân viên<\/b> gắn bó<\/p>\n<p><b style=\"color:#E2783B\">Khách hàng<\/b> trung thành<\/p>\n<p><b>Lợi nhuận<\/b> bền vững<\/p>\n<\/div>\n<\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng wifi – case DigiNet\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 26 A34 34 0 0 1 56 26\"/><path d=\"M16 35 A22 22 0 0 1 48 35\"/><path d=\"M24 44 A11 11 0 0 1 40 44\"/><circle cx=\"32\" cy=\"53\" r=\"4\" fill=\"#E2783B\" stroke=\"none\"/><\/g><\/svg><p style=\"color:#5B6577\">DigiNet: rời bỏ 20% → 12% ≈ giữ lại 160.000 thuê bao<\/p><\/div>\n<\/section>"}, {"id": "b2-25", "label": "B2 · 27", "session": 2, "part": "s12", "title": "Thảo luận nhóm: Gắn chỉ số cho các sáng kiến CX", "activity": "Nhóm 4 người · 10 phút", "points": ["1. Chốt ba sáng kiến", "2. Mỗi sáng kiến: một chỉ số cảm nhận, một chỉ số hành vi", "3. Mục tiêu sau 6 tháng"], "notes": "① MỞ\n\"Mười phút tới là bước cuối cùng trước khi các nhóm chuẩn bị trình bày. Một sáng kiến không có chỉ số là một mong muốn; một sáng kiến có chỉ số và mục tiêu là một cam kết.\"\n\n② HƯỚNG DẪN HOẠT ĐỘNG (10 phút)\n– Phút 0–3: chốt ba sáng kiến CX của nhóm. Gợi ý cấu trúc: Sáng kiến 1 – sửa nguyên nhân gốc đã tìm ở Phần 1. Sáng kiến 2 – khoảnh khắc đáng nhớ đã thiết kế ở Phần 2. Sáng kiến 3 – kịch bản phục hồi hoặc một vòng phản hồi khép kín.\n– Phút 3–8: với mỗi sáng kiến, chọn một chỉ số cảm nhận (NPS, CSAT hoặc CES) và một chỉ số hành vi hoặc vận hành. Ghi rõ đo ở giai đoạn nào của hành trình, ai sở hữu chỉ số đó.\n– Phút 8–10: đặt mục tiêu sau sáu tháng, và ước tính tác động tài chính theo cách đã làm ở Phần 1 – dù chỉ ở mức thứ tự độ lớn.\nNhắc: mục tiêu trong câu hỏi thảo luận của từng case có thể dùng làm tham chiếu – DigiNet giảm rời bỏ từ 20% xuống 12%; BizManage đạt tỷ lệ sử dụng 80% trong 8 tuần; Life Biz School nâng tỷ lệ chuyển đổi từ 12% lên 20% và giảm rời rụng từ 15% xuống 5%; TechPharma có thể đặt mục tiêu về tỷ lệ khách được liên hệ lại sau mua.\n\n③ DẪN DẮT TRONG LÚC NHÓM LÀM\nCâu hỏi gợi mở: \"Nếu chỉ số này tăng, anh chị có chắc là do sáng kiến của mình không?\" \"Chỉ số này có thể bị 'làm đẹp' không – và làm sao ngăn điều đó?\" \"Ai sẽ nhìn chỉ số này mỗi tuần?\"\nNếu nhóm chọn quá nhiều chỉ số: yêu cầu giữ tối đa hai chỉ số cho mỗi sáng kiến.\n\n④ LIÊN HỆ\nKhông có phần chia sẻ riêng cho hoạt động này; kết quả sẽ xuất hiện trong phần trình bày ba phút ở Phần 4. Giảng viên có thể nêu nhanh một ví dụ tốt quan sát được khi đi quanh các nhóm.\nGợi ý chỉ số tham khảo: DigiNet – tỷ lệ lắp đặt đúng hẹn, CES sau cuộc gọi tổng đài, tỷ lệ rời bỏ tháng thứ 13. TechPharma – tỷ lệ đơn thuốc chính xác, tỷ lệ khách được liên hệ lại, tần suất mua lại của khách mãn tính. BizManage – tỷ lệ người dùng hoạt động sau 30 và 90 ngày, thời gian phản hồi yêu cầu khẩn, tỷ lệ gia hạn. Life Biz School – tỷ lệ hủy trong \"vùng chết\", tỷ lệ rời rụng tháng 8–15, số giới thiệu từ cựu học viên.\n\n★ CÂU CHỐT: \"Một sáng kiến không có chỉ số là một mong muốn. Có chỉ số, có người sở hữu và có thời hạn, nó trở thành một cam kết.\"\n\n⑤ TƯƠNG TÁC\nNếu nhóm bế tắc: bắt đầu từ chỉ số hành vi gắn với \"vết thương\" của case trên slide bốn case ở Buổi 1, rồi đi ngược về chỉ số vận hành và cảm nhận.\n\n⑥ CHUYỂN Ý\n\"Ba sáng kiến, có chỉ số, có mục tiêu. Câu hỏi cuối cùng – và khó nhất: làm sao để tổ chức thực sự thay đổi?\"\n\nTÓM TẮT PHẦN 3 (một câu): Đo lường trải nghiệm hiệu quả kết hợp chỉ số cảm nhận, hành vi và vận hành, khép vòng phản hồi để dẫn tới hành động, và nối trải nghiệm nhân viên, khách hàng với kết quả tài chính.", "html": "<section id=\"b2-25\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:40px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Thảo luận nhóm: Gắn chỉ số cho các sáng kiến CX<\/h2>\n<p style=\"align-self:start; font-weight:700; color:#FFFFFF; background:#E2783B; padding:8px 36px; border-radius:999px\">Nhóm 4 người · 10 phút<\/p>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Bảng theo dõi với ba hàng: mỗi hàng có một ô màu (cam, xám nhạt, trắng) và một thanh tiến độ\" width=\"560\" height=\"440\" viewBox=\"0 0 560 440\" style=\"width:560px; height:440px\"><rect x=\"10\" y=\"10\" width=\"540\" height=\"420\" rx=\"24\" fill=\"#FFFFFF\" stroke=\"#1E2533\" stroke-width=\"8\"/><rect x=\"50\" y=\"70\" width=\"70\" height=\"70\" rx=\"12\" fill=\"#E2783B\"/><rect x=\"150\" y=\"92\" width=\"350\" height=\"26\" rx=\"13\" fill=\"#D5DAE1\"/><rect x=\"150\" y=\"92\" width=\"210\" height=\"26\" rx=\"13\" fill=\"#E2783B\"/><rect x=\"50\" y=\"185\" width=\"70\" height=\"70\" rx=\"12\" fill=\"#8A94A6\"/><rect x=\"150\" y=\"207\" width=\"350\" height=\"26\" rx=\"13\" fill=\"#D5DAE1\"/><rect x=\"150\" y=\"207\" width=\"280\" height=\"26\" rx=\"13\" fill=\"#8A94A6\"/><rect x=\"50\" y=\"300\" width=\"70\" height=\"70\" rx=\"12\" fill=\"#1E2533\"/><rect x=\"150\" y=\"322\" width=\"350\" height=\"26\" rx=\"13\" fill=\"#D5DAE1\"/><rect x=\"150\" y=\"322\" width=\"150\" height=\"26\" rx=\"13\" fill=\"#1E2533\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:40px\">\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng check\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"6\" y=\"6\" width=\"52\" height=\"52\" rx=\"8\"/><path d=\"M16 22 L21 27 L30 17\"/><line x1=\"36\" y1=\"22\" x2=\"50\" y2=\"22\"/><path d=\"M16 42 L21 47 L30 37\"/><line x1=\"36\" y1=\"42\" x2=\"50\" y2=\"42\"/><\/g><\/svg><p><b style=\"color:#E2783B\">1.<\/b> Chốt ba sáng kiến<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng gauge\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 44 A26 26 0 0 1 58 44\"/><line x1=\"32\" y1=\"44\" x2=\"46\" y2=\"26\"/><circle cx=\"32\" cy=\"44\" r=\"4\" fill=\"#E2783B\" stroke=\"none\"/><line x1=\"12\" y1=\"54\" x2=\"52\" y2=\"54\"/><\/g><\/svg><p><b style=\"color:#E2783B\">2.<\/b> Mỗi sáng kiến: một chỉ số cảm nhận, một chỉ số hành vi<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng flag\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"14\" y1=\"6\" x2=\"14\" y2=\"60\"/><path d=\"M14 8 H52 L44 20 L52 32 H14\"/><\/g><\/svg><p><b style=\"color:#E2783B\">3.<\/b> Mục tiêu sau 6 tháng<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b2-26", "label": "B2 · 28", "session": 2, "part": "s13", "title": "Lãnh đạo cần làm gì để CX trở thành năng lực của tổ chức?", "activity": "", "points": [], "notes": "① MỞ\n\"Chúng ta đã có nguyên nhân gốc, có thiết kế, có chỉ số. Nhưng anh chị đều biết: rất nhiều dự án CX tốt trên giấy đã dừng lại sau sáu tháng. Vì sao?\" Để lớp trả lời. Các câu trả lời thường gặp: thiếu người sở hữu, thiếu ngân sách, lãnh đạo chuyển sự chú ý sang việc khác, nhân viên coi đó là \"thêm việc\".\n\n② GIẢNG\nPhần 4 kéo dài khoảng 45 phút và là phần cuối cùng của học phần. Nó gồm hai nửa. Nửa đầu, khoảng 20 phút, trả lời câu hỏi: lãnh đạo cần làm gì để trải nghiệm khách hàng không phải là một dự án, mà là một năng lực bền vững của tổ chức? Chúng ta sẽ đi qua bốn ý:\n– Trải nghiệm nhân viên là điều kiện của trải nghiệm khách hàng.\n– Văn hóa lấy khách hàng làm trung tâm được xây từ hành vi của lãnh đạo, không phải từ khẩu hiệu.\n– Chuyển đổi CX là một lộ trình có các giai đoạn, bắt đầu bằng những chiến thắng nhanh.\n– Công nghệ khuếch đại trải nghiệm, nhưng không thay thế sự thấu hiểu.\nNửa sau, khoảng 25 phút, là phần trình bày của bốn nhóm: mỗi nhóm ba phút, như đang trình bày trước hội đồng quản trị, sau đó là phản hồi.\n\n③ MINH HỌA\nMột hình ảnh để mở phần này: khi một tổ chức \"làm CX\" như một dự án, nó giống như một đợt ăn kiêng – kết quả nhanh, rồi quay về thói quen cũ. Khi CX trở thành năng lực, nó giống như một lối sống: được xây từ những thói quen nhỏ, lặp lại mỗi ngày, bởi mọi người trong tổ chức – bắt đầu từ người đứng đầu.\n\n④ LIÊN HỆ\nNhắc học viên: phần này dành cho chính vai trò của anh chị. Không phải việc của phòng CX, của phòng marketing hay của tư vấn bên ngoài, mà là những việc chỉ người lãnh đạo mới làm được: đặt ưu tiên, phân bổ nguồn lực, thiết kế KPI, và làm gương.\n\n★ CÂU CHỐT: \"Một dự án CX kết thúc khi hết ngân sách. Một năng lực CX tồn tại khi nó trở thành cách tổ chức làm việc mỗi ngày.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Anh chị đã từng chứng kiến một sáng kiến khách hàng 'chết yểu' trong tổ chức mình chưa? Nguyên nhân chính là gì?\"\nNếu lớp im lặng: gợi ý bốn nguyên nhân phổ biến vừa nêu và mời lớp chọn.\nCâu trả lời có thể gặp: \"Lãnh đạo mới đến và đổi ưu tiên\" → phản hồi: đó là lý do CX cần được gắn vào chỉ số và cơ chế quản trị, không chỉ vào cá nhân một người.\n\n⑥ CHUYỂN Ý\n\"Bắt đầu từ mắt xích đầu tiên của chuỗi lợi nhuận dịch vụ: nhân viên.\"", "html": "<section id=\"b2-26\" data-transition=\"push\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; justify-content:center; gap:24px\">\n<div style=\"display:flex; flex-direction:row; align-items:center; justify-content:space-between\"><p style=\"font-size:280px; font-weight:800; line-height:1; color:#E2783B\">04<\/p><svg aria-label=\"La bàn định hướng\" width=\"320\" height=\"320\" viewBox=\"0 0 320 320\" style=\"width:320px; height:320px\"><g transform=\"scale(5)\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"32\" cy=\"32\" r=\"26\"/><path d=\"M40 18 L36 36 L24 46 L28 28 Z\" stroke=\"#E2783B\"/><circle cx=\"32\" cy=\"32\" r=\"2\"/><\/g><\/svg><\/div>\n<h1 style=\"font-size:88px; font-weight:700; line-height:1.15; color:#1E2533\">Lãnh đạo cần làm gì để CX trở thành năng lực của tổ chức?<\/h1>\n<\/section>"}, {"id": "b2-27", "label": "B2 · 29", "session": 2, "part": "s13", "title": "Nhân viên chỉ có thể trao cho khách hàng điều họ nhận được", "activity": "", "points": ["Trải nghiệm nhân viên · công cụ, quyền, ghi nhận", "Trải nghiệm khách hàng · phản chiếu điều đó", "DigiNet: kỹ thuật viên là thương hiệu trong nhà khách"], "notes": "① MỞ\n\"Hãy hình dung một kỹ thuật viên phải lắp đặt sáu nhà mỗi ngày, di chuyển trong giờ cao điểm, không có thời gian ăn trưa, và bị phạt nếu thiếu chỉ tiêu. Anh ta bước vào nhà khách hàng lúc 6 giờ chiều. Anh chị nghĩ khách hàng sẽ nhận được trải nghiệm gì?\"\n\n② GIẢNG\nTrải nghiệm nhân viên (Employee Experience – EX) là tổng hòa những gì nhân viên trải qua trong suốt vòng đời làm việc với tổ chức: được thu hút và tuyển dụng, hội nhập những ngày đầu, được phát triển, gắn bó và cuối cùng là rời đi. Năm điểm trên vòng tròn là năm giai đoạn đó. Như chuỗi lợi nhuận dịch vụ đã chỉ ra, trải nghiệm khách hàng thường phản chiếu trải nghiệm nhân viên, đặc biệt ở tuyến đầu. Ba yếu tố nhà quản lý có thể tác động trực tiếp. Công cụ: nhân viên có đủ thông tin và hệ thống để phục vụ khách không, hay phải hỏi ba phòng ban mới trả lời được một câu? Quyền: nhân viên có được tự quyết để giải quyết vấn đề không – như chúng ta bàn ở Phần 2? Ghi nhận: tổ chức có khen thưởng hành vi phục vụ khách hàng tốt, hay chỉ khen thưởng doanh số và tốc độ? Một nguyên tắc thiết kế: hãy vẽ bản đồ hành trình cho nhân viên tuyến đầu giống như vẽ cho khách hàng – anh chị sẽ tìm thấy những điểm đau giống hệt nhau, chỉ nhìn từ phía bên kia quầy.\n\n③ MINH HỌA\nCase DigiNet ghi nhận một đặc thù ngành: kỹ thuật viên vào nhà khách hàng chính là đại diện thương hiệu. DigiNet có hơn 200 kỹ thuật viên, và 28% lượt lắp đặt bị đánh giá dưới 3 trên 5 – đến muộn, không gọi trước, thái độ chưa tốt. Nếu chỉ đào tạo lại thái độ, kết quả có thể không thay đổi. Câu hỏi EX cần đặt ra: lịch làm việc của kỹ thuật viên được xếp thế nào, họ có ứng dụng để báo trước giờ đến không, KPI của họ đo số lượt lắp hay chất lượng lắp, và có ai từng cảm ơn họ khi khách khen không? Đây là các giả thuyết để nhóm DigiNet kiểm chứng.\n\n④ LIÊN HỆ\nNhà quản lý cấp cao nên xem các chỉ số nhân sự tuyến đầu – tỷ lệ nghỉ việc, mức độ gắn bó, số ngày đào tạo – như những chỉ số dẫn dắt của CX, và đặt chúng cạnh chỉ số khách hàng trong cùng một báo cáo.\n\n★ CÂU CHỐT: \"Muốn khách hàng được đối xử tốt, hãy bắt đầu bằng cách đối xử tốt với những người phục vụ họ.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Nhân viên tuyến đầu của anh chị đang gặp điểm đau lớn nhất nào khi phục vụ khách hàng?\"\nNếu lớp im lặng: gợi ý – phải nhập dữ liệu ở nhiều hệ thống, không được quyền xử lý, bị khách phản ánh vì lỗi của bộ phận khác.\nCâu trả lời có thể gặp: \"Nhân viên bị khách mắng vì lỗi không phải của họ\" → phản hồi: đó là một điểm đau EX trực tiếp sinh ra từ một điểm đau CX ở hậu trường – hai vấn đề có chung một nguyên nhân gốc.\n\n⑥ CHUYỂN Ý\n\"Nhân viên nhìn vào đâu để biết tổ chức thực sự coi trọng điều gì? Họ nhìn vào lãnh đạo.\"", "html": "<section id=\"b2-27\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Nhân viên chỉ có thể trao cho khách hàng điều họ nhận được<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Vòng đời nhân viên gồm năm điểm xám nhạt quanh một người xám tối nhạt, mũi tên nối sang một khách hàng màu cam\" width=\"512\" height=\"384\" viewBox=\"0 0 512 384\" style=\"width:512px; height:384px\"><g transform=\"scale(0.800)\"><circle cx=\"220\" cy=\"240\" r=\"170\" fill=\"none\" stroke=\"#D5DAE1\" stroke-width=\"8\"/><circle cx=\"220\" cy=\"70\" r=\"34\" fill=\"#8A94A6\"/><circle cx=\"382\" cy=\"187\" r=\"34\" fill=\"#8A94A6\"/><circle cx=\"320\" cy=\"378\" r=\"34\" fill=\"#8A94A6\"/><circle cx=\"120\" cy=\"378\" r=\"34\" fill=\"#8A94A6\"/><circle cx=\"58\" cy=\"187\" r=\"34\" fill=\"#8A94A6\"/><circle cx=\"220\" cy=\"209\" r=\"31\" fill=\"#8A94A6\"/><path d=\"M177 303 Q220 233 263 303 Z\" fill=\"#8A94A6\"/><path d=\"M410 240 L500 240\" stroke=\"#1E2533\" stroke-width=\"8\" stroke-linecap=\"round\"/><path d=\"M496 216 L536 240 L496 264 Z\" fill=\"#1E2533\"/><circle cx=\"580\" cy=\"216\" r=\"26\" fill=\"#E2783B\"/><path d=\"M544 294 Q580 236 616 294 Z\" fill=\"#E2783B\"/><\/g><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:28px\">\n<p><b>Trải nghiệm nhân viên<\/b> · công cụ, quyền, ghi nhận<\/p>\n<p><b style=\"color:#E2783B\">Trải nghiệm khách hàng<\/b> · phản chiếu điều đó<\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng wifi – case DigiNet\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 26 A34 34 0 0 1 56 26\"/><path d=\"M16 35 A22 22 0 0 1 48 35\"/><path d=\"M24 44 A11 11 0 0 1 40 44\"/><circle cx=\"32\" cy=\"53\" r=\"4\" fill=\"#E2783B\" stroke=\"none\"/><\/g><\/svg><p style=\"color:#5B6577\">DigiNet: kỹ thuật viên là thương hiệu trong nhà khách<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b2-28", "label": "B2 · 30", "session": 2, "part": "s13", "title": "Văn hóa lấy khách hàng làm trung tâm được xây từ hành vi của lãnh đạo", "activity": "", "points": ["Nghe khách hàng trực tiếp", "Hỏi về khách hàng trong mọi cuộc họp", "Amazon: một chiếc ghế trống dành cho khách hàng"], "notes": "① MỞ\n\"Nhân viên không đọc khẩu hiệu trên tường. Họ quan sát xem sếp hỏi câu gì đầu tiên trong cuộc họp giao ban. Nếu câu đầu tiên luôn là doanh số, họ biết điều gì thực sự quan trọng.\"\n\n② GIẢNG\nVăn hóa, theo một cách hiểu đơn giản, là những hành vi được lặp lại và được tổ chức chấp nhận. Văn hóa lấy khách hàng làm trung tâm không được tạo ra bằng một sứ mệnh hay một chiến dịch truyền thông nội bộ, mà bằng những tín hiệu nhỏ, nhất quán từ lãnh đạo. Có ba nhóm hành vi mà nhà quản lý cấp cao có thể bắt đầu ngay. Một, nghe khách hàng trực tiếp: định kỳ nghe cuộc gọi tổng đài, đọc phản hồi của người phản đối, gặp khách hàng đã rời bỏ. Hai, hỏi về khách hàng: đưa một câu chuyện khách hàng hoặc một chỉ số CX lên đầu chương trình họp điều hành, và hỏi \"quyết định này ảnh hưởng tới khách hàng thế nào?\" trước khi phê duyệt. Ba, khen thưởng và hệ thống hóa: ghi nhận công khai những hành động phục vụ khách hàng xuất sắc, và gắn một phần thưởng của quản lý với chỉ số khách hàng. Quan trọng nhất là tính nhất quán: một lần lãnh đạo bỏ qua khách hàng để chạy doanh số cuối quý có thể xóa đi nhiều tháng truyền thông.\n\n③ MINH HỌA\nMột câu chuyện thường được kể về Amazon: trong những năm đầu, Jeff Bezos đặt một chiếc ghế trống trong các cuộc họp và giới thiệu đó là chỗ ngồi của khách hàng – \"người quan trọng nhất trong phòng\". Dù là một biểu tượng đơn giản, nó nhắc mọi người rằng mỗi quyết định đều có một người vắng mặt chịu ảnh hưởng. Ví dụ Việt Nam: tại Đại hội cổ đông Thế Giới Di Động ngày 26/4/2025, Chủ tịch Nguyễn Đức Tài phân biệt nhà bán lẻ đỉnh cao với nhà bán lẻ tầm thường bằng câu: \"Khi thiết bị còn trong nhà bạn, trách nhiệm còn nằm trên vai chúng tôi.\" Câu nói đi kèm cam kết cụ thể: máy lạnh mua tại Điện Máy Xanh được bảo dưỡng trọn đời, có lịch nhắc vệ sinh, sửa chữa khẩn cấp – do công ty con với hàng nghìn kỹ thuật viên thực hiện. Khi lãnh đạo nói về khách hàng trước cổ đông, cả tổ chức hiểu đâu là ưu tiên. Quay lại case BizManage: CEO Khoa không trả lời được câu hỏi \"tiết kiệm được bao nhiêu\" vì chưa ai trong BizManage ngồi với anh để hỏi anh cần gì.\n\n④ LIÊN HỆ\nMời học viên tự kiểm tra lịch làm việc tháng vừa qua của mình: bao nhiêu giờ dành để nghe trực tiếp khách hàng? Nếu con số gần bằng không, tổ chức sẽ hiểu rằng khách hàng không phải ưu tiên của lãnh đạo, dù khẩu hiệu nói gì.\n\n★ CÂU CHỐT: \"Văn hóa khách hàng không nằm trong khẩu hiệu. Nó nằm trong câu hỏi đầu tiên mà lãnh đạo đặt ra ở mỗi cuộc họp.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Trong cuộc họp ban điều hành gần nhất của anh chị, khách hàng xuất hiện ở phút thứ mấy – và dưới dạng nào?\"\nNếu lớp im lặng: đề nghị học viên ước lượng tỷ lệ thời gian họp dành cho khách hàng so với tài chính và nội bộ.\nCâu trả lời có thể gặp: \"Chỉ khi có khiếu nại lớn\" → phản hồi: khi khách hàng chỉ xuất hiện trong khủng hoảng, tổ chức sẽ học cách phản ứng thay vì phòng ngừa.\n\n⑥ CHUYỂN Ý\n\"Hành vi của lãnh đạo tạo ra hướng đi. Nhưng tổ chức cần một lộ trình để đi.\"", "html": "<section id=\"b2-28\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Văn hóa lấy khách hàng làm trung tâm được xây từ hành vi của lãnh đạo<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Bàn họp xám tối với năm ghế xám nhạt và một ghế trống viền cam\" width=\"620\" height=\"460\" viewBox=\"0 0 620 460\" style=\"width:620px; height:460px\"><rect x=\"40\" y=\"170\" width=\"530\" height=\"140\" rx=\"24\" fill=\"#D5DAE1\"/><rect x=\"80\" y=\"60\" width=\"110\" height=\"90\" rx=\"14\" fill=\"#8A94A6\"/><rect x=\"250\" y=\"60\" width=\"110\" height=\"90\" rx=\"14\" fill=\"#8A94A6\"/><rect x=\"420\" y=\"60\" width=\"110\" height=\"90\" rx=\"14\" fill=\"#8A94A6\"/><rect x=\"80\" y=\"330\" width=\"110\" height=\"90\" rx=\"14\" fill=\"#8A94A6\"/><rect x=\"250\" y=\"330\" width=\"110\" height=\"90\" rx=\"14\" fill=\"#8A94A6\"/><rect x=\"420\" y=\"330\" width=\"110\" height=\"90\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E2783B\" stroke-width=\"8\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:40px\">\n<p><b style=\"color:#E2783B\">Nghe<\/b> khách hàng trực tiếp<\/p>\n<p><b>Hỏi<\/b> về khách hàng trong mọi cuộc họp<\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng chiếc ghế trống\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 6 V58\"/><path d=\"M18 36 H46 V58\"/><line x1=\"18\" y1=\"36\" x2=\"18\" y2=\"6\"/><\/g><\/svg><p style=\"color:#5B6577\">Amazon: một chiếc ghế trống dành cho khách hàng<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b2-29", "label": "B2 · 31", "session": 2, "part": "s13", "title": "Chuyển đổi CX là một lộ trình, không phải một dự án", "activity": "", "points": ["0–3 tháng · thắng nhanh", "3–12 tháng · xây nền đo lường", "Sau 12 tháng · thành văn hóa"], "notes": "① MỞ\n\"Nếu ngày mai anh chị về công ty và tuyên bố 'năm nay là năm của trải nghiệm khách hàng', điều gì sẽ xảy ra sau ba tháng?\" Để lớp cười. Thường câu trả lời là: \"không có gì cả\".\n\n② GIẢNG\nJohn Kotter, trong mô hình tám bước dẫn dắt thay đổi (1995), nhấn mạnh rằng thay đổi thất bại khi tổ chức không tạo được cảm giác cấp bách, không có liên minh dẫn dắt, và không tạo ra những chiến thắng ngắn hạn để duy trì động lực. Áp dụng vào CX, một lộ trình thực tế thường có ba chặng.\nChặng 1, khoảng 0–3 tháng – thắng nhanh: chọn MỘT hành trình quan trọng, MỘT điểm đau lớn, có người sở hữu rõ ràng và có số liệu trước – sau. Mục tiêu là chứng minh rằng CX tạo ra kết quả, để có niềm tin và ngân sách cho chặng sau.\nChặng 2, khoảng 3–12 tháng – xây nền: thiết lập hệ thống đo lường ba tầng, vòng phản hồi khép kín, cơ chế trao quyền và kịch bản phục hồi cho các sự cố phổ biến; mở rộng sang hai, ba hành trình tiếp theo.\nChặng 3, sau 12 tháng – thành văn hóa: gắn chỉ số CX vào đánh giá quản lý, đưa CX vào quy trình ra quyết định sản phẩm và đầu tư, xây trải nghiệm nhân viên tương xứng.\nMốc thời gian chỉ mang tính tham khảo; điều quan trọng là thứ tự: chứng minh trước, hệ thống hóa sau, văn hóa hóa cuối cùng.\n\n③ MINH HỌA\nVới case Life Biz School, một \"thắng nhanh\" rõ ràng là \"vùng chết\" sáu tuần giữa lúc đóng học phí và ngày khai giảng: điểm đau được đo được (23% hối tiếc sau khi mua), giải pháp chi phí thấp (chuỗi liên lạc chào đón, người đồng hành), và kết quả thấy được trong một khóa tuyển sinh. Thành công đó tạo cơ sở để chặng 2 giải quyết vấn đề khó hơn – giai đoạn rời rụng tháng 8 đến 15 – và chặng 3 xây dựng mô hình cựu học viên gắn bó suốt đời.\n\n④ LIÊN HỆ\nNhà quản lý nên cảnh giác với hai cám dỗ: bắt đầu bằng một dự án công nghệ lớn trước khi hiểu khách hàng, hoặc làm cùng lúc quá nhiều hành trình. Một chiến thắng nhỏ, rõ ràng, có số liệu thường thuyết phục hơn một kế hoạch tổng thể đẹp.\n\n★ CÂU CHỐT: \"Bắt đầu nhỏ, chứng minh bằng số liệu, rồi mới mở rộng – đó là cách CX sống sót qua năm đầu tiên.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Nếu phải chọn MỘT 'thắng nhanh' cho doanh nghiệp anh chị trong 90 ngày tới, anh chị chọn điểm đau nào?\"\nNếu lớp im lặng: gợi ý tiêu chí – ảnh hưởng nhiều khách, đo được, sửa được trong phạm vi quyền hạn của mình.\nCâu trả lời có thể gặp: \"Giảm thời gian chờ tổng đài\" → phản hồi: tốt; hãy chắc chắn đo cả tỷ lệ giải quyết ngay lần đầu, không chỉ thời gian chờ.\n\n⑥ CHUYỂN Ý\n\"Trong lộ trình đó, công nghệ đóng vai trò gì? Đây là câu hỏi nhiều ban điều hành đang đặt ra với AI.\"", "html": "<section id=\"b2-29\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Chuyển đổi CX là một lộ trình, không phải một dự án<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Con đường đi lên qua ba chặng, mỗi chặng có một lá cờ: cam, xám nhạt, trắng\" width=\"680\" height=\"460\" viewBox=\"0 0 680 460\" style=\"width:680px; height:460px\"><path d=\"M20 430 C 160 430, 160 330, 240 320 S 380 250, 450 210 S 580 110, 660 90\" fill=\"none\" stroke=\"#D5DAE1\" stroke-width=\"16\" stroke-linecap=\"round\"/><line x1=\"240\" y1=\"320\" x2=\"240\" y2=\"200\" stroke=\"#1E2533\" stroke-width=\"8\"/><path d=\"M244 200 L320 225 L244 250 Z\" fill=\"#E2783B\"/><line x1=\"450\" y1=\"210\" x2=\"450\" y2=\"90\" stroke=\"#1E2533\" stroke-width=\"8\"/><path d=\"M454 90 L530 115 L454 140 Z\" fill=\"#8A94A6\"/><line x1=\"640\" y1=\"96\" x2=\"640\" y2=\"10\" stroke=\"#1E2533\" stroke-width=\"8\"/><path d=\"M644 10 L676 22 L644 40 Z\" fill=\"#1E2533\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:40px\">\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng bolt\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M36 4 L12 36 H30 L26 60 L52 26 H34 Z\"/><\/g><\/svg><p><b style=\"color:#E2783B\">0–3 tháng<\/b> · thắng nhanh<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng layers\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M32 6 L58 20 L32 34 L6 20 Z\"/><path d=\"M6 32 L32 46 L58 32\"/><path d=\"M6 44 L32 58 L58 44\"/><\/g><\/svg><p><b>3–12 tháng<\/b> · xây nền đo lường<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng heart\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M32 56 C 10 42, 4 28, 8 18 C 12 8, 26 6, 32 16 C 38 6, 52 8, 56 18 C 60 28, 54 42, 32 56 Z\"/><\/g><\/svg><p><b>Sau 12 tháng<\/b> · thành văn hóa<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b2-30", "label": "B2 · 32", "session": 2, "part": "s13", "title": "Công nghệ khuếch đại trải nghiệm, không thay thế sự thấu hiểu", "activity": "", "points": ["Tự động hóa · việc lặp lại", "Con người · khoảnh khắc cảm xúc", "TechPharma: 180.000 khách mãn tính chưa được nhắc mua thuốc định kỳ"], "notes": "① MỞ\n\"Số hóa một quy trình tệ sẽ cho chúng ta một quy trình tệ chạy nhanh hơn.\" Nói chậm câu này, để lớp suy nghĩ.\n\n② GIẢNG\nCông nghệ – từ ứng dụng di động, hệ thống CRM, dữ liệu hợp nhất đến trí tuệ nhân tạo – đang mở ra những khả năng rất lớn cho CX: cá nhân hóa theo từng khách hàng, dự báo khách sắp rời bỏ, trả lời 24/7, phân tích hàng nghìn bình luận trong vài phút. Nhưng công nghệ là bộ khuếch đại: nó làm mạnh lên những gì doanh nghiệp đã có. Nếu doanh nghiệp đã hiểu khách hàng, đã có hành trình được thiết kế tốt, công nghệ giúp làm điều đó ở quy mô lớn. Nếu chưa, công nghệ chỉ nhân rộng những điểm đau. Một nguyên tắc phân công hữu ích: để công nghệ xử lý những việc lặp lại, có quy tắc rõ ràng, cần tốc độ – nhắc lịch, cập nhật trạng thái, trả lời câu hỏi thường gặp, phát hiện tín hiệu rời bỏ sớm; để con người xử lý những khoảnh khắc có cảm xúc cao, tình huống phức tạp, và sự cố – đúng những đỉnh và đáy trên đường cảm xúc. Và luôn thiết kế một lối thoát dễ dàng từ máy sang người.\n\n③ MINH HỌA\nCase TechPharma cho thấy cả hai mặt. Chuỗi có khoảng 180.000 khách hàng mãn tính, nhóm có giá trị vòng đời cao nhất, nhưng chưa có cơ chế tự động nhắc hoặc đặt lại thuốc định kỳ, và dược sĩ quên nhắc. Đây là việc lặp lại, có quy tắc – rất phù hợp để công nghệ đảm nhận: nhắc tái mua, kiểm tra tương tác thuốc tự động dựa trên lịch sử mua. Nhưng với bà Ngọc, 72 tuổi, dùng năm loại thuốc mỗi ngày và ít dùng công nghệ, hay với chị Mai lúc 2 giờ sáng, điều cần là một dược sĩ – một con người – với đủ thông tin trên màn hình để tư vấn đúng. Công nghệ giúp dược sĩ có thời gian và thông tin cho những khoảnh khắc đó, thay vì thay thế họ.\n\n④ LIÊN HỆ\nTrước khi phê duyệt một dự án công nghệ CX, nhà quản lý nên hỏi ba câu: dự án này giải quyết điểm đau nào trên bản đồ hành trình? Nó giải phóng thời gian của nhân viên cho khoảnh khắc nào? Và khách hàng thoát ra để gặp người thật bằng cách nào?\n\n★ CÂU CHỐT: \"Hãy để máy làm những việc lặp lại, để con người có thời gian cho những khoảnh khắc có ý nghĩa.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Doanh nghiệp anh chị có dự án công nghệ nào đang làm trải nghiệm tệ đi thay vì tốt lên?\"\nNếu lớp im lặng: gợi ý – chatbot không hiểu câu hỏi và không cho gặp người, tổng đài tự động nhiều tầng, ứng dụng bắt đăng nhập lại liên tục.\nCâu trả lời có thể gặp: \"Chatbot của chúng tôi giảm chi phí nhưng khách than phiền nhiều hơn\" → phản hồi: hãy đo CES cho kênh chatbot và tỷ lệ khách phải chuyển sang kênh khác.\n\n⑥ CHUYỂN Ý\n\"Đã đến lúc các nhóm đứng trước hội đồng quản trị.\"", "html": "<section id=\"b2-30\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Công nghệ khuếch đại trải nghiệm, không thay thế sự thấu hiểu<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Một người màu cam ở giữa, các vòng sóng xám nhạt lan tỏa ra xung quanh, một bánh răng nhỏ trắng bên cạnh\" width=\"448\" height=\"384\" viewBox=\"0 0 448 384\" style=\"width:448px; height:384px\"><g transform=\"scale(0.800)\"><circle cx=\"260\" cy=\"240\" r=\"220\" fill=\"none\" stroke=\"#D5DAE1\" stroke-width=\"8\"/><circle cx=\"260\" cy=\"240\" r=\"160\" fill=\"none\" stroke=\"#8A94A6\" stroke-width=\"8\"/><circle cx=\"260\" cy=\"240\" r=\"100\" fill=\"none\" stroke=\"#8A94A6\" stroke-width=\"8\"/><circle cx=\"260\" cy=\"213\" r=\"29\" fill=\"#E2783B\"/><path d=\"M220 298 Q260 235 300 298 Z\" fill=\"#E2783B\"/><rect x=\"472\" y=\"52\" width=\"16\" height=\"26\" rx=\"4\" fill=\"#1E2533\" transform=\"rotate(0 480 90)\"/><rect x=\"472\" y=\"52\" width=\"16\" height=\"26\" rx=\"4\" fill=\"#1E2533\" transform=\"rotate(45 480 90)\"/><rect x=\"472\" y=\"52\" width=\"16\" height=\"26\" rx=\"4\" fill=\"#1E2533\" transform=\"rotate(90 480 90)\"/><rect x=\"472\" y=\"52\" width=\"16\" height=\"26\" rx=\"4\" fill=\"#1E2533\" transform=\"rotate(135 480 90)\"/><rect x=\"472\" y=\"52\" width=\"16\" height=\"26\" rx=\"4\" fill=\"#1E2533\" transform=\"rotate(180 480 90)\"/><rect x=\"472\" y=\"52\" width=\"16\" height=\"26\" rx=\"4\" fill=\"#1E2533\" transform=\"rotate(225 480 90)\"/><rect x=\"472\" y=\"52\" width=\"16\" height=\"26\" rx=\"4\" fill=\"#1E2533\" transform=\"rotate(270 480 90)\"/><rect x=\"472\" y=\"52\" width=\"16\" height=\"26\" rx=\"4\" fill=\"#1E2533\" transform=\"rotate(315 480 90)\"/><circle cx=\"480\" cy=\"90\" r=\"30\" fill=\"#1E2533\"/><circle cx=\"480\" cy=\"90\" r=\"10\" fill=\"#FFFFFF\"/><\/g><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:28px\">\n<p><b>Tự động hóa<\/b> · việc lặp lại<\/p>\n<p><b style=\"color:#E2783B\">Con người<\/b> · khoảnh khắc cảm xúc<\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng viên thuốc – case TechPharma\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><g transform=\"rotate(-40 32 32)\"><rect x=\"6\" y=\"21\" width=\"52\" height=\"22\" rx=\"11\"/><line x1=\"32\" y1=\"21\" x2=\"32\" y2=\"43\"/><\/g><\/g><\/svg><p style=\"color:#5B6577\">TechPharma: 180.000 khách mãn tính chưa được nhắc mua thuốc định kỳ<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b2-31", "label": "B2 · 33", "session": 2, "part": "s13", "title": "Trình bày: Ba sáng kiến CX trước hội đồng quản trị", "activity": "4 nhóm · mỗi nhóm 3 phút", "points": ["1. Vấn đề và nguyên nhân gốc", "2. Ba sáng kiến, mỗi sáng kiến một chỉ số", "3. Tác động tài chính và đề xuất quyết định"], "notes": "① MỞ\n\"Cả lớp bây giờ là hội đồng quản trị của bốn doanh nghiệp. Mỗi nhóm có đúng ba phút để thuyết phục chúng ta phê duyệt ba sáng kiến trải nghiệm khách hàng. Ba phút – vì hội đồng quản trị thật cũng không có nhiều thời gian hơn.\"\n\n② HƯỚNG DẪN HOẠT ĐỘNG (khoảng 25 phút)\n– Chuẩn bị: các nhóm có 3 phút để thống nhất người trình bày và thứ tự nội dung.\n– Trình bày: mỗi nhóm 3 phút, giảng viên bấm giờ nghiêm ngặt và báo khi còn 30 giây. Cấu trúc gợi ý: (1) Vấn đề – persona, điểm đáy trên hành trình, nguyên nhân gốc và chi phí của nó; (2) Ba sáng kiến – sửa nguyên nhân gốc, khoảnh khắc đáng nhớ, kịch bản phục hồi hoặc vòng phản hồi – mỗi sáng kiến kèm một chỉ số và mục tiêu sáu tháng; (3) Tác động tài chính ước tính và MỘT quyết định cụ thể cần hội đồng phê duyệt hôm nay.\n– Hỏi đáp: sau mỗi nhóm, \"hội đồng\" đặt một câu hỏi, tối đa một phút.\n– Thứ tự gợi ý: DigiNet, TechPharma, BizManage, Life Biz School – đi từ B2C sang B2B rồi giáo dục, để lớp thấy cùng một phương pháp áp dụng cho các mô hình khác nhau.\n\n③ TIÊU CHÍ PHẢN HỒI\nGiảng viên phản hồi ngắn sau khi cả bốn nhóm trình bày xong, theo năm tiêu chí: nguyên nhân gốc có nằm ở tầng hệ thống không; sáng kiến có khả thi với nguồn lực của doanh nghiệp không; chỉ số có đo được và có người sở hữu không; tác động tài chính có logic không; và phần trình bày có kết thúc bằng một đề xuất quyết định rõ ràng không. Có thể mời cả lớp bình chọn nhóm thuyết phục nhất bằng cách giơ tay.\n\n④ LIÊN HỆ\nNhấn mạnh sau khi các nhóm trình bày: kỹ năng vừa thực hành – nói về trải nghiệm khách hàng bằng ngôn ngữ của nguyên nhân, chỉ số và tài chính trong ba phút – chính là kỹ năng anh chị cần khi đề xuất CX trong ban điều hành của mình.\n\n★ CÂU CHỐT: \"Một đề xuất CX thuyết phục kết thúc bằng một quyết định, không phải bằng một mong muốn.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi gợi ý cho \"hội đồng\" nếu lớp chưa đặt câu hỏi: \"Nếu chỉ được duyệt một trong ba sáng kiến, nhóm chọn sáng kiến nào?\" \"Ai trong doanh nghiệp sẽ chịu trách nhiệm chính?\" \"Sau ba tháng, dấu hiệu nào cho biết sáng kiến đang đi đúng hướng?\"\nNếu một nhóm vượt thời gian: dừng lịch sự ở phút thứ ba và mời nhóm nêu ngay quyết định cần phê duyệt – đây cũng là một bài học về trình bày trước lãnh đạo.\n\n⑥ CHUYỂN Ý\n\"Cảm ơn bốn nhóm. Ba sáng kiến đã có. Bây giờ hãy đặt chúng lên đúng chỗ của chúng: hành trình của khách hàng.\"\n\nTÓM TẮT PHẦN 4 (một câu): CX trở thành năng lực của tổ chức khi lãnh đạo chăm lo trải nghiệm nhân viên, làm gương bằng hành vi, dẫn dắt theo lộ trình bắt đầu từ những chiến thắng nhanh, và dùng công nghệ để khuếch đại sự thấu hiểu.", "html": "<section id=\"b2-31\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:40px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Trình bày: Ba sáng kiến CX trước hội đồng quản trị<\/h2>\n<p style=\"align-self:start; font-weight:700; color:#FFFFFF; background:#E2783B; padding:8px 36px; border-radius:999px\">4 nhóm · mỗi nhóm 3 phút<\/p>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Bục thuyết trình màu trắng với một người màu cam, bên cạnh là đồng hồ bấm giờ xám tối nhạt\" width=\"560\" height=\"460\" viewBox=\"0 0 560 460\" style=\"width:560px; height:460px\"><circle cx=\"140\" cy=\"86\" r=\"34\" fill=\"#E2783B\"/><path d=\"M93 187 Q140 112 187 187 Z\" fill=\"#E2783B\"/><path d=\"M40 220 L240 220 L215 440 L65 440 Z\" fill=\"#1E2533\"/><circle cx=\"420\" cy=\"250\" r=\"110\" fill=\"#FFFFFF\" stroke=\"#8A94A6\" stroke-width=\"16\"/><rect x=\"400\" y=\"110\" width=\"40\" height=\"30\" rx=\"8\" fill=\"#8A94A6\"/><path d=\"M420 250 L420 250 L420 160 A 90 90 0 0 1 498 295 Z\" fill=\"#8A94A6\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:32px\">\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng roots\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M32 4 V26\"/><path d=\"M22 12 H42\"/><path d=\"M32 26 L16 46 M32 26 L32 58 M32 26 L48 46 M24 36 L8 40 M40 36 L56 40\"/><\/g><\/svg><p><b style=\"color:#E2783B\">1.<\/b> Vấn đề và nguyên nhân gốc<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng gauge\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 44 A26 26 0 0 1 58 44\"/><line x1=\"32\" y1=\"44\" x2=\"46\" y2=\"26\"/><circle cx=\"32\" cy=\"44\" r=\"4\" fill=\"#E2783B\" stroke=\"none\"/><line x1=\"12\" y1=\"54\" x2=\"52\" y2=\"54\"/><\/g><\/svg><p><b style=\"color:#E2783B\">2.<\/b> Ba sáng kiến, mỗi sáng kiến một chỉ số<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng coin\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><ellipse cx=\"32\" cy=\"16\" rx=\"22\" ry=\"9\"/><path d=\"M10 16 V32 C 10 37, 20 41, 32 41 C 44 41, 54 37, 54 32 V16\"/><path d=\"M10 32 V48 C 10 53, 20 57, 32 57 C 44 57, 54 53, 54 48 V32\"/><\/g><\/svg><p><b style=\"color:#E2783B\">3.<\/b> Tác động tài chính và đề xuất quyết định<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b2-31a", "label": "B2 · 34", "session": 2, "part": "s13", "title": "Workshop: Bản đồ hành trình cho persona của nhóm", "activity": "Nhóm · 40 phút · handout trang 6 khổ A1", "points": ["Hành trình 6 giai đoạn của persona", "Điểm đau, giải pháp, phòng ban", "Điểm wow cần phát triển"], "notes": "① MỞ\n\"Đây là phần tổng hợp của cả học phần. Trên một tờ A1, mỗi nhóm sẽ dẫn persona của mình – người khách đã xây dựng ở Buổi 1 – đi qua toàn bộ doanh nghiệp, và đề xuất doanh nghiệp phải thay đổi điều gì.\"\n\n② HƯỚNG DẪN HOẠT ĐỘNG (khoảng 40 phút)\nDùng handout trang 6 in khổ A1, bút dạ và giấy note.\n– Phút 0–5: điền phần đầu bản đồ – thông tin cơ bản, đặc điểm hành vi, mục tiêu và thách thức của persona Buổi 1.\n– Phút 5–20: đi qua sáu giai đoạn Nhận thức – Tìm hiểu – Cân nhắc – Mua hàng – Sử dụng – Ủng hộ; với mỗi giai đoạn điền hành động, suy nghĩ, điểm chạm, mong muốn và vẽ đường cảm xúc.\n– Phút 20–30: khoanh 2–3 điểm đau quan trọng nhất (hàng màu cam). Với mỗi điểm đau, điền hàng Giải pháp và hàng Team phụ trách – ghi rõ phòng ban nào cần phối hợp. Có thể dùng Problem Definition Canvas ở cuối trang 6 cho điểm đau lớn nhất, kết hợp kết quả \"5 lần vì sao\" đã làm ở Phần 1.\n– Phút 30–37: đánh dấu 1–2 điểm wow cần phát triển – thường ở đỉnh cảm xúc hoặc phần kết của hành trình – dùng bốn yếu tố thăng hoa, vỡ lẽ, tự hào, kết nối.\n– Phút 37–40: chọn người trình bày, dán bản đồ lên tường.\n\n③ DẪN DẮT TRONG LÚC NHÓM LÀM\nCâu hỏi gợi mở: \"Ở giai đoạn này persona cảm thấy thế nào – một từ thôi?\" \"Điểm đau này thuộc tiền sảnh hay hậu trường?\" \"Giải pháp này cần mấy phòng ban cùng làm, ai là người sở hữu?\" \"Điểm wow này có thực hiện được lúc 2 giờ sáng không?\"\nNhắc thời gian ở phút 20, 30 và 37. Nếu nhóm sa đà vào giai đoạn đầu, đề nghị đi hết hành trình trước rồi mới quay lại chi tiết.\n\n④ LIÊN HỆ\nBản đồ này gom lại mọi công cụ của hai buổi: persona và empathy map (Buổi 1), điểm chạm và đường cảm xúc (Phần 4 Buổi 1), nguyên nhân gốc (Phần 1 Buổi 2), điểm wow và phục hồi (Phần 2), chỉ số (Phần 3), người sở hữu (Phần 4).\n\n★ CÂU CHỐT: \"Một bản đồ hành trình chỉ có giá trị khi mỗi điểm đau trên đó có một giải pháp và một người chịu trách nhiệm.\"\n\n⑤ TƯƠNG TÁC\nNếu nhóm bế tắc ở hàng Team phụ trách: gợi ý đọc lại gợi ý in sẵn dưới mỗi cột (Marketing, Sales, Payment, Support, Customer Success) rồi điều chỉnh theo case.\n\n⑥ CHUYỂN Ý\n\"Mời bốn nhóm dán bản đồ lên tường. Chúng ta sẽ đi một vòng 'triển lãm hành trình'.\"", "html": "<section id=\"b2-31a\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:40px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Workshop: Bản đồ hành trình cho persona của nhóm<\/h2>\n<p style=\"align-self:start; font-weight:700; color:#FFFFFF; background:#E2783B; padding:8px 36px; border-radius:999px\">Nhóm · 40 phút · handout trang 6 khổ A1<\/p>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg aria-label=\"Bản đồ hành trình khổ lớn: sáu giai đoạn, các hàng ô xám, hàng điểm đau màu cam, đường cảm xúc và một ngôi sao điểm wow\" width=\"600\" height=\"460\" viewBox=\"0 0 600 460\" style=\"width:600px; height:460px\"><path d=\"M20 20 L96 20 L108 44 L96 68 L20 68 L32 44 Z\" fill=\"#1E2533\"/><path d=\"M112 20 L188 20 L200 44 L188 68 L112 68 L124 44 Z\" fill=\"#1E2533\"/><path d=\"M204 20 L280 20 L292 44 L280 68 L204 68 L216 44 Z\" fill=\"#1E2533\"/><path d=\"M296 20 L372 20 L384 44 L372 68 L296 68 L308 44 Z\" fill=\"#1E2533\"/><path d=\"M388 20 L464 20 L476 44 L464 68 L388 68 L400 44 Z\" fill=\"#1E2533\"/><path d=\"M480 20 L556 20 L568 44 L556 68 L480 68 L492 44 Z\" fill=\"#1E2533\"/><rect x=\"24\" y=\"88\" width=\"84\" height=\"38\" rx=\"6\" fill=\"#D5DAE1\"/><rect x=\"116\" y=\"88\" width=\"84\" height=\"38\" rx=\"6\" fill=\"#D5DAE1\"/><rect x=\"208\" y=\"88\" width=\"84\" height=\"38\" rx=\"6\" fill=\"#D5DAE1\"/><rect x=\"300\" y=\"88\" width=\"84\" height=\"38\" rx=\"6\" fill=\"#D5DAE1\"/>< =\"484\" y=\"296\" width=\"84\" height=\"38\" rx=\"6\" fill=\"#D5DAE1\"/><rect x=\"24\" y=\"348\" width=\"84\" height=\"38\" rx=\"6\" fill=\"#D5DAE1\"/><rect x=\"116\" y=\"348\" width=\"84\" height=\"38\" rx=\"6\" fill=\"#D5DAE1\"/><rect x=\"208\" y=\"348\" width=\"84\" height=\"38\" rx=\"6\" fill=\"#D5DAE1\"/><rect x=\"300\" y=\"348\" width=\"84\" height=\"38\" rx=\"6\" fill=\"#D5DAE1\"/><rect x=\"392\" y=\"348\" width=\"84\" height=\"38\" rx=\"6\" fill=\"#D5DAE1\"/><rect x=\"484\" y=\"348\" width=\"84\" height=\"38\" rx=\"6\" fill=\"#D5DAE1\"/><polyline points=\"62,420 154,400 246,440 338,446 430,410 522,396\" fill=\"none\" stroke=\"#8A94A6\" stroke-width=\"8\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><path d=\"M522 360 L530 378 L550 380 L535 393 L540 412 L522 402 L504 412 L509 393 L494 380 L514 378 Z\" fill=\"#E2783B\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:32px\">\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng map\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 14 L22 8 L42 14 L58 8 V50 L42 56 L22 50 L6 56 Z\"/><line x1=\"22\" y1=\"8\" x2=\"22\" y2=\"50\"/><line x1=\"42\" y1=\"14\" x2=\"42\" y2=\"56\"/><\/g><\/svg><p>Hành trình 6 giai đoạn của persona<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng xmark\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"6\" y=\"6\" width=\"52\" height=\"52\" rx=\"10\"/><line x1=\"20\" y1=\"20\" x2=\"44\" y2=\"44\"/><line x1=\"44\" y1=\"20\" x2=\"20\" y2=\"44\"/><\/g><\/svg><p>Điểm đau, giải pháp, phòng ban<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng star\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M32 5 L39 22 L57 23 L43 35 L48 53 L32 43 L16 53 L21 35 L7 23 L25 22 Z\"/><\/g><\/svg><p>Điểm wow cần phát triển<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b2-31b", "label": "B2 · 35", "session": 2, "part": "s13", "title": "Triển lãm hành trình: Bốn nhóm trình bày bản đồ khách hàng", "activity": "4 nhóm · mỗi nhóm 4 phút", "points": ["Persona và điểm đáy cảm xúc", "Điểm đau, giải pháp, người sở hữu", "Một điểm wow"], "notes": "① MỞ\n\"Mỗi bản đồ trên tường là một doanh nghiệp được nhìn bằng mắt khách hàng. Mời anh chị đứng dậy – chúng ta đi một vòng triển lãm.\"\n\n② HƯỚNG DẪN (khoảng 20 phút)\nMỗi nhóm trình bày tối đa 4 phút ngay trước bản đồ của mình, cả lớp đứng xem; sau đó một câu hỏi từ lớp. Cấu trúc gợi ý:\n– Persona là ai và hành trình đi qua những giai đoạn nào; điểm đáy cảm xúc nằm ở đâu.\n– 2–3 điểm đau ưu tiên: giải pháp cụ thể và phòng ban phụ trách.\n– Một điểm wow cần phát triển – và khách hàng sẽ kể lại điều gì.\nThứ tự gợi ý: DigiNet, TechPharma, BizManage, Life Biz School. Nếu thời gian cho phép, mỗi học viên dùng một giấy note bình chọn \"giải pháp đáng làm nhất\" trên bản đồ của nhóm khác.\n\n③ TIÊU CHÍ PHẢN HỒI CỦA GIẢNG VIÊN\n– Hành trình có được vẽ cho một persona cụ thể, trong một tình huống cụ thể không?\n– Điểm đau được ưu tiên có dựa trên dữ liệu trong case và đường cảm xúc không?\n– Giải pháp có chạm tới nguyên nhân ở hậu trường, hay chỉ sửa triệu chứng ở tiền sảnh?\n– Hàng Team phụ trách có chỉ rõ người sở hữu những khoảng trống giữa các phòng ban không?\n– Điểm wow có khả thi và phù hợp với persona không?\n\n④ LIÊN HỆ\nKết nối với phần trình bày ba sáng kiến trước đó: các sáng kiến của nhóm nên xuất hiện trên bản đồ – ở đúng điểm đau hoặc điểm wow mà chúng giải quyết. Nếu một sáng kiến không gắn được vào bản đồ, cần xem lại nó đang phục vụ ai.\n\n★ CÂU CHỐT: \"Khi mỗi giải pháp đều có chỗ đứng trên hành trình của khách hàng và có một người chịu trách nhiệm, trải nghiệm bắt đầu được quản trị.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi gợi ý cho lớp: \"Nếu chỉ làm được một việc trên bản đồ này trong 90 ngày, nhóm chọn việc gì?\" \"Phòng ban nào sẽ phản đối giải pháp này, và vì sao?\"\nNếu lớp im lặng: giảng viên chỉ vào điểm đáy cảm xúc trên bản đồ và hỏi nhóm khác sẽ giải quyết thế nào.\n\n⑥ CHUYỂN Ý\n\"Cảm ơn bốn nhóm. Hãy cùng nhìn lại toàn bộ hành trình học tập của buổi hôm nay.\"", "html": "<section id=\"b2-31b\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:40px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Triển lãm hành trình: Bốn nhóm trình bày bản đồ khách hàng<\/h2>\n<p style=\"align-self:start; font-weight:700; color:#FFFFFF; background:#E2783B; padding:8px 36px; border-radius:999px\">4 nhóm · mỗi nhóm 4 phút<\/p>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg aria-label=\"Bốn bản đồ khổ lớn dán trên tường, một bản đồ viền cam, phía dưới là nhóm người đang xem\" width=\"580\" height=\"440\" viewBox=\"0 0 580 440\" style=\"width:580px; height:440px\"><rect x=\"20\" y=\"30\" width=\"120\" height=\"170\" rx=\"10\" fill=\"#FFFFFF\" stroke=\"#8A94A6\" stroke-width=\"8\"/><rect x=\"36\" y=\"56\" width=\"88\" height=\"14\" rx=\"7\" fill=\"#1E2533\"/><rect x=\"36\" y=\"90\" width=\"88\" height=\"12\" rx=\"6\" fill=\"#D5DAE1\"/><rect x=\"36\" y=\"118\" width=\"88\" height=\"12\" rx=\"6\" fill=\"#D5DAE1\"/><rect x=\"36\" y=\"146\" width=\"88\" height=\"12\" rx=\"6\" fill=\"#D5DAE1\"/><rect x=\"160\" y=\"30\" width=\"120\" height=\"170\" rx=\"10\" fill=\"#FFFFFF\" stroke=\"#E2783B\" stroke-width=\"8\"/><rect x=\"176\" y=\"56\" width=\"88\" height=\"14\" rx=\"7\" fill=\"#1E2533\"/><rect x=\"176\" y=\"90\" width=\"88\" height=\"12\" rx=\"6\" fill=\"#D5DAE1\"/><rect x=\"176\" y=\"118\" width=\"88\" height=\"12\" rx=\"6\" fill=\"#E2783B\"/><rect x=\"176\" y=\"146\" width=\"88\" height=\"12\" rx=\"6\" fill=\"#D5DAE1\"/><rect x=\"300\" y=\"30\" width=\"120\" height=\"170\" rx=\"10\" fill=\"#FFFFFF\" stroke=\"#8A94A6\" stroke-width=\"8\"/><rect x=\"316\" y=\"56\" width=\"88\" height=\"14\" rx=\"7\" fill=\"#1E2533\"/><rect x=\"316\" y=\"90\" width=\"88\" height=\"12\" rx=\"6\" fill=\"#D5DAE1\"/><rect x=\"316\" y=\"118\" width=\"88\" height=\"12\" rx=\"6\" fill=\"#D5DAE1\"/><rect x=\"316\" y=\"146\" width=\"88\" height=\"12\" rx=\"6\" fill=\"#D5DAE1\"/><rect x=\"440\" y=\"30\" width=\"120\" height=\"170\" rx=\"10\" fill=\"#FFFFFF\" stroke=\"#8A94A6\" stroke-width=\"8\"/><rect x=\"456\" y=\"56\" width=\"88\" height=\"14\" rx=\"7\" fill=\"#1E2533\"/><rect x=\"456\" y=\"90\" width=\"88\" height=\"12\" rx=\"6\" fill=\"#D5DAE1\"/><rect x=\"456\" y=\"118\" width=\"88\" height=\"12\" rx=\"6\" fill=\"#D5DAE1\"/><rect x=\"456\" y=\"146\" width=\"88\" height=\"12\" rx=\"6\" fill=\"#D5DAE1\"/><circle cx=\"150\" cy=\"290\" r=\"26\" fill=\"#1E2533\"/><path d=\"M112 380 Q150 316 188 380 Z\" fill=\"#1E2533\"/><circle cx=\"290\" cy=\"290\" r=\"26\" fill=\"#1E2533\"/><path d=\"M252 380 Q290 316 328 380 Z\" fill=\"#1E2533\"/><circle cx=\"430\" cy=\"290\" r=\"26\" fill=\"#1E2533\"/><path d=\"M392 380 Q430 316 468 380 Z\" fill=\"#1E2533\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:32px\">\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng map\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 14 L22 8 L42 14 L58 8 V50 L42 56 L22 50 L6 56 Z\"/><line x1=\"22\" y1=\"8\" x2=\"22\" y2=\"50\"/><line x1=\"42\" y1=\"14\" x2=\"42\" y2=\"56\"/><\/g><\/svg><p>Persona và điểm đáy cảm xúc<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng roots\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M32 4 V26\"/><path d=\"M22 12 H42\"/><path d=\"M32 26 L16 46 M32 26 L32 58 M32 26 L48 46 M24 36 L8 40 M40 36 L56 40\"/><\/g><\/svg><p>Điểm đau, giải pháp, người sở hữu<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng star\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M32 5 L39 22 L57 23 L43 35 L48 53 L32 43 L16 53 L21 35 L7 23 L25 22 Z\"/><\/g><\/svg><p>Một điểm wow<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b2-32", "label": "B2 · 36", "session": 2, "part": "s14", "title": "Bốn điều cần mang về từ Buổi 2", "activity": "", "points": ["01 Sửa hệ thống, không chỉ sửa triệu chứng", "02 Xóa điểm đau, rồi tạo điểm nhấn", "03 Đo để hành động, không để báo cáo", "04 CX bắt đầu từ lãnh đạo và nhân viên"], "notes": "① MỞ\n\"Tuần trước chúng ta đi bốn bậc thang của sự 'nhìn thấy'. Hôm nay chúng ta đi bốn bậc của sự 'hành động'. Nếu mỗi phần anh chị chỉ mang về một câu, đó là bốn câu trên màn hình.\"\n\n② GIẢNG – NHẮC LẠI TỪNG PHẦN\n01 – Vì sao trải nghiệm tệ vẫn lặp lại? Vì nguyên nhân nằm ở hậu trường và ở hệ thống do quản lý thiết kế: quy trình, KPI, phân quyền. Công cụ: bản thiết kế dịch vụ, hỏi \"vì sao\" tới tầng hệ thống, và lượng hóa chi phí của điểm đau.\n02 – Làm thế nào để thiết kế khoảnh khắc khách hàng ghi nhớ? Loại bỏ điểm đau và công sức không cần thiết trước; sau đó thiết kế có chủ đích một đỉnh cảm xúc và một kết thúc đẹp; và luôn chuẩn bị sẵn kịch bản phục hồi cùng quyền quyết định cho tuyến đầu.\n03 – Làm thế nào để đo lường và gắn với kết quả kinh doanh? Kết hợp chỉ số cảm nhận, hành vi và vận hành; khép vòng phản hồi để mỗi con số dẫn tới hành động; và nối trải nghiệm nhân viên, khách hàng với lợi nhuận.\n04 – Lãnh đạo cần làm gì? Chăm lo trải nghiệm của nhân viên, làm gương bằng hành vi, dẫn dắt theo lộ trình bắt đầu từ chiến thắng nhanh, và dùng công nghệ để khuếch đại sự thấu hiểu.\n\n③ MINH HỌA\nNối hai buổi thành một mạch: Buổi 1 – vì sao, ai, hiểu, nhìn. Buổi 2 – chẩn đoán, thiết kế, đo lường, dẫn dắt. Tám bậc thang này cũng chính là trình tự một doanh nghiệp có thể đi khi bắt đầu quản trị trải nghiệm khách hàng một cách bài bản.\n\n④ LIÊN HỆ\nNhắc lại những gì mỗi nhóm đã tạo ra trong hai buổi: một persona, một empathy map, một insight, một nguyên nhân gốc, một khoảnh khắc đáng nhớ, một kịch bản phục hồi, ba sáng kiến có chỉ số, và một bản đồ hành trình khổ A1 với điểm đau, giải pháp, người sở hữu và điểm wow. Đó là một bộ công cụ hoàn chỉnh mà anh chị có thể lặp lại với doanh nghiệp của mình.\n\n★ CÂU CHỐT: \"Hiểu đúng nguyên nhân, thiết kế có chủ đích, đo để hành động và dẫn dắt bằng làm gương – đó là quản trị trải nghiệm khách hàng.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Trong tám bậc thang của hai buổi, bậc nào doanh nghiệp anh chị cần bước tiếp theo?\" Mời ba đến bốn học viên trả lời nhanh.\nNếu lớp im lặng: đề nghị mỗi người viết con số của bậc đó lên trang \"Việc tôi sẽ làm\" từ đầu buổi.\nCâu trả lời có thể gặp: đa số chọn đo lường hoặc lãnh đạo → phản hồi: đó là những bậc đòi hỏi quyết định của chính anh chị, không thể giao cho người khác.\n\n⑥ CHUYỂN Ý\n\"Và nếu chỉ được mang về một thông điệp duy nhất từ cả học phần, tôi mong đó là câu sau.\"", "html": "<section id=\"b2-32\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Bốn điều cần mang về từ Buổi 2<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Bậc thang bốn nấc đi lên với bốn chấm tròn cam, xám nhạt, trắng và trắng\" width=\"448\" height=\"480\" viewBox=\"0 0 448 480\" style=\"width:448px; height:480px\"><g transform=\"scale(0.800)\"><path d=\"M20 580 H160 V430 H300 V280 H440 V130 H540\" fill=\"none\" stroke=\"#D5DAE1\" stroke-width=\"8\" stroke-linejoin=\"round\"/><circle cx=\"90\" cy=\"540\" r=\"32\" fill=\"#E2783B\"/><circle cx=\"230\" cy=\"390\" r=\"32\" fill=\"#8A94A6\"/><circle cx=\"370\" cy=\"240\" r=\"32\" fill=\"#1E2533\"/><circle cx=\"490\" cy=\"90\" r=\"32\" fill=\"#1E2533\"/><\/g><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:24px\">\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng roots\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M32 4 V26\"/><path d=\"M22 12 H42\"/><path d=\"M32 26 L16 46 M32 26 L32 58 M32 26 L48 46 M24 36 L8 40 M40 36 L56 40\"/><\/g><\/svg><p><b style=\"color:#E2783B\">01<\/b> Sửa hệ thống, không chỉ sửa triệu chứng<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng star\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M32 5 L39 22 L57 23 L43 35 L48 53 L32 43 L16 53 L21 35 L7 23 L25 22 Z\"/><\/g><\/svg><p><b>02<\/b> Xóa điểm đau, rồi tạo điểm nhấn<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng gauge\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 44 A26 26 0 0 1 58 44\"/><line x1=\"32\" y1=\"44\" x2=\"46\" y2=\"26\"/><circle cx=\"32\" cy=\"44\" r=\"4\" fill=\"#E2783B\" stroke=\"none\"/><line x1=\"12\" y1=\"54\" x2=\"52\" y2=\"54\"/><\/g><\/svg><p><b>03<\/b> Đo để hành động, không để báo cáo<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng flag\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"14\" y1=\"6\" x2=\"14\" y2=\"60\"/><path d=\"M14 8 H52 L44 20 L52 32 H14\"/><\/g><\/svg><p><b>04<\/b> CX bắt đầu từ lãnh đạo và nhân viên<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b2-33", "label": "B2 · 37", "session": 2, "part": "s14", "title": "Khách hàng trải nghiệm cả tổ chức, vì vậy CX là việc của người lãnh đạo", "activity": "", "points": [], "notes": "① MỞ\nDừng vài giây để câu thông điệp tự đứng trên màn hình. Sau đó nói chậm: \"Nếu hai buổi học chỉ để lại một câu, tôi mong đó là câu này.\"\n\n② GIẢNG\nNhắc lại thông điệp của Buổi 1: khách hàng ghi nhớ cảm nhận, không chỉ ghi nhớ sản phẩm. Buổi 2 trả lời câu hỏi: ai tạo ra cảm nhận đó? Câu trả lời là cả tổ chức. Khách hàng không trải nghiệm phòng chăm sóc khách hàng; họ trải nghiệm lời hứa của phòng bán hàng, lịch của đội kỹ thuật, chính sách giá của phòng tài chính, phần mềm của phòng công nghệ, thái độ của người giao hàng thuê ngoài. Nhìn lại bốn case: điểm đáy của DigiNet nằm giữa bán hàng và kỹ thuật; của TechPharma nằm giữa KPI tốc độ và sự an toàn; của BizManage nằm giữa người mua và người dùng; của Life Biz School nằm giữa tuyển sinh và đào tạo. Không phòng ban nào có thể tự sửa những điểm đó. Chỉ người lãnh đạo – người nhìn thấy toàn bộ tổ chức – mới có thể đặt ưu tiên, thiết kế lại KPI, phân bổ nguồn lực và chỉ định người sở hữu những khoảng trống giữa các phòng ban.\n\n③ MINH HỌA\nHình ảnh trên màn hình: bốn người đứng quanh một trái tim – mỗi người là một bộ phận, trái tim là khách hàng. Không ai trong bốn người đó sở hữu trái tim; tất cả cùng chịu trách nhiệm. Ví dụ Việt Nam về một quyết định của lãnh đạo: tháng 9/2016, Techcombank áp dụng miễn phí chuyển khoản trực tuyến (\"Zero Fee\") – xóa một điểm đau mà khách hàng gặp mỗi ngày. Tỷ lệ tiền gửi không kỳ hạn (CASA) của ngân hàng tăng từ khoảng 17% năm 2015 lên 24,1% cuối 2017 và đạt khoảng 50,5% năm 2021; khách hàng cá nhân mới tăng bình quân 23,5% mỗi năm giai đoạn 2016–2021. Kết quả đến từ nhiều yếu tố, nhưng khởi đầu là một quyết định chỉ cấp lãnh đạo mới đưa ra được, và sau đó cả ngành làm theo.\n\n④ LIÊN HỆ\nVới mỗi học viên – những CEO và nhà quản lý cấp cao – thông điệp này là một lời mời trực tiếp: đừng giao CX cho một phòng ban rồi chờ báo cáo. Hãy đưa khách hàng vào cuộc họp điều hành, vào KPI của các trưởng bộ phận, và vào lịch làm việc của chính mình.\n\n★ CÂU CHỐT: \"Khách hàng không nhìn thấy sơ đồ tổ chức của anh chị. Họ chỉ nhìn thấy một doanh nghiệp – và người lãnh đạo là người duy nhất chịu trách nhiệm cho toàn bộ doanh nghiệp đó.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Sau hai buổi học, anh chị sẽ thay đổi điều gì trong cách mình lãnh đạo – dù chỉ là một điều nhỏ?\"\nNếu lớp im lặng: đề nghị mỗi người viết một câu, giảng viên mời hai người đọc to.\nCâu trả lời có thể gặp: \"Tôi sẽ bắt đầu cuộc họp bằng một câu chuyện khách hàng\" → phản hồi: một thay đổi nhỏ nhưng nếu lặp lại mỗi tuần, nó sẽ thay đổi văn hóa.\n\n⑥ CHUYỂN Ý\n\"Để câu thông điệp này không chỉ nằm trên slide, tôi đề nghị ba hành động trong 30 ngày tới.\"", "html": "<section id=\"b2-33\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:56px\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Bốn người màu trắng đứng thành vòng tròn quanh một trái tim màu cam\" width=\"360\" height=\"380\" viewBox=\"0 0 360 380\" style=\"width:360px; height:380px\"><circle cx=\"180\" cy=\"36\" r=\"18\" fill=\"#1E2533\"/><path d=\"M155 91 Q180 50 205 91 Z\" fill=\"#1E2533\"/><circle cx=\"310\" cy=\"166\" r=\"18\" fill=\"#1E2533\"/><path d=\"M285 221 Q310 180 335 221 Z\" fill=\"#1E2533\"/><circle cx=\"180\" cy=\"296\" r=\"18\" fill=\"#1E2533\"/><path d=\"M155 351 Q180 310 205 351 Z\" fill=\"#1E2533\"/><circle cx=\"50\" cy=\"166\" r=\"18\" fill=\"#1E2533\"/><path d=\"M25 221 Q50 180 75 221 Z\" fill=\"#1E2533\"/><path d=\"M180 230 C 130 195, 125 155, 152 146 C 166 141, 180 150, 180 162 C 180 150, 194 141, 208 146 C 235 155, 230 195, 180 230 Z\" fill=\"#E2783B\"/><\/svg>\n<h1 style=\"font-size:96px; font-weight:800; line-height:1.15; color:#1E2533; text-align:center; width:1560px\">Khách hàng trải nghiệm cả tổ chức, vì vậy CX là việc của người lãnh đạo<\/h1>\n<\/section>"}, {"id": "b2-34", "label": "B2 · 38", "session": 2, "part": "s14", "title": "Ba hành động trong 30 ngày tới", "activity": "", "points": ["1. Chọn một hành trình và một người sở hữu", "2. Đưa một chỉ số CX vào họp điều hành", "3. Mỗi tháng nghe trực tiếp mười khách hàng"], "notes": "① MỞ\n\"Kiến thức của hai buổi học sẽ phai dần sau vài tuần – trừ khi nó biến thành hành động trong 30 ngày đầu tiên. Vì vậy tôi không giao bài tập, mà đề nghị ba cam kết.\"\n\n② GIẢNG – BA HÀNH ĐỘNG\nHành động 1 – Chọn một hành trình và một người sở hữu. Không phải cả doanh nghiệp, chỉ MỘT hành trình quan trọng – ví dụ hành trình của khách hàng mới trong 90 ngày đầu – và giao cho MỘT người chịu trách nhiệm toàn bộ hành trình đó, xuyên qua các phòng ban, với quyền hạn tương xứng. Đây là \"thắng nhanh\" của lộ trình.\nHành động 2 – Đưa một chỉ số CX vào cuộc họp điều hành. Chọn một chỉ số – có thể là tỷ lệ rời bỏ của khách mới, CES của một điểm chạm, hoặc tỷ lệ người phản đối được liên hệ lại trong 48 giờ – và đặt nó ở đầu chương trình họp mỗi tuần hoặc mỗi tháng, cùng với một câu chuyện khách hàng thật.\nHành động 3 – Mỗi tháng nghe trực tiếp mười khách hàng. Qua cuộc gọi tổng đài, phỏng vấn theo nguyên tắc Mom Test, gặp khách hàng đã rời bỏ. Mười cuộc trò chuyện mỗi tháng là khoảng hai giờ – ít hơn nhiều so với thời gian dành cho một cuộc họp nội bộ – nhưng thường mang lại nhiều nhận thức hơn.\n\n③ MINH HỌA\nGợi ý mỗi học viên viết ba hành động này lên trang \"Việc tôi sẽ làm\" đã mở từ đầu buổi, kèm tên hành trình, tên người sở hữu và tên chỉ số cụ thể. Có thể đề nghị học viên chụp lại và gửi cho một bạn cùng lớp để hai người nhắc nhau sau 30 ngày. Gợi ý kênh theo dõi: lập một nhóm Zalo hoặc email của lớp; sau 30 ngày, giảng viên gửi một câu hỏi ngắn \"Anh chị đã làm được hành động nào, kết quả ra sao?\" và mời ba học viên chia sẻ.\n\n④ LIÊN HỆ\nBa hành động này tương ứng với ba vai trò chỉ người lãnh đạo mới làm được: phân bổ trách nhiệm, đặt ưu tiên trong hệ thống quản trị, và làm gương bằng hành vi của chính mình.\n\n★ CÂU CHỐT: \"Quản trị trải nghiệm khách hàng không bắt đầu bằng một dự án lớn, mà bằng lần đầu tiên người lãnh đạo ngồi xuống và lắng nghe khách hàng.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Ai sẵn sàng chia sẻ trước lớp hành trình mình sẽ chọn và người mình sẽ giao?\" Mời hai đến ba học viên.\nNếu lớp im lặng: giảng viên chia sẻ cam kết của chính mình như một ví dụ – chẳng hạn: \"Trong 30 ngày tới, tôi sẽ gọi cho mười học viên của các khóa trước để hỏi điều gì họ thực sự áp dụng được, và điều chỉnh học phần này theo đó.\"\nCâu trả lời có thể gặp: \"Tôi sẽ chọn hành trình khiếu nại, giao cho giám đốc vận hành\" → phản hồi: tốt; hãy chắc chắn người đó có quyền điều phối cả các phòng ban khác trong hành trình.\n\n⑥ KẾT THÚC HỌC PHẦN\nCảm ơn lớp và các nhóm. Nhắc lại hình ảnh con đường ở slide đầu tiên của hai buổi: hành trình khách hàng không có điểm kết thúc, và hành trình quản trị trải nghiệm cũng vậy. Mời học viên điền phản hồi về học phần nếu chương trình có yêu cầu. \"Chúc anh chị có những khách hàng nhớ đến doanh nghiệp mình bằng những cảm nhận tốt đẹp nhất.\"", "html": "<section id=\"b2-34\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Ba hành động trong 30 ngày tới<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Tờ lịch màu trắng với ba dấu tích: cam, xám nhạt và trắng, và một lá cờ đích nhỏ\" width=\"480\" height=\"500\" viewBox=\"0 0 480 500\" style=\"width:480px; height:500px\"><rect x=\"20\" y=\"50\" width=\"440\" height=\"430\" rx=\"24\" fill=\"#FFFFFF\" stroke=\"#1E2533\" stroke-width=\"8\"/><rect x=\"20\" y=\"50\" width=\"440\" height=\"90\" rx=\"24\" fill=\"#1E2533\"/><rect x=\"100\" y=\"20\" width=\"22\" height=\"70\" rx=\"10\" fill=\"#8A94A6\"/><rect x=\"358\" y=\"20\" width=\"22\" height=\"70\" rx=\"10\" fill=\"#8A94A6\"/><path d=\"M70 225 L105 260 L165 190\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"16\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"200\" y=\"210\" widt :72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 10 H56 V42 H30 L18 54 V42 H8 Z\"/><circle cx=\"21\" cy=\"26\" r=\"3\" fill=\"#E2783B\" stroke=\"none\"/><circle cx=\"32\" cy=\"26\" r=\"3\" fill=\"#E2783B\" stroke=\"none\"/><circle cx=\"43\" cy=\"26\" r=\"3\" fill=\"#E2783B\" stroke=\"none\"/><\/g><\/svg><p><b>3.<\/b> Mỗi tháng nghe trực tiếp mười khách hàng<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}]}</script>
