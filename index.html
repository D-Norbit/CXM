ứu về công sức của khách hàng ở đầu buổi.\n– Thiết kế có chủ đích một đỉnh cảm xúc và một kết thúc đẹp, dựa trên quy luật Peak-End.\n– Bốn yếu tố làm nên một khoảnh khắc đáng nhớ.\n– Và một sự thật không tránh được: sự cố sẽ xảy ra. Vì vậy doanh nghiệp cần thiết kế sẵn cách phục hồi, và trao quyền cho tuyến đầu để thực hiện nó.\nPhần này kết thúc bằng hoạt động nhóm 15 phút: thiết kế một khoảnh khắc đáng nhớ và một kịch bản phục hồi cho case của nhóm. Sau đó chúng ta nghỉ giải lao.\n\n③ MINH HỌA\nHãy nghĩ về một thương hiệu mà anh chị sẵn sàng giới thiệu cho bạn bè. Thường lý do không phải là \"mọi thứ đều ổn\", mà là một khoảnh khắc cụ thể: một nhân viên nhớ tên, một lời hỏi thăm đúng lúc, một sự cố được xử lý nhanh hơn mình tưởng. Những khoảnh khắc đó hiếm khi xảy ra ngẫu nhiên ở những doanh nghiệp làm CX tốt – chúng được thiết kế.\n\n④ LIÊN HỆ\nVới nhà quản lý, thiết kế trải nghiệm không phải là việc trang trí. Nó là việc phân bổ nguồn lực có chủ đích: tập trung vào vài khoảnh khắc có sức nặng cảm xúc lớn nhất, thay vì dàn trải đều cho mọi điểm chạm. Một doanh nghiệp không cần xuất sắc ở mọi điểm chạm – nhưng cần không thất bại ở những điểm quan trọng, và cần nổi bật ở một vài điểm có chủ đích.\n\n★ CÂU CHỐT: \"Sửa điểm đau giúp khách hàng không rời đi. Khoảnh khắc đáng nhớ giúp khách hàng kể về chúng ta.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Doanh nghiệp anh chị có khoảnh khắc nào được thiết kế có chủ đích để khách hàng ghi nhớ không – hay mọi khoảnh khắc đáng nhớ đều nhờ một nhân viên tự làm?\"\nNếu lớp im lặng: hỏi giơ tay – \"có thiết kế\", \"nhờ nhân viên\", \"chưa có\".\nCâu trả lời có thể gặp: \"Có một vài nhân viên rất giỏi làm khách vui\" → phản hồi: đó là tài sản quý, nhưng chưa phải năng lực của tổ chức; câu hỏi là làm sao biến điều đó thành cách làm chung.\n\n⑥ CHUYỂN Ý\n\"Bắt đầu với thứ tự ưu tiên – vì đây là chỗ nhiều doanh nghiệp làm ngược.\"", "html": "<section id=\"b2-11\" data-transition=\"push\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; justify-content:center; gap:24px\">\n<div style=\"display:flex; flex-direction:row; align-items:center; justify-content:space-between\"><p style=\"font-size:280px; font-weight:800; line-height:1; color:#E2783B\">02<\/p><svg aria-label=\"Ngôi sao trên đường cảm xúc\" width=\"320\" height=\"320\" viewBox=\"0 0 320 320\" style=\"width:320px; height:320px\"><g transform=\"scale(5)\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 50 C 16 50, 20 40, 32 40 S 48 54, 60 46\"/><path d=\"M32 6 L37 18 L50 18 L40 26 L44 38 L32 30 L20 38 L24 26 L14 18 L27 18 Z\" stroke=\"#E2783B\"/><\/g><\/svg><\/div>\n<h1 style=\"font-size:88px; font-weight:700; line-height:1.15; color:#1E2533\">Làm thế nào để thiết kế những khoảnh khắc khách hàng ghi nhớ?<\/h1>\n<\/section>"}, {"id": "b2-12", "label": "B2 · 12", "session": 2, "part": "s10", "title": "Loại bỏ điểm đau trước, tạo điểm nhấn sau", "activity": "", "points": ["Điểm đau · làm khách rời đi", "Điểm nhấn · làm khách kể lại", "Grab: thấy tài xế trên bản đồ, nỗi lo chờ đợi biến mất"], "notes": "① MỞ\n\"Một khách sạn tặng khách giỏ trái cây chào mừng rất đẹp – nhưng thủ tục nhận phòng mất bốn mươi phút. Anh chị nghĩ khách sẽ nhớ giỏ trái cây, hay bốn mươi phút?\"\n\n② GIẢNG\nMô hình Kano, do giáo sư Noriaki Kano đề xuất năm 1984, phân biệt ba loại thuộc tính. Thuộc tính cơ bản: khách mặc định phải có; có thì không ai khen, thiếu thì khách rất bất mãn – như sự an toàn, sự chính xác, lời hứa được giữ. Thuộc tính hiệu năng: càng tốt khách càng hài lòng – như tốc độ, giá. Thuộc tính gây thích thú: khách không kỳ vọng, nên có thì bất ngờ vui, không có cũng không phàn nàn. Bài học quản trị: điểm nhấn gây thích thú không bù đắp được cho một thuộc tính cơ bản bị hỏng. Kết hợp với nghiên cứu của Dixon và cộng sự ở đầu buổi: thứ tự đúng là trước tiên loại bỏ những điểm đau và công sức không cần thiết – \"lấp ổ gà\" – rồi mới đặt ngôi sao ở cuối con đường. Và theo thời gian, điều hôm nay gây thích thú sẽ trở thành điều cơ bản ngày mai.\n\n③ MINH HỌA\nGrab là ví dụ quen thuộc với khách hàng Việt Nam. Trước đây, khi gọi taxi, nỗi lo lớn nhất là không biết xe có đến không, bao giờ đến, giá bao nhiêu. Việc hiển thị vị trí tài xế theo thời gian thực và giá trước chuyến không phải là một \"điểm nhấn\" hào nhoáng – nó xóa đi một điểm đau cơ bản. Ngày nay, tính năng này đã trở thành kỳ vọng mặc định. Quay lại case TechPharma: một chương trình tích điểm hấp dẫn sẽ vô nghĩa với chị Mai nếu đơn thuốc cho con vẫn có thể bị giao nhầm lúc nửa đêm. Độ chính xác của đơn thuốc là thuộc tính cơ bản; tư vấn dược sĩ tận tâm mới là cơ hội tạo điểm nhấn.\n\n④ LIÊN HỆ\nVới nhà quản lý, đây là một nguyên tắc phân bổ ngân sách: trước khi phê duyệt một chương trình \"làm khách hàng bất ngờ\", hãy hỏi – những điểm đau lớn nhất trên bản đồ hành trình đã được xử lý chưa? Nếu chưa, khoản chi cho điểm nhấn có thể chỉ khiến khách hàng thấy doanh nghiệp đặt ưu tiên sai chỗ.\n\n★ CÂU CHỐT: \"Không một điểm nhấn nào bù đắp được cho một lời hứa cơ bản bị phá vỡ.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Doanh nghiệp anh chị có đang đầu tư vào một 'giỏ trái cây' trong khi khách hàng vẫn phải chờ 'bốn mươi phút' ở đâu đó không?\"\nNếu lớp im lặng: gợi ý – chương trình khách hàng thân thiết trong khi tổng đài quá tải; ứng dụng đẹp trong khi giao hàng trễ.\nCâu trả lời có thể gặp: \"Chúng tôi vừa làm lại nhận diện thương hiệu trong khi khiếu nại tăng\" → phản hồi: thương hiệu là lời hứa; trải nghiệm là việc giữ lời hứa đó.\n\n⑥ CHUYỂN Ý\n\"Khi nền móng đã vững, chúng ta đặt điểm nhấn ở đâu? Tâm lý học cho một câu trả lời rất cụ thể.\"", "html": "<section id=\"b2-12\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Loại bỏ điểm đau trước, tạo điểm nhấn sau<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Mặt đường xám có hai ổ gà được lấp xám tối nhạt, phía trên cuối con đường là một ngôi sao màu cam\" width=\"640\" height=\"480\" viewBox=\"0 0 640 480\" style=\"width:640px; height:480px\"><rect x=\"10\" y=\"330\" width=\"620\" height=\"60\" rx=\"10\" fill=\"#D5DAE1\"/><path d=\"M110 330 Q160 400 210 330 Z\" fill=\"#8A94A6\"/><path d=\"M300 330 Q350 400 400 330 Z\" fill=\"#8A94A6\"/><line x1=\"20\" y1=\"430\" x2=\"620\" y2=\"430\" stroke=\"#1E2533\" stroke-width=\"8\" stroke-linecap=\"round\"/><path d=\"M540 60 L558 110 L610 110 L568 142 L584 192 L540 162 L496 192 L512 142 L470 110 L522 110 Z\" fill=\"#E2783B\"/><line x1=\"540\" y1=\"200\" x2=\"540\" y2=\"320\" stroke=\"#D5DAE1\" stroke-width=\"8\" stroke-dasharray=\"10 10\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:40px\">\n<p><b>Điểm đau<\/b> · làm khách rời đi<\/p>\n<p><b style=\"color:#E2783B\">Điểm nhấn<\/b> · làm khách kể lại<\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng xe\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 42 V32 L15 18 H49 L58 32 V42 Z\"/><circle cx=\"19\" cy=\"46\" r=\"5\"/><circle cx=\"45\" cy=\"46\" r=\"5\"/><\/g><\/svg><p style=\"color:#5B6577\">Grab: thấy tài xế trên bản đồ, nỗi lo chờ đợi biến mất<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b2-13", "label": "B2 · 13", "session": 2, "part": "s10", "title": "Thiết kế có chủ đích một đỉnh cảm xúc và một kết thúc đẹp", "activity": "", "points": ["Đỉnh · một khoảnh khắc vượt trội", "Kết thúc · dấu ấn cuối cùng", "Life Biz School: cựu học viên chào đón trong \"vùng chết\""], "notes": "① MỞ\n\"Nhớ lại lần gần nhất anh chị đi khám bệnh. Anh chị nhớ gì nhất? Tôi đoán không phải là trung bình của bốn mươi phút ngồi chờ, mà là câu nói của bác sĩ – và cảm giác lúc bước ra về.\"\n\n② GIẢNG\nTuần trước chúng ta đã nói về quy luật Peak-End của Daniel Kahneman: con người đánh giá một trải nghiệm chủ yếu dựa trên khoảnh khắc cường độ cao nhất và khoảnh khắc kết thúc. Một nghiên cứu nổi tiếng của Redelmeier và Kahneman (1996) với bệnh nhân nội soi đại tràng cho thấy ký ức về cơn đau gắn chặt với mức đau cao nhất và mức đau ở cuối, hơn là với độ dài của thủ thuật. Hôm nay, chúng ta dùng quy luật này như một công cụ thiết kế. Ba câu hỏi. Một: trong hành trình, đâu là khoảnh khắc có sức nặng cảm xúc lớn nhất – thường là lần đầu, lúc lo lắng, hoặc lúc đạt được mục tiêu? Hãy đầu tư để biến nó thành một đỉnh. Hai: hành trình kết thúc ở đâu và kết thúc thế nào? Rất nhiều doanh nghiệp kết thúc bằng một hóa đơn hoặc một email tự động. Ba: điểm đáy nào cần được \"lấp\" để không trở thành ký ức nổi bật nhất?\n\n③ MINH HỌA\nCase Life Biz School có sẵn một điểm đáy lớn: \"vùng chết\" bốn đến tám tuần sau khi đóng học phí, nơi 23% học viên hối tiếc. Một hướng thiết kế: biến khoảng thời gian này thành một đỉnh nhỏ – ví dụ, trong 48 giờ sau khi đóng học phí, học viên nhận một lời chào bằng video từ một cựu học viên có hoàn cảnh giống mình, được giới thiệu với bạn đồng hành cùng khóa, và nhận một lộ trình chuẩn bị cho tuần đầu tiên. Và thiết kế lại phần kết: lễ tốt nghiệp đã là một đỉnh, nhưng ngay sau đó 40% cựu học viên cảm thấy \"bị bỏ rơi\". Một kết thúc tốt hơn có thể là lời mời trở thành người hướng dẫn cho khóa sau – vừa ghi nhận thành tựu, vừa giữ kết nối. Đây là các ý tưởng minh họa để nhóm Life Biz School tham khảo và phát triển.\n\n④ LIÊN HỆ\nNhà quản lý nên yêu cầu đội ngũ chỉ ra trên bản đồ hành trình: đỉnh của chúng ta ở đâu, và kết thúc của chúng ta trông như thế nào. Nếu đội ngũ không chỉ ra được, nghĩa là cả hai đang được để cho ngẫu nhiên.\n\n★ CÂU CHỐT: \"Đừng để đỉnh cảm xúc và phần kết cho ngẫu nhiên – đó là hai điều khách hàng sẽ mang về.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Hành trình của khách hàng anh chị đang kết thúc bằng điều gì? Một hóa đơn, một email tự động, hay một khoảnh khắc được thiết kế?\"\nNếu lớp im lặng: gợi ý các ngành – bàn giao căn hộ, tất toán khoản vay, trả xe sau bảo dưỡng.\nCâu trả lời có thể gặp: \"Khách tất toán khoản vay và không ai nói gì\" → phản hồi: đó là lúc khách vừa hoàn thành một mục tiêu tài chính lớn – một cơ hội tuyệt vời để chúc mừng và mời họ quay lại.\n\n⑥ CHUYỂN Ý\n\"Vậy một khoảnh khắc đáng nhớ được tạo thành từ những yếu tố nào?\"", "html": "<section id=\"b2-13\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Thiết kế có chủ đích một đỉnh cảm xúc và một kết thúc đẹp<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Đường trải nghiệm xám tối với một đỉnh cao màu cam ở giữa và điểm kết thúc màu trắng được nâng lên\" width=\"680\" height=\"460\" viewBox=\"0 0 680 460\" style=\"width:680px; height:460px\"><line x1=\"20\" y1=\"300\" x2=\"660\" y2=\"300\" stroke=\"#D5DAE1\" stroke-width=\"8\" stroke-dasharray=\"18 12\"/><path d=\"M30 300 C 90 280, 130 320, 190 290 C 240 265, 270 80, 320 80 C 370 80, 390 280, 450 290 C 510 300, 560 250, 640 170\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"8\" stroke-linecap=\"round\"/><circle cx=\"320\" cy=\"80\" r=\"30\" fill=\"#E2783B\"/><circle cx=\"640\" cy=\"170\" r=\"30\" fill=\"#1E2533\"/><rect x=\"290\" y=\"330\" width=\"60\" height=\"100\" rx=\"10\" fill=\"#E2783B\"/><rect x=\"610\" y=\"330\" width=\"60\" height=\"100\" rx=\"10\" fill=\"#1E2533\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:40px\">\n<p><b style=\"color:#E2783B\">Đỉnh<\/b> · một khoảnh khắc vượt trội<\/p>\n<p><b>Kết thúc<\/b> · dấu ấn cuối cùng<\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng mũ tốt nghiệp – case Life Biz School\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 24 L32 12 L60 24 L32 36 Z\"/><path d=\"M16 30 V42 C 24 50, 40 50, 48 42 V30\"/><line x1=\"56\" y1=\"26\" x2=\"56\" y2=\"42\"/><\/g><\/svg><p style=\"color:#5B6577\">Life Biz School: cựu học viên chào đón trong \"vùng chết\"<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b2-14", "label": "B2 · 14", "session": 2, "part": "s10", "title": "Bốn yếu tố tạo nên một khoảnh khắc đáng nhớ", "activity": "", "points": ["Thăng hoa · Vỡ lẽ", "Tự hào · Kết nối", "BizManage: kế toán trưởng dẫn dắt chuyển đổi số"], "notes": "① MỞ\n\"Anh chị hãy nhớ lại một khoảnh khắc trong sự nghiệp mà anh chị vẫn nhớ rõ sau mười năm. Điều gì khiến nó khác những ngày làm việc bình thường?\"\n\n② GIẢNG\nChip Heath và Dan Heath, trong cuốn \"The Power of Moments\" (2017), đề xuất bốn yếu tố tạo nên khoảnh khắc đáng nhớ. Một khoảnh khắc chỉ cần một vài yếu tố, không cần đủ cả bốn. Thăng hoa (Elevation): vượt ra khỏi thường nhật – có yếu tố bất ngờ, có nghi thức, có cảm giác \"đây là dịp đặc biệt\". Vỡ lẽ (Insight): khách hàng nhận ra một điều mới về bản thân hoặc về vấn đề của mình. Tự hào (Pride): khoảnh khắc ghi nhận thành tựu, cột mốc, sự tiến bộ. Kết nối (Connection): cảm giác được gắn bó với người khác, được thuộc về một cộng đồng. Với CX, điều quan trọng là: phần lớn các điểm chạm của doanh nghiệp là \"thường nhật\" – thanh toán, gửi hóa đơn, cập nhật. Chỉ cần biến một vài điểm trong số đó thành khoảnh khắc có một trong bốn yếu tố trên, ký ức của khách hàng sẽ khác đi.\n\n③ MINH HỌA\nQuay lại case BizManage. Điểm đáy là người dùng cuối – như chị Nga, kế toán trưởng 15 năm kinh nghiệm – cảm thấy bị áp đặt và sợ trở thành \"người mới bắt đầu\". Hãy thử áp dụng bốn yếu tố. Tự hào: thay vì coi chị Nga là người phải học, mời chị trở thành \"người dẫn dắt chuyển đổi số\" của phòng kế toán, và ghi nhận công khai khi phòng hoàn thành kỳ quyết toán đầu tiên trên hệ thống mới. Vỡ lẽ: cho chị thấy báo cáo mà trước đây mất ba ngày giờ chỉ mất ba phút. Kết nối: đưa chị vào cộng đồng kế toán trưởng đang dùng BizManage. Thăng hoa: một buổi \"go-live\" có nghi thức, với sự có mặt của CEO Khoa. Đây là các ý tưởng minh họa – nhóm BizManage có thể dùng làm điểm xuất phát.\n\n④ LIÊN HỆ\nVới nhà quản lý, bốn yếu tố này cũng áp dụng cho nhân viên: một ngày làm việc đầu tiên đáng nhớ, một lễ ghi nhận thành tích, một buổi gặp khách hàng thật. Chúng ta sẽ quay lại trải nghiệm nhân viên ở Phần 4.\n\n★ CÂU CHỐT: \"Khách hàng không nhớ những ngày bình thường. Họ nhớ những khoảnh khắc khiến họ thấy mình được nâng lên, được hiểu, được ghi nhận và được kết nối.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Khách hàng của anh chị có cột mốc nào đáng được chúc mừng mà doanh nghiệp đang bỏ qua?\"\nNếu lớp im lặng: gợi ý – năm đầu tiên sử dụng dịch vụ, lần đầu đạt một mục tiêu, lần tất toán khoản vay, ngày nhận nhà.\nCâu trả lời có thể gặp: \"Khách hàng tròn một năm dùng dịch vụ nhưng chỉ nhận được hóa đơn gia hạn\" → phản hồi: một cột mốc tự hào đang bị biến thành một lời nhắc thanh toán.\n\n⑥ CHUYỂN Ý\n\"Đó là khi mọi việc suôn sẻ. Nhưng điều gì xảy ra khi có sự cố?\"", "html": "<section id=\"b2-14\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Bốn yếu tố tạo nên một khoảnh khắc đáng nhớ<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Bốn ô vuông bo góc xếp hai hàng: mũi tên đi lên màu cam, bóng đèn xám nhạt, huy chương trắng, hai vòng tròn nối nhau trắng\" width=\"560\" height=\"520\" viewBox=\"0 0 560 520\" style=\"width:560px; height:520px\"><rect x=\"10\" y=\"10\" width=\"255\" height=\"240\" rx=\"24\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"8\"/><path d=\"M137 60 L197 130 L162 130 L162 200 L112 200 L112 130 L77 130 Z\" fill=\"#E2783B\"/><rect x=\"295\" y=\"10\" width=\"255\" height=\"240\" rx=\"24\" fill=\"none\" stroke=\"#8A94A6\" stroke-width=\"8\"/><circle cx=\"422\" cy=\"110\" r=\"52\" fill=\"#8A94A6\"/><rect x=\"400\" y=\"168\" width=\"44\" height=\"36\" rx=\"8\" fill=\"#8A94A6\"/><rect x=\"10\" y=\"270\" width=\"255\" height=\"240\" rx=\"24\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"8\"/><path d=\"M105 290 L137 350 L169 290\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"14\"/><circle cx=\"137\" cy=\"405\" r=\"58\" fill=\"#1E2533\"/><rect x=\"295\" y=\"270\" width=\"255\" height=\"240\" rx=\"24\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"8\"/><circle cx=\"390\" cy=\"390\" r=\"50\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"14\"/><circle cx=\"455\" cy=\"390\" r=\"50\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"14\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:40px\">\n<p><b style=\"color:#E2783B\">Thăng hoa<\/b> · <b>Vỡ lẽ<\/b><\/p>\n<p><b>Tự hào<\/b> · <b>Kết nối<\/b><\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng màn hình phần mềm – case BizManage\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"6\" y=\"8\" width=\"52\" height=\"36\" rx=\"5\"/><line x1=\"22\" y1=\"56\" x2=\"42\" y2=\"56\"/><line x1=\"32\" y1=\"44\" x2=\"32\" y2=\"56\"/><line x1=\"20\" y1=\"36\" x2=\"20\" y2=\"28\"/><line x1=\"32\" y1=\"36\" x2=\"32\" y2=\"18\"/><line x1=\"44\" y1=\"36\" x2=\"44\" y2=\"24\"/><\/g><\/svg><p style=\"color:#5B6577\">BizManage: kế toán trưởng dẫn dắt chuyển đổi số<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b2-15", "label": "B2 · 15", "session": 2, "part": "s10", "title": "Một sự cố được xử lý tốt có thể củng cố niềm tin", "activity": "", "points": ["Sự cố · điều không tránh khỏi", "Phục hồi · điều có thể thiết kế", "TechPharma: dược sĩ trực đêm gọi lại trong 15 phút"], "notes": "① MỞ\n\"Hãy nghĩ về một thương hiệu mà anh chị trung thành nhất. Có bao giờ họ mắc lỗi với anh chị chưa? Và điều gì đã khiến anh chị ở lại?\"\n\n② GIẢNG\nNăm 1992, McCollough và Bharadwaj đặt tên cho một hiện tượng được quan sát nhiều lần: \"nghịch lý phục hồi dịch vụ\" – khách hàng gặp sự cố và được xử lý xuất sắc đôi khi đánh giá doanh nghiệp cao hơn cả khách hàng chưa từng gặp sự cố. Cần nói rõ với lớp: đây không phải là quy luật luôn đúng. Một phân tích tổng hợp của de Matos và cộng sự (2007) cho thấy hiệu ứng này có với mức độ hài lòng, nhưng không rõ ràng với ý định mua lại hay lòng trung thành. Nghịch lý cũng chỉ xuất hiện khi sự cố không quá nghiêm trọng, không lặp lại, và khách hàng thấy nguyên nhân không phải do doanh nghiệp cẩu thả. Vì vậy bài học đúng không phải là \"cứ để lỗi xảy ra rồi sửa cho đẹp\", mà là: sự cố chắc chắn sẽ xảy ra, và cách doanh nghiệp phản ứng trong vài giờ đầu quyết định khách hàng nhớ sự cố hay nhớ sự tận tâm.\n\n③ MINH HỌA\nQuay lại chị Mai trong case TechPharma. Hãy hình dung hai kịch bản. Kịch bản thực tế: 2 giờ sáng, gọi hotline, ngoài giờ làm việc; chị xóa ứng dụng và kể lại trong cộng đồng 5.000 bà mẹ. Kịch bản thiết kế lại: ứng dụng có nút \"Báo sai thuốc – khẩn cấp\" kết nối với dược sĩ trực đêm; dược sĩ gọi lại trong 15 phút, hướng dẫn chị không cho con dùng thuốc viên, và giao đúng siro ngay trong đêm; sáng hôm sau, dược sĩ gọi hỏi thăm tình trạng của bé. Trong kịch bản thứ hai, câu chuyện chị Mai kể trong cộng đồng có thể là: \"Họ có nhầm, nhưng nửa đêm vẫn có người lo cho con mình.\" Chi phí của một dược sĩ trực đêm cần được đặt cạnh chi phí của một làn sóng truyền miệng tiêu cực.\n\n④ LIÊN HỆ\nNhà quản lý nên hỏi: với năm sự cố phổ biến nhất, doanh nghiệp đã có kịch bản phục hồi chưa? Ai được quyền quyết định? Và phải mất bao lâu để khách hàng nhận được phản hồi đầu tiên?\n\n★ CÂU CHỐT: \"Sự cố cho khách hàng thấy sản phẩm của chúng ta. Cách phục hồi cho khách hàng thấy con người của chúng ta.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Anh chị có nhớ một lần doanh nghiệp của mình xử lý sự cố tốt đến mức khách hàng trở nên gắn bó hơn không? Điều gì đã làm nên khác biệt?\"\nNếu lớp im lặng: kể câu chuyện \"Joshie the Giraffe\". Mùa hè 2012, một cậu bé bỏ quên chú hươu cao cổ nhồi bông tên Joshie tại khách sạn Ritz-Carlton Amelia Island (Florida). Để con ngủ được, người cha nói Joshie \"ở lại nghỉ thêm vài ngày\". Nhân viên tìm thấy Joshie trong đồ giặt, gửi trả kèm một tập ảnh Joshie nằm bên hồ bơi, đi spa, lái xe golf. Người cha, Chris Hurn, kể lại trên Huffington Post và câu chuyện lan ra nhiều nước. Một sự cố nhỏ – bỏ quên đồ – trở thành câu chuyện thương hiệu.\nCâu trả lời có thể gặp: \"Nhân viên tự bỏ tiền túi giải quyết cho khách\" → phản hồi: một hành động đáng trân trọng, nhưng cũng cho thấy hệ thống chưa trao quyền – đó là chủ đề của slide tiếp theo.\n\n⑥ CHUYỂN Ý\n\"Phục hồi tốt không thể dựa vào may mắn hay lòng tốt cá nhân. Nó cần được thiết kế trước.\"", "html": "<section id=\"b2-15\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Một sự cố được xử lý tốt có thể củng cố niềm tin<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Đường xám tối nhạt đi ngang, rơi xuống điểm sự cố màu cam, rồi đi lên vượt trên mức ban đầu tới điểm trắng\" width=\"600\" height=\"406\" viewBox=\"0 0 600 406\" style=\"width:600px; height:406px\"><g transform=\"scale(0.88)\"><line x1=\"20\" y1=\"200\" x2=\"660\" y2=\"200\" stroke=\"#D5DAE1\" stroke-width=\"8\" stroke-dasharray=\"18 12\"/><path d=\"M30 200 L230 200 C 270 200, 280 380, 320 380 C 380 380, 420 150, 480 130 L650 110\" fill=\"none\" stroke=\"#8A94A6\" stroke-width=\"8\" stroke-linecap=\"round\"/><circle cx=\"320\" cy=\"380\" r=\"26\" fill=\"#E2783B\"/><circle cx=\"650\" cy=\"110\" r=\"26\" fill=\"#1E2533\"/><\/g><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:40px\">\n<p><b style=\"color:#E2783B\">Sự cố<\/b> · điều không tránh khỏi<\/p>\n<p><b>Phục hồi<\/b> · điều có thể thiết kế<\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng viên thuốc – case TechPharma\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><g transform=\"rotate(-40 32 32)\"><rect x=\"6\" y=\"21\" width=\"52\" height=\"22\" rx=\"11\"/><line x1=\"32\" y1=\"21\" x2=\"32\" y2=\"43\"/><\/g><\/g><\/svg><p style=\"color:#5B6577\">TechPharma: dược sĩ trực đêm gọi lại trong 15 phút<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b2-16", "label": "B2 · 16", "session": 2, "part": "s10", "title": "Kịch bản phục hồi cần được thiết kế trước khi sự cố xảy ra", "activity": "", "points": ["Nghe · Xin lỗi · Giải quyết · Bù đắp · Theo dõi", "Trao quyền cho tuyến đầu", "Ritz-Carlton: nhân viên tự quyết tới 2.000 USD cho mỗi khách"], "notes": "① MỞ\n\"Khi khách hàng gặp sự cố, câu nói khiến họ bực bội nhất là gì?\" Để lớp trả lời. Thường sẽ là: \"Để em báo lại cấp trên\" – hoặc \"Việc này không thuộc bộ phận em.\"\n\n② GIẢNG\nMột kịch bản phục hồi tốt thường gồm năm bước. Một, lắng nghe: để khách hàng nói hết, không ngắt lời, không phòng thủ. Hai, xin lỗi chân thành: xin lỗi về trải nghiệm của khách, không cần chờ xác định lỗi của ai. Ba, giải quyết: khắc phục vấn đề nhanh nhất có thể, lý tưởng là ngay trong lần tiếp xúc đầu tiên. Bốn, bù đắp tương xứng: không phải lúc nào cũng là tiền; đôi khi là thời gian, là sự ưu tiên, là một cử chỉ thể hiện doanh nghiệp hiểu điều khách đã mất. Năm, theo dõi: liên hệ lại sau đó để chắc chắn vấn đề đã được giải quyết – và đưa thông tin về để sửa nguyên nhân gốc, nối lại với Phần 1. Nhưng kịch bản chỉ có tác dụng khi người đứng trước khách hàng có quyền thực hiện nó. Nếu mỗi bước đều cần xin phê duyệt, thời gian phục hồi sẽ kéo dài, và khách hàng sẽ nhớ sự chờ đợi.\n\n③ MINH HỌA\nRitz-Carlton thường được nhắc tới như một ví dụ kinh điển: nhân viên được trao quyền chi tới 2.000 USD cho mỗi khách, mỗi sự cố, để giải quyết vấn đề mà không cần xin phép cấp trên. Theo chia sẻ từ chính Ritz-Carlton, con số này hiếm khi được dùng hết; giá trị của nó nằm ở thông điệp: \"Chúng tôi tin anh chị sẽ làm điều đúng cho khách hàng.\" Ở Việt Nam, học viên có thể liên hệ tới các chuỗi bán lẻ cho phép nhân viên cửa hàng đổi trả ngay tại chỗ trong một hạn mức nhất định. Quay lại case DigiNet: kỹ thuật viên đến muộn có được quyền tặng ngay một tháng cước, hay phải tạo một yêu cầu gửi về tổng đài và chờ ba ngày?\n\n④ LIÊN HỆ\nVới nhà quản lý cấp cao, trao quyền là một quyết định quản trị rủi ro: đặt hạn mức rõ ràng, đào tạo cách dùng, theo dõi và học hỏi từ dữ liệu. Rủi ro lạm dụng thường nhỏ hơn nhiều so với chi phí của những khách hàng rời đi vì phải chờ.\n\n★ CÂU CHỐT: \"Khách hàng không cần nghe 'để em hỏi cấp trên'. Họ cần một người có quyền giải quyết.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Nhân viên tuyến đầu của anh chị hiện được tự quyết định tới mức nào để làm hài lòng một khách hàng gặp sự cố – mà không cần xin phép?\"\nNếu lớp im lặng: đề nghị mỗi người viết ra con số hoặc quyền cụ thể, rồi so sánh với chi phí trung bình để có một khách hàng mới.\nCâu trả lời có thể gặp: \"Không có quyền gì, mọi thứ phải qua trưởng ca\" → phản hồi: hãy thử tính xem trung bình một lần phê duyệt khiến khách chờ bao lâu.\n\n⑥ CHUYỂN Ý\n\"Bây giờ các nhóm sẽ thiết kế cả hai: một khoảnh khắc đáng nhớ, và một kịch bản phục hồi.\"", "html": "<section id=\"b2-16\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Kịch bản phục hồi cần được thiết kế trước khi sự cố xảy ra<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Năm bậc thang đi lên: ba bậc xám nhạt, bậc thứ tư màu cam, bậc cao nhất màu trắng\" width=\"560\" height=\"440\" viewBox=\"0 0 560 440\" style=\"width:560px; height:440px\"><rect x=\"20\" y=\"330\" width=\"94\" height=\"80\" rx=\"12\" fill=\"#8A94A6\"/><rect x=\"126\" y=\"260\" width=\"94\" height=\"150\" rx=\"12\" fill=\"#8A94A6\"/><rect x=\"232\" y=\"190\" width=\"94\" height=\"220\" rx=\"12\" fill=\"#8A94A6\"/><rect x=\"338\" y=\"120\" width=\"94\" height=\"290\" rx=\"12\" fill=\"#E2783B\"/><rect x=\"444\" y=\"50\" width=\"94\" height=\"360\" rx=\"12\" fill=\"#1E2533\"/><line x1=\"10\" y1=\"420\" x2=\"550\" y2=\"420\" stroke=\"#1E2533\" stroke-width=\"8\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:40px\">\n<p>Nghe · Xin lỗi · Giải quyết · <b style=\"color:#E2783B\">Bù đắp<\/b> · <b>Theo dõi<\/b><\/p>\n<p><b>Trao quyền<\/b> cho tuyến đầu<\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng chìa khóa phòng khách sạn\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"18\" cy=\"32\" r=\"11\"/><path d=\"M29 32 H58\"/><path d=\"M48 32 V42\"/><path d=\"M56 32 V40\"/><\/g><\/svg><p style=\"color:#5B6577\">Ritz-Carlton: nhân viên tự quyết tới 2.000 USD cho mỗi khách<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b2-17", "label": "B2 · 17", "session": 2, "part": "s10", "title": "Thảo luận nhóm: Khoảnh khắc đáng nhớ và kịch bản phục hồi", "activity": "Nhóm 4 người · 15 phút", "points": ["1. Xóa điểm đau ở Phần 1", "2. Tạo một đỉnh cảm xúc", "3. Viết kịch bản phục hồi 5 bước"], "notes": "① MỞ\n\"Mười lăm phút tới, mỗi nhóm là đội thiết kế trải nghiệm của doanh nghiệp. Nhiệm vụ: biến điểm đáy trên bản đồ hành trình thành một câu chuyện mà khách hàng muốn kể lại.\"\n\n② HƯỚNG DẪN HOẠT ĐỘNG\n– Phút 0–4: dựa trên nguyên nhân gốc đã tìm ở Phần 1, đề xuất MỘT thay đổi để loại bỏ hoặc giảm điểm đau – thay đổi ở quy trình, KPI, công cụ hoặc chính sách, không chỉ là \"đào tạo nhân viên\".\n– Phút 4–9: thiết kế MỘT đỉnh cảm xúc cho persona, sử dụng ít nhất một trong bốn yếu tố: thăng hoa, vỡ lẽ, tự hào, kết nối. Ghi rõ: xảy ra ở giai đoạn nào, ai thực hiện, chi phí ước tính.\n– Phút 9–14: viết kịch bản phục hồi cho tình huống Problem Canvas của nhóm theo năm bước: nghe – xin lỗi – giải quyết – bù đắp – theo dõi. Ghi rõ: ai được quyền quyết định bù đắp, trong hạn mức nào, và phản hồi đầu tiên đến với khách trong bao lâu.\n– Phút 14–15: chọn một người trình bày 60 giây.\nNhắc: giữ lại kết quả; đây là hai trong ba sáng kiến CX của phần trình bày cuối buổi.\n\n③ DẪN DẮT TRONG LÚC NHÓM LÀM\nCâu hỏi gợi mở: \"Nếu persona kể lại khoảnh khắc này cho bạn thân, họ sẽ nói câu gì?\" \"Kịch bản phục hồi này có thực hiện được lúc 2 giờ sáng, hay chỉ trong giờ hành chính?\" \"Nhân viên nào sẽ làm điều này, và họ có đủ thời gian không?\"\nGợi ý tham khảo nếu nhóm bế tắc: DigiNet – lịch lắp đặt hiển thị trực tiếp khi bán, kỹ thuật viên gọi trước 30 phút; đỉnh cảm xúc: kiểm tra và tối ưu WiFi cho từng phòng cho gia đình làm việc tại nhà. TechPharma – bước kiểm tra bắt buộc cho đơn thuốc trẻ em; đỉnh cảm xúc: dược sĩ gọi hỏi thăm sau ba ngày. BizManage – lộ trình 90 ngày cho người dùng cuối; đỉnh cảm xúc: lễ hoàn thành kỳ quyết toán đầu tiên. Life Biz School – người đồng hành từ ngày đóng học phí; đỉnh cảm xúc: gặp cựu học viên có hoàn cảnh giống mình.\n\n④ LIÊN HỆ – CHIA SẺ NHANH\nMời hai nhóm chưa chia sẻ ở Phần 1 trình bày 60 giây. Cả lớp phản hồi bằng một câu hỏi: \"Khách hàng sẽ kể lại điều gì?\"\n\n★ CÂU CHỐT: \"Một thiết kế tốt trả lời được hai câu hỏi: khách hàng sẽ kể lại điều gì – và ai trong tổ chức sẽ làm cho điều đó xảy ra.\"\n\n⑤ TƯƠNG TÁC\nNếu nhóm chỉ đề xuất quà tặng: hỏi \"Điều gì khách hàng không thể mua được bằng tiền trong khoảnh khắc này?\"\n\n⑥ CHUYỂN Ý\n\"Giữ lại thiết kế này. Sau giờ nghỉ, chúng ta sẽ hỏi: làm sao biết nó có hiệu quả?\"\n\nTÓM TẮT PHẦN 2 (một câu): Thiết kế trải nghiệm bắt đầu bằng việc loại bỏ điểm đau, tiếp theo là tạo một đỉnh cảm xúc và một kết thúc có chủ đích, và luôn có sẵn kịch bản phục hồi cùng quyền quyết định cho tuyến đầu.", "html": "<section id=\"b2-17\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:40px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Thảo luận nhóm: Khoảnh khắc đáng nhớ và kịch bản phục hồi<\/h2>\n<p style=\"align-self:start; font-weight:700; color:#FFFFFF; background:#E2783B; padding:8px 36px; border-radius:999px\">Nhóm 4 người · 15 phút<\/p>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Ngôi sao màu cam và một mũi tên vòng màu trắng đi lên từ điểm thấp\" width=\"520\" height=\"440\" viewBox=\"0 0 520 440\" style=\"width:520px; height:440px\"><path d=\"M150 30 L176 100 L250 100 L190 144 L212 214 L150 172 L88 214 L110 144 L50 100 L124 100 Z\" fill=\"#E2783B\"/><path d=\"M260 400 C 300 420, 340 330, 380 330 C 430 330, 440 240, 470 200\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"14\" stroke-linecap=\"round\"/><path d=\"M450 190 L490 170 L486 216 Z\" fill=\"#1E2533\"/><circle cx=\"260\" cy=\"400\" r=\"20\" fill=\"#8A94A6\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:40px\">\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng xmark\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"6\" y=\"6\" width=\"52\" height=\"52\" rx=\"10\"/><line x1=\"20\" y1=\"20\" x2=\"44\" y2=\"44\"/><line x1=\"44\" y1=\"20\" x2=\"20\" y2=\"44\"/><\/g><\/svg><p><b style=\"color:#E2783B\">1.<\/b> Xóa điểm đau ở Phần 1<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng star\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M32 5 L39 22 L57 23 L43 35 L48 53 L32 43 L16 53 L21 35 L7 23 L25 22 Z\"/><\/g><\/svg><p><b style=\"color:#E2783B\">2.<\/b> Tạo một đỉnh cảm xúc<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng shield\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M32 4 L54 12 V30 C 54 44, 44 54, 32 60 C 20 54, 10 44, 10 30 V12 Z\"/><path d=\"M22 32 L29 39 L43 24\"/><\/g><\/svg><p><b style=\"color:#E2783B\">3.<\/b> Viết kịch bản phục hồi 5 bước<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b2-18", "label": "B2 · 18", "session": 2, "part": "s11", "title": "Giải lao 15 phút", "activity": "", "points": ["Khoảnh khắc nào khiến anh chị nhớ mãi một thương hiệu?"], "notes": "TRƯỚC KHI NGHỈ\nThông báo rõ giờ quay lại (ví dụ \"chúng ta bắt đầu lại đúng 10 giờ\") và nhắc các nhóm giữ lại ba kết quả đã có: nguyên nhân gốc rễ và chi phí ước tính (Phần 1), khoảnh khắc đáng nhớ và kịch bản phục hồi (Phần 2). Sau giờ nghỉ, các nhóm sẽ bổ sung chỉ số đo lường và hoàn thiện ba sáng kiến CX để trình bày.\n\nTÓM TẮT PHẦN 1 (một câu): Trải nghiệm tệ lặp lại vì nguyên nhân nằm ở hậu trường và ở hệ thống do quản lý thiết kế; tìm gốc rễ và lượng hóa chi phí là bước đầu tiên để cải tiến có trọng tâm.\nTÓM TẮT PHẦN 2 (một câu): Loại bỏ điểm đau trước, thiết kế có chủ đích một đỉnh cảm xúc và một kết thúc đẹp, và chuẩn bị sẵn kịch bản phục hồi cùng quyền quyết định cho tuyến đầu.\n\nCÂU HỎI TRÊN MÀN HÌNH\n\"Khoảnh khắc nào khiến anh chị nhớ mãi một thương hiệu?\" – mời học viên suy nghĩ trong giờ nghỉ. Khi quay lại, giảng viên có thể hỏi nhanh hai, ba người: khoảnh khắc đó thuộc yếu tố nào trong bốn yếu tố – thăng hoa, vỡ lẽ, tự hào hay kết nối – và nó xảy ra ở đỉnh hay ở phần kết của hành trình. Đây là cách khởi động nhẹ nhàng cho Phần 3, vì câu hỏi tiếp theo sẽ là: làm sao doanh nghiệp đo được những khoảnh khắc như vậy?\n\nGỢI Ý CHO GIẢNG VIÊN TRONG GIỜ NGHỈ\n– Đi qua các nhóm, xem nhanh bản thiết kế và kịch bản phục hồi; ghi lại một hoặc hai ý tưởng tốt để nhắc tên trong Phần 3 và Phần 4 – học viên thường rất hào hứng khi ý tưởng của nhóm mình được nêu như ví dụ.\n– Kiểm tra nhóm nào còn chậm tiến độ để hỗ trợ trong hoạt động tiếp theo.\n– Chuẩn bị bảng hoặc slide trống để ghi chỉ số của từng nhóm trong Phần 3.\n– Nếu có học viên hỏi riêng về tình huống doanh nghiệp của họ, khuyến khích họ mang câu hỏi đó vào Phần 4 – phần dẫn dắt thay đổi – vì nhiều khả năng cả lớp cũng có cùng băn khoăn.\n\n★ CÂU CHỐT KHI NGHỈ: \"Hãy tận hưởng giờ nghỉ như một khách hàng – và để ý xem khoảnh khắc nào khiến anh chị thấy dễ chịu.\"", "html": "<section id=\"b2-18\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:row; gap:96px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Tách cà phê với hơi nóng bốc lên\" width=\"560\" height=\"600\" viewBox=\"0 0 560 600\" style=\"width:560px; height:600px\"><path d=\"M170 60 C 140 110, 200 140, 170 190\" fill=\"none\" stroke=\"#D5DAE1\" stroke-width=\"14\" stroke-linecap=\"round\"/><path d=\"M260 40 C 230 100, 290 130, 260 190\" fill=\"none\" stroke=\"#D5DAE1\" stroke-width=\"14\" stroke-linecap=\"round\"/><path d=\"M350 60 C 320 110, 380 140, 350 190\" fill=\"none\" stroke=\"#D5DAE1\" stroke-width=\"14\" stroke-linecap=\"round\"/><path d=\"M60 240 L460 240 L430 470 C 425 510, 395 530, 360 530 L160 530 C 125 530, 95 510, 90 470 Z\" fill=\"#8A94A6\"/><path d=\"M455 280 C 540 280, 540 420, 440 420\" fill=\"none\" stroke=\"#8A94A6\" stroke-width=\"28\"/><rect x=\"20\" y=\"555\" width=\"480\" height=\"24\" rx=\"12\" fill=\"#1E2533\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:40px\">\n<h2 style=\"font-size:120px; font-weight:800; line-height:1.05; color:#1E2533\">Giải lao 15 phút<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng bong bóng suy nghĩ\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 10 H56 V42 H30 L18 54 V42 H8 Z\"/><circle cx=\"21\" cy=\"26\" r=\"3\" fill=\"#E2783B\" stroke=\"none\"/><circle cx=\"32\" cy=\"26\" r=\"3\" fill=\"#E2783B\" stroke=\"none\"/><circle cx=\"43\" cy=\"26\" r=\"3\" fill=\"#E2783B\" stroke=\"none\"/><\/g><\/svg><p style=\"color:#5B6577\">Khoảnh khắc nào khiến anh chị nhớ mãi một thương hiệu?<\/p><\/div>\n<\/div>\n<\/section>"}, {"id": "b2-19", "label": "B2 · 19", "session": 2, "part": "s12", "title": "Làm thế nào để đo lường trải nghiệm và gắn nó với kết quả kinh doanh?", "activity": "", "points": [], "notes": "① MỞ\n\"Trước giờ nghỉ, các nhóm đã thiết kế một khoảnh khắc đáng nhớ và một kịch bản phục hồi. Bây giờ, hãy tưởng tượng anh chị trình bày thiết kế đó trước hội đồng quản trị. Câu hỏi đầu tiên sẽ là gì?\" Để lớp trả lời. Thường sẽ là: \"Làm sao biết nó hiệu quả?\" hoặc \"Nó mang lại bao nhiêu tiền?\"\n\n② GIẢNG\nPhần 3 kéo dài khoảng 40 phút. Peter Drucker thường được trích dẫn với ý: điều gì không đo được thì khó quản trị được. Với trải nghiệm khách hàng, vấn đề ngày nay không phải là thiếu chỉ số, mà là có quá nhiều chỉ số nhưng ít chỉ số dẫn tới quyết định. Chúng ta sẽ đi qua năm ý:\n– Ba chỉ số phổ biến nhất – NPS, CSAT, CES – và mỗi chỉ số trả lời một câu hỏi khác nhau.\n– NPS: dùng thế nào cho đúng, và những giới hạn cần biết.\n– Kết hợp chỉ số cảm nhận với chỉ số hành vi và chỉ số vận hành.\n– Vòng phản hồi khép kín: chỉ số chỉ có giá trị khi dẫn tới hành động.\n– Chuỗi lợi nhuận dịch vụ: nối trải nghiệm nhân viên, trải nghiệm khách hàng và kết quả tài chính.\nPhần này kết thúc bằng hoạt động nhóm 10 phút: gắn chỉ số và mục tiêu cho các sáng kiến CX của nhóm.\n\n③ MINH HỌA\nMột câu chuyện khá phổ biến: một doanh nghiệp treo thưởng cho nhân viên nếu điểm hài lòng đạt trên 90%. Vài tháng sau, điểm số tăng vọt – vì nhân viên nhắc khách \"anh chị chấm giúp em 5 sao nhé\", hoặc chỉ gửi khảo sát cho khách vui vẻ. Chỉ số đẹp lên, trải nghiệm thì không. Đây là minh họa cho định luật Goodhart: khi một thước đo trở thành mục tiêu, nó không còn là một thước đo tốt.\n\n④ LIÊN HỆ\nVới nhà quản lý cấp cao, câu hỏi không phải là \"chúng ta có đo CX không\", mà là \"chỉ số CX nào đang xuất hiện trong cuộc họp ban điều hành, và lần gần nhất nó khiến chúng ta thay đổi một quyết định là khi nào?\"\n\n★ CÂU CHỐT: \"Đo lường trải nghiệm không nhằm tạo ra một con số đẹp, mà nhằm tạo ra một quyết định tốt hơn.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Doanh nghiệp anh chị đang theo dõi chỉ số trải nghiệm nào? Chỉ số đó được báo cáo cho ai, bao lâu một lần?\"\nNếu lớp im lặng: hỏi giơ tay – \"có đo NPS\", \"có đo CSAT\", \"chưa đo chỉ số nào một cách hệ thống\".\nCâu trả lời có thể gặp: \"Chúng tôi đo nhưng chỉ phòng marketing xem\" → phản hồi: khi chỉ số chỉ nằm ở một phòng, nó sẽ chỉ dẫn tới hành động của một phòng.\n\n⑥ CHUYỂN Ý\n\"Hãy bắt đầu với ba chỉ số mà anh chị sẽ gặp nhiều nhất.\"", "html": "<section id=\"b2-19\" data-transition=\"push\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; justify-content:center; gap:24px\">\n<div style=\"display:flex; flex-direction:row; align-items:center; justify-content:space-between\"><p style=\"font-size:280px; font-weight:800; line-height:1; color:#E2783B\">03<\/p><svg aria-label=\"Đồng hồ đo\" width=\"320\" height=\"320\" viewBox=\"0 0 320 320\" style=\"width:320px; height:320px\"><g transform=\"scale(5)\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 46 A26 26 0 0 1 58 46\"/><path d=\"M32 46 L46 26\" stroke=\"#E2783B\"/><circle cx=\"32\" cy=\"46\" r=\"3\"/><path d=\"M12 56 H52\"/><\/g><\/svg><\/div>\n<h1 style=\"font-size:88px; font-weight:700; line-height:1.15; color:#1E2533\">Làm thế nào để đo lường trải nghiệm và gắn nó với kết quả kinh doanh?<\/h1>\n<\/section>"}, {"id": "b2-20", "label": "B2 · 20", "session": 2, "part": "s12", "title": "Ba chỉ số phổ biến trả lời ba câu hỏi khác nhau", "activity": "", "points": ["NPS · có giới thiệu không?", "CSAT · có hài lòng không?", "CES · có dễ dàng không?", "DigiNet: điểm sẵn sàng giới thiệu chỉ 6,2 trên 10"], "notes": "① MỞ\n\"Nếu anh chị chỉ được hỏi khách hàng MỘT câu, anh chị sẽ hỏi câu gì?\" Để lớp trả lời vài giây.\n\n② GIẢNG\nBa chỉ số phổ biến nhất trả lời ba câu hỏi khác nhau, và phù hợp với những thời điểm khác nhau.\nNPS – Net Promoter Score – do Fred Reichheld giới thiệu trên Harvard Business Review năm 2003. Câu hỏi: \"Trên thang 0 đến 10, khả năng anh chị giới thiệu chúng tôi cho bạn bè hoặc đồng nghiệp là bao nhiêu?\" NPS đo mức độ gắn bó tổng thể với thương hiệu, thường dùng định kỳ theo quý hoặc năm – đây là chỉ số \"quan hệ\".\nCSAT – Customer Satisfaction – hỏi \"Anh chị hài lòng thế nào với…\" một giao dịch hoặc điểm chạm cụ thể, thường trên thang 1 đến 5. Đây là chỉ số \"giao dịch\", đo ngay sau khi sự việc xảy ra.\nCES – Customer Effort Score – ra đời từ nghiên cứu của CEB mà chúng ta nhắc ở đầu buổi, hỏi \"Doanh nghiệp đã giúp anh chị giải quyết vấn đề dễ dàng đến mức nào?\" CES đặc biệt hữu ích cho các điểm chạm dịch vụ và hỗ trợ.\nKhông có chỉ số nào là tốt nhất. Câu hỏi đúng là: chúng ta cần biết điều gì, ở giai đoạn nào của hành trình, để ra quyết định gì?\n\n③ MINH HỌA\nCase DigiNet ghi nhận điểm sẵn sàng giới thiệu 6,2 trên 10. Lưu ý một chi tiết kỹ thuật: NPS chuẩn không phải là điểm trung bình, mà là tỷ lệ người giới thiệu trừ đi tỷ lệ người phản đối – slide sau sẽ nói kỹ. Một điểm trung bình 6,2 thường tương ứng với một NPS âm. Với DigiNet, cả ba chỉ số đều có chỗ đứng: NPS theo quý để theo dõi sức khỏe thương hiệu; CSAT ngay sau mỗi lần lắp đặt; CES sau mỗi cuộc gọi tổng đài – nơi 40% khách phải gọi lại.\n\n④ LIÊN HỆ\nVới nhà quản lý, tránh hai sai lầm: dùng một chỉ số cho mọi mục đích, hoặc đo quá nhiều đến mức khách hàng mệt mỏi vì khảo sát. Hãy chọn ít chỉ số, gắn đúng giai đoạn, và nói rõ ai chịu trách nhiệm với mỗi chỉ số.\n\n★ CÂU CHỐT: \"Không có chỉ số tốt nhất – chỉ có chỉ số phù hợp với câu hỏi mà nhà quản lý cần trả lời.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Với hành trình khách hàng của doanh nghiệp anh chị, giai đoạn nào nên đo bằng CES thay vì CSAT?\"\nNếu lớp im lặng: gợi ý – thủ tục mở tài khoản, yêu cầu bảo hành, đổi trả hàng.\nCâu trả lời có thể gặp: \"Chúng tôi chỉ đo CSAT ở tổng đài\" → phản hồi: thử thêm một câu hỏi về công sức – kết quả có thể rất khác.\n\n⑥ CHUYỂN Ý\n\"NPS là chỉ số được dùng nhiều nhất ở cấp ban điều hành. Hãy xem nó được tính thế nào – và nó không nói được điều gì.\"", "html": "<section id=\"b2-20\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Ba chỉ số phổ biến trả lời ba câu hỏi khác nhau<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Ba đồng hồ đo màu trắng, xám nhạt và cam, kim chỉ ở các vị trí khác nhau\" width=\"760\" height=\"360\" viewBox=\"0 0 760 360\" style=\"width:760px; height:360px\"><path d=\"M20 230 A 110 110 0 0 1 240 230\" fill=\"none\" stroke=\"#D5DAE1\" stroke-width=\"22\"/><line x1=\"130\" y1=\"230\" x2=\"199\" y2=\"172\" stroke=\"#1E2533\" stroke-width=\"8\" stroke-linecap=\"round\"/><circle cx=\"130\" cy=\"230\" r=\"16\" fill=\"#1E2533\"/><rect x=\"60\" y=\"300\" width=\"140\" height=\"24\" rx=\"10\" fill=\"#1E2533\"/><path d=\"M270 230 A 110 110 0 0 1 490 230\" fill=\"none\" stroke=\"#D5DAE1\" stroke-width=\"22\"/><line x1=\"380\" y1=\"230\" x2=\"396\" y2=\"141\" stroke=\"#8A94A6\" stroke-width=\"8\" stroke-linecap=\"round\"/><circle cx=\"380\" cy=\"230\" r=\"16\" fill=\"#8A94A6\"/><rect x=\"310\" y=\"300\" width=\"140\" height=\"24\" rx=\"10\" fill=\"#8A94A6\"/><path d=\"M520 230 A 110 110 0 0 1 740 230\" fill=\"none\" stroke=\"#D5DAE1\" stroke-width=\"22\"/><line x1=\"630\" y1=\"230\" x2=\"572\" y2=\"161\" stroke=\"#E2783B\" stroke-width=\"8\" stroke-linecap=\"round\"/><circle cx=\"630\" cy=\"230\" r=\"16\" fill=\"#E2783B\"/><rect x=\"560\" y=\"300\" width=\"140\" height=\"24\" rx=\"10\" fill=\"#E2783B\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:32px\">\n<p><b>NPS<\/b> · có giới thiệu không?<\/p>\n<p><b>CSAT<\/b> · có hài lòng không?<\/p>\n<p><b style=\"color:#E2783B\">CES<\/b> · có dễ dàng không?<\/p>\n<\/div>\n<\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng wifi – case DigiNet\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 26 A34 34 0 0 1 56 26\"/><path d=\"M16 35 A22 22 0 0 1 48 35\"/><path d=\"M24 44 A11 11 0 0 1 40 44\"/><circle cx=\"32\" cy=\"53\" r=\"4\" fill=\"#E2783B\" stroke=\"none\"/><\/g><\/svg><p style=\"color:#5B6577\">DigiNet: điểm sẵn sàng giới thiệu chỉ 6,2 trên 10<\/p><\/div>\n<\/section>"}, {"id": "b2-21", "label": "B2 · 21", "session": 2, "part": "s12", "title": "NPS đo ý định giới thiệu, chưa phải lòng trung thành thực tế", "activity": "", "points": ["NPS = % 9–10 − % 0–6", "Điều quan trọng là câu hỏi \"vì sao?\" tiếp theo", "BizManage: hỏi CEO Khoa hay kế toán trưởng Nga?"], "notes": "① MỞ\n\"NPS là một trong số ít chỉ số trải nghiệm xuất hiện thường xuyên trong báo cáo thường niên và cuộc họp hội đồng quản trị. Nhưng rất nhiều người dùng nó mà chưa biết nó được tính thế nào.\"\n\n② GIẢNG\nCách tính: khách hàng trả lời trên thang 0 đến 10. Người chấm 9–10 là người ủng hộ, 7–8 là trung lập, 0–6 là người phản đối. NPS bằng tỷ lệ người ủng hộ trừ đi tỷ lệ người phản đối, nên dao động từ âm 100 đến 100. Ví dụ: 30% ủng hộ, 50% trung lập, 20% phản đối, NPS bằng 10. Ưu điểm: đơn giản, dễ so sánh theo thời gian, dễ truyền thông trong tổ chức. Nhưng nhà quản lý cần biết ba giới hạn. Một: NPS đo ý định, không đo hành vi – người nói sẽ giới thiệu chưa chắc đã giới thiệu, và người chấm 9 vẫn có thể rời đi khi đối thủ giảm giá. Hai: các nghiên cứu, như của Keiningham và cộng sự (2007), không tìm thấy bằng chứng NPS dự báo tăng trưởng tốt hơn các chỉ số hài lòng khác. Ba: bản thân con số không nói lý do. Giá trị lớn nhất của NPS nằm ở câu hỏi mở tiếp theo: \"Lý do chính khiến anh chị cho điểm này là gì?\" Và nên so sánh NPS với chính mình theo thời gian hoặc với đối thủ trực tiếp trong cùng ngành, vì mức NPS \"bình thường\" rất khác nhau giữa các ngành và các quốc gia.\n\n③ MINH HỌA\nCase BizManage đặt ra một câu hỏi rất thực tế cho B2B: hỏi ai? Nếu chỉ hỏi CEO Khoa – người mua – điểm số có thể phản ánh kỳ vọng ban đầu. Nếu hỏi chị Nga – người dùng hằng ngày, đang tính tay ba đêm vì lỗi phần mềm – kết quả có thể hoàn toàn khác. Với doanh nghiệp B2B, NPS nên được đo theo từng vai trò trong trung tâm mua hàng, và khoảng cách giữa điểm của người mua và người dùng chính là một tín hiệu cảnh báo sớm về rủi ro không gia hạn.\n\n④ LIÊN HỆ\nKhi nhìn một báo cáo NPS, nhà quản lý nên hỏi ba câu: mẫu khảo sát là ai và có đại diện không? Ai không trả lời – vì người im lặng thường là người đã rời đi trong tâm trí? Và những lý do hàng đầu của người phản đối là gì, ai đang xử lý chúng?\n\n★ CÂU CHỐT: \"Con số NPS cho biết nhiệt độ. Câu trả lời 'vì sao' mới cho biết bệnh ở đâu.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Nếu doanh nghiệp anh chị đang đo NPS, anh chị có biết ba lý do hàng đầu của người phản đối không?\"\nNếu lớp im lặng: đề nghị học viên đang đo NPS chia sẻ con số và cách họ dùng nó.\nCâu trả lời có thể gặp: \"NPS của chúng tôi là 45, khá cao\" → hỏi tiếp: so với đối thủ trực tiếp thì sao, và xu hướng qua các quý thế nào?\n\n⑥ CHUYỂN Ý\n\"NPS cho biết sức khỏe của cả mối quan hệ. Để biết từng khoảnh khắc đang diễn ra thế nào, chúng ta cần CSAT.\"", "html": "<section id=\"b2-21\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">NPS đo ý định giới thiệu, chưa phải lòng trung thành thực tế<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Thang điểm 0 đến 10 thành mười một ô: bảy ô cam (0 đến 6), hai ô xám (7 và 8), hai ô trắng (9 và 10)\" width=\"760\" height=\"340\" viewBox=\"0 0 760 340\" style=\"width:760px; height:340px\"><rect x=\"10\" y=\"120\" width=\"60\" height=\"120\" rx=\"10\" fill=\"#E2783B\"/><rect x=\"78\" y=\"120\" width=\"60\" height=\"120\" rx=\"10\" fill=\"#E2783B\"/><rect x=\"146\" y=\"120\" width=\"60\" height=\"120\" rx=\"10\" fill=\"#E2783B\"/><rect x=\"214\" y=\"120\" width=\"60\" height=\"120\" rx=\"10\" fill=\"#E2783B\"/><rect x=\"282\" y=\"120\" width=\"60\" height=\"120\" rx=\"10\" fill=\"#E2783B\"/><rect x=\"350\" y=\"120\" width=\"60\" height=\"120\" rx=\"10\" fill=\"#E2783B\"/><rect x=\"418\" y=\"120\" width=\"60\" height=\"120\" rx=\"10\" fill=\"#E2783B\"/><rect x=\"486\" y=\"120\" width=\"60\" height=\"120\" rx=\"10\" fill=\"#D5DAE1\"/><rect x=\"554\" y=\"120\" width=\"60\" height=\"120\" rx=\"10\" fill=\"#D5DAE1\"/><rect x=\"622\" y=\"120\" width=\"60\" height=\"120\" rx=\"10\" fill=\"#1E2533\"/><rect x=\"690\" y=\"120\" width=\"60\" height=\"120\" rx=\"10\" fill=\"#1E2533\"/><rect x=\"10\" y=\"270\" width=\"468\" height=\"16\" rx=\"8\" fill=\"#E2783B\"/><rect x=\"486\" y=\"270\" width=\"128\" height=\"16\" rx=\"8\" fill=\"#D5DAE1\"/><rect x=\"622\" y=\"270\" width=\"128\" height=\"16\" rx=\"8\" fill=\"#1E2533\"/><path d=\"M686 100 L686 40 L110 40 L110 100\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"8\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:32px\">\n<p>NPS = <b>% 9–10<\/b> − <b style=\"color:#E2783B\">% 0–6<\/b><\/p>\n<p>Điều quan trọng là câu hỏi <b>\"vì sao?\"<\/b> tiếp theo<\/p>\n<\/div>\n<\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng màn hình phần mềm – case BizManage\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"6\" y=\"8\" width=\"52\" height=\"36\" rx=\"5\"/><line x1=\"22\" y1=\"56\" x2=\"42\" y2=\"56\"/><line x1=\"32\" y1=\"44\" x2=\"32\" y2=\"56\"/><line x1=\"20\" y1=\"36\" x2=\"20\" y2=\"28\"/><line x1=\"32\" y1=\"36\" x2=\"32\" y2=\"18\"/><line x1=\"44\" y1=\"36\" x2=\"44\" y2=\"24\"/><\/g><\/svg><p style=\"color:#5B6577\">BizManage: hỏi CEO Khoa hay kế toán trưởng Nga?<\/p><\/div>\n<\/section>"}, {"id": "b2-21a", "label": "B2 · 22", "session": 2, "part": "s12", "title": "CSAT đo mức hài lòng tại từng khoảnh khắc", "activity": "", "points": ["CSAT = % chấm 4–5", "Hỏi ngay sau giao dịch", "DigiNet: 28% lượt lắp đặt bị chấm dưới 3/5"], "notes": "① MỞ\n\"Anh chị đã bao giờ được nhân viên nhắc: 'Anh chị chấm giúp em 5 sao nhé'? Điểm số đó đo sự hài lòng của anh chị – hay đo sự khéo léo của nhân viên?\"\n\n② GIẢNG\nCSAT – Customer Satisfaction Score – là chỉ số lâu đời và phổ biến nhất. Câu hỏi điển hình: \"Anh chị hài lòng thế nào với [lần lắp đặt / cuộc gọi / lần giao hàng] vừa rồi?\", trên thang 1 đến 5. Cách tính thông dụng: tỷ lệ khách chấm 4 hoặc 5 trên tổng số người trả lời – gọi là \"top-2-box\". Một số doanh nghiệp dùng điểm trung bình, nhưng tỷ lệ 4–5 dễ theo dõi và khó bị che giấu bởi vài điểm cực đoan hơn.\nBa nguyên tắc dùng đúng. Một, đúng lúc: hỏi ngay sau giao dịch, lý tưởng trong vòng 24 giờ, khi trải nghiệm còn rõ. Hai, đúng chỗ: CSAT là chỉ số \"giao dịch\", phù hợp để so sánh các điểm chạm với nhau và theo dõi một điểm chạm theo thời gian. Ba, ngắn gọn: một câu chấm điểm và một câu hỏi mở \"Điều gì chúng tôi có thể làm tốt hơn?\".\nBốn cạm bẫy nhà quản lý cần biết. Một, thiên lệch người trả lời: người rất vui và người rất bực thường trả lời nhiều hơn. Hai, \"làm đẹp\" điểm số khi CSAT gắn với thưởng – định luật Goodhart ta đã nói. Ba, khác biệt văn hóa: mức chấm \"bình thường\" khác nhau giữa các thị trường, nên so sánh với chính mình theo thời gian. Bốn, hiệu ứng \"quả dưa hấu\" ở Buổi 1: CSAT từng điểm chạm cao nhưng cả hành trình vẫn tệ.\n\n③ MINH HỌA\nCase DigiNet: 28% lượt lắp đặt bị khách chấm dưới 3 trên 5 – đó chính là một chỉ số CSAT tại điểm chạm kỹ thuật viên. Giá trị của nó nằm ở việc chia nhỏ: theo khu vực, theo ca làm việc, theo từng kỹ thuật viên, theo khung giờ. Nếu điểm thấp tập trung vào ca chiều muộn, vấn đề có thể nằm ở lịch làm việc chứ không ở thái độ. Và câu hỏi mở đi kèm sẽ cho biết lý do: đến muộn, không gọi trước, hay WiFi vẫn yếu sau khi lắp.\n\n④ LIÊN HỆ\nKhi nhìn báo cáo CSAT, nhà quản lý nên hỏi: tỷ lệ phản hồi là bao nhiêu, điểm được chia nhỏ theo những chiều nào, và điểm thấp có được chuyển ngay cho người có thể hành động không? Nếu CSAT gắn với thưởng, cần kiểm tra xem ai đang chọn khách để gửi khảo sát.\n\n★ CÂU CHỐT: \"CSAT cho biết từng khoảnh khắc diễn ra thế nào – nhưng chỉ hữu ích khi được chia nhỏ tới mức ai đó có thể hành động.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"CSAT trong doanh nghiệp anh chị có gắn với thưởng không? Nếu có, anh chị có tin con số đó phản ánh đúng trải nghiệm không?\"\nNếu lớp im lặng: hỏi giơ tay \"có đo CSAT\", \"CSAT gắn với thưởng\".\nCâu trả lời có thể gặp: \"CSAT của chúng tôi luôn trên 90%\" → phản hồi: hãy kiểm tra tỷ lệ phản hồi và so với tỷ lệ khiếu nại; con số quá đẹp thường cần được xem kỹ hơn.\n\n⑥ CHUYỂN Ý\n\"CSAT hỏi khách có hài lòng không. Nhưng như ta thấy ở đầu buổi, câu hỏi dự báo lòng trung thành tốt hơn trong dịch vụ là: có dễ dàng không?\"", "html": "<section id=\"b2-21a\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">CSAT đo mức hài lòng tại từng khoảnh khắc<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Năm khuôn mặt từ buồn tới vui: hai mặt cam, một mặt xám, hai mặt trắng được gạch chân\" width=\"760\" height=\"300\" viewBox=\"0 0 760 300\" style=\"width:760px; height:300px\"><circle cx=\"76\" cy=\"150\" r=\"64\" fill=\"#E2783B\"/><circle cx=\"54\" cy=\"132\" r=\"8\" fill=\"#FFFFFF\"/><circle cx=\"98\" cy=\"132\" r=\"8\" fill=\"#FFFFFF\"/><path d=\"M-26 22 Q0 0 26 22\" transform=\"translate(76 160)\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"8\" stroke-linecap=\"round\"/><circle cx=\"228\" cy=\"150\" r=\"64\" fill=\"#E2783B\"/><circle cx=\"206\" cy=\"132\" r=\"8\" fill=\"#FFFFFF\"/><circle cx=\"250\" cy=\"132\" r=\"8\" fill=\"#FFFFFF\"/><path d=\"M-26 18 Q0 6 26 18\" transform=\"translate(228 160)\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"8\" stroke-linecap=\"round\"/><circle cx=\"380\" cy=\"150\" r=\"64\" fill=\"#D5DAE1\"/><circle cx=\"358\" cy=\"132\" r=\"8\" fill=\"#FFFFFF\"/><circle cx=\"402\" cy=\"132\" r=\"8\" fill=\"#FFFFFF\"/><path d=\"M-26 14 L26 14\" transform=\"translate(380 160)\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"8\" stroke-linecap=\"round\"/><circle cx=\"532\" cy=\"150\" r=\"64\" fill=\"#1E2533\"/><circle cx=\"510\" cy=\"132\" r=\"8\" fill=\"#FFFFFF\"/><circle cx=\"554\" cy=\"132\" r=\"8\" fill=\"#FFFFFF\"/><path d=\"M-26 8 Q0 22 26 8\" transform=\"translate(532 160)\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"8\" stroke-linecap=\"round\"/><circle cx=\"684\" cy=\"150\" r=\"64\" fill=\"#1E2533\"/><circle cx=\"662\" cy=\"132\" r=\"8\" fill=\"#FFFFFF\"/><circle cx=\"706\" cy=\"132\" r=\"8\" fill=\"#FFFFFF\"/><path d=\"M-28 4 Q0 32 28 4\" transform=\"translate(684 160)\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"8\" stroke-linecap=\"round\"/><rect x=\"468\" y=\"250\" width=\"280\" height=\"18\" rx=\"9\" fill=\"#1E2533\"/><rect x=\"10\" y=\"250\" width=\"440\" height=\"18\" rx=\"9\" fill=\"#D5DAE1\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:32px\">\n<p>CSAT = <b>% chấm 4–5<\/b><\/p>\n<p>Hỏi <b>ngay sau<\/b> giao dịch<\/p>\n<\/div>\n<\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng wifi – case DigiNet\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 26 A34 34 0 0 1 56 26\"/><path d=\"M16 35 A22 22 0 0 1 48 35\"/><path d=\"M24 44 A11 11 0 0 1 40 44\"/><circle cx=\"32\" cy=\"53\" r=\"4\" fill=\"#E2783B\" stroke=\"none\"/><\/g><\/svg><p style=\"color:#5B6577\">DigiNet: 28% lượt lắp đặt bị chấm dưới 3/5<\/p><\/div>\n<\/section>"}, {"id": "b2-21b", "label": "B2 · 23", "session": 2, "part": "s12", "title": "CES đo công sức khách hàng phải bỏ ra", "activity": "", "points": ["Thang 1–7 · \"dễ dàng\"", "Giảm gọi lại, chuyển máy, lặp lại", "BizManage: ticket khẩn 24 giờ chưa phản hồi, kế toán tính tay 3 đêm"], "notes": "① MỞ\n\"Nhớ lại lần gần nhất anh chị phải gọi tổng đài để giải quyết một việc. Anh chị phải gọi mấy lần, bị chuyển máy mấy lần, và phải đọc lại số hợp đồng mấy lần?\"\n\n② GIẢNG\nCES – Customer Effort Score – ra đời từ nghiên cứu của CEB (nay thuộc Gartner) mà chúng ta nhắc ở đầu buổi, và được trình bày đầy đủ trong cuốn \"The Effortless Experience\" (Dixon, Toman và DeLisi, 2013). Phiên bản thường dùng hiện nay hỏi mức độ đồng ý với câu: \"Doanh nghiệp đã giúp tôi giải quyết vấn đề một cách dễ dàng\", trên thang 1 đến 7. Có thể theo dõi điểm trung bình hoặc tỷ lệ khách chấm 5–7.\nĐiểm mạnh của CES là nó chỉ thẳng vào những việc doanh nghiệp có thể sửa. Nghiên cứu của CEB chỉ ra các nguồn công sức phổ biến: phải liên hệ nhiều lần mới giải quyết xong; bị chuyển giữa các bộ phận; phải lặp lại thông tin đã cung cấp; phải chuyển kênh, ví dụ từ website sang tổng đài; và nhận câu trả lời chung chung không đúng tình huống. Vì vậy CES thường đi cùng các chỉ số vận hành như tỷ lệ giải quyết ngay lần đầu và tỷ lệ liên hệ lại. Một ý tưởng hữu ích khác từ nghiên cứu này: giải quyết luôn cả \"vấn đề tiếp theo\" mà khách sắp gặp, để họ không phải quay lại.\nCES phù hợp nhất với các điểm chạm dịch vụ và hỗ trợ: tổng đài, khiếu nại, bảo hành, thủ tục, triển khai sản phẩm. Nó ít phù hợp để đo cảm xúc thương hiệu tổng thể – đó là việc của NPS.\n\n③ MINH HỌA\nCase BizManage: chị Nga, kế toán trưởng, phát hiện lỗi tính sai thuế GTGT đúng kỳ quyết toán. Chị gửi yêu cầu khẩn; 24 giờ sau chưa có phản hồi, chị phải tính tay ba đêm. Thời gian phản hồi trung bình của BizManage là 38 giờ, 15% yêu cầu phải chuyển cấp. Nếu đo CES ngay sau lần hỗ trợ này, điểm gần như chắc chắn ở mức thấp nhất – và nó báo trước rủi ro không gia hạn rõ hơn bất kỳ khảo sát hài lòng nào gửi cho CEO Khoa. Hướng cải thiện gắn trực tiếp với CES: một kênh ưu tiên cho kế toán vào cuối kỳ, và giải quyết ngay lần liên hệ đầu tiên.\n\n④ LIÊN HỆ\nNhà quản lý có thể tự kiểm tra CES theo cách đơn giản nhất: làm khách hàng của chính mình, như bài tập tuần trước, và đếm số bước, số lần chuyển máy, số lần phải lặp lại thông tin.\n\n★ CÂU CHỐT: \"Mỗi lần khách hàng phải gọi lại, phải chờ chuyển máy hay phải kể lại câu chuyện của mình, lòng trung thành lại giảm đi một chút.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Trong hành trình khách hàng của anh chị, điểm chạm nào khiến khách phải bỏ nhiều công sức nhất – và doanh nghiệp có đo điều đó không?\"\nNếu lớp im lặng: gợi ý – thủ tục bảo hành, đổi trả, khiếu nại hóa đơn, mở tài khoản.\nCâu trả lời có thể gặp: \"Khách phải gửi lại giấy tờ nhiều lần\" → phản hồi: đó là một nguồn công sức có thể loại bỏ bằng việc chia sẻ dữ liệu giữa các bộ phận.\n\n⑥ CHUYỂN Ý\n\"Vì các chỉ số cảm nhận – NPS, CSAT hay CES – đều có giới hạn, chúng ta cần đặt chúng cạnh hai loại chỉ số khác.\"", "html": "<section id=\"b2-21b\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">CES đo công sức khách hàng phải bỏ ra<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Hai con đường: một dốc cao màu cam với người đẩy tảng đá, một đường bằng phẳng màu trắng\" width=\"760\" height=\"320\" viewBox=\"0 0 760 320\" style=\"width:760px; height:320px\"><path d=\"M20 300 L340 40 L340 300 Z\" fill=\"#E2783B\"/><circle cx=\"232\" cy=\"112\" r=\"34\" fill=\"#1E2533\"/><circle cx=\"186\" cy=\"150\" r=\"14\" fill=\"#FFFFFF\"/><line x1=\"160\" y1=\"190\" x2=\"200\" y2=\"160\" stroke=\"#FFFFFF\" stroke-width=\"8\" stroke-linecap=\"round\"/><line x1=\"400\" y1=\"250\" x2=\"740\" y2=\"250\" stroke=\"#1E2533\" stroke-width=\"22\" stroke-linecap=\"round\"/><circle cx=\"570\" cy=\"200\" r=\"14\" fill=\"#1E2533\"/><line x1=\"570\" y1=\"214\" x2=\"570\" y2=\"238\" stroke=\"#1E2533\" stroke-width=\"8\" stroke-linecap=\"round\"/><path d=\"M690 226 L730 250 L690 274 Z\" fill=\"#1E2533\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:32px\">\n<p>Thang 1–7 · <b>\"dễ dàng\"<\/b><\/p>\n<p>Giảm <b style=\"color:#E2783B\">gọi lại, chuyển máy, lặp lại<\/b><\/p>\n<\/div>\n<\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng màn hình phần mềm – case BizManage\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"6\" y=\"8\" width=\"52\" height=\"36\" rx=\"5\"/><line x1=\"22\" y1=\"56\" x2=\"42\" y2=\"56\"/><line x1=\"32\" y1=\"44\" x2=\"32\" y2=\"56\"/><line x1=\"20\" y1=\"36\" x2=\"20\" y2=\"28\"/><line x1=\"32\" y1=\"36\" x2=\"32\" y2=\"18\"/><line x1=\"44\" y1=\"36\" x2=\"44\" y2=\"24\"/><\/g><\/svg><p style=\"color:#5B6577\">BizManage: ticket khẩn 24 giờ chưa phản hồi, kế toán tính tay 3 đêm<\/p><\/div>\n<\/section>"}, {"id": "b2-22", "label": "B2 · 24", "session": 2, "part": "s12", "title": "Kết hợp chỉ số cảm nhận, hành vi và vận hành", "activity": "", "points": ["Cảm nhận · khách nói gì", "Hành vi · khách làm gì", "Vận hành · doanh nghiệp làm gì", "BizManage: tỷ lệ sử dụng 55% báo trước rủi ro rời bỏ"], "notes": "① MỞ\n\"Một khách hàng chấm 9 điểm trong khảo sát, rồi ba tháng sau không gia hạn. Khảo sát sai, hay chúng ta nhìn thiếu?\"\n\n② GIẢNG\nMột hệ thống đo lường trải nghiệm tốt thường kết hợp ba tầng chỉ số. Tầng cảm nhận: khách hàng nói gì – NPS, CSAT, CES, và các bình luận mở. Tầng hành vi: khách hàng thực sự làm gì – tỷ lệ giữ chân, tỷ lệ rời bỏ, tần suất mua lại, mức độ sử dụng sản phẩm, số lượt giới thiệu thực tế. Đây là tầng gắn trực tiếp với doanh thu. Tầng vận hành: doanh nghiệp đang làm gì ở từng điểm chạm – thời gian chờ, tỷ lệ giải quyết ngay lần đầu, tỷ lệ lắp đặt đúng hẹn, độ chính xác của đơn hàng. Đây là tầng mà các phòng ban kiểm soát trực tiếp. Giá trị nằm ở mối liên kết giữa ba tầng: chỉ số vận hành nào đang kéo điểm cảm nhận xuống, và điểm cảm nhận đó dự báo hành vi nào. Khi tìm ra mối liên kết đó, mỗi phòng ban biết mình cần cải thiện con số nào để tác động lên doanh thu. Một lưu ý nữa: chỉ số hành vi thường là chỉ số \"trễ\" – khi churn tăng thì khách đã đi rồi. Nhà quản lý cần những chỉ số \"sớm\" để kịp can thiệp.\n\n③ MINH HỌA\nCase BizManage: tỷ lệ sử dụng thực tế chỉ 55%, và 60% khách rời bỏ trong sáu tháng đầu. Tỷ lệ sử dụng là một chỉ số hành vi \"sớm\" – nếu sau 30 ngày chỉ 12 trên 50 nhân viên đăng nhập, rủi ro không gia hạn đã hiện ra từ rất lâu trước ngày hết hợp đồng. Tầng vận hành cho biết vì sao: thời gian phản hồi hỗ trợ trung bình 38 giờ so với cam kết 24 giờ, thời gian triển khai trung bình hơn bốn tháng. Tầng cảm nhận cho biết cảm xúc: kế toán cảm thấy bị \"áp đặt từ trên xuống\". Ba tầng cùng kể một câu chuyện – và chỉ ra nơi cần can thiệp.\n\n④ LIÊN HỆ\nNhà quản lý nên yêu cầu một bảng theo dõi CX có đủ ba tầng, với không quá hai đến ba chỉ số mỗi tầng, gắn với các giai đoạn trên bản đồ hành trình. Mỗi chỉ số vận hành cần một người sở hữu.\n\n★ CÂU CHỐT: \"Khách hàng có thể nói một đằng, nhưng hành vi của họ luôn cho biết sự thật – và vận hành cho biết vì sao.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Trong doanh nghiệp anh chị, chỉ số 'sớm' nào có thể báo trước một khách hàng sắp rời đi?\"\nNếu lớp im lặng: gợi ý – tần suất đăng nhập giảm, số khiếu nại tăng, thời gian giữa hai lần mua dài ra, khách ngừng mở email.\nCâu trả lời có thể gặp: \"Khách giảm dần giá trị đơn hàng trước khi ngừng hẳn\" → phản hồi: đó là một tín hiệu rất tốt; câu hỏi là ai nhận được cảnh báo và họ làm gì.\n\n⑥ CHUYỂN Ý\n\"Có chỉ số rồi, nhưng chỉ số chỉ có giá trị khi nó dẫn tới hành động. Đó là ý tưởng của vòng phản hồi khép kín.\"", "html": "<section id=\"b2-22\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Kết hợp chỉ số cảm nhận, hành vi và vận hành<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Ba tầng xếp chồng: tầng trên màu cam hình trái tim nhỏ, tầng giữa xám tối nhạt hình mũi tên, tầng dưới màu trắng hình bánh răng\" width=\"560\" height=\"500\" viewBox=\"0 0 560 500\" style=\"width:560px; height:500px\"><rect x=\"20\" y=\"20\" width=\"520\" height=\"140\" rx=\"20\" fill=\"#E2783B\"/><path d=\"M100 115 C 60 90, 58 60, 80 54 C 92 50, 100 58, 100 66 C 100 58, 108 50, 120 54 C 142 60, 140 90, 100 115 Z\" fill=\"#FFFFFF\"/><rect x=\"20\" y=\"180\" width=\"520\" height=\"140\" rx=\"20\" fill=\"#8A94A6\"/><path d=\"M60 270 L110 220 L140 250 L190 200\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"20\" y=\"340\" width=\"520\" height=\"140\" rx=\"20\" fill=\"#1E2533\"/><circle cx=\"100\" cy=\"410\" r=\"36\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"8\"/><circle cx=\"100\" cy=\"410\" r=\"10\" fill=\"#FFFFFF\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:40px\">\n<p><b style=\"color:#E2783B\">Cảm nhận<\/b> · khách nói gì<\/p>\n<p><b>Hành vi<\/b> · khách làm gì<\/p>\n<p><b>Vận hành<\/b> · doanh nghiệp làm gì<\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng màn hình phần mềm – case BizManage\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"6\" y=\"8\" width=\"52\" height=\"36\" rx=\"5\"/><line x1=\"22\" y1=\"56\" x2=\"42\" y2=\"56\"/><line x1=\"32\" y1=\"44\" x2=\"32\" y2=\"56\"/><line x1=\"20\" y1=\"36\" x2=\"20\" y2=\"28\"/><line x1=\"32\" y1=\"36\" x2=\"32\" y2=\"18\"/><line x1=\"44\" y1=\"36\" x2=\"44\" y2=\"24\"/><\/g><\/svg><p style=\"color:#5B6577\">BizManage: tỷ lệ sử dụng 55% báo trước rủi ro rời bỏ<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b2-23", "label": "B2 · 25", "session": 2, "part": "s12", "title": "Chỉ số chỉ có giá trị khi khép được vòng phản hồi", "activity": "", "points": ["Vòng trong · gọi lại từng khách", "Vòng ngoài · sửa nguyên nhân gốc", "TechPharma: 95% khách không được liên hệ lại sau khi mua"], "notes": "① MỞ\n\"Anh chị đã bao giờ điền một khảo sát, viết rất thật lòng về một điều không hài lòng – rồi không bao giờ nghe thấy gì nữa? Lần sau anh chị còn muốn trả lời khảo sát không?\"\n\n② GIẢNG\nHệ thống Net Promoter do Bain phát triển nhấn mạnh rằng giá trị không nằm ở điểm số, mà ở \"vòng phản hồi khép kín\" với hai vòng. Vòng trong: phản hồi của từng khách hàng được chuyển ngay tới người có thể hành động – thường là quản lý tuyến đầu – và người đó liên hệ lại với khách trong một thời hạn ngắn, ví dụ 48 giờ, đặc biệt với người phản đối. Mục tiêu kép: giải quyết vấn đề của khách, và hiểu sâu hơn lý do. Vòng ngoài: các phản hồi được tổng hợp định kỳ để tìm ra những nguyên nhân gốc mang tính hệ thống – đúng những gì chúng ta làm ở Phần 1 – và giao cho người có thẩm quyền sửa đổi quy trình, chính sách, sản phẩm. Vòng ngoài cần có mặt của ban điều hành, vì nhiều nguyên nhân gốc vượt quá quyền hạn của một phòng ban. Và cuối cùng: báo lại cho khách hàng và nhân viên rằng phản hồi của họ đã dẫn tới thay đổi gì. Đó là cách xây niềm tin để khách tiếp tục nói thật.\n\n③ MINH HỌA\nCase TechPharma: 95% khách mua xong không bao giờ được liên hệ lại – \"bán xong là xong\". Với một chuỗi nhà thuốc, đó là bỏ lỡ cả hai vòng. Vòng trong có thể rất đơn giản: dược sĩ gọi hỏi thăm khách mua thuốc kháng sinh sau ba ngày, hoặc gọi lại ngay cho khách chấm điểm thấp. Vòng ngoài: tổng hợp các phản hồi về giao sai thuốc, về tư vấn vội vàng – trung bình chỉ hai phút mỗi khách trong khi 72% khách muốn được tư vấn kỹ hơn – để thay đổi cách bố trí dược sĩ và quy trình kiểm tra đơn. Với nhóm khách mãn tính như ông Hùng, vòng trong còn là cơ hội chăm sóc sức khỏe liên tục.\n\n④ LIÊN HỆ\nNhà quản lý có thể kiểm tra sức khỏe của vòng phản hồi bằng hai con số: tỷ lệ người phản đối được liên hệ lại trong 48 giờ, và số thay đổi hệ thống được thực hiện mỗi quý từ phản hồi của khách hàng. Nếu con số thứ hai bằng không, doanh nghiệp đang đo lường để báo cáo, không phải để cải tiến.\n\n★ CÂU CHỐT: \"Hỏi khách hàng mà không hành động còn tệ hơn không hỏi – vì nó dạy khách hàng rằng ý kiến của họ không quan trọng.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Trong doanh nghiệp anh chị, khi một khách hàng chấm điểm thấp, ai biết được điều đó – và trong bao lâu?\"\nNếu lớp im lặng: đề nghị học viên đoán thời gian trung bình từ lúc khách phàn nàn tới lúc ban điều hành biết.\nCâu trả lời có thể gặp: \"Chúng tôi chỉ biết qua báo cáo tháng\" → phản hồi: khi đó khách hàng đã có một tháng để kể cho người khác nghe.\n\n⑥ CHUYỂN Ý\n\"Vòng phản hồi giúp cải tiến. Nhưng để ban điều hành đầu tư bền vững, cần nối trải nghiệm với lợi nhuận. Đó là chuỗi lợi nhuận dịch vụ.\"", "html": "<section id=\"b2-23\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Chỉ số chỉ có giá trị khi khép được vòng phản hồi<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Hai vòng tròn mũi tên đồng tâm: vòng trong màu cam, vòng ngoài xám tối nhạt, ở giữa là một hình người màu trắng\" width=\"560\" height=\"520\" viewBox=\"0 0 560 520\" style=\"width:560px; height:520px\"><path d=\"M280 40 A 220 220 0 1 1 90 150\" fill=\"none\" stroke=\"#8A94A6\" stroke-width=\"18\" stroke-linecap=\"round\"/><path d=\"M70 120 L118 132 L86 172 Z\" fill=\"#8A94A6\"/><path d=\"M280 140 A 120 120 0 1 1 176 200\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"18\" stroke-linecap=\"round\"/><path d=\"M160 176 L204 190 L172 226 Z\" fill=\"#E2783B\"/><circle cx=\"280\" cy=\"240\" r=\"26\" fill=\"#1E2533\"/><path d=\"M244 320 Q280 256 316 320 Z\" fill=\"#1E2533\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:40px\">\n<p><b style=\"color:#E2783B\">Vòng trong<\/b> · gọi lại từng khách<\/p>\n<p><b>Vòng ngoài<\/b> · sửa nguyên nhân gốc<\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng viên thuốc – case TechPharma\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><g transform=\"rotate(-40 32 32)\"><rect x=\"6\" y=\"21\" width=\"52\" height=\"22\" rx=\"11\"/><line x1=\"32\" y1=\"21\" x2=\"32\" y2=\"43\"/><\/g><\/g><\/svg><p style=\"color:#5B6577\">TechPharma: 95% khách không được liên hệ lại sau khi mua<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b2-24", "label": "B2 · 26", "session": 2, "part": "s12", "title": "Trải nghiệm nhân viên, khách hàng và lợi nhuận là một chuỗi", "activity": "", "points": ["Nhân viên gắn bó", "Khách hàng trung thành", "Lợi nhuận bền vững", "DigiNet: rời bỏ 20% → 12% ≈ giữ lại 160.000 thuê bao"], "notes": "① MỞ\n\"Nếu tôi hỏi giám đốc tài chính: chi phí đào tạo nhân viên tổng đài nằm ở dòng nào trong báo cáo? – Ở dòng chi phí. Còn doanh thu từ khách hàng ở lại nhờ tổng đài đó nằm ở đâu? – Thường là không ai tính.\"\n\n② GIẢNG\nNăm 1994, Heskett, Jones, Loveman, Sasser và Schlesinger công bố trên Harvard Business Review mô hình \"chuỗi lợi nhuận dịch vụ\" (Service-Profit Chain). Chuỗi bắt đầu từ bên trong: chất lượng môi trường làm việc – công cụ, quy trình, sự trao quyền, sự ghi nhận – tạo ra nhân viên hài lòng và gắn bó. Nhân viên gắn bó ở lại lâu hơn và làm việc hiệu quả hơn, tạo ra giá trị dịch vụ cao hơn cho khách hàng. Giá trị đó tạo ra sự hài lòng, rồi lòng trung thành của khách hàng. Và lòng trung thành – khách mua lại, mua thêm, giới thiệu người khác – tạo ra tăng trưởng doanh thu và lợi nhuận. Ý nghĩa quản trị: CX không thể tốt hơn EX một cách bền vững. Và để thuyết phục ban điều hành, cần đi ngược chuỗi từ con số tài chính: giữ được bao nhiêu khách, nhờ cải thiện điểm chạm nào, và cần đầu tư gì vào con người và hệ thống để làm được điều đó.\n\n③ MINH HỌA\nTiếp tục phép tính minh họa với DigiNet ở Phần 1: giảm tỷ lệ rời bỏ từ 20% xuống 12% đồng nghĩa với giữ lại khoảng 160.000 thuê bao mỗi năm; với giả định mức cước 199 nghìn đồng mỗi tháng, đó là khoảng 380 tỷ đồng doanh thu mỗi năm. Đi ngược chuỗi: khách rời đi vì mạng không ổn định giờ cao điểm, vì tổng đài chờ lâu, vì kỹ thuật viên đến muộn. Và nhìn vào đầu chuỗi: kỹ thuật viên có đủ thời gian cho mỗi lượt lắp đặt không, có được đào tạo kỹ năng giao tiếp không, có được ghi nhận khi khách khen không? 28% lượt lắp đặt bị đánh giá dưới 3 trên 5 có thể là câu chuyện về trải nghiệm của chính đội kỹ thuật. Con số tài chính là ước tính để minh họa phương pháp.\n\n④ LIÊN HỆ\nVới nhà quản lý cấp cao, chuỗi này là công cụ để trình bày ngân sách CX: không phải \"chúng ta cần chi thêm cho dịch vụ\", mà là \"khoản đầu tư này vào đội ngũ tuyến đầu dự kiến giữ lại X khách, tương đương Y doanh thu\".\n\n★ CÂU CHỐT: \"Doanh nghiệp không thể mang tới cho khách hàng một trải nghiệm tốt hơn trải nghiệm mà nó mang tới cho nhân viên của mình.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Ở doanh nghiệp anh chị, mắt xích nào trong chuỗi đang yếu nhất?\"\nNếu lớp im lặng: mời học viên chọn một trong năm mắt xích bằng cách giơ số ngón tay.\nCâu trả lời có thể gặp: \"Nhân viên tuyến đầu nghỉ việc nhiều\" → phản hồi: mỗi nhân viên nghỉ việc mang theo những mối quan hệ với khách hàng; đây là một chỉ số CX mà ít ai theo dõi. Chúng ta sẽ đi sâu vào trải nghiệm nhân viên ở Phần 4.\n\n⑥ CHUYỂN Ý\n\"Bây giờ các nhóm sẽ gắn chỉ số và con số tài chính vào các sáng kiến của mình.\"", "html": "<section id=\"b2-24\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Trải nghiệm nhân viên, khách hàng và lợi nhuận là một chuỗi<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Chuỗi năm mắt xích: hai mắt xám nhạt, hai mắt cam, một mắt trắng, nối với nhau bằng thanh trắng\" width=\"760\" height=\"280\" viewBox=\"0 0 760 280\" style=\"width:760px; height:280px\"><rect x=\"20\" y=\"40\" width=\"120\" height=\"120\" rx=\"60\" fill=\"none\" stroke=\"#8A94A6\" stroke-width=\"18\"/><rect x=\"166\" y=\"40\" width=\"120\" height=\"120\" rx=\"60\" fill=\"none\" stroke=\"#8A94A6\" stroke-width=\"18\"/><rect x=\"312\" y=\"40\" width=\"120\" height=\"120\" rx=\"60\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"18\"/><rect x=\"458\" y=\"40\" width=\"120\" height=\"120\" rx=\"60\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"18\"/><rect x=\"604\" y=\"40\" width=\"120\" height=\"120\" rx=\"60\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"18\"/><rect x=\"110\" y=\"88\" width=\"56\" height=\"24\" rx=\"12\" fill=\"#1E2533\"/><rect x=\"256\" y=\"88\" width=\"56\" height=\"24\" rx=\"12\" fill=\"#1E2533\"/><rect x=\"402\" y=\"88\" width=\"56\" height=\"24\" rx=\"12\" fill=\"#1E2533\"/><rect x=\"548\" y=\"88\" width=\"56\" height=\"24\" rx=\"12\" fill=\"#1E2533\"/><path d=\"M40 2
