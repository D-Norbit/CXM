h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Mũi tên bậc thang đi xuống qua ba điểm\" width=\"760\" height=\"560\" viewBox=\"0 0 760 560\" style=\"width:760px; height:560px\"><path d=\"M60 60 L260 60 L260 220 L460 220 L460 380 L620 380 L620 470\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"22\" stroke-linejoin=\"round\"/><path d=\"M580 460 L620 530 L660 460 Z\" fill=\"#E2783B\"/><circle cx=\"60\" cy=\"60\" r=\"30\" fill=\"#1E2533\"/><circle cx=\"260\" cy=\"220\" r=\"30\" fill=\"#1E2533\"/><circle cx=\"460\" cy=\"380\" r=\"30\" fill=\"#1E2533\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:32px\">\n<p><b>1.<\/b> Giảm giá bán<\/p>\n<p><b>2.<\/b> Biên lợi nhuận thu hẹp<\/p>\n<p><b>3.<\/b> Cắt chi phí, chất lượng suy giảm<\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng wifi – case DigiNet\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 26 A34 34 0 0 1 56 26\"/><path d=\"M16 35 A22 22 0 0 1 48 35\"/><path d=\"M24 44 A11 11 0 0 1 40 44\"/><circle cx=\"32\" cy=\"53\" r=\"4\" fill=\"#E2783B\" stroke=\"none\"/><\/g><\/svg><p style=\"color:#5B6577\">DigiNet: 28% đánh giá kỹ thuật viên dưới 3/5<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-10", "label": "B1 · 13", "session": 1, "part": "s2", "title": "Trải nghiệm nâng mức sẵn sàng chi trả thay vì hạ giá bán", "activity": "", "points": ["Giữ nguyên giá bán", "Nâng giá trị cảm nhận", "Pizza 4P's: giá cao hơn mặt bằng, khách vẫn đặt bàn trước"], "notes": "① MỞ\n\"Có một chuỗi nhà hàng pizza sinh ra ở Việt Nam mà thực khách thường phải đặt bàn trước, dù giá cao hơn mặt bằng chung. Họ gần như không cạnh tranh bằng khuyến mãi. Vậy họ đang làm gì?\"\n\n② GIẢNG\nĐây là con đường thứ hai: giữ nguyên giá bán, nâng WTP. Nhìn vào cây thước: phần đỉnh được kéo lên (khung nét đứt), trong khi vạch giá bán đứng yên. Kết quả là kép: đoạn xám nhạt – sự hài lòng của khách – lớn hơn, đồng thời đoạn trắng – biên lợi nhuận – được bảo toàn. Đây không phải trò chơi \"tôi được thì anh mất\" như giảm giá. Có ba cách chính để nâng WTP: tăng lợi ích cảm xúc (khách cảm thấy được trân trọng, tự hào, an tâm); giảm chi phí phi tiền tệ (thời gian chờ, công sức, rủi ro); và thiết kế những điểm chạm xuất sắc tại khoảnh khắc quan trọng.\n\n③ MINH HỌA\nPizza 4P's bắt đầu từ một nhà hàng ở TP.HCM năm 2011, với sứ mệnh \"Delivering Wow, Sharing Happiness\". Họ tự làm phô mai tại Đà Lạt, kể câu chuyện nông trại – bàn ăn, thiết kế bếp mở để thực khách thấy lò nướng và người đầu bếp. Khách hàng không chỉ mua một chiếc pizza; họ mua một buổi tối đáng nhớ và một câu chuyện để kể lại. Đó là lý do mức giá cao hơn vẫn được chấp nhận. (Giảng viên có thể cập nhật quy mô chuỗi hiện tại trước buổi học.)\n\n④ LIÊN HỆ\nMột bài tập tư duy rất hiệu quả cho ban điều hành: \"Giả sử từ ngày mai chúng ta không được giảm giá nữa – chúng ta sẽ cạnh tranh bằng gì?\" Câu hỏi này buộc đội ngũ phải tìm ra các đòn bẩy WTP thay vì tìm đến công cụ quen thuộc nhất là giá.\n\n★ CÂU CHỐT: \"Doanh nghiệp giỏi không hỏi 'giảm bao nhiêu thì khách mua', mà hỏi 'làm gì để khách thấy xứng đáng'.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Nếu phải tăng giá 10% mà không mất khách, anh chị sẽ thay đổi điều gì trong trải nghiệm?\" Cho mọi người trao đổi với người bên cạnh một phút.\nNếu lớp im lặng: gợi ý bằng chính case của các nhóm – ví dụ Life Biz School có thể làm gì để học phí 220 triệu trở nên \"đáng tiền\" hơn?\nCâu trả lời có thể gặp: \"giao hàng nhanh hơn\", \"tư vấn cá nhân hóa\", \"bảo hành tận nhà\", \"cộng đồng khách hàng\". Phản hồi: \"Đó đều là đòn bẩy WTP.\" Ghi lại để quay lại ở phần thiết kế trải nghiệm tại Buổi 2.\n\n⑥ CHUYỂN Ý\n\"Trải nghiệm nâng WTP cụ thể như thế nào, bằng những lớp nào? Hãy cùng mổ xẻ một ly cà phê.\"", "html": "<section id=\"b1-10\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Trải nghiệm nâng mức sẵn sàng chi trả thay vì hạ giá bán<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Cây thước giá trị có phần đỉnh được kéo dài lên trên bằng một mũi tên xanh\" width=\"760\" height=\"560\" viewBox=\"0 0 760 560\" style=\"width:760px; height:560px\"><rect x=\"300\" y=\"40\" width=\"160\" height=\"130\" fill=\"#FFFFFF\" stroke=\"#8A94A6\" stroke-width=\"8\" stroke-dasharray=\"16 12\"/><rect x=\"300\" y=\"170\" width=\"160\" height=\"130\" fill=\"#8A94A6\"/><rect x=\"300\" y=\"300\" width=\"160\" height=\"120\" fill=\"#1E2533\"/><rect x=\"300\" y=\"420\" width=\"160\" height=\"120\" fill=\"#E2783B\"/><line x1=\"260\" y1=\"300\" x2=\"500\" y2=\"300\" stroke=\"#1E2533\" stroke-width=\"8\"/><line x1=\"580\" y1=\"300\" x2=\"580\" y2=\"80\" stroke=\"#8A94A6\" stroke-width=\"16\" stroke-linecap=\"round\"/><path d=\"M545 90 L580 30 L615 90 Z\" fill=\"#8A94A6\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:40px\">\n<p>Giữ nguyên <b>giá bán<\/b><\/p>\n<p>Nâng <b>giá trị cảm nhận<\/b><\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng miếng pizza\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M32 58 L8 14 C 22 6, 42 6, 56 14 Z\"/><circle cx=\"27\" cy=\"24\" r=\"3\" fill=\"#E2783B\" stroke=\"none\"/><circle cx=\"38\" cy=\"33\" r=\"3\" fill=\"#E2783B\" stroke=\"none\"/><\/g><\/svg><p style=\"color:#5B6577\">Pizza 4P's: giá cao hơn mặt bằng, khách vẫn đặt bàn trước<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-11", "label": "B1 · 14", "session": 1, "part": "s2", "title": "Bốn lớp trải nghiệm cộng dồn giá trị cảm nhận", "activity": "", "points": ["30K", "+20K", "+20K", "+10K", "80K", "Lõi"], "notes": "① MỞ\n\"Tôi mời anh chị tính nhẩm: trong giá một ly cà phê ở chuỗi, bao nhiêu phần trăm là tiền hạt cà phê?\" Để vài người đoán. Câu trả lời thường khiến lớp bất ngờ: phần nguyên liệu chỉ chiếm một tỷ trọng nhỏ.\n\n② GIẢNG\nBiểu đồ là một ví dụ minh họa, không phải số liệu thật của thương hiệu nào. Sản phẩm lõi – ly cà phê ngon – tạo ra WTP khoảng 30 nghìn. Lớp không gian (ánh sáng, âm nhạc, chỗ ngồi, wifi, ứng dụng đặt trước) cộng thêm khoảng 20 nghìn. Lớp con người (nhân viên nhớ tên, tư vấn đúng món, xử lý khéo khi có sự cố) cộng thêm 20 nghìn. Lớp cộng đồng (chương trình thành viên, nơi hẹn gặp, cảm giác thuộc về) thêm 10 nghìn. Tổng WTP đạt 80 nghìn. Nếu bán ở mức 60 nghìn, doanh nghiệp có giá gấp đôi so với chỉ bán sản phẩm lõi, trong khi khách vẫn cảm thấy mình được thêm 20 nghìn giá trị – phần màu cam trên cột tổng. Ba lớp ngoài cùng đều là trải nghiệm.\n\n③ MINH HỌA\nHoward Schultz xây dựng Starbucks sau chuyến đi Ý, nơi ông thấy quán espresso là không gian gặp gỡ của cộng đồng. Ông mượn khái niệm \"nơi chốn thứ ba\" của nhà xã hội học Ray Oldenburg: không phải nhà, không phải nơi làm việc, mà là nơi thứ ba để thuộc về. Lớp cộng đồng còn thể hiện qua Starbucks Rewards: khách hàng nạp tiền trước vào thẻ và ứng dụng, tạo ra một khoản số dư rất lớn – tức là khách sẵn sàng \"gửi tiền\" trước cho thương hiệu mình yêu thích.\n\n④ LIÊN HỆ\nHãy áp dụng cho sản phẩm của anh chị: liệt kê ba lớp ngoài – lớp nào đang gần như trống? Một lưu ý quản trị quan trọng: mỗi lớp đều tốn chi phí. Nâng WTP chỉ có lời khi phần WTP tăng thêm lớn hơn chi phí tạo ra lớp đó. Đó là lý do CX cần được tính toán, không chỉ \"làm cho đẹp\".\n\n★ CÂU CHỐT: \"Hạt cà phê là phần nhỏ nhất trong giá một ly cà phê. Phần lớn còn lại là trải nghiệm.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Nếu vẽ biểu đồ này cho sản phẩm chủ lực của anh chị, lớp nào cao nhất, lớp nào đang gần bằng không?\"\nNếu lớp im lặng: mời nhóm Life Biz School hoặc DigiNet thử với case của mình.\nCâu trả lời có thể gặp: \"Lớp cộng đồng gần như không có\" → phản hồi bằng case Life Biz School: 8.000 cựu học viên – một tài sản mạng lưới khổng lồ – nhưng 40% cảm thấy bị bỏ rơi và chỉ 8% mua thêm chương trình. \"Lớp con người của chúng tôi phụ thuộc vào từng nhân viên\" → ghi nhận, đó là chủ đề EX ở Buổi 2.\n\n⑥ CHUYỂN Ý\n\"Trước khi đi tiếp, tôi muốn biết lớp học của chúng ta đang đứng ở đâu.\"", "html": "<section id=\"b1-11\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:40px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Bốn lớp trải nghiệm cộng dồn giá trị cảm nhận<\/h2>\n<div style=\"position:relative; width:1664px; height:470px\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Biểu đồ thác nước: lõi 30K, thêm không gian 20K, con người 20K, cộng đồng 10K, tổng 80K trong đó 20K là thặng dư của khách\" width=\"1664\" height=\"470\" viewBox=\"0 0 1664 470\" style=\"position:absolute; left:0; top:0; width:1664px; height:470px\"><line x1=\"0\" y1=\"380\" x2=\"1664\" y2=\"380\" stroke=\"#D5DAE1\" stroke-width=\"8\"/><rect x=\"66\" y=\"267.5\" width=\"200\" height=\"112.5\" fill=\"#D5DAE1\"/><rect x=\"399\" y=\"192.5\" width=\"200\" height=\"75\" fill=\"#8A94A6\"/><rect x=\"732\" y=\"117.5\" width=\"200\" height=\"75\" fill=\"#8A94A6\"/><rect x=\"1065\" y=\"80\" width=\"200\" height=\"37.5\" fill=\"#8A94A6\"/><rect x=\"1398\" y=\"155\" width=\"200\" height=\"225\" fill=\"#1E2533\"/><rect x=\"1398\" y=\"80\" width=\"200\" height=\"75\" fill=\"#E2783B\"/><line x1=\"266\" y1=\"267.5\" x2=\"399\" y2=\"267.5\" stroke=\"#D5DAE1\" stroke-width=\"8\" stroke-dasharray=\"8 8\"/><line x1=\"599\" y1=\"192.5\" x2=\"732\" y2=\"192.5\" stroke=\"#D5DAE1\" stroke-width=\"8\" stroke-dasharray=\"8 8\"/><line x1=\"932\" y1=\"117.5\" x2=\"1065\" y2=\"117.5\" stroke=\"#D5DAE1\" stroke-width=\"8\" stroke-dasharray=\"8 8\"/><line x1=\"1265\" y1=\"80\" x2=\"1398\" y2=\"80\" stroke=\"#D5DAE1\" stroke-width=\"8\" stroke-dasharray=\"8 8\"/><\/svg>\n<p style=\"position:absolute; left:0; top:190px; width:332px; text-align:center; font-weight:700\">30K<\/p>\n<p style=\"position:absolute; left:333px; top:115px; width:332px; text-align:center; font-weight:700; color:#5B6577\">+20K<\/p>\n<p style=\"position:absolute; left:666px; top:40px; width:332px; text-align:center; font-weight:700; color:#5B6577\">+20K<\/p>\n<p style=\"position:absolute; left:999px; top:2px; width:332px; text-align:center; font-weight:700; color:#5B6577\">+10K<\/p>\n<p style=\"position:absolute; left:1332px; top:2px; width:332px; text-align:center; font-weight:800; color:#E2783B\">80K<\/p>\n<p style=\"position:absolute; left:0; top:392px; width:332px; text-align:center\">Lõi<\/p>\n<p style=\"position:absolute; left:333px; top:392px; width:332px; text-align:center\">Không gian<\/p>\n<p style=\"position:absolute; left:666px; top:392px; width:332px; text-align:center\">Con người<\/p>\n<p style=\"position:absolute; left:999px; top:392px; width:332px; text-align:center\">Cộng đồng<\/p>\n<p style=\"position:absolute; left:1332px; top:392px; width:332px; text-align:center; font-weight:700\">Tổng<\/p>\n<\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng tách cà phê\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 20 H46 L42 56 H16 Z\"/><path d=\"M46 26 C 58 26, 58 42, 44 42\"/><path d=\"M22 12 C 20 8, 26 6, 24 2\"/><path d=\"M34 12 C 32 8, 38 6, 36 2\"/><\/g><\/svg><p style=\"color:#5B6577\">Starbucks: bán \"nơi chốn thứ ba\"<\/p><\/div>\n<\/section>"}, {"id": "b1-12", "label": "B1 · 15", "session": 1, "part": "s2", "title": "Bình chọn: Doanh nghiệp đang cạnh tranh bằng yếu tố nào?", "activity": "Cả lớp · 3 phút", "points": ["Giá", "Tính năng", "Trải nghiệm"], "notes": "① MỞ\n\"Ba phút, một câu hỏi, và tôi cần câu trả lời thật – không phải câu trả lời trong báo cáo thường niên.\" Nói chậm, nhấn vào chữ \"thật\".\n\n② HƯỚNG DẪN HOẠT ĐỘNG\nMỗi người chọn MỘT đáp án: yếu tố chính khiến khách hàng chọn doanh nghiệp của anh chị HÔM NAY – không phải điều anh chị mong muốn. A – Giá. B – Tính năng hoặc chất lượng sản phẩm. C – Trải nghiệm. Hình thức: giơ tay lần lượt theo A, B, C; hoặc bình chọn qua mã QR (Mentimeter, Slido) nếu lớp đã chuẩn bị. Đếm và đọc to kết quả. Sau đó hỏi thêm một câu: \"Anh chị có bằng chứng nào cho lựa chọn của mình?\"\n\n③ DẪN DẮT THEO KẾT QUẢ\n– Nếu đa số chọn C: hỏi \"Bằng chứng là gì? Doanh nghiệp đã đo được việc khách trả cao hơn vì trải nghiệm chưa?\". Thường lớp sẽ lúng túng. Phản hồi nhẹ nhàng: đó là khoảng cách giữa niềm tin và dữ liệu – chúng ta sẽ gặp lại con số \"80% doanh nghiệp tự tin, 8% khách hàng đồng ý\" ở đầu Buổi 2.\n– Nếu đa số chọn A: cảm ơn sự thẳng thắn, rồi hỏi \"Biên lợi nhuận ba năm qua biến động thế nào?\".\n– Nếu chia đều: mời mỗi phương án một người giải thích; nhấn mạnh rằng câu trả lời khác nhau theo ngành và theo phân khúc khách hàng.\n\n④ LIÊN HỆ\nCâu trả lời này quyết định chiến lược. Cạnh tranh bằng giá đòi hỏi lợi thế chi phí vượt trội và thường chỉ có một người thắng. Cạnh tranh bằng trải nghiệm cho phép nhiều doanh nghiệp cùng thắng, mỗi doanh nghiệp được một nhóm khách hàng yêu thích theo cách riêng.\n\n★ CÂU CHỐT: \"Chỉ có một doanh nghiệp rẻ nhất thị trường. Nhưng có thể có nhiều doanh nghiệp được khách hàng yêu thích nhất.\"\n\n⑤ TƯƠNG TÁC BỔ SUNG\nCâu hỏi: \"Nếu hỏi chính khách hàng của anh chị câu này, họ sẽ chọn đáp án nào?\"\nCâu trả lời có thể gặp: \"Chắc họ sẽ nói là giá\" → phản hồi: \"Vậy khoảng cách giữa điều chúng ta nghĩ về mình và điều khách hàng nghĩ về chúng ta chính là việc cần làm đầu tiên.\" \"Chúng tôi chưa từng hỏi\" → đề nghị đây là một việc có thể làm ngay trong tuần tới.\nNếu lớp im lặng: giảng viên chia sẻ trước lựa chọn cho một doanh nghiệp quen thuộc để làm mẫu.\n\n⑥ CHUYỂN Ý\n\"Để khép lại Phần 1, tôi muốn anh chị nhìn lại cây thước giá trị lần nữa – lần này ở cả hai đầu.\"", "html": "<section id=\"b1-12\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:40px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Bình chọn: Doanh nghiệp đang cạnh tranh bằng yếu tố nào?<\/h2>\n<p style=\"align-self:start; font-weight:700; color:#FFFFFF; background:#E2783B; padding:8px 36px; border-radius:999px\">Cả lớp · 3 phút<\/p>\n<div style=\"display:flex; flex-direction:row; gap:48px\">\n<div style=\"flex:1; display:flex; flex-direction:column; align-items:center; gap:16px; padding:28px; border:4px solid #D5DAE1; border-radius:24px\">\n<p style=\"font-size:88px; font-weight:800; line-height:1; color:#E2783B\">A<\/p>\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Biểu tượng thẻ giá\" width=\"150\" height=\"150\" viewBox=\"0 0 150 150\" style=\"width:150px; height:150px\"><path d=\"M20 20 L80 20 L135 75 L75 135 L20 80 Z\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"8\" stroke-linejoin=\"round\"/><circle cx=\"48\" cy=\"48\" r=\"11\" fill=\"#1E2533\"/><\/svg>\n<p style=\"font-weight:700\">Giá<\/p>\n<\/div>\n<div style=\"flex:1; display:flex; flex-direction:column; align-items:center; gap:16px; padding:28px; border:4px solid #D5DAE1; border-radius:24px\">\n<p style=\"font-size:88px; font-weight:800; line-height:1; color:#E2783B\">B<\/p>\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Biểu tượng bánh răng\" width=\"150\" height=\"150\" viewBox=\"0 0 150 150\" style=\"width:150px; height:150px\"><circle cx=\"75\" cy=\"75\" r=\"36\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"8\"/><g stroke=\"#1E2533\" stroke-width=\"16\" stroke-linecap=\"round\"><line x1=\"75\" y1=\"12\" x2=\"75\" y2=\"30\"/><line x1=\"75\" y1=\"120\" x2=\"75\" y2=\"138\"/><line x1=\"12\" y1=\"75\" x2=\"30\" y2=\"75\"/><line x1=\"120\" y1=\"75\" x2=\"138\" y2=\"75\"/><line x1=\"30\" y1=\"30\" x2=\"43\" y2=\"43\"/><line x1=\"107\" y1=\"107\" x2=\"120\" y2=\"120\"/><line x1=\"120\" y1=\"30\" x2=\"107\" y2=\"43\"/><line x1=\"30\" y1=\"120\" x2=\"43\" y2=\"107\"/><\/g><\/svg>\n<p style=\"font-weight:700\">Tính năng<\/p>\n<\/div>\n<div style=\"flex:1; display:flex; flex-direction:column; align-items:center; gap:16px; padding:28px; border:4px solid #E2783B; border-radius:24px\">\n<p style=\"font-size:88px; font-weight:800; line-height:1; color:#E2783B\">C<\/p>\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Biểu tượng trái tim\" width=\"150\" height=\"150\" viewBox=\"0 0 150 150\" style=\"width:150px; height:150px\"><path d=\"M75 132 C 20 95, 8 60, 30 36 C 48 18, 70 26, 75 44 C 80 26, 102 18, 120 36 C 142 60, 130 95, 75 132 Z\" fill=\"#E2783B\"/><\/svg>\n<p style=\"font-weight:700\">Trải nghiệm<\/p>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-13", "label": "B1 · 16", "session": 1, "part": "s2", "title": "Hai động lực tạo giá trị: CX nâng WTP, EX tối ưu WTS", "activity": "", "points": ["CX · khách sẵn lòng trả nhiều hơn", "EX · nhân viên sẵn lòng cống hiến hơn", "DigiNet: kỹ thuật viên quá tải, khách mất niềm tin"], "notes": "① MỞ\n\"Có một câu hỏi tôi thường nhận được từ các CEO: 'Chúng tôi đã đầu tư rất nhiều cho trải nghiệm khách hàng – đào tạo, quy trình, phần mềm – sao nhân viên vẫn phục vụ không tốt?'\" Dừng lại. \"Câu trả lời nằm ở đầu dưới của cây thước.\"\n\n② GIẢNG\nQuay lại Value Stick. Có hai động cơ tạo thêm giá trị, nằm ở hai đầu thước. Động cơ thứ nhất – CX: kéo WTP lên, để khách hàng sẵn lòng trả nhiều hơn vì họ nhận được nhiều hơn. Đây thường là trách nhiệm của khối marketing và dịch vụ. Động cơ thứ hai – EX, trải nghiệm nhân viên: kéo WTS xuống. Điều này không có nghĩa là trả lương thấp hơn, mà là làm cho công việc trở nên đáng gắn bó hơn – nhờ văn hóa, mục đích, cơ hội phát triển, sự trao quyền – để nhân viên sẵn lòng cống hiến nhiều hơn. Hai động cơ nối với nhau: nhân viên gắn bó phục vụ tận tâm hơn, trải nghiệm khách hàng tốt hơn, WTP tăng. Ngược lại, nhân viên kiệt sức không thể tạo ra trải nghiệm mà chính họ chưa từng nhận.\n\n③ MINH HỌA\nCase DigiNet: kỹ thuật viên phải chạy nhiều ca, bị đo bằng số lượng lắp đặt, ít được đào tạo kỹ năng giao tiếp. Họ đến muộn, không gọi trước, trả lời cộc lốc. Khách hàng nhìn thấy \"kỹ thuật viên thái độ kém\", nhưng nguyên nhân gốc lại nằm ở cách doanh nghiệp đối xử với kỹ thuật viên. Trong case, kỹ thuật viên vào nhà khách chính là \"đại diện thương hiệu\" – một điểm chạm quyết định. Muốn sửa trải nghiệm khách hàng ở điểm chạm này, phải bắt đầu từ trải nghiệm của chính kỹ thuật viên.\n\n④ LIÊN HỆ\nCEO là người duy nhất trong tổ chức nhìn thấy cả hai đầu cây thước. Marketing lo CX, nhân sự lo EX – nếu không ai nối hai bên, hai động cơ sẽ quay ngược chiều nhau. Chúng ta sẽ đi sâu vào phần này ở Buổi 2.\n\n★ CÂU CHỐT: \"Muốn khách hàng được đối xử tốt, hãy bắt đầu từ cách doanh nghiệp đối xử với nhân viên.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Ở doanh nghiệp anh chị, chỉ số trải nghiệm khách hàng và chỉ số gắn kết nhân viên có được xem xét trong cùng một cuộc họp không?\"\nNếu lớp im lặng: đề nghị giơ tay \"có\" hoặc \"không\".\nCâu trả lời có thể gặp: \"Không, hai phòng báo cáo riêng\" → phản hồi: đó là dấu hiệu của tư duy silo mà chúng ta sẽ phân tích ở Phần 4. \"Có, chúng tôi đặt chung trên một dashboard\" → mời anh chị đó chia sẻ ngắn cách làm.\n\nTÓM TẮT PHẦN 1 (một câu): Trải nghiệm không phải là chi phí, mà là đòn bẩy nâng mức sẵn sàng chi trả – và đòn bẩy đó được vận hành bởi chính nhân viên.\n\n⑥ CHUYỂN Ý\n\"Nếu CX quan trọng như vậy, nó khác gì với chăm sóc khách hàng, và ai thực sự chịu trách nhiệm? Đó là câu hỏi lớn của Phần 2.\"", "html": "<section id=\"b1-13\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Hai động lực tạo giá trị: CX nâng WTP, EX tối ưu WTS<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Cây thước giá trị với mũi tên xanh kéo đỉnh lên và mũi tên cam kéo đáy xuống\" width=\"608\" height=\"448\" viewBox=\"0 0 608 448\" style=\"width:608px; height:448px\"><g transform=\"scale(0.800)\"><rect x=\"310\" y=\"160\" width=\"140\" height=\"80\" fill=\"#8A94A6\"/><rect x=\"310\" y=\"240\" width=\"140\" height=\"80\" fill=\"#1E2533\"/><rect x=\"310\" y=\"320\" width=\"140\" height=\"80\" fill=\"#E2783B\"/><line x1=\"380\" y1=\"150\" x2=\"380\" y2=\"70\" stroke=\"#8A94A6\" stroke-width=\"18\" stroke-linecap=\"round\"/><path d=\"M335 80 L380 12 L425 80 Z\" fill=\"#8A94A6\"/><line x1=\"380\" y1=\"410\" x2=\"380\" y2=\"490\" stroke=\"#E2783B\" stroke-width=\"18\" stroke-linecap=\"round\"/><path d=\"M335 480 L380 548 L425 480 Z\" fill=\"#E2783B\"/><\/g><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:28px\">\n<p><b>CX<\/b> · khách sẵn lòng trả nhiều hơn<\/p>\n<p><b style=\"color:#E2783B\">EX<\/b> · nhân viên sẵn lòng cống hiến hơn<\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng wifi – case DigiNet\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 26 A34 34 0 0 1 56 26\"/><path d=\"M16 35 A22 22 0 0 1 48 35\"/><path d=\"M24 44 A11 11 0 0 1 40 44\"/><circle cx=\"32\" cy=\"53\" r=\"4\" fill=\"#E2783B\" stroke=\"none\"/><\/g><\/svg><p style=\"color:#5B6577\">DigiNet: kỹ thuật viên quá tải, khách mất niềm tin<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-14", "label": "B1 · 17", "session": 1, "part": "s3", "title": "CX khác gì chăm sóc khách hàng, và ai chịu trách nhiệm quản trị CX?", "activity": "", "points": [], "notes": "① MỞ\n\"Nếu tôi hỏi trong công ty anh chị, ai phụ trách trải nghiệm khách hàng – rất nhiều người sẽ chỉ về phòng chăm sóc khách hàng hoặc tổng đài. Hôm nay tôi muốn thách thức câu trả lời đó.\" Dừng một nhịp để lớp tự nghĩ về câu trả lời của mình.\n\n② GIẢNG\nPhần 2 kéo dài khoảng 35 phút, trả lời hai câu hỏi gắn liền nhau. Thứ nhất: CX khác gì với chăm sóc khách hàng, với sự hài lòng, với dịch vụ? Nếu không phân biệt rõ, doanh nghiệp sẽ đầu tư vào tổng đài và nghĩ rằng mình đang làm CX. Thứ hai: nếu CX rộng hơn chăm sóc khách hàng, thì ai trong tổ chức chịu trách nhiệm quản trị nó? Chúng ta sẽ đi qua: hình ảnh tảng băng để thấy phần hiển hiện và phần chìm; cách phân biệt các khái niệm; khách hàng thực sự \"mua\" gì; ba yếu tố bổ sung của marketing dịch vụ; ba nền tảng của trải nghiệm xuất sắc. Giữa phần có một hoạt động thảo luận cặp đôi bảy phút.\n\n③ MINH HỌA\nMột hình ảnh để mở phần: khi khách hàng gọi tổng đài phàn nàn, cuộc gọi đó là điểm cuối của một chuỗi sự việc đã xảy ra trước đó – một hóa đơn khó hiểu, một lịch hẹn bị lỡ, một thông tin sai trên website. Tổng đài viên giỏi nhất cũng chỉ xử lý được hậu quả. Nguyên nhân nằm ở những bộ phận chưa bao giờ nói chuyện với khách hàng: kế toán, IT, vận hành, pháp chế. Trong case TechPharma, việc dược sĩ tư vấn vội vàng, chỉ khoảng hai phút mỗi khách, không bắt nguồn từ thái độ của dược sĩ, mà từ cách bố trí nhân sự và chỉ tiêu tại cửa hàng.\n\n④ LIÊN HỆ\nVới nhà quản lý cấp cao, câu hỏi \"ai chịu trách nhiệm CX\" không phải là câu hỏi về sơ đồ tổ chức, mà là câu hỏi về quyền ra quyết định: ai có quyền thay đổi một quy trình khi quy trình đó làm hỏng trải nghiệm của khách?\n\n★ CÂU CHỐT: \"Tổng đài chỉ nghe được tiếng nói của khách hàng. Trải nghiệm được quyết định ở những nơi khách hàng không bao giờ nhìn thấy.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Trong doanh nghiệp anh chị, hiện có ai mang chức danh hoặc KPI liên quan đến trải nghiệm khách hàng không? Người đó báo cáo cho ai?\"\nNếu lớp im lặng: đề nghị giơ tay theo ba lựa chọn – \"có người chuyên trách\", \"nằm trong phòng CSKH/marketing\", \"chưa có ai\".\nCâu trả lời có thể gặp: \"Giám đốc CSKH phụ trách\" → hỏi tiếp: \"Người đó có quyền thay đổi chính sách giá hay quy trình của phòng kỹ thuật không?\". \"Chưa có ai\" → phản hồi: rất phổ biến, và cuối phần này chúng ta sẽ bàn cách bắt đầu.\n\n⑥ CHUYỂN Ý\n\"Hãy bắt đầu bằng một hình ảnh quen thuộc: tảng băng trôi.\"", "html": "<section id=\"b1-14\" data-transition=\"push\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; justify-content:center; gap:24px\">\n<div style=\"display:flex; flex-direction:row; align-items:center; justify-content:space-between\"><p style=\"font-size:280px; font-weight:800; line-height:1; color:#E2783B\">02<\/p><svg aria-label=\"Tảng băng: phần nổi màu cam, phần chìm màu trắng\" width=\"320\" height=\"320\" viewBox=\"0 0 320 320\" style=\"width:320px; height:320px\"><g transform=\"scale(5)\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 34 H60\"/><path d=\"M22 34 L32 14 L42 34\" stroke=\"#E2783B\"/><path d=\"M12 34 L20 56 H44 L52 34\"/><\/g><\/svg><\/div>\n<h1 style=\"font-size:88px; font-weight:700; line-height:1.15; color:#1E2533\">CX khác gì chăm sóc khách hàng, và ai chịu trách nhiệm quản trị CX?<\/h1>\n<\/section>"}, {"id": "b1-15", "label": "B1 · 18", "session": 1, "part": "s3", "title": "Chăm sóc khách hàng chỉ là phần hiển hiện của trải nghiệm", "activity": "", "points": ["CS · phản ứng khi có sự cố", "CX · chủ động, xuyên suốt hành trình", "DigiNet: chờ hotline 3,5 phút chỉ là triệu chứng"], "notes": "① MỞ\n\"Nếu anh chị đi thuyền và nhìn thấy một tảng băng nhỏ, điều đáng lo không phải là phần anh chị nhìn thấy.\" Chỉ vào phần màu trắng. \"Khoảng 90% khối băng nằm dưới mặt nước. Trải nghiệm khách hàng cũng vậy.\"\n\n② GIẢNG\nPhần nổi là chăm sóc khách hàng (Customer Service): tổng đài, quầy hỗ trợ, trả lời tin nhắn. Nó mang tính phản ứng – chỉ hoạt động khi khách đã gặp vấn đề và lên tiếng. Phần chìm là quản trị trải nghiệm khách hàng (CXM): chủ động, bao trùm toàn bộ hành trình từ lúc khách biết đến thương hiệu cho tới khi họ giới thiệu cho người khác. Phần chìm gồm chiến lược, dữ liệu, quy trình liên phòng ban, văn hóa, cách thiết kế sản phẩm và chính sách. Khách hàng chỉ \"chạm\" vào phần nổi, nhưng cảm nhận của họ được quyết định chủ yếu bởi phần chìm.\n\n③ MINH HỌA\nCase DigiNet cho thấy rõ. Phần nổi: thời gian chờ hotline trung bình 3,5 phút, 40% khách phải gọi lại, tổng đài tự động 4–5 bước, nhân viên đọc theo kịch bản. Nếu chỉ nhìn phần nổi, giải pháp sẽ là tuyển thêm tổng đài viên. Nhưng nhìn xuống phần chìm: 65% khiếu nại là về chất lượng mạng giờ cao điểm; 35% khách \"sốc\" khi hết khuyến mãi vì phí phát sinh không được báo trước; kỹ thuật viên đến muộn, không gọi trước; ứng dụng chỉ được đánh giá 2,8/5. Tổng đài quá tải vì những vấn đề phát sinh ở kỹ thuật, tính cước, sản phẩm số. Thêm tổng đài viên chỉ giúp khách phàn nàn nhanh hơn, không giúp họ ít phải phàn nàn hơn.\n\n④ LIÊN HỆ\nKhi một chỉ số dịch vụ xấu đi, câu hỏi của nhà quản lý không nên dừng ở \"tổng đài làm sao vậy\", mà là \"điều gì phía dưới mặt nước đã đẩy khách đến tổng đài?\". Chi phí rẻ nhất cho một cuộc gọi phàn nàn là cuộc gọi không bao giờ phải xảy ra.\n\n★ CÂU CHỐT: \"Cuộc gọi phàn nàn rẻ nhất là cuộc gọi mà khách hàng không bao giờ phải thực hiện.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Ba lý do hàng đầu khiến khách hàng liên hệ tổng đài của anh chị là gì – và bao nhiêu trong số đó bắt nguồn từ bộ phận khác?\"\nNếu lớp im lặng: gợi ý các lý do phổ biến – hỏi về hóa đơn, trạng thái giao hàng, lỗi đăng nhập – rồi hỏi ai \"sở hữu\" từng lý do.\nCâu trả lời có thể gặp: \"Phần lớn là hỏi tình trạng đơn hàng\" → phản hồi: đó là vấn đề thông tin chủ động, có thể giải quyết bằng một tin nhắn cập nhật tự động. \"Chúng tôi không phân loại lý do cuộc gọi\" → đó là việc nên làm ngay: dữ liệu tổng đài là bản đồ phần chìm miễn phí.\n\n⑥ CHUYỂN Ý\n\"Nếu CX lớn hơn chăm sóc khách hàng, vậy nó khác gì với sự hài lòng mà chúng ta vẫn đo hằng tháng?\"", "html": "<section id=\"b1-15\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Chăm sóc khách hàng chỉ là phần hiển hiện của trải nghiệm<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Tảng băng trôi: phần nhỏ xám tối nổi trên mặt nước, phần lớn màu trắng chìm bên dưới\" width=\"760\" height=\"560\" viewBox=\"0 0 760 560\" style=\"width:760px; height:560px\"><path d=\"M290 180 L360 70 L400 110 L440 40 L510 180 Z\" fill=\"#D5DAE1\"/><path d=\"M200 180 L560 180 L640 300 L570 470 L400 545 L240 470 L150 300 Z\" fill=\"#1E2533\"/><path d=\"M0 180 C 60 165, 120 195, 180 180 S 300 165, 380 180 S 500 195, 580 180 S 700 165, 760 180\" fill=\"none\" stroke=\"#8A94A6\" stroke-width=\"8\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:40px\">\n<p><b>CS<\/b> · phản ứng khi có sự cố<\/p>\n<p><b>CX<\/b> · chủ động, xuyên suốt hành trình<\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng wifi – case DigiNet\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 26 A34 34 0 0 1 56 26\"/><path d=\"M16 35 A22 22 0 0 1 48 35\"/><path d=\"M24 44 A11 11 0 0 1 40 44\"/><circle cx=\"32\" cy=\"53\" r=\"4\" fill=\"#E2783B\" stroke=\"none\"/><\/g><\/svg><p style=\"color:#5B6577\">DigiNet: chờ hotline 3,5 phút chỉ là triệu chứng<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-16", "label": "B1 · 19", "session": 1, "part": "s3", "title": "Sự hài lòng là kết quả đo lường; trải nghiệm là toàn bộ hành trình", "activity": "", "points": ["CX · toàn bộ hành trình", "Service · một phần của CX", "Satisfaction · thước đo kết quả", "BizManage: 85% doanh thu từ gia hạn"], "notes": "① MỞ\n\"Có một nhà cung cấp truyền hình trả tiền mà điểm hài lòng ở từng điểm chạm đều cao – nhưng tỷ lệ khách rời bỏ vẫn là vấn đề lớn. Làm sao cả hai điều đó cùng đúng?\" Ví dụ thực tiễn từ bài \"The Truth About Customer Experience\" (Rawson, Duncan & Jones, HBR 2013): hành trình của khách mới kéo dài khoảng ba tháng, gồm khoảng sáu cuộc gọi, một lần kỹ thuật viên đến nhà và nhiều lần trao đổi qua web, thư. Từng tương tác đều được chấm tốt, nhưng mức hài lòng trung bình giảm gần 40% trong suốt hành trình. Một quản lý mô tả: \"Bảng chỉ số của chúng tôi như quả dưa hấu – bên ngoài xanh, bên trong đỏ.\" Nghiên cứu cũng cho thấy kết quả trên toàn hành trình gắn với doanh thu, mua lại và rời bỏ chặt hơn 20–30% so với kết quả ở từng điểm chạm.\n\n② GIẢNG\nBa khái niệm thường bị dùng lẫn lộn. Customer Experience – trải nghiệm khách hàng – là tổng hợp mọi tương tác, cảm nhận và đánh giá của khách về thương hiệu trên toàn bộ hành trình, qua mọi kênh, bao gồm cả cảm xúc chủ quan. Customer Service – dịch vụ khách hàng – là một phần của CX, tập trung hỗ trợ và giải quyết vấn đề, thường là tương tác trực tiếp giữa nhân viên và khách. Customer Satisfaction – sự hài lòng – là thước đo kết quả: so sánh giữa kỳ vọng và thực tế tại một thời điểm, thường gắn với từng giao dịch. Một khái niệm thứ tư đáng nhắc tới là Customer Success – chủ động giúp khách hàng đạt được mục tiêu khi dùng sản phẩm, đặc biệt quan trọng với mô hình thuê bao và B2B. Khách có thể hài lòng với từng cuộc gọi nhưng vẫn chán nản với cả hành trình.\n\n③ MINH HỌA\nCase BizManage: 85% doanh thu đến từ khách gia hạn hằng năm, nên với họ, trải nghiệm chính là doanh thu. Nhưng tỷ lệ nhân viên Customer Success trên khách hàng là 1:130, trong khi mức tham chiếu của ngành là khoảng 1:50–80. 70% CEO khách hàng không trả lời được câu hỏi \"phần mềm này giúp tôi tiết kiệm bao nhiêu?\". Khách có thể hài lòng với từng lần hỗ trợ kỹ thuật, nhưng nếu họ không đạt được mục tiêu kinh doanh của mình, họ sẽ không gia hạn.\n\n④ LIÊN HỆ\nNếu dashboard của ban điều hành chỉ có điểm hài lòng theo giao dịch, anh chị đang nhìn từng viên gạch mà không thấy bức tường. Nhà quản lý cần ít nhất một chỉ số phản ánh toàn hành trình – như tỷ lệ gia hạn, tỷ lệ giới thiệu – bên cạnh chỉ số theo giao dịch.\n\n★ CÂU CHỐT: \"Khách hàng có thể hài lòng với từng lần gặp gỡ, nhưng vẫn rời bỏ cả mối quan hệ.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Chỉ số khách hàng mà ban điều hành của anh chị xem hằng tháng là chỉ số theo giao dịch hay theo cả hành trình?\"\nNếu lớp im lặng: đưa hai ví dụ để lớp tự phân loại – \"CSAT sau cuộc gọi\" (giao dịch) và \"tỷ lệ khách mua lại sau 12 tháng\" (hành trình).\nCâu trả lời có thể gặp: \"Chúng tôi chỉ đo CSAT\" → phản hồi: đó là điểm khởi đầu tốt, nhưng cần bổ sung chỉ số hành trình. \"Chúng tôi đo NPS định kỳ\" → hỏi tiếp: NPS có được nối với dữ liệu gia hạn không? (sẽ bàn sâu ở Buổi 2).\n\n⑥ CHUYỂN Ý\n\"Vậy rốt cuộc, khi bỏ tiền ra, khách hàng đang mua điều gì?\"", "html": "<section id=\"b1-16\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Sự hài lòng là kết quả đo lường; trải nghiệm là toàn bộ hành trình<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Vòng tròn lớn là trải nghiệm, bên trong có vòng tròn nhỏ là dịch vụ, bên cạnh là đồng hồ đo sự hài lòng\" width=\"760\" height=\"480\" viewBox=\"0 0 760 480\" style=\"width:760px; height:480px\"><circle cx=\"280\" cy=\"245\" r=\"228\" fill=\"#FFFFFF\" stroke=\"#8A94A6\" stroke-width=\"8\"/><circle cx=\"220\" cy=\"315\" r=\"105\" fill=\"#1E2533\"/><path d=\"M560 190 A90 90 0 0 1 740 190\" fill=\"none\" stroke=\"#D5DAE1\" stroke-width=\"24\"/><path d=\"M560 190 A90 90 0 0 1 650 100\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"24\"/><line x1=\"650\" y1=\"190\" x2=\"700\" y2=\"135\" stroke=\"#1E2533\" stroke-width=\"8\" stroke-linecap=\"round\"/><circle cx=\"650\" cy=\"190\" r=\"14\" fill=\"#1E2533\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:36px\">\n<p><b>CX<\/b> · toàn bộ hành trình<\/p>\n<p><b>Service<\/b> · một phần của CX<\/p>\n<p><b style=\"color:#E2783B\">Satisfaction<\/b> · thước đo kết quả<\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng màn hình phần mềm – case BizManage\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"6\" y=\"8\" width=\"52\" height=\"36\" rx=\"5\"/><line x1=\"22\" y1=\"56\" x2=\"42\" y2=\"56\"/><line x1=\"32\" y1=\"44\" x2=\"32\" y2=\"56\"/><line x1=\"20\" y1=\"36\" x2=\"20\" y2=\"28\"/><line x1=\"32\" y1=\"36\" x2=\"32\" y2=\"18\"/><line x1=\"44\" y1=\"36\" x2=\"44\" y2=\"24\"/><\/g><\/svg><p style=\"color:#5B6577\">BizManage: 85% doanh thu từ gia hạn<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-17", "label": "B1 · 20", "session": 1, "part": "s3", "title": "Khách hàng mua giá trị cảm nhận, không chỉ mua sản phẩm", "activity": "", "points": ["Lợi ích · chức năng + cảm xúc", "Chi phí · tiền, thời gian, công sức, rủi ro", "Grab: giảm rủi ro giá thiếu minh bạch"], "notes": "① MỞ\n\"Grab thường không rẻ hơn xe ôm truyền thống ở đầu ngõ. Vậy tại sao chỉ sau vài năm, rất nhiều người trong chúng ta gần như không còn vẫy xe ôm nữa?\" Để lớp trả lời tự do vài giây – thường sẽ nghe \"tiện\", \"biết trước giá\", \"an toàn\".\n\n② GIẢNG\nPhilip Kotler định nghĩa giá trị khách hàng cảm nhận (Customer Perceived Value) bằng một phép trừ đơn giản: tổng lợi ích khách nhận được trừ đi tổng chi phí khách phải bỏ ra. Lợi ích gồm hai phần: chức năng (sản phẩm làm được gì) và cảm xúc (khách cảm thấy thế nào). Chi phí không chỉ là tiền: còn có thời gian (chờ đợi, di chuyển), công sức (tìm kiếm, điền biểu mẫu, mặc cả) và chi phí tâm lý (lo lắng, rủi ro bị lừa, sợ chọn sai). Sai lầm phổ biến là chỉ nhìn vào chi phí tiền bạc – nên giải pháp duy nhất nghĩ ra là giảm giá. Trong khi đó, giảm các chi phí phi tiền tệ thường rẻ hơn nhiều và khó bị sao chép hơn.\n\n③ MINH HỌA\nGrab thắng không phải bằng giá, mà bằng cách xóa gần hết chi phí phi tiền tệ: biết trước giá nên không phải mặc cả, không lo bị tính giá thiếu minh bạch; biết xe đang ở đâu nên giảm lo lắng khi chờ; có thông tin tài xế nên an tâm hơn khi đi đêm. Quay về case TechPharma: 55% khách chưa tin mua thuốc online vì lo thuốc giả hoặc giao sai. Đây là một chi phí tâm lý rất lớn. Giảm giá 10% không giải quyết được nỗi lo đó; một dược sĩ gọi xác nhận đơn và hướng dẫn liều dùng thì có thể.\n\n④ LIÊN HỆ\nVới nhà quản lý, câu hỏi hữu ích là: \"Khách hàng của chúng ta đang phải trả những khoản chi phí nào ngoài tiền?\" Mỗi khoản chi phí phi tiền tệ bị loại bỏ là một lần nâng giá trị cảm nhận mà không phải hạ giá bán.\n\n★ CÂU CHỐT: \"Khách hàng không chỉ trả bằng tiền. Họ trả bằng thời gian, công sức và cả nỗi lo của mình.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Khách hàng của anh chị đang phải trả chi phí phi tiền tệ nào lớn nhất – thời gian, công sức hay nỗi lo?\"\nNếu lớp im lặng: gợi ý các ngành cụ thể – ngân hàng (thủ tục giấy tờ), bệnh viện (thời gian chờ), bất động sản (lo rủi ro pháp lý).\nCâu trả lời có thể gặp: \"Thủ tục của chúng tôi phức tạp vì yêu cầu pháp lý\" → phản hồi: pháp lý có thể không đổi được, nhưng cách hướng dẫn, số lần khách phải đi lại thì có thể thiết kế lại. \"Khách lo chất lượng không đồng đều\" → đó là chi phí tâm lý – giải pháp có thể là cam kết, bảo hành, minh bạch.\n\n⑥ CHUYỂN Ý\n\"Với dịch vụ, việc nâng lợi ích và giảm chi phí cho khách phụ thuộc vào ba yếu tố mà marketing hàng hóa truyền thống không có.\"", "html": "<section id=\"b1-17\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Khách hàng mua giá trị cảm nhận, không chỉ mua sản phẩm<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Cán cân: bên lợi ích với trái tim trắng nặng hơn bên chi phí với đồng hồ màu cam\" width=\"760\" height=\"520\" viewBox=\"0 0 760 520\" style=\"width:760px; height:520px\"><rect x=\"280\" y=\"480\" width=\"200\" height=\"24\" rx=\"6\" fill=\"#1E2533\"/><rect x=\"370\" y=\"200\" width=\"20\" height=\"282\" fill=\"#1E2533\"/><line x1=\"100\" y1=\"260\" x2=\"660\" y2=\"140\" stroke=\"#1E2533\" stroke-width=\"14\" stroke-linecap=\"round\"/><circle cx=\"380\" cy=\"200\" r=\"18\" fill=\"#1E2533\"/><line x1=\"100\" y1=\"260\" x2=\"40\" y2=\"400\" stroke=\"#1E2533\" stroke-width=\"8\"/><line x1=\"100\" y1=\"260\" x2=\"160\" y2=\"400\" stroke=\"#1E2533\" stroke-width=\"8\"/><path d=\"M30 400 Q100 470 170 400 Z\" fill=\"#1E2533\"/><path d=\"M100 395 C 60 368, 56 338, 76 330 C 88 325, 98 332, 100 342 C 102 332, 112 325, 124 330 C 144 338, 140 368, 100 395 Z\" fill=\"#1E2533\"/><line x1=\"660\" y1=\"140\" x2=\"600\" y2=\"280\" stroke=\"#1E2533\" stroke-width=\"8\"/><line x1=\"660\" y1=\"140\" x2=\"720\" y2=\"280\" stroke=\"#1E2533\" stroke-width=\"8\"/><path d=\"M590 280 Q660 340 730 280 Z\" fill=\"#E2783B\"/><circle cx=\"660\" cy=\"245\" r=\"30\" fill=\"#FFFFFF\" stroke=\"#E2783B\" stroke-width=\"8\"/><line x1=\"660\" y1=\"245\" x2=\"660\" y2=\"228\" stroke=\"#E2783B\" stroke-width=\"8\"/><line x1=\"660\" y1=\"245\" x2=\"674\" y2=\"252\" stroke=\"#E2783B\" stroke-width=\"8\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:40px\">\n<p><b>Lợi ích<\/b> · chức năng + cảm xúc<\/p>\n<p><b style=\"color:#E2783B\">Chi phí<\/b> · tiền, thời gian, công sức, rủi ro<\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng xe\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 42 V32 L15 18 H49 L58 32 V42 Z\"/><circle cx=\"19\" cy=\"46\" r=\"5\"/><circle cx=\"45\" cy=\"46\" r=\"5\"/><\/g><\/svg><p style=\"color:#5B6577\">Grab: giảm rủi ro giá thiếu minh bạch<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-18", "label": "B1 · 21", "session": 1, "part": "s3", "title": "Dịch vụ đòi hỏi thêm ba yếu tố: Con người, Quy trình, Bằng chứng hữu hình", "activity": "", "points": ["Con người", "Quy trình", "Bằng chứng hữu hình", "Haidilao: làm móng trong lúc chờ bàn"], "notes": "① MỞ\n\"Anh chị có thể trưng bày một chiếc điện thoại trong tủ kính để khách xem trước khi mua. Nhưng làm sao 'trưng bày' một buổi khám bệnh, một khóa học hay một kỳ nghỉ trước khi khách trả tiền?\"\n\n② GIẢNG\nMô hình 4P – Sản phẩm, Giá, Phân phối, Xúc tiến – được xây dựng cho hàng hóa hữu hình. Năm 1981, Booms và Bitner đề xuất bổ sung ba yếu tố cho dịch vụ, tạo thành 7P. Con người (People): trong dịch vụ, nhân viên chính là một phần của sản phẩm; thái độ và kỹ năng của họ quyết định trải nghiệm. Quy trình (Process): cách dịch vụ được cung ứng, từng bước một – vừa cần chuẩn hóa để nhất quán, vừa cần linh hoạt để cá nhân hóa. Bằng chứng hữu hình (Physical Evidence): vì dịch vụ vô hình, khách tìm kiếm những dấu hiệu hữu hình để đánh giá – không gian, đồng phục, tài liệu, giao diện ứng dụng. Trên hình, vòng tròn xám ở giữa là 4P truyền thống; ba cung màu bao quanh là phần dịch vụ – nơi phần lớn khác biệt về trải nghiệm được tạo ra.\n\n③ MINH HỌA\nHaidilao – chuỗi lẩu nổi tiếng từ Trung Quốc, có mặt tại Việt Nam – là ví dụ điển hình của cả ba P. Quy trình: thay vì để khách đứng chờ bàn trong bực bội, họ biến khu chờ thành nơi làm móng, ăn vặt, chơi trò chơi miễn phí. Con người: nhân viên được trao quyền tặng món hoặc xử lý tình huống ngay tại bàn mà không cần xin phép nhiều cấp. Bằng chứng hữu hình: màn trình diễn kéo mì ngay tại bàn trở thành khoảnh khắc khách quay video chia sẻ. Kết quả: thời gian chờ – vốn là điểm đau – lại trở thành một phần đáng nhớ.\n\n④ LIÊN HỆ\nVới doanh nghiệp dịch vụ, ngân sách thường dồn vào 4P – sản phẩm, giá, kênh, quảng cáo – trong khi ba P còn lại, nơi khách thực sự cảm nhận, lại được giao cho vận hành và nhân sự mà không có mục tiêu trải nghiệm rõ ràng. Nhà quản lý cần hỏi: ai đang thiết kế quy trình từ góc nhìn của khách?\n\n★ CÂU CHỐT: \"Trong dịch vụ, nhân viên không chỉ bán sản phẩm. Nhân viên chính là sản phẩm.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Trong ba P dịch vụ, doanh nghiệp anh chị mạnh nhất ở P nào và yếu nhất ở P nào?\"\nNếu lớp im lặng: gợi ý bằng case của các nhóm – TechPharma có 700 dược sĩ nhưng thời gian tư vấn chỉ khoảng hai phút mỗi khách: mạnh về con người nhưng quy trình chưa cho phép con người phát huy.\nCâu trả lời có thể gặp: \"Mạnh về không gian, yếu về quy trình\" → phản hồi: không gian đẹp tạo kỳ vọng cao, quy trình yếu làm kỳ vọng đó sụp đổ – nguy hiểm hơn không gian bình thường. \"Yếu nhất là con người vì nhân viên nghỉ việc nhiều\" → ghi nhận, đó là chủ đề EX ở Buổi 2.\n\n⑥ CHUYỂN Ý\n\"Vậy một trải nghiệm xuất sắc được xây trên những nền tảng nào?\"", "html": "<section id=\"b1-18\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Dịch vụ đòi hỏi thêm ba yếu tố: Con người, Quy trình, Bằng chứng hữu hình<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:80px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Vòng tròn xám ở giữa là 4P truyền thống, bao quanh bởi ba cung màu cam, xám nhạt và trắng là ba P dịch vụ\" width=\"480\" height=\"480\" viewBox=\"0 0 480 480\" style=\"width:480px; height:480px\"><g transform=\"scale(0.857)\"><circle cx=\"280\" cy=\"280\" r=\"150\" fill=\"#D5DAE1\"/><path d=\"M295.7 55.6 A225 225 0 0 1 482.2 378.6\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"56\"/><path d=\"M466.5 405.8 A225 225 0 0 1 93.5 405.8\" fill=\"none\" stroke=\"#8A94A6\" stroke-width=\"56\"/><path d=\"M77.8 378.6 A225 225 0 0 1 264.3 55.6\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"56\"/><\/g><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:32px\">\n<p><b style=\"color:#E2783B\">Con người<\/b><\/p>\n<p><b>Quy trình<\/b><\/p>\n<p><b>Bằng chứng hữu hình<\/b><\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng bát lẩu\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 30 H58 C 58 44, 46 54, 32 54 C 18 54, 6 44, 6 30 Z\"/><line x1=\"34\" y1=\"24\" x2=\"52\" y2=\"4\"/><line x1=\"44\" y1=\"24\" x2=\"60\" y2=\"8\"/><\/g><\/svg><p style=\"color:#5B6577\">Haidilao: làm móng trong lúc chờ bàn<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-19", "label": "B1 · 22", "session": 1, "part": "s3", "title": "Ba nền tảng của trải nghiệm xuất sắc: Thấu cảm, Nhất quán, Chủ động", "activity": "", "points": ["Thấu cảm", "Nhất quán", "Chủ động", "TechPharma: 95% khách không được liên hệ lại"], "notes": "① MỞ\n\"Hãy nghĩ về thương hiệu mà anh chị tin tưởng nhất. Tôi đoán nó không phải là thương hiệu làm anh chị bất ngờ nhiều nhất, mà là thương hiệu hiểu anh chị, lần nào cũng tốt như nhau, và thường giải quyết vấn đề trước khi anh chị phải lên tiếng.\"\n\n② GIẢNG\nCó nhiều mô hình về các yếu tố tạo nên CX xuất sắc; ở đây chúng ta chắt lọc ba nền tảng. Thấu cảm: hiểu nhu cầu và tâm lý của khách, tạo kết nối cảm xúc thay vì chỉ giao dịch – lắng nghe tích cực, hiểu điểm đau, phản hồi bằng sự tôn trọng. Nhất quán: trải nghiệm giống nhau về chất lượng ở mọi kênh, mọi cửa hàng, mọi nhân viên – thông tin đồng bộ, nhận diện thống nhất. Sự nhất quán tạo niềm tin, vì khách biết mình sẽ nhận được gì. Chủ động: dự đoán nhu cầu và xử lý vấn đề trước khi khách phải báo – theo dõi, nhắc nhở, liên hệ lại. Ba nền tảng này phải đi cùng nhau: thấu cảm mà không nhất quán sẽ phụ thuộc vào may mắn gặp đúng nhân viên; nhất quán mà không thấu cảm sẽ trở nên máy móc.\n\n③ MINH HỌA\nCase TechPharma minh họa rõ điều ngược lại của \"chủ động\": 95% khách mua xong không bao giờ được liên hệ lại – \"bán xong là xong\". Trong khi đó, chuỗi có khoảng 180.000 khách mắc bệnh mãn tính mua thuốc định kỳ, nhưng không có tính năng tự động đặt lại, không có dược sĩ quen theo dõi. Ông Hùng 62 tuổi, tiểu đường type 2 và huyết áp, mua thuốc hai tuần một lần – đó là nhóm có giá trị vòng đời cao nhất. Một cuộc gọi nhắc lịch mua thuốc, một tin nhắn nhắc uống thuốc đúng giờ, sẽ là trải nghiệm chủ động đơn giản mà khó có đối thủ nào làm tốt ở quy mô lớn. Với sự nhất quán, Uniqlo là ví dụ quen thuộc: cách gấp đồ và lời chào gần như giống nhau ở cửa hàng khắp thế giới.\n\n④ LIÊN HỆ\nNhà quản lý có thể dùng ba nền tảng này như một bộ lọc nhanh cho mọi sáng kiến CX: sáng kiến này giúp ta thấu cảm hơn, nhất quán hơn, hay chủ động hơn? Nếu không cải thiện nền tảng nào, có lẽ đó chỉ là trang trí.\n\n★ CÂU CHỐT: \"Khách hàng tin tưởng không phải vì doanh nghiệp làm tốt một lần, mà vì doanh nghiệp làm tốt mọi lần.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Trong ba nền tảng, doanh nghiệp anh chị đang thiếu nền tảng nào nhất – và khách hàng cảm nhận sự thiếu hụt đó ở đâu?\"\nNếu lớp im lặng: đề nghị giơ tay theo từng nền tảng, rồi mời một người ở nhóm đông nhất chia sẻ.\nCâu trả lời có thể gặp: \"Thiếu nhất quán giữa các chi nhánh\" → hỏi tiếp: chênh lệch đến từ con người hay quy trình? \"Chúng tôi chỉ phản ứng, chưa chủ động\" → phản hồi: dữ liệu khách hàng hiện có thường đủ để bắt đầu một sáng kiến chủ động nhỏ.\n\n⑥ CHUYỂN Ý\n\"Bây giờ, đến lượt anh chị. Mỗi người đều từng là một khách hàng không hài lòng.\"", "html": "<section id=\"b1-19\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Ba nền tảng của trải nghiệm xuất sắc: Thấu cảm, Nhất quán, Chủ động<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px\">\n<div style=\"flex:1; display:flex; flex-direction:column; align-items:center; gap:24px\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Trái tim màu cam\" width=\"180\" height=\"180\" viewBox=\"0 0 180 180\" style=\"width:180px; height:180px\"><path d=\"M90 160 C 24 116, 10 74, 36 44 C 58 22, 84 32, 90 54 C 96 32, 122 22, 144 44 C 170 74, 156 116, 90 160 Z\" fill=\"#E2783B\"/><\/svg>\n<p style=\"font-weight:700\">Thấu cảm<\/p>\n<\/div>\n<div style=\"flex:1; display:flex; flex-direction:column; align-items:center; gap:24px\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Ba ô vuông xanh giống hệt nhau xếp thẳng hàng\" width=\"180\" height=\"180\" viewBox=\"0 0 180 180\" style=\"width:180px; height:180px\"><rect x=\"10\" y=\"65\" width=\"46\" height=\"46\" rx=\"8\" fill=\"#8A94A6\"/><rect x=\"67\" y=\"65\" width=\"46\" height=\"46\" rx=\"8\" fill=\"#8A94A6\"/><rect x=\"124\" y=\"65\" width=\"46\" height=\"46\" rx=\"8\" fill=\"#8A94A6\"/><line x1=\"10\" y1=\"135\" x2=\"170\" y2=\"135\" stroke=\"#1E2533\" stroke-width=\"8\"/><\/svg>\n<p style=\"font-weight:700\">Nhất quán<\/p>\n<\/div>\n<div style=\"flex:1; display:flex; flex-direction:column; align-items:center; gap:24px\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Mũi tên trắng hướng về phía trước vượt qua một vạch mốc\" width=\"180\" height=\"180\" viewBox=\"0 0 180 180\" style=\"width:180px; height:180px\"><line x1=\"120\" y1=\"20\" x2=\"120\" y2=\"160\" stroke=\"#D5DAE1\" stroke-width=\"8\" stroke-dasharray=\"12 10\"/><path d=\"M20 78 L120 78 L120 50 L170 90 L120 130 L120 102 L20 102 Z\" fill=\"#1E2533\"/><\/svg>\n<p style=\"font-weight:700\">Chủ động<\/p>\n<\/div>\n<\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng viên thuốc – case TechPharma\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><g transform=\"rotate(-40 32 32)\"><rect x=\"6\" y=\"21\" width=\"52\" height=\"22\" rx=\"11\"/><line x1=\"32\" y1=\"21\" x2=\"32\" y2=\"43\"/><\/g><\/g><\/svg><p style=\"color:#5B6577\">TechPharma: 95% khách không được liên hệ lại<\/p><\/div>\n<\/section>"}, {"id": "b1-20", "label": "B1 · 23", "session": 1, "part": "s3", "title": "Thảo luận cặp đôi: Phân tích một trải nghiệm tiêu cực", "activity": "Cặp đôi · 7 phút", "points": ["1. Kể một trải nghiệm tệ gần đây", "2. Hỏng ở điểm chạm nào?", "3. Ai trong tổ chức sở hữu điểm đó?"], "notes": "① MỞ\n\"Mỗi người trong phòng này đều là chuyên gia về trải nghiệm tệ – vì tất cả chúng ta đều từng là khách hàng không hài lòng. Bảy phút tới, chúng ta sẽ dùng chuyên môn đó.\"\n\n② HƯỚNG DẪN HOẠT ĐỘNG\nGhép cặp với người ngồi bên cạnh, ưu tiên người khác ngành. Mỗi người có khoảng ba phút:\n– Bước 1: kể ngắn một trải nghiệm tiêu cực gần đây với tư cách khách hàng – ngân hàng, bệnh viện, hãng bay, nhà mạng, cửa hàng…\n– Bước 2: người nghe giúp xác định chính xác trải nghiệm hỏng ở điểm chạm nào – cuộc gọi, ứng dụng, nhân viên, hóa đơn, thời gian chờ.\n– Bước 3: cùng đoán xem trong doanh nghiệp đó, bộ phận nào \"sở hữu\" điểm chạm ấy – và bộ phận đó có biết mình đã làm khách thất vọng không.\nMột phút cuối: mỗi cặp chọn một câu chuyện điển hình hơn để chia sẻ với lớp. Giảng viên đi quanh lớp, lắng nghe và chọn hai đến ba câu chuyện có tính minh họa cao.\n\n③ DẪN DẮT PHẦN CHIA SẺ\nMời hai hoặc ba cặp chia sẻ, mỗi cặp khoảng một phút. Với mỗi câu chuyện, giảng viên hỏi thêm: \"Theo anh chị, tổng đài viên hoặc nhân viên tiếp xúc có lỗi không, hay nguyên nhân nằm ở chỗ khác?\" Mục tiêu là để lớp tự phát hiện: phần lớn các trải nghiệm tệ không do một người làm sai, mà do các bộ phận không kết nối với nhau – đúng như hình ảnh tảng băng.\nNhững câu chuyện thường gặp: chuyến bay trễ nhưng không được thông báo kịp thời; ứng dụng ngân hàng lỗi đúng lúc cần chuyển tiền; bệnh viện chờ nhiều giờ không rõ lý do; đơn hàng giao sai và mất nhiều ngày để đổi. Với mỗi loại, có thể chỉ ra \"chủ sở hữu\" thực sự: bộ phận vận hành, IT, điều phối, chính sách đổi trả.\n\n④ LIÊN HỆ\nSau khi nghe, hãy đảo vai: \"Nếu câu chuyện anh chị vừa kể xảy ra với khách hàng của chính doanh nghiệp mình, anh chị có biết không? Mất bao lâu để biết?\" Đây là khoảnh khắc chuyển từ góc nhìn khách hàng sang góc nhìn nhà quản lý.\n\n★ CÂU CHỐT: \"Hầu hết trải nghiệm tệ không do một người làm sai, mà do nhiều bộ phận cùng làm đúng phần việc của mình – nhưng không ai nhìn toàn bộ hành trình.\"\n\n⑤ TƯƠNG TÁC\nNếu lớp ngại chia sẻ: giảng viên kể trước một ví dụ để phá băng, rồi mời cặp đầu tiên. Ví dụ thực tiễn: tháng 7/2014, Ryan Block – một người làm công nghệ ở Mỹ – ghi âm cuộc gọi hủy dịch vụ Internet của Comcast. Nhân viên giữ chân khách liên tục chất vấn, không chịu thực hiện yêu cầu; đoạn ghi âm khoảng 8 phút (cả cuộc gọi dài hơn nhiều) lan truyền rộng khắp. Điểm đáng bàn: sau đó, trong thư nội bộ, lãnh đạo Comcast thừa nhận nhân viên đã làm nhiều điều đúng như được đào tạo và trả thưởng để làm, chỉ là làm quá mức. Điểm chạm hỏng ở tổng đài, nhưng \"người sở hữu\" thật là cơ chế KPI giữ chân khách.\nNếu một cặp kể câu chuyện liên quan đến doanh nghiệp của người khác trong lớp: xử lý khéo léo, tập trung vào bài học hệ thống, tránh làm người đó khó xử.\n\n⑥ CHUYỂN Ý\n\"Những câu chuyện vừa rồi dẫn tới một câu hỏi quản trị rất thẳng: trong tổ chức, rốt cuộc ai chịu trách nhiệm cho trải nghiệm?\"", "html": "<section id=\"b1-20\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:40px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Thảo luận cặp đôi: Phân tích một trải nghiệm tiêu cực<\/h2>\n<p style=\"align-self:start; font-weight:700; color:#FFFFFF; background:#E2783B; padding:8px 36px; border-radius:999px\">Cặp đôi · 7 phút<\/p>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Hai bong bóng hội thoại màu cam và xám nhạt\" width=\"520\" height=\"440\" viewBox=\"0 0 520 440\" style=\"width:520px; height:440px\"><path d=\"M30 40 L330 40 C 350 40, 360 50, 360 70 L360 210 C 360 230, 350 240, 330 240 L140 240 L80 300 L90 240 L60 240 C 40 240, 30 230, 30 210 Z\" fill=\"#E2783B\"/><path d=\"M180 200 L470 200 C 490 200, 500 210, 500 230 L500 360 C 500 380, 490 390, 470 390 L450 390 L460 440 L400 390 L210 390 C 190 390, 180 380, 180 360 Z\" fill=\"#8A94A6\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:36px\">\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng bubble\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 10 H56 V42 H30 L18 54 V42 H8 Z\"/><circle cx=\"21\" cy=\"26\" r=\"3\" fill=\"#E2783B\" stroke=\"none\"/><circle cx=\"32\" cy=\"26\" r=\"3\" fill=\"#E2783B\" stroke=\"none\"/><circle cx=\"43\" cy=\"26\" r=\"3\" fill=\"#E2783B\" stroke=\"none\"/><\/g><\/svg><p><b style=\"color:#E2783B\">1.<\/b> Kể một trải nghiệm tệ gần đây<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng pin\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M32 58 C 32 58, 12 38, 12 24 C 12 12, 21 5, 32 5 C 43 5, 52 12, 52 24 C 52 38, 32 58, 32 58 Z\"/><circle cx=\"32\" cy=\"24\" r=\"7\"/><\/g><\/svg><p><b style=\"color:#E2783B\">2.<\/b> Hỏng ở điểm chạm nào?<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng owner\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"24\" cy=\"18\" r=\"9\"/><path d=\"M6 54 C 6 38, 42 38, 42 54\"/><circle cx=\"48\" cy=\"40\" r=\"6\"/><path d=\"M48 46 V60 M48 54 H54\"/><\/g><\/svg><p><b style=\"color:#E2783B\">3.<\/b> Ai trong tổ chức sở hữu điểm đó?<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-21", "label": "B1 · 24", "session": 1, "part": "s3", "title": "Ai chịu trách nhiệm quản trị trải nghiệm trong tổ chức?", "activity": "", "points": ["Hành trình đi ngang mọi phòng ban", "Trách nhiệm chung dễ thành không ai chịu trách nhiệm", "Life Biz School: 6 tuần sau khi nộp học phí, ai phụ trách?"], "notes": "① MỞ\n\"Trong câu chuyện anh chị vừa kể cho nhau, nếu phải gọi đúng một người trong doanh nghiệp đó để chịu trách nhiệm cho toàn bộ trải nghiệm – anh chị sẽ gọi ai?\" Thường lớp sẽ ngập ngừng. \"Chính sự ngập ngừng đó là câu trả lời.\"\n\n② GIẢNG\nSơ đồ tổ chức được vẽ theo chiều dọc: mỗi phòng ban có mục tiêu, ngân sách và KPI riêng. Nhưng hành trình của khách hàng đi theo chiều ngang, cắt qua tất cả các phòng ban – như dải màu cam trên hình. Khách biết đến qua marketing, mua qua kinh doanh, được phục vụ bởi vận hành, thanh toán qua kế toán, được hỗ trợ bởi chăm sóc khách hàng. Mỗi phòng có thể đạt KPI của mình, trong khi trải nghiệm tổng thể của khách vẫn tệ. Khi CX được tuyên bố là \"trách nhiệm của tất cả mọi người\", trên thực tế nó thường trở thành trách nhiệm của không ai. Các doanh nghiệp làm CX hiệu quả thường có ba lớp: CEO bảo trợ trực tiếp, một đầu mối CX có thẩm quyền liên phòng ban, và các \"chủ sở hữu hành trình\" (journey owner) chịu trách nhiệm từ đầu đến cuối cho từng hành trình quan trọng.\n\n③ MINH HỌA\nCase Life Biz School: sau khi học viên nộp hồ sơ và đóng học phí 220 triệu, có một \"vùng chết\" kéo dài 4–8 tuần trước khi khai giảng. Anh Minh, 28 tuổi, đã đóng tiền rồi chờ sáu tuần mà không nhận được một email hay video nào từ trường – trong khi xung quanh có khóa học trực tuyến chỉ khoảng 80 triệu. Anh suýt xin hủy và kể với bạn bè câu chuyện \"220 triệu mà im lặng sáu tuần\". 23% học viên rơi vào trạng thái hối tiếc sau khi mua. Vì sao? Phòng tuyển sinh coi việc của mình đã xong khi học viên đóng tiền; phòng đào tạo chỉ bắt đầu từ buổi định hướng. Khoảng giữa không thuộc về ai.\n\n④ LIÊN HỆ\nCâu hỏi cho CEO: trong doanh nghiệp của anh chị, có \"vùng chết\" nào giữa hai phòng ban – nơi khách hàng bị bỏ lại? Thường những vùng này nằm ngay sau khi khách trả tiền, khi bàn giao giữa kinh doanh và vận hành.\n\n★ CÂU CHỐT: \"Sơ đồ tổ chức được vẽ theo chiều dọc. Khách hàng lại đi theo chiều ngang.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Trong hành trình của khách hàng ở doanh nghiệp anh chị, đâu là khoảng trống giữa hai phòng ban mà không ai thực sự sở hữu?\"\nNếu lớp im lặng: gợi ý các điểm bàn giao phổ biến – từ kinh doanh sang triển khai, từ bán hàng sang bảo hành, từ tuyển dụng sang hội nhập.\nCâu trả lời có thể gặp: \"Giai đoạn sau bán hàng, trước khi bàn giao\" → phản hồi: đó thường là nơi cảm xúc của khách xuống thấp nhất. \"Chúng tôi đã có phòng CX\" → hỏi tiếp: phòng đó có quyền yêu cầu phòng khác thay đổi quy trình không?\n\nTÓM TẮT PHẦN 2 (một câu): CX không phải là việc của phòng chăm sóc khách hàng; đó là một hành trình đi ngang tổ chức và cần một người có thẩm quyền để sở hữu.\n\n⑥ CHUYỂN Ý\n\"Chúng ta nghỉ giải lao 15 phút. Khi quay lại, câu hỏi sẽ là: chúng ta thực sự hiểu khách hàng đến mức nào?\"", "html": "<section id=\"b1-21\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Ai chịu trách nhiệm quản trị trải nghiệm trong tổ chức?<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Sơ đồ tổ chức với CEO ở trên, bốn phòng ban bên dưới và một dải màu cam cắt ngang qua tất cả phòng ban\" width=\"512\" height=\"333\" viewBox=\"0 0 512 333\" style=\"width:512px; height:333px\"><g transform=\"scale(0.800)\"><g transform=\"scale(0.8)\"><rect x=\"320\" y=\"20\" width=\"160\" height=\"80\" rx=\"10\" fill=\"#1E2533\"/><line x1=\"400\" y1=\"100\" x2=\"400\" y2=\"160\" stroke=\"#1E2533\" stroke-width=\"8\"/><line x1=\"100\" y1=\"160\" x2=\"700\" y2=\"160\" stroke=\"#1E2533\" stroke-width=\"8\"/><line x1=\"100\" y1=\"160\" x2=\"100\" y2=\"200\" stroke=\"#1E2533\" stroke-width=\"8\"/><line x1=\"300\" y1=\"160\" x2=\"300\" y2=\"200\" stroke=\"#1E2533\" stroke-width=\"8\"/><line x1=\"500\" y1=\"160\" x2=\"500\" y2=\"200\" stroke=\"#1E2533\" stroke-width=\"8\"/><line x1=\"700\" y1=\"160\" x2=\"700\" y2=\"200\" stroke=\"#1E2533\" stroke-width=\"8\"/><rect x=\"30\" y=\"200\" width=\"140\" height=\"280\" rx=\"10\" fill=\"#D5DAE1\"/><rect x=\"230\" y=\"200\" width=\"140\" height=\"280\" rx=\"10\" fill=\"#D5DAE1\"/><rect x=\"430\" y=\"200\" width=\"140\" height=\"280\" rx=\"10\" fill=\"#D5DAE1\"/><rect x=\"630\" y=\"200\" width=\"140\" height=\"280\" rx=\"10\" fill=\"#D5DAE1\"/><rect x=\"0\" y=\"310\" width=\"760\" height=\"60\" fill=\"#E2783B\"/><path d=\"M760 290 L800 340 L760 390 Z\" fill=\"#E2783B\"/><\/g><\/g><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:28px\">\n<p>Hành trình đi <b style=\"color:#E2783B\">ngang<\/b> mọi phòng ban<\/p>\n<p>Trách nhiệm chung dễ thành <b>không ai chịu trách nhiệm<\/b><\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng mũ tốt nghiệp – case Life Biz School\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 24 L32 12 L60 24 L32 36 Z\"/><path d=\"M16 30 V42 C 24 50, 40 50, 48 42 V30\"/><line x1=\"56\" y1=\"26\" x2=\"56\" y2=\"42\"/><\/g><\/svg><p style=\"color:#5B6577\">Life Biz School: 6 tuần sau khi nộp học phí, ai phụ trách?<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-22", "label": "B1 · 25", "session": 1, "part": "s4", "title": "Giải lao 15 phút", "activity": "", "points": ["Khách hàng của bạn đang nghĩ gì lúc này?"], "notes": "TRƯỚC KHI NGHỈ\nThông báo rõ giờ quay lại (ví dụ \"chúng ta bắt đầu lại đúng 9 giờ 45\") và nhắc mỗi nhóm mang theo bản in case của nhóm, vì ngay sau giờ nghỉ sẽ có hoạt động nhóm 15 phút với case.\n\n① GỢI Ý SUY NGẪM TRONG GIỜ NGHỈ\nCâu hỏi trên slide – \"Khách hàng của bạn đang nghĩ gì lúc này?\" – là lời mời chứ không phải bài tập bắt buộc. Có thể nói: \"Trong lúc uống cà phê, hãy thử nghĩ: ngay giờ phút này, có một khách hàng nào đó đang dùng sản phẩm của anh chị. Họ đang vui, đang bực, hay đang phân vân? Anh chị có cách nào để biết không?\" Câu hỏi này dẫn trực tiếp vào Phần 3 về Persona và Empathy Map.\n\n② VIỆC GIẢNG VIÊN NÊN LÀM TRONG GIỜ NGHỈ\n– Đi quanh lớp, trò chuyện ngắn với hai, ba học viên chưa phát biểu. Hỏi họ làm ngành gì và câu chuyện trải nghiệm tệ họ vừa kể. Những chi tiết này rất có giá trị để gọi tên họ một cách tự nhiên ở phần sau.\n– Kiểm tra lại số lượng mẫu Persona và Empathy Map in sẵn cho bốn nhóm.\n– Ghi lại trên bảng các từ khóa lớp đã chia sẻ ở Phần 1 và Phần 2 (những lớp trải nghiệm, những chi phí phi tiền tệ, những \"vùng chết\") để dùng lại ở phần tổng kết cuối buổi.\n\n③ KHI QUAY LẠI\nMở lại bằng một câu hỏi nhẹ để kéo năng lượng: \"Có ai trong giờ nghỉ nhận được tin nhắn hoặc cuộc gọi từ một thương hiệu không? Đó là trải nghiệm tích cực hay phiền toái?\" Câu hỏi này vừa giúp lớp tập trung trở lại, vừa là cầu nối tự nhiên: mọi thương hiệu đều nghĩ mình hiểu khách hàng, nhưng khách hàng thường cảm thấy khác.\n\n④ LIÊN HỆ\nNếu có học viên đến muộn, không cần chờ. Bắt đầu bằng slide chuyển phần; người đến muộn vẫn theo kịp vì phần mới mở đầu bằng một câu hỏi lớn.\n\n★ CÂU CHỐT (dùng khi mở lại sau giờ nghỉ): \"Mọi doanh nghiệp đều tin rằng mình hiểu khách hàng. Rất ít doanh nghiệp từng kiểm chứng niềm tin đó.\"\n\n⑤ TƯƠNG TÁC\nNếu còn thời gian trước khi vào Phần 3, hỏi nhanh: \"Anh chị đoán tỷ lệ bao nhiêu phần trăm khách hàng của mình sẽ đồng ý rằng 'doanh nghiệp này hiểu tôi'?\" Ghi lại vài con số dự đoán; chúng ta sẽ quay lại con số này ở đầu Buổi 2 với nghiên cứu của Bain.\n\n⑥ CHUYỂN Ý\n\"Chào mừng anh chị quay lại. Phần 3 bắt đầu bằng một câu hỏi khó hơn chúng ta tưởng.\"", "html": "<section id=\"b1-22\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:row; gap:96px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Tách cà phê với hơi nóng bốc lên\" width=\"560\" height=\"600\" viewBox=\"0 0 560 600\" style=\"width:560px; height:600px\"><path d=\"M170 60 C 140 110, 200 140, 170 190\" fill=\"none\" stroke=\"#D5DAE1\" stroke-width=\"14\" stroke-linecap=\"round\"/><path d=\"M260 40 C 230 100, 290 130, 260 190\" fill=\"none\" stroke=\"#D5DAE1\" stroke-width=\"14\" stroke-linecap=\"round\"/><path d=\"M350 60 C 320 110, 380 140, 350 190\" fill=\"none\" stroke=\"#D5DAE1\" stroke-width=\"14\" stroke-linecap=\"round\"/><path d=\"M60 240 L460 240 L430 470 C 425 510, 395 530, 360 530 L160 530 C 125 530, 95 510, 90 470 Z\" fill=\"#E2783B\"/><path d=\"M455 280 C 540 280, 540 420, 440 420\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"28\"/><rect x=\"20\" y=\"555\" width=\"480\" height=\"24\" rx=\"12\" fill=\"#1E2533\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:40px\">\n<h2 style=\"font-size:120px; font-weight:800; line-height:1.05; color:#1E2533\">Giải lao 15 phút<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng bong bóng suy nghĩ\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 10 H56 V42 H30 L18 54 V42 H8 Z\"/><circle cx=\"21\" cy=\"26\" r=\"3\" fill=\"#E2783B\" stroke=\"none\"/><circle cx=\"32\" cy=\"26\" r=\"3\" fill=\"#E2783B\" stroke=\"none\"/><circle cx=\"43\" cy=\"26\" r=\"3\" fill=\"#E2783B\" stroke=\"none\"/><\/g><\/svg><p style=\"color:#5B6577\">Khách hàng của bạn đang nghĩ gì lúc này?<\/p><\/div>\n<\/div>\n<\/section>"}, {"id": "b1-23", "label": "B1 · 26", "session": 1, "part": "s5", "title": "Doanh nghiệp thực sự hiểu khách hàng đến mức nào?", "activity": "", "points": [], "notes": "① MỞ\n\"Trước giờ nghỉ, tôi có hỏi: anh chị đoán bao nhiêu phần trăm khách hàng sẽ đồng ý rằng 'doanh nghiệp này hiểu tôi'? Hãy giữ con số đó trong đầu. Bây giờ tôi hỏi ngược lại: anh chị có thể kể tên ba nỗi lo lớn nhất của khách hàng mục tiêu – không phải về sản phẩm, mà về cuộc sống của họ – không?\" Để lớp suy nghĩ vài giây. Thường sẽ ít người trả lời được ngay.\n\n② GIẢNG\nPhần 3 kéo dài khoảng 45 phút và là phần \"đi sâu\" nhất của buổi hôm nay. Chúng ta sẽ đi từ gốc rễ của nhu cầu tới công cụ thấu hiểu cụ thể:\n– Khách hàng thực sự mua gì: kết quả họ muốn đạt được, không phải bản thân sản phẩm.\n– Vì sao thông điệp phải chạm đúng tầng nhu cầu.\n– Sự khác biệt giữa phân khúc và chân dung khách hàng (Persona).\n– Cách hỏi để nghe được sự thật, không phải lời khen xã giao.\n– Kết hợp dữ liệu định lượng và định tính.\n– Bản đồ thấu cảm và cách viết một insight.\nCuối phần, mỗi nhóm có 15 phút để xây dựng Persona và Empathy Map cho doanh nghiệp trong case của mình.\n\n③ MINH HỌA\nMột nghịch lý thường gặp: doanh nghiệp ngày nay có nhiều dữ liệu về khách hàng hơn bất cứ thời điểm nào trong lịch sử – lịch sử giao dịch, lượt nhấp chuột, vị trí, thiết bị. Nhưng khi hỏi \"vì sao khách hàng này rời đi?\", câu trả lời thường vẫn là phỏng đoán. Case DigiNet là ví dụ: doanh nghiệp biết mỗi hộ dùng bao nhiêu GB, vào giờ nào, trên thiết bị gì, nhưng vẫn gửi cùng một tin nhắn khuyến mãi cho tất cả, khiến khách cảm thấy \"mình chỉ là một con số\".\n\n④ LIÊN HỆ\nVới nhà quản lý cấp cao, rủi ro lớn nhất không phải là thiếu dữ liệu, mà là tin rằng mình đã hiểu khách hàng. Những quyết định lớn – sản phẩm mới, định giá, kênh phân phối – thường được đưa ra dựa trên hình ảnh khách hàng trong đầu ban điều hành, vốn đã cũ hoặc chưa từng được kiểm chứng.\n\n★ CÂU CHỐT: \"Doanh nghiệp chưa bao giờ có nhiều dữ liệu về khách hàng như hôm nay, nhưng cũng hiếm khi hiểu khách hàng ít như hôm nay.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Lần gần nhất anh chị – với tư cách lãnh đạo – trực tiếp nói chuyện với một khách hàng bình thường, không phải khách VIP hay đối tác lớn, là khi nào?\"\nNếu lớp im lặng: đề nghị giơ tay theo mốc thời gian – \"trong tuần này\", \"trong tháng này\", \"lâu hơn thế\".\nCâu trả lời có thể gặp: \"Tôi chủ yếu đọc báo cáo\" → phản hồi: báo cáo cho biết chuyện gì xảy ra, nhưng hiếm khi cho biết vì sao. \"Tôi thường xuyên đi cửa hàng\" → khen ngợi và hỏi: điều gì anh chị học được từ lần gần nhất mà báo cáo không cho thấy?\n\n⑥ CHUYỂN Ý\n\"Hãy bắt đầu từ câu hỏi căn bản nhất: khi trả tiền, khách hàng thực sự đang mua điều gì?\"", "html": "<section id=\"b1-23\" data-transition=\"push\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; justify-content:center; gap:24px\">\n<div style=\"display:flex; flex-direction:row; align-items:center; justify-content:space-between\"><p style=\"font-size:280px; font-weight:800; line-height:1; color:#E2783B\">03<\/p><svg aria-label=\"Kính lúp soi vào một khách hàng\" width=\"320\" height=\"320\" viewBox=\"0 0 320 320\" style=\"width:320px; height:320px\"><g transform=\"scale(5)\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"26\" cy=\"20\" r=\"10\"/><path d=\"M8 56 C 8 38, 44 38, 44 56\"/><circle cx=\"44\" cy=\"36\" r=\"10\" stroke=\"#E2783B\"/><path d=\"M51 43 L60 52\" stroke=\"#E2783B\"/><\/g><\/svg><\/div>\n<h1 style=\"font-size:88px; font-weight:700; line-height:1.15; color:#1E2533\">Doanh nghiệp thực sự hiểu khách hàng đến mức nào?<\/h1>\n<\/section>"}, {"id": "b1-24", "label": "B1 · 27", "session": 1, "part": "s5", "title": "Khách hàng mua kết quả, không mua công cụ (Jobs to be Done)", "activity": "", "points": ["Nhu cầu → Mong muốn → Sức mua", "Khách \"thuê\" sản phẩm để hoàn thành một việc", "Life Biz School: \"thuê\" MBA để lên Director"], "notes": "① MỞ\n\"Có một câu nói nổi tiếng mà giáo sư Clayton Christensen thường trích từ Theodore Levitt: 'Người ta không muốn mua một mũi khoan cỡ sáu li. Họ muốn một cái lỗ sáu li.'\" Chỉ vào hình. \"Và nếu nghĩ sâu hơn: họ cũng không thực sự muốn cái lỗ – họ muốn treo một bức ảnh gia đình lên tường.\"\n\n② GIẢNG\nÝ thứ nhất là cấu trúc nhu cầu kinh điển của Kotler. Nhu cầu (Needs) là sự thiếu hụt cơ bản – ăn, ở, an toàn, kết nối; doanh nghiệp không tạo ra nhu cầu. Mong muốn (Wants) là nhu cầu được định hình qua văn hóa và cá nhân – khát nước là nhu cầu, muốn một ly trà sữa là mong muốn. Sức mua (Demands) là mong muốn cộng với khả năng chi trả. Ý thứ hai là Jobs to be Done của Christensen: khách hàng \"thuê\" một sản phẩm để hoàn thành một \"công việc\" trong cuộc sống của họ. Công việc đó có ba chiều: chức năng (làm được gì), cảm xúc (cảm thấy thế nào) và xã hội (người khác nhìn mình ra sao). Khi hiểu đúng công việc, đối thủ thực sự có thể không phải là doanh nghiệp cùng ngành.\n\n③ MINH HỌA\nChristensen từng kể về nghiên cứu cho một chuỗi đồ ăn nhanh muốn bán thêm sữa lắc. Khảo sát về hương vị không giúp gì. Khi quan sát, nhóm nghiên cứu nhận thấy một phần lớn sữa lắc được bán vào sáng sớm cho người lái xe đi làm một mình. \"Công việc\" họ thuê sữa lắc là: giữ cho quãng đường dài đỡ buồn chán và no tới trưa. Đối thủ thật không phải là chuỗi khác, mà là chuối, bánh mì, hay cà phê. Case Life Biz School: anh Tuấn, CEO một doanh nghiệp nhỏ, \"thuê\" chương trình MBA để nâng tầm lãnh đạo và có mạng lưới CEO; chị Lan, quản lý cấp trung ngân hàng, \"thuê\" nó để thăng tiến lên vị trí Director. Cùng một sản phẩm, hai công việc khác nhau – và hai trải nghiệm cần thiết kế khác nhau.\n\n④ LIÊN HỆ\nVới nhà quản lý, câu hỏi JTBD giúp mở rộng tầm nhìn cạnh tranh và định hướng đổi mới. Thay vì hỏi \"làm sao bán được nhiều sản phẩm hơn\", hãy hỏi \"khách hàng đang cố hoàn thành việc gì, và chúng ta giúp họ làm việc đó tốt hơn ra sao?\"\n\n★ CÂU CHỐT: \"Khách hàng không mua sản phẩm của anh chị. Họ thuê nó để tiến thêm một bước trong cuộc sống của chính họ.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Khách hàng đang 'thuê' sản phẩm chủ lực của anh chị để hoàn thành công việc gì – và ngoài đối thủ cùng ngành, họ còn có thể 'thuê' ai khác cho công việc đó?\"\nNếu lớp im lặng: làm mẫu với một ngành quen thuộc – ví dụ khách \"thuê\" ngân hàng số để \"quản lý tiền mà không phải nghĩ nhiều\".\nCâu trả lời có thể gặp: \"Khách mua để tiết kiệm chi phí\" → hỏi tiếp: đó là chiều chức năng; chiều cảm xúc và xã hội là gì? \"Đối thủ của chúng tôi hóa ra là… chính Excel\" → rất hay, đó đúng là trường hợp của BizManage.\n\n⑥ CHUYỂN Ý\n\"Hiểu công việc của khách rồi, câu hỏi tiếp theo là: nói với họ bằng thông điệp nào? Câu trả lời phụ thuộc vào tầng nhu cầu mà ta chạm tới.\"", "html": "<section id=\"b1-24\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Khách hàng mua kết quả, không mua công cụ (Jobs to be Done)<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Mũi khoan xám tối hướng vào bức tường, trên tường là một lỗ khoan tròn được khoanh màu cam\" width=\"640\" height=\"480\" viewBox=\"0 0 640 480\" style=\"width:640px; height:480px\"><rect x=\"40\" y=\"200\" width=\"200\" height=\"90\" rx=\"16\" fill=\"#D5DAE1\"/><rect x=\"100\" y=\"290\" width=\"70\" height=\"140\" rx=\"12\" fill=\"#D5DAE1\"/><rect x=\"240\" y=\"225\" width=\"40\" height=\"40\" fill=\"#D5DAE1\"/><path d=\"M280 232 L400 238 L420 245 L400 252 L280 258 Z\" fill=\"#D5DAE1\"/><rect x=\"480\" y=\"40\" width=\"40\" height=\"400\" fill=\"#1E2533\"/><circle cx=\"500\" cy=\"245\" r=\"22\" fill=\"#FFFFFF\"/><circle cx=\"500\" cy=\"245\" r=\"60\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"8\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:40px\">\n<p>Nhu cầu → Mong muốn → <b>Sức mua<\/b><\/p>\n<p>Khách \"thuê\" sản phẩm để hoàn thành <b style=\"color:#E2783B\">một việc<\/b><\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng mũ tốt nghiệp – case Life Biz School\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 24 L32 12 L60 24 L32 36 Z\"/><path d=\"M16 30 V42 C 24 50, 40 50, 48 42 V30\"/><line x1=\"56\" y1=\"26\" x2=\"56\" y2=\"42\"/><\/g><\/svg><p style=\"color:#5B6577\">Life Biz School: \"thuê\" MBA để lên Director<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-25", "label": "B1 · 28", "session": 1, "part": "s5", "title": "Thông điệp hiệu quả khi chạm đúng tầng nhu cầu", "activity": "", "points": ["Xác định tầng nhu cầu khách đang ở", "Nói đúng ngôn ngữ của tầng đó", "Mercedes: bán sự ngưỡng mộ, không bán tiết kiệm xăng"], "notes": "① MỞ\n\"Nếu một nhân viên bán xe Mercedes mở đầu bằng câu 'Mẫu xe này rất tiết kiệm xăng', anh chị nghĩ khách hàng sẽ phản ứng thế nào?\" Thường lớp sẽ cười. \"Thông tin không sai – nhưng nó nói sai tầng.\"\n\n② GIẢNG\nTháp nhu cầu của Abraham Maslow (1943) gồm năm tầng, từ dưới lên: sinh lý (ăn, ngủ), an toàn (bảo vệ bản thân, tài sản), xã hội (tình yêu, kết nối, thuộc về), được tôn trọng (địa vị, sự công nhận) và tự thể hiện (sống đúng với đam mê và tiềm năng). Trong marketing và CX, tháp này hữu ích như một công cụ định vị: mỗi sản phẩm, mỗi phân khúc thường gắn chủ yếu với một tầng. Ví dụ quen thuộc: mì ăn liền ở tầng sinh lý; Volvo và các công ty bảo hiểm ở tầng an toàn; mạng xã hội ở tầng kết nối; Mercedes, Rolex ở tầng được tôn trọng; Nike, Apple chạm tới tầng tự thể hiện. Ý chính của slide có hai phần: xác định khách đang ở tầng nào, và thiết kế cả thông điệp lẫn trải nghiệm bằng ngôn ngữ của tầng đó.\n\n③ MINH HỌA\nVới Mercedes, khách đang mua sự ngưỡng mộ – tầng thứ tư được tô màu cam. Vì vậy trải nghiệm tại showroom, cách nhân viên đón khách, cả thủ tục giao xe đều được thiết kế như một nghi thức tôn vinh chủ nhân mới. Chuyển sang case TechPharma: với ông Hùng 62 tuổi mắc bệnh mãn tính hay chị Mai mua thuốc cho con nhỏ, nỗi sợ lớn nhất là mua nhầm thuốc, thuốc giả, sai liều – họ đang ở tầng an toàn. Trải nghiệm phải nói ngôn ngữ của sự an tâm: dược sĩ kiểm tra tương tác thuốc, nhãn liều dùng rõ ràng, xác nhận đơn trước khi giao. Một chương trình tích điểm hào nhoáng sẽ không ch
