ạm đúng tầng.\n\n④ LIÊN HỆ\nNhiều doanh nghiệp dùng một thông điệp cho mọi phân khúc, hoặc nói về tính năng (tầng thấp) trong khi khách đang tìm kiếm sự công nhận (tầng cao) – hoặc ngược lại. Nhà quản lý nên hỏi đội ngũ: \"Với phân khúc này, khách đang ở tầng nào, và trải nghiệm của chúng ta có nói đúng ngôn ngữ đó không?\"\n\n★ CÂU CHỐT: \"Một thông điệp đúng nhưng chạm sai tầng nhu cầu vẫn là một thông điệp thất bại.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Phân khúc khách hàng quan trọng nhất của anh chị đang ở tầng nào của tháp – và trải nghiệm hiện tại đang nói ngôn ngữ của tầng nào?\"\nNếu lớp im lặng: gợi ý với ngành ngân hàng – khách vay mua nhà ở tầng an toàn, khách ngân hàng ưu tiên ở tầng được tôn trọng.\nCâu trả lời có thể gặp: \"Khách của chúng tôi ở nhiều tầng khác nhau\" → phản hồi: đúng vậy, đó chính là lý do cần Persona – chủ đề của slide tiếp theo. \"Chúng tôi quảng cáo tính năng nhưng khách mua vì thương hiệu\" → đó là dấu hiệu lệch tầng cần xem lại.\n\n⑥ CHUYỂN Ý\n\"Khi khách hàng ở nhiều tầng khác nhau, phân khúc truyền thống bắt đầu bộc lộ giới hạn. Đó là lúc chúng ta cần Persona.\"", "html": "<section id=\"b1-25\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Thông điệp hiệu quả khi chạm đúng tầng nhu cầu<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Kim tự tháp năm tầng, tầng thứ tư được tô màu cam nổi bật\" width=\"608\" height=\"448\" viewBox=\"0 0 608 448\" style=\"width:608px; height:448px\"><g transform=\"scale(0.800)\"><path d=\"M380 20 L450 120 L310 120 Z\" fill=\"#D5DAE1\"/><path d=\"M302 132 L458 132 L528 232 L232 232 Z\" fill=\"#E2783B\"/><path d=\"M224 244 L536 244 L606 344 L154 344 Z\" fill=\"#D5DAE1\"/><path d=\"M146 356 L614 356 L684 456 L76 456 Z\" fill=\"#D5DAE1\"/><path d=\"M68 468 L692 468 L752 552 L8 552 Z\" fill=\"#1E2533\"/><\/g><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:28px\">\n<p>Xác định <b>tầng nhu cầu<\/b> khách đang ở<\/p>\n<p>Nói đúng <b style=\"color:#E2783B\">ngôn ngữ của tầng đó<\/b><\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng xe\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 42 V32 L15 18 H49 L58 32 V42 Z\"/><circle cx=\"19\" cy=\"46\" r=\"5\"/><circle cx=\"45\" cy=\"46\" r=\"5\"/><\/g><\/svg><p style=\"color:#5B6577\">Mercedes: bán sự ngưỡng mộ, không bán tiết kiệm xăng<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-26", "label": "B1 · 29", "session": 1, "part": "s5", "title": "Phân khúc cho biết \"ai\"; Persona giải thích \"vì sao\"", "activity": "", "points": ["STP/RFM · ai, mua gì, bao nhiêu", "Persona · động cơ, nỗi sợ, mục tiêu", "TechPharma: ông Hùng, 62 tuổi, mua 26 lần/năm"], "notes": "① MỞ\n\"Hai khách hàng cùng 45 tuổi, cùng sống ở Hà Nội, cùng thu nhập 50 triệu một tháng, cùng mua một chiếc SUV. Một người mua vì cần chở ba đứa con đi học an toàn. Người kia mua vì vừa được thăng chức và muốn cả công ty nhìn thấy điều đó. Trong báo cáo phân khúc, họ là một người. Trong thực tế, họ cần hai trải nghiệm hoàn toàn khác nhau.\"\n\n② GIẢNG\nPhân khúc truyền thống – STP (Segmentation, Targeting, Positioning) theo nhân khẩu học, hay RFM (Recency, Frequency, Monetary: lần mua gần nhất, tần suất, giá trị chi tiêu) – rất hữu ích để trả lời câu hỏi \"ai\" và \"mua gì, bao nhiêu\". Nhưng những dữ liệu đó không giải thích được \"vì sao\". Persona – chân dung khách hàng – là một nhân vật đại diện cho một nhóm khách, được xây dựng từ nghiên cứu thật, mô tả động cơ, mục tiêu, nỗi sợ, thói quen, kênh ưa thích và mức độ sử dụng công nghệ. Persona không thay thế phân khúc; nó \"thổi hồn\" vào phân khúc để đội ngũ có thể thấu cảm và thiết kế cho một con người cụ thể.\n\n③ MINH HỌA\nCase TechPharma: nếu chỉ nhìn RFM, ông Hùng là một khách hàng \"giá trị cao\" – mua thuốc hai tuần một lần, khoảng 26 lần mỗi năm. Hệ thống sẽ gửi ông mã giảm giá. Nhưng Persona của ông cho thấy: ông 62 tuổi, mắc tiểu đường type 2 và huyết áp, đang dùng nhiều loại thuốc cùng lúc. Điều ông cần là dược sĩ nhớ lịch sử thuốc của mình, kiểm tra tương tác, nhắc lịch uống, giao tận nhà. Điều ông sợ là mua nhầm thuốc và tương tác thuốc nguy hiểm. Trong case, tình huống thật đã xảy ra: một dược sĩ trẻ bán thuốc mới mà không kiểm tra bốn loại ông đang dùng, ông bị tụt huyết áp phải nhập viện. Mã giảm giá không bao giờ giải quyết được nỗi sợ đó.\n\n④ LIÊN HỆ\nVới nhà quản lý, Persona có ba giá trị thực tế: giúp các phòng ban cùng nhìn về một khách hàng cụ thể thay vì những con số trừu tượng; giúp ưu tiên tính năng và ngân sách; và giúp phát hiện những rủi ro mà báo cáo tài chính không cho thấy.\n\n★ CÂU CHỐT: \"Dữ liệu cho chúng ta biết khách hàng là ai. Chỉ sự thấu hiểu mới cho biết vì sao họ ở lại hay rời đi.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Doanh nghiệp anh chị đã có Persona chưa? Nếu có, lần cuối Persona đó được dùng để ra một quyết định cụ thể là khi nào?\"\nNếu lớp im lặng: đề nghị giơ tay theo ba mức – \"chưa có\", \"có nhưng ít dùng\", \"dùng thường xuyên\".\nCâu trả lời có thể gặp: \"Có, do agency làm, nằm trong file trình bày\" → phản hồi: đó là Persona \"trưng bày\", sẽ bàn ở Buổi 2 về CX hình thức. \"Persona của chúng tôi dựa trên cảm nhận của đội bán hàng\" → hỏi tiếp: đã kiểm chứng với dữ liệu và phỏng vấn khách thật chưa?\n\n⑥ CHUYỂN Ý\n\"Vậy làm sao xây dựng Persona từ sự thật, chứ không phải từ phỏng đoán? Bí quyết nằm ở cách chúng ta đặt câu hỏi.\"", "html": "<section id=\"b1-26\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Phân khúc cho biết \"ai\"; Persona giải thích \"vì sao\"<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Bên trái là bảng số liệu xám tối, bên phải là chân dung một người với trái tim màu cam\" width=\"608\" height=\"400\" viewBox=\"0 0 608 400\" style=\"width:608px; height:400px\"><g transform=\"scale(0.800)\"><rect x=\"20\" y=\"60\" width=\"300\" height=\"380\" rx=\"16\" fill=\"none\" stroke=\"#D5DAE1\" stroke-width=\"8\"/><rect x=\"60\" y=\"120\" width=\"220\" height=\"24\" rx=\"6\" fill=\"#D5DAE1\"/><rect x=\"60\" y=\"190\" width=\"160\" height=\"24\" rx=\"6\" fill=\"#D5DAE1\"/><rect x=\"60\" y=\"260\" width=\"200\" height=\"24\" rx=\"6\" fill=\"#D5DAE1\"/><rect x=\"60\" y=\"330\" width=\"130\" height=\"24\" rx=\"6\" fill=\"#D5DAE1\"/><path d=\"M345 250 L405 250\" stroke=\"#1E2533\" stroke-width=\"8\" stroke-linecap=\"round\"/><path d=\"M395 230 L420 250 L395 270\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"590\" cy=\"170\" r=\"80\" fill=\"#8A94A6\"/><path d=\"M450 460 C 450 330, 730 330, 730 460 Z\" fill=\"#8A94A6\"/><path d=\"M590 420 C 560 400, 552 380, 566 372 C 576 367, 586 372, 590 380 C 594 372, 604 367, 614 372 C 628 380, 620 400, 590 420 Z\" fill=\"#E2783B\"/><\/g><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:28px\">\n<p><b>STP/RFM<\/b> · ai, mua gì, bao nhiêu<\/p>\n<p><b style=\"color:#E2783B\">Persona<\/b> · động cơ, nỗi sợ, mục tiêu<\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng viên thuốc – case TechPharma\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><g transform=\"rotate(-40 32 32)\"><rect x=\"6\" y=\"21\" width=\"52\" height=\"22\" rx=\"11\"/><line x1=\"32\" y1=\"21\" x2=\"32\" y2=\"43\"/><\/g><\/g><\/svg><p style=\"color:#5B6577\">TechPharma: ông Hùng, 62 tuổi, mua 26 lần/năm<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-27", "label": "B1 · 30", "session": 1, "part": "s5", "title": "Hành vi trong quá khứ đáng tin cậy hơn ý kiến về tương lai", "activity": "", "points": ["Không hỏi: \"Anh có mua không?\"", "Hãy hỏi: \"Lần gần nhất anh xử lý việc này thế nào?\"", "LEGO: hỏi phụ huynh, thiết kế sai hướng"], "notes": "① MỞ\n\"Nếu anh chị kể cho mẹ mình nghe một ý tưởng kinh doanh mới và hỏi 'Mẹ thấy thế nào?', câu trả lời gần như chắc chắn sẽ là 'Hay đấy con'. Mẹ không nói dối – mẹ chỉ muốn động viên. Và đó chính là vấn đề của rất nhiều cuộc khảo sát khách hàng.\"\n\n② GIẢNG\nRob Fitzpatrick đặt tên cho nguyên tắc này là \"The Mom Test\" (2013): hãy đặt câu hỏi sao cho ngay cả mẹ anh chị cũng không thể nói dối. Có ba quy tắc. Một: nói về cuộc sống của họ, không nói về ý tưởng của anh chị. Hai: hỏi về hành vi cụ thể trong quá khứ, không hỏi ý kiến chung chung hay dự định tương lai. Ba: nói ít, nghe nhiều. Câu hỏi \"Anh có mua sản phẩm này không?\" mời gọi một lời hứa xã giao. Câu hỏi \"Lần gần nhất anh gặp vấn đề này là khi nào, anh đã xử lý ra sao, tốn bao nhiêu thời gian và tiền?\" buộc người trả lời kể lại sự thật. Nếu họ chưa từng cố gắng giải quyết vấn đề, có lẽ vấn đề đó không đủ quan trọng với họ.\n\n③ MINH HỌA\nLEGO là bài học kinh điển. Đầu những năm 2000, khi doanh nghiệp rơi vào khủng hoảng nghiêm trọng, nhiều nhận định từ phụ huynh và chuyên gia cho rằng trẻ em ngày nay thiếu kiên nhẫn, chỉ thích trò chơi điện tử, nên sản phẩm cần đơn giản hơn. LEGO làm theo hướng đó nhưng kết quả không cải thiện. Khi chuyển sang quan sát trực tiếp trẻ em chơi tại nhà – phương pháp nghiên cứu nhân học – họ phát hiện điều ngược lại: trẻ em khao khát thử thách và cảm giác làm chủ một kỹ năng khó. Một câu chuyện thường được kể là về cậu bé tự hào khoe đôi giày trượt ván mòn vẹt – bằng chứng cho kỹ năng cậu đã khổ luyện. LEGO quay lại với những bộ lắp ráp có độ thử thách, và bắt đầu phục hồi.\n\n④ LIÊN HỆ\nVới nhà quản lý, bài học có hai tầng. Thứ nhất: hỏi đúng cách. Thứ hai: hỏi đúng người – người sử dụng thật, không chỉ người trả tiền. Trong B2B, người ký hợp đồng thường không phải người dùng hằng ngày; trong giáo dục, phụ huynh không phải người học.\n\n★ CÂU CHỐT: \"Khách hàng sẽ lịch sự với ý tưởng của anh chị. Nhưng hành vi của họ thì luôn nói thật.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Doanh nghiệp anh chị đã từng ra quyết định dựa trên ý kiến khách hàng nhưng kết quả thực tế lại khác xa không?\"\nNếu lớp im lặng: gợi ý tình huống phổ biến – khách nói sẵn sàng trả thêm cho tính năng mới, nhưng khi ra mắt thì rất ít người dùng.\nCâu trả lời có thể gặp: \"Khảo sát nói khách muốn giá rẻ hơn, nhưng giảm giá rồi vẫn không tăng doanh số\" → phản hồi: có thể giá không phải vấn đề thật; hành vi quá khứ sẽ cho biết họ thực sự bỏ đi vì điều gì.\n\n⑥ CHUYỂN Ý\n\"Phỏng vấn cho chúng ta chiều sâu, nhưng cỡ mẫu nhỏ. Dữ liệu lớn cho chúng ta quy mô, nhưng thiếu chiều sâu. Cần cả hai.\"", "html": "<section id=\"b1-27\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Hành vi trong quá khứ đáng tin cậy hơn ý kiến về tương lai<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Mũi tên quay ngược chiều kim đồng hồ xám tối nhạt bao quanh một chiếc đồng hồ, bên cạnh là quả cầu tiên tri xám tối bị gạch chéo\" width=\"560\" height=\"480\" viewBox=\"0 0 560 480\" style=\"width:560px; height:480px\"><circle cx=\"170\" cy=\"200\" r=\"120\" fill=\"none\" stroke=\"#8A94A6\" stroke-width=\"14\"/><line x1=\"170\" y1=\"200\" x2=\"170\" y2=\"130\" stroke=\"#1E2533\" stroke-width=\"8\" stroke-linecap=\"round\"/><line x1=\"170\" y1=\"200\" x2=\"120\" y2=\"230\" stroke=\"#1E2533\" stroke-width=\"8\" stroke-linecap=\"round\"/><path d=\"M40 150 L60 90 L100 140 Z\" fill=\"#8A94A6\"/><circle cx=\"430\" cy=\"300\" r=\"90\" fill=\"#D5DAE1\"/><rect x=\"370\" y=\"385\" width=\"120\" height=\"30\" rx=\"8\" fill=\"#D5DAE1\"/><line x1=\"340\" y1=\"200\" x2=\"530\" y2=\"420\" stroke=\"#E2783B\" stroke-width=\"16\" stroke-linecap=\"round\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:40px\">\n<p>Không hỏi: \"Anh có mua không?\"<\/p>\n<p>Hãy hỏi: \"Lần gần nhất anh xử lý việc này thế nào?\"<\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng khối lắp ghép\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"6\" y=\"26\" width=\"52\" height=\"28\" rx=\"4\"/><rect x=\"13\" y=\"15\" width=\"14\" height=\"11\" rx=\"3\"/><rect x=\"37\" y=\"15\" width=\"14\" height=\"11\" rx=\"3\"/><\/g><\/svg><p style=\"color:#5B6577\">LEGO: hỏi phụ huynh, thiết kế sai hướng<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-28", "label": "B1 · 31", "session": 1, "part": "s5", "title": "Dữ liệu định lượng cho biết \"điều gì\"; nghiên cứu định tính cho biết \"vì sao\"", "activity": "", "points": ["Định lượng · quy mô, xu hướng", "Định tính · động cơ, cảm xúc", "DigiNet: biết GB/giờ, chưa biết vì sao khách rời đi"], "notes": "① MỞ\n\"Dữ liệu có thể cho anh chị biết rằng 20% khách hàng rời đi trong tháng thứ 13. Nhưng dữ liệu không thể cho biết họ đã nghĩ gì vào buổi tối nhận được hóa đơn đó.\"\n\n② GIẢNG\nCó hai con đường xây dựng sự thấu hiểu, và nhà quản lý cần cả hai. Định lượng – dữ liệu giao dịch, hành vi trên ứng dụng, khảo sát quy mô lớn – trả lời câu hỏi \"điều gì đang xảy ra, ở quy mô nào, xu hướng ra sao\". Phù hợp với doanh nghiệp đã vận hành và có dữ liệu tích lũy; giá trị lớn nhất đến khi hợp nhất dữ liệu online và offline để tìm ra các mẫu hành vi. Định tính – phỏng vấn sâu, quan sát tại hiện trường, nhật ký khách hàng – trả lời câu hỏi \"vì sao\". Phù hợp khi ra mắt sản phẩm mới, khi dữ liệu còn ít, hoặc khi con số cho thấy một hiện tượng bất thường cần giải thích. Quy trình hiệu quả thường đi theo vòng: dữ liệu định lượng chỉ ra \"chỗ cần nhìn\", nghiên cứu định tính giải thích \"vì sao\", rồi lại dùng định lượng để kiểm chứng giả thuyết ở quy mô lớn.\n\n③ MINH HỌA\nCase DigiNet: doanh nghiệp có dữ liệu rất chi tiết – mỗi hộ dùng bao nhiêu GB, vào giờ nào, qua bao nhiêu thiết bị. Nhưng dữ liệu đó \"chưa được khai thác\", và khách vẫn nhận tin nhắn đại trà. Dữ liệu định lượng có thể chỉ ra rằng churn tăng vọt ở tháng thứ 13 – đúng thời điểm hết khuyến mãi. Chỉ khi ngồi nói chuyện với những khách như Hùng, doanh nghiệp mới hiểu vấn đề không nằm ở mức giá 199 nghìn, mà ở cảm giác bị \"gài bẫy\" vì không được báo trước. Hai giải pháp khác nhau hoàn toàn: giảm giá cho tất cả, hay thông báo minh bạch trước một tháng kèm lựa chọn gói phù hợp.\n\n④ LIÊN HỆ\nNhiều ban điều hành yêu cầu \"cho tôi con số\", và nghiên cứu định tính bị xem là cảm tính. Nhưng những quyết định sai lầm đắt giá nhất thường đến từ việc hiểu đúng \"điều gì\" nhưng hiểu sai \"vì sao\". Nhà quản lý nên yêu cầu mọi báo cáo khách hàng quan trọng phải có cả hai phần: con số và câu chuyện đằng sau con số.\n\n★ CÂU CHỐT: \"Con số cho chúng ta biết nên nhìn vào đâu. Câu chuyện của khách hàng cho biết chúng ta đang nhìn thấy điều gì.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Doanh nghiệp anh chị đang mạnh về định lượng hay định tính? Lần gần nhất một cuộc phỏng vấn khách hàng làm thay đổi một quyết định là khi nào?\"\nNếu lớp im lặng: đề nghị giơ tay – \"mạnh định lượng\", \"mạnh định tính\", \"chưa mạnh cả hai\".\nCâu trả lời có thể gặp: \"Chúng tôi có dashboard rất nhiều chỉ số\" → hỏi tiếp: khi một chỉ số xấu đi, ai đi hỏi khách vì sao? \"Chúng tôi chủ yếu nghe phản hồi từ đội bán hàng\" → phản hồi: đó là dữ liệu định tính qua trung gian, dễ bị sàng lọc.\n\n⑥ CHUYỂN Ý\n\"Khi đã có cả con số và câu chuyện, chúng ta cần một công cụ để sắp xếp những gì khách hàng nghĩ, cảm, nói và làm. Đó là bản đồ thấu cảm.\"", "html": "<section id=\"b1-28\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Dữ liệu định lượng cho biết \"điều gì\"; nghiên cứu định tính cho biết \"vì sao\"<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Biểu đồ cột xám tối nhạt với một kính lúp màu cam phóng to vào cột cao nhất\" width=\"520\" height=\"480\" viewBox=\"0 0 520 480\" style=\"width:520px; height:480px\"><line x1=\"20\" y1=\"440\" x2=\"500\" y2=\"440\" stroke=\"#1E2533\" stroke-width=\"8\"/><rect x=\"50\" y=\"300\" width=\"70\" height=\"140\" fill=\"#8A94A6\"/><rect x=\"150\" y=\"220\" width=\"70\" height=\"220\" fill=\"#8A94A6\"/><rect x=\"250\" y=\"260\" width=\"70\" height=\"180\" fill=\"#8A94A6\"/><rect x=\"350\" y=\"140\" width=\"70\" height=\"300\" fill=\"#8A94A6\"/><circle cx=\"385\" cy=\"130\" r=\"80\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"16\"/><line x1=\"440\" y1=\"190\" x2=\"500\" y2=\"260\" stroke=\"#E2783B\" stroke-width=\"22\" stroke-linecap=\"round\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:40px\">\n<p><b>Định lượng<\/b> · quy mô, xu hướng<\/p>\n<p><b style=\"color:#E2783B\">Định tính<\/b> · động cơ, cảm xúc<\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng wifi – case DigiNet\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 26 A34 34 0 0 1 56 26\"/><path d=\"M16 35 A22 22 0 0 1 48 35\"/><path d=\"M24 44 A11 11 0 0 1 40 44\"/><circle cx=\"32\" cy=\"53\" r=\"4\" fill=\"#E2783B\" stroke=\"none\"/><\/g><\/svg><p style=\"color:#5B6577\">DigiNet: biết GB/giờ, chưa biết vì sao khách rời đi<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-29", "label": "B1 · 32", "session": 1, "part": "s5", "title": "Thấu cảm là nhận diện những điều khách hàng không nói ra", "activity": "", "points": ["Nghĩ · Cảm · Nói · Làm · Thấy · Nghe", "Nỗi đau · Kỳ vọng ẩn", "Life Biz School: chị Lan, học cuối tuần, con còn nhỏ"], "notes": "① MỞ\n\"Khách hàng hiếm khi nói với chúng ta điều họ thực sự lo lắng. Một người mẹ mua thuốc cho con lúc nửa đêm sẽ không nói 'tôi đang sợ mình là một người mẹ tồi'. Nhưng nỗi sợ đó quyết định mọi lựa chọn của cô ấy.\"\n\n② GIẢNG\nBản đồ thấu cảm (Empathy Map) do Dave Gray và công ty XPLANE phát triển, giúp đội ngũ sắp xếp những gì biết về một Persona thành sáu vùng. Nghĩ và cảm: điều diễn ra bên trong – lo lắng, hy vọng, những suy nghĩ không nói ra. Nói và làm: hành vi quan sát được – những gì họ nói công khai, những gì họ thực sự làm. Thấy: môi trường xung quanh, những gì họ tiếp xúc – quảng cáo, mạng xã hội, bạn bè. Nghe: những ai và điều gì ảnh hưởng tới họ – gia đình, đồng nghiệp, người có ảnh hưởng. Bên dưới là hai ô quan trọng nhất: Nỗi đau (rào cản, rủi ro, nỗi sợ) và Kỳ vọng ẩn (lợi ích họ mong muốn, mong muốn sâu kín). Giá trị lớn nhất của bản đồ nằm ở những mâu thuẫn: khi điều khách nói khác với điều khách làm, hoặc điều họ nghĩ khác với điều họ thể hiện.\n\n③ MINH HỌA\nCase Life Biz School: chị Lan, 35 tuổi, quản lý cấp trung ngân hàng, đã có gia đình và con năm tuổi. Điều chị nói: \"Tôi muốn học MBA để thăng tiến lên Director.\" Điều chị nghĩ và cảm: lo 220 triệu tương đương bốn tháng lương, áy náy vì 24 tháng học cuối tuần khi con còn nhỏ. Tình huống thật trong case: tháng thứ mười, một sáng thứ Bảy chị kiệt sức, con khóc đòi mẹ, trong khi email từ trường khô khan, không có người cố vấn, bộ phận hành chính phản hồi chậm năm ngày. Điều chị không bao giờ nói ra: \"Liệu tôi có đang hy sinh gia đình cho một tấm bằng không?\" Kỳ vọng ẩn của chị không chỉ là bằng cấp, mà là cảm giác được đồng hành và được ghi nhận nỗ lực.\n\n④ LIÊN HỆ\nNhà quản lý không cần tự tay vẽ bản đồ thấu cảm, nhưng nên yêu cầu đội ngũ trình bày được: nỗi đau lớn nhất và kỳ vọng ẩn lớn nhất của khách hàng mục tiêu là gì. Nếu đội ngũ chỉ nói được tính năng họ muốn, sự thấu hiểu vẫn còn ở bề mặt.\n\n★ CÂU CHỐT: \"Thấu cảm không phải là nghe điều khách hàng nói. Thấu cảm là nhận ra điều khách hàng không nói.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Với khách hàng quan trọng nhất của anh chị, đâu là một nỗi lo mà họ sẽ không bao giờ nói thẳng với nhân viên?\"\nNếu lớp im lặng: gợi ý với ngành y tế (sợ bị đánh giá), tài chính (ngại hỏi vì sợ bị coi là thiếu hiểu biết), giáo dục (sợ không theo kịp).\nCâu trả lời có thể gặp: \"Khách ngại hỏi về phí vì sợ bị coi là không đủ khả năng chi trả\" → phản hồi: đó là một insight quý – trải nghiệm có thể chủ động minh bạch chi phí để khách không phải hỏi.\n\n⑥ CHUYỂN Ý\n\"Từ bản đồ thấu cảm, bước khó nhất là chắt lọc ra một insight. Vậy một insight tốt gồm những gì?\"", "html": "<section id=\"b1-29\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Thấu cảm là nhận diện những điều khách hàng không nói ra<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Bản đồ thấu cảm: một khuôn mặt ở giữa, bốn góc là biểu tượng mắt, tai, bong bóng lời nói và trái tim, bên dưới là hai ô nỗi đau và kỳ vọng\" width=\"640\" height=\"540\" viewBox=\"0 0 640 540\" style=\"width:640px; height:540px\"><rect x=\"10\" y=\"10\" width=\"620\" height=\"380\" rx=\"16\" fill=\"none\" stroke=\"#D5DAE1\" stroke-width=\"8\"/><line x1=\"10\" y1=\"10\" x2=\"630\" y2=\"390\" stroke=\"#D5DAE1\" stroke-width=\"8\"/><line x1=\"630\" y1=\"10\" x2=\"10\" y2=\"390\" stroke=\"#D5DAE1\" stroke-width=\"8\"/><circle cx=\"320\" cy=\"200\" r=\"70\" fill=\"#FFFFFF\" stroke=\"#1E2533\" stroke-width=\"8\"/><circle cx=\"296\" cy=\"188\" r=\"7\" fill=\"#1E2533\"/><circle cx=\"344\" cy=\"188\" r=\"7\" fill=\"#1E2533\"/><path d=\"M294 222 Q320 240 346 222\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"8\" stroke-linecap=\"round\"/><path d=\"M290 70 C 300 40, 340 40, 350 70 C 365 70, 370 90, 355 98 L285 98 C 270 90, 275 70, 290 70 Z\" fill=\"#E2783B\"/><ellipse cx=\"90\" cy=\"200\" rx=\"46\" ry=\"26\" fill=\"none\" stroke=\"#8A94A6\" stroke-width=\"8\"/><circle cx=\"90\" cy=\"200\" r=\"12\" fill=\"#8A94A6\"/><path d=\"M545 170 C 545 145, 585 140, 590 170 C 595 200, 565 205, 565 230 C 565 245, 548 245, 545 232\" fill=\"none\" stroke=\"#8A94A6\" stroke-width=\"8\" stroke-linecap=\"round\"/><path d=\"M270 300 L370 300 C 380 300, 385 305, 385 315 L385 345 C 385 355, 380 360, 370 360 L320 360 L300 380 L302 360 L270 360 C 260 360, 255 355, 255 345 L255 315 C 255 305, 260 300, 270 300 Z\" fill=\"#1E2533\"/><rect x=\"10\" y=\"420\" width=\"300\" height=\"110\" rx=\"14\" fill=\"#E2783B\"/><rect x=\"330\" y=\"420\" width=\"300\" height=\"110\" rx=\"14\" fill=\"#1E2533\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:40px\">\n<p>Nghĩ · Cảm · Nói · Làm · Thấy · Nghe<\/p>\n<p><b style=\"color:#E2783B\">Nỗi đau<\/b> · <b>Kỳ vọng ẩn<\/b><\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng mũ tốt nghiệp – case Life Biz School\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 24 L32 12 L60 24 L32 36 Z\"/><path d=\"M16 30 V42 C 24 50, 40 50, 48 42 V30\"/><line x1=\"56\" y1=\"26\" x2=\"56\" y2=\"42\"/><\/g><\/svg><p style=\"color:#5B6577\">Life Biz School: chị Lan, học cuối tuần, con còn nhỏ<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-30", "label": "B1 · 33", "session": 1, "part": "s5", "title": "Insight: sự thật, mâu thuẫn và động lực", "activity": "", "points": ["Sự thật · điều khách làm", "Mâu thuẫn · điều cản trở họ", "Động lực · điều họ khao khát", "BizManage: CEO muốn số hóa, nhân viên sợ học lại từ đầu"], "notes": "① MỞ\n\"Hãy thử đọc hai câu sau và cho tôi biết câu nào là insight. Câu một: 'Khách hàng muốn phần mềm dễ dùng.' Câu hai: 'Kế toán trưởng biết phần mềm mới giúp công ty minh bạch hơn, nhưng sợ rằng sau 15 năm thành thạo Excel, cô sẽ trở thành người chậm nhất phòng.'\" Đa số sẽ chọn câu hai. \"Vì sao?\"\n\n② GIẢNG\nCâu một là một nhận xét đúng nhưng ai cũng biết. Câu hai là một insight vì nó có ba thành phần. Sự thật: một hành vi hoặc thực tế có thể quan sát được – điều khách đang làm. Mâu thuẫn: một căng thẳng, một rào cản khiến khách không đạt được điều mình muốn – thường là chỗ lý trí và cảm xúc kéo về hai phía khác nhau. Động lực: điều khách thực sự khao khát ở tầng sâu. Một insight tốt thường khiến người nghe gật đầu \"đúng vậy, nhưng trước giờ tôi chưa nghĩ ra\", và quan trọng nhất: nó mở ra một hướng hành động cụ thể. Nếu đọc xong mà không biết nên làm gì khác đi, đó vẫn chưa phải insight.\n\n③ MINH HỌA\nCase BizManage: tỷ lệ sử dụng thực tế chỉ 55%. Sự thật: CEO Khoa đã đầu tư 200 triệu, nhưng sau năm tháng chỉ 12 trên 50 nhân viên dùng phần mềm, kế toán vẫn làm song song trên Excel. Mâu thuẫn: CEO muốn số hóa để minh bạch và tiết kiệm; chị Nga – trưởng phòng kế toán 45 tuổi, 15 năm kinh nghiệm – cần một công cụ \"dễ như Excel\", sợ học mới mất thời gian và sợ sai số liệu cuối kỳ. Nhân viên cảm thấy phần mềm bị \"áp đặt từ trên xuống\". Động lực: chị Nga không chống lại công nghệ; chị muốn giữ vị thế người thành thạo, đáng tin cậy nhất phòng. Insight: \"Người dùng không từ chối phần mềm – họ từ chối cảm giác trở thành người mới bắt đầu.\" Từ đó, hướng hành động rõ ràng: thiết kế lộ trình triển khai giúp kế toán trưởng trở thành \"người hướng dẫn\" nội bộ, thay vì học viên.\n\n④ LIÊN HỆ\nVới nhà quản lý, công thức ba thành phần là một bộ lọc hữu ích khi nghe đội ngũ trình bày \"insight khách hàng\". Hãy hỏi: sự thật là gì, mâu thuẫn nằm ở đâu, động lực sâu xa là gì – và insight này khiến chúng ta làm gì khác đi?\n\n★ CÂU CHỐT: \"Một insight thực sự không chỉ khiến chúng ta hiểu khách hàng hơn, mà khiến chúng ta phải hành động khác đi.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Hãy nghĩ về một thay đổi thành công gần đây trong doanh nghiệp anh chị. Đằng sau nó có một insight nào về khách hàng – hoặc về nhân viên – không?\"\nNếu lớp im lặng: mời một học viên đọc thử một insight về khách hàng của mình, cả lớp cùng kiểm tra xem đã đủ ba thành phần chưa.\nCâu trả lời có thể gặp: \"Khách hàng muốn giá tốt hơn\" → phản hồi: đó mới là sự thật hoặc mong muốn; mâu thuẫn và động lực nằm ở đâu?\n\n⑥ CHUYỂN Ý\n\"Bây giờ đến lượt các nhóm thực hành với doanh nghiệp trong case của mình.\"", "html": "<section id=\"b1-30\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Insight: sự thật, mâu thuẫn và động lực<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Ba khối xám tối nhạt, cam và trắng hội tụ vào một bóng đèn\" width=\"640\" height=\"520\" viewBox=\"0 0 640 520\" style=\"width:640px; height:520px\"><rect x=\"20\" y=\"40\" width=\"180\" height=\"120\" rx=\"16\" fill=\"#8A94A6\"/><rect x=\"20\" y=\"200\" width=\"180\" height=\"120\" rx=\"16\" fill=\"#E2783B\"/><rect x=\"20\" y=\"360\" width=\"180\" height=\"120\" rx=\"16\" fill=\"#1E2533\"/><path d=\"M210 100 C 300 100, 300 250, 360 260\" fill=\"none\" stroke=\"#D5DAE1\" stroke-width=\"8\"/><path d=\"M210 260 L360 260\" fill=\"none\" stroke=\"#D5DAE1\" stroke-width=\"8\"/><path d=\"M210 420 C 300 420, 300 270, 360 260\" fill=\"none\" stroke=\"#D5DAE1\" stroke-width=\"8\"/><circle cx=\"480\" cy=\"230\" r=\"110\" fill=\"#FFFFFF\" stroke=\"#1E2533\" stroke-width=\"8\"/><path d=\"M445 330 L515 330 L505 400 L455 400 Z\" fill=\"#1E2533\"/><rect x=\"455\" y=\"410\" width=\"50\" height=\"20\" rx=\"6\" fill=\"#1E2533\"/><path d=\"M450 240 L470 200 L490 250 L510 210\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:36px\">\n<p><b>Sự thật<\/b> · điều khách làm<\/p>\n<p><b style=\"color:#E2783B\">Mâu thuẫn<\/b> · điều cản trở họ<\/p>\n<p><b>Động lực<\/b> · điều họ khao khát<\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng màn hình phần mềm – case BizManage\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"6\" y=\"8\" width=\"52\" height=\"36\" rx=\"5\"/><line x1=\"22\" y1=\"56\" x2=\"42\" y2=\"56\"/><line x1=\"32\" y1=\"44\" x2=\"32\" y2=\"56\"/><line x1=\"20\" y1=\"36\" x2=\"20\" y2=\"28\"/><line x1=\"32\" y1=\"36\" x2=\"32\" y2=\"18\"/><line x1=\"44\" y1=\"36\" x2=\"44\" y2=\"24\"/><\/g><\/svg><p style=\"color:#5B6577\">BizManage: CEO muốn số hóa, nhân viên sợ học lại từ đầu<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-31", "label": "B1 · 34", "session": 1, "part": "s5", "title": "Thảo luận nhóm: Persona và Empathy Map cho case", "activity": "Nhóm · 25 phút · handout trang 1–5", "points": ["1. Chọn một nhân vật", "2. Điền hai template", "3. Viết một insight"], "notes": "① MỞ\n\"Hai mươi lăm phút tới, mỗi nhóm làm đúng việc mà một đội CX chuyên nghiệp làm trong tuần đầu của dự án: đọc dữ liệu về khách hàng, chọn một con người cụ thể, bước vào đôi giày của họ, và viết ra một insight.\"\n\n② HƯỚNG DẪN HOẠT ĐỘNG (25 phút)\nMỗi nhóm nhận trang case của mình (handout trang 1–4) và trang template (trang 5).\n– Phút 0–7: đọc case – bối cảnh, pain points, persona khách hàng, tình huống Problem Canvas. Chọn MỘT nhân vật. Gợi ý: DigiNet – anh Minh (gia đình trẻ làm việc tại nhà), cô Lan (người lớn tuổi) hoặc chị Trang (hộ kinh doanh nhỏ); TechPharma – ông Hùng (bệnh mãn tính), chị Mai (mẹ bỉm sữa) hoặc bà Ngọc (cao tuổi, ít dùng công nghệ); BizManage – anh Khoa (CEO, người mua), chị Nga (kế toán trưởng, người dùng) hoặc anh Đức (IT, người ảnh hưởng); Life Biz School – chị Lan, anh Minh, anh Tuấn hoặc chị Hương.\n– Phút 7–15: trả lời bảng \"Customer Persona – câu hỏi thảo luận\" ngay dưới case, rồi điền template Customer Persona: thông tin cơ bản, mục tiêu và kỳ vọng, hành vi và thói quen, nỗi đau và rào cản, kênh tiếp cận và ảnh hưởng, tâm lý và cảm xúc, kèm một câu nói tiêu biểu (Key quote).\n– Phút 15–22: dùng bảng \"Empathy Map – câu hỏi thảo luận\" để điền template Empathy Map: Think & Feel, See, Hear, Say & Do, Pain, Gain. Chọn một điểm chạm cụ thể để phân tích.\n– Phút 22–25: viết MỘT câu insight theo công thức sự thật – mâu thuẫn – động lực; chọn người trình bày.\nNhắc: được phép suy luận vượt ra ngoài dữ liệu case, nhưng phải đánh dấu đâu là giả định cần kiểm chứng.\n\n③ DẪN DẮT TRONG LÚC NHÓM LÀM\nĐi quanh các nhóm, đặt câu hỏi gợi mở: \"Nhân vật này sẽ nói gì với bạn thân về doanh nghiệp, mà không bao giờ nói với nhân viên?\" \"Điều họ nói và điều họ làm có mâu thuẫn không?\" Nhắc thời gian ở phút 7, 15 và 22. Nếu nhóm sa đà mô tả sản phẩm, kéo họ về cảm xúc và nỗi sợ của nhân vật.\nInsight tham khảo: DigiNet – \"Anh Minh không cần mạng nhanh nhất; anh cần không bao giờ rớt mạng giữa cuộc họp với sếp.\" TechPharma – \"Chị Mai không sợ giá cao; chị sợ mình là người đưa nhầm thuốc cho con.\" BizManage – \"Chị Nga không chống phần mềm; chị chống cảm giác trở thành người mới.\" Life Biz School – \"Chị Lan không nghi ngờ giá trị tấm bằng; chị nghi ngờ cái giá gia đình phải trả.\"\n\n★ CÂU CHỐT: \"Khi anh chị viết được nỗi sợ của khách hàng bằng chính lời của họ, anh chị đã bắt đầu thiết kế trải nghiệm.\"\n\n⑤ TƯƠNG TÁC\nNếu nhóm bế tắc: bắt đầu từ ô \"Nỗi đau\" – thường dễ viết nhất – rồi đi ngược lên \"Think & Feel\". Nếu nhóm tranh luận chọn nhân vật quá lâu: giảng viên chọn giúp để giữ thời gian.\n\n⑥ CHUYỂN Ý\n\"Hết giờ. Mời bốn nhóm giới thiệu khách hàng của mình.\"", "html": "<section id=\"b1-31\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:40px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Thảo luận nhóm: Persona và Empathy Map cho case<\/h2>\n<p style=\"align-self:start; font-weight:700; color:#FFFFFF; background:#E2783B; padding:8px 36px; border-radius:999px\">Nhóm · 25 phút · handout trang 1–5<\/p>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Hai tờ mẫu thu nhỏ: thẻ chân dung khách hàng và bản đồ thấu cảm\" width=\"560\" height=\"440\" viewBox=\"0 0 560 440\" style=\"width:560px; height:440px\"><rect x=\"10\" y=\"30\" width=\"250\" height=\"360\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#8A94A6\" stroke-width=\"8\"/><circle cx=\"135\" cy=\"100\" r=\"40\" fill=\"#8A94A6\"/><rect x=\"45\" y=\"170\" width=\"180\" height=\"18\" rx=\"6\" fill=\"#D5DAE1\"/><rect x=\"45\" y=\"215\" width=\"140\" height=\"18\" rx=\"6\" fill=\"#D5DAE1\"/><rect x=\"45\" y=\"260\" width=\"170\" height=\"18\" rx=\"6\" fill=\"#D5DAE1\"/><rect x=\"45\" y=\"305\" width=\"120\" height=\"18\" rx=\"6\" fill=\"#D5DAE1\"/><rect x=\"300\" y=\"60\" width=\"250\" height=\"360\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#E2783B\" stroke-width=\"8\"/><line x1=\"300\" y1=\"60\" x2=\"550\" y2=\"300\" stroke=\"#D5DAE1\" stroke-width=\"8\"/><line x1=\"550\" y1=\"60\" x2=\"300\" y2=\"300\" stroke=\"#D5DAE1\" stroke-width=\"8\"/><circle cx=\"425\" cy=\"180\" r=\"36\" fill=\"#E2783B\"/><rect x=\"315\" y=\"320\" width=\"110\" height=\"84\" rx=\"8\" fill=\"#E2783B\"/><rect x=\"430\" y=\"320\" width=\"105\" height=\"84\" rx=\"8\" fill=\"#1E2533\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:36px\">\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng person\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"32\" cy=\"18\" r=\"11\"/><path d=\"M10 58 C 10 38, 54 38, 54 58\"/><\/g><\/svg><p><b style=\"color:#E2783B\">1.<\/b> Chọn một nhân vật<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng grid\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"6\" y=\"8\" width=\"52\" height=\"48\" rx=\"5\"/><line x1=\"6\" y1=\"24\" x2=\"58\" y2=\"24\"/><line x1=\"6\" y1=\"40\" x2=\"58\" y2=\"40\"/><line x1=\"24\" y1=\"8\" x2=\"24\" y2=\"56\"/><line x1=\"41\" y1=\"8\" x2=\"41\" y2=\"56\"/><\/g><\/svg><p><b style=\"color:#E2783B\">2.<\/b> Điền hai template<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng bulb\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 40 C 14 34, 12 26, 14 20 C 17 10, 26 6, 32 6 C 38 6, 47 10, 50 20 C 52 26, 50 34, 42 40 V46 H22 Z\"/><line x1=\"24\" y1=\"54\" x2=\"40\" y2=\"54\"/><line x1=\"27\" y1=\"60\" x2=\"37\" y2=\"60\"/><\/g><\/svg><p><b style=\"color:#E2783B\">3.<\/b> Viết một insight<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-31b", "label": "B1 · 35", "session": 1, "part": "s5", "title": "Trình bày: Persona và Empathy Map của bốn nhóm", "activity": "4 nhóm · mỗi nhóm 3 phút", "points": ["Persona và một câu nói tiêu biểu", "Nỗi đau và kỳ vọng ẩn", "Một câu insight"], "notes": "① MỞ\n\"Bốn nhóm, bốn doanh nghiệp, bốn con người cụ thể. Mỗi nhóm có ba phút để giới thiệu khách hàng của mình như giới thiệu một người bạn mà cả lớp chưa từng gặp.\"\n\n② HƯỚNG DẪN (khoảng 15 phút)\nMỗi nhóm trình bày 3 phút, dán hoặc chiếu tờ Persona và Empathy Map đã điền (trang 5). Cấu trúc gợi ý:\n– Persona là ai, và một câu nói tiêu biểu của người đó (ô \"Key quote\").\n– Nỗi đau lớn nhất và kỳ vọng ẩn lớn nhất (ô Pain – Gain).\n– Một câu insight theo công thức sự thật – mâu thuẫn – động lực.\nSau mỗi nhóm, lớp đặt một câu hỏi, tối đa một phút. Thứ tự gợi ý: DigiNet, TechPharma, BizManage, Life Biz School.\n\n③ TIÊU CHÍ PHẢN HỒI CỦA GIẢNG VIÊN\n– Persona có sống động như một người thật không, hay chỉ là một phân khúc thống kê?\n– Empathy Map có chỉ ra được mâu thuẫn giữa điều khách nói và điều khách làm, hoặc điều khách nghĩ mà không nói ra?\n– Nhóm có phân biệt rõ đâu là dữ liệu trong case, đâu là giả định cần kiểm chứng?\n– Insight có dẫn tới một hành động khác đi không?\nPersona có thể nghe thấy: DigiNet – anh Minh hoặc cô Lan; TechPharma – ông Hùng, chị Mai hoặc bà Ngọc; BizManage – anh Khoa, chị Nga hoặc anh Đức; Life Biz School – chị Lan, anh Minh, anh Tuấn hoặc chị Hương.\n\n④ LIÊN HỆ\nNhấn mạnh: persona và empathy map không phải sản phẩm để nộp, mà là \"người khách\" các nhóm sẽ dẫn đi suốt Buổi 2 – trên bản đồ hành trình khổ A1. Nhắc các nhóm giữ lại bản giấy.\n\n★ CÂU CHỐT: \"Khi cả lớp có thể hình dung khách hàng của anh chị như một người quen, anh chị đã sẵn sàng thiết kế trải nghiệm cho họ.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi gợi ý cho lớp nếu chưa ai hỏi: \"Persona này sẽ nói gì về doanh nghiệp với bạn thân?\" \"Điều gì khiến người này rời bỏ ngay ngày mai?\"\nNếu một nhóm trình bày quá dài: dừng lịch sự ở phút thứ ba và mời nhóm đọc câu insight.\n\n⑥ CHUYỂN Ý\n\"Chúng ta đã biết khách hàng là ai và họ nghĩ gì. Câu hỏi cuối cùng của hôm nay: họ đi qua doanh nghiệp theo hành trình nào?\"\n\nTÓM TẮT PHẦN 3 (một câu): Thấu hiểu khách hàng bắt đầu từ việc khách \"thuê\" sản phẩm để làm gì, được nuôi dưỡng bằng hành vi thật và câu chuyện thật, và được chắt lọc thành persona, empathy map và insight có thể dẫn tới hành động.", "html": "<section id=\"b1-31b\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:40px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Trình bày: Persona và Empathy Map của bốn nhóm<\/h2>\n<p style=\"align-self:start; font-weight:700; color:#FFFFFF; background:#E2783B; padding:8px 36px; border-radius:999px\">4 nhóm · mỗi nhóm 3 phút<\/p>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg aria-label=\"Giá vẽ trình bày một thẻ chân dung khách hàng và bản đồ thấu cảm thu nhỏ\" width=\"560\" height=\"460\" viewBox=\"0 0 560 460\" style=\"width:560px; height:460px\"><rect x=\"20\" y=\"20\" width=\"520\" height=\"330\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"#1E2533\" stroke-width=\"8\"/><circle cx=\"130\" cy=\"120\" r=\"44\" fill=\"#E2783B\"/><rect x=\"70\" y=\"190\" width=\"120\" height=\"16\" rx=\"8\" fill=\"#D5DAE1\"/><rect x=\"70\" y=\"222\" width=\"100\" height=\"16\" rx=\"8\" fill=\"#D5DAE1\"/><rect x=\"70\" y=\"254\" width=\"110\" height=\"16\" rx=\"8\" fill=\"#D5DAE1\"/><rect x=\"250\" y=\"60\" width=\"250\" height=\"250\" rx=\"12\" fill=\"none\" stroke=\"#8A94A6\" stroke-width=\"6\"/><line x1=\"250\" y1=\"60\" x2=\"500\" y2=\"310\" stroke=\"#D5DAE1\" stroke-width=\"6\"/><line x1=\"500\" y1=\"60\" x2=\"250\" y2=\"310\" stroke=\"#D5DAE1\" stroke-width=\"6\"/><circle cx=\"375\" cy=\"185\" r=\"36\" fill=\"#1E2533\"/><line x1=\"280\" y1=\"350\" x2=\"280\" y2=\"410\" stroke=\"#1E2533\" stroke-width=\"10\" stroke-linecap=\"round\"/><path d=\"M200 450 L280 410 L360 450\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:32px\">\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng person\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"32\" cy=\"18\" r=\"11\"/><path d=\"M10 58 C 10 38, 54 38, 54 58\"/><\/g><\/svg><p>Persona và một câu nói tiêu biểu<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng faces\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"17\" cy=\"32\" r=\"13\"/><circle cx=\"47\" cy=\"32\" r=\"13\"/><path d=\"M11 39 Q17 34 23 39\"/><path d=\"M41 35 Q47 41 53 35\"/><circle cx=\"13\" cy=\"28\" r=\"2\" fill=\"#E2783B\" stroke=\"none\"/><circle cx=\"21\" cy=\"28\" r=\"2\" fill=\"#E2783B\" stroke=\"none\"/><circle cx=\"43\" cy=\"28\" r=\"2\" fill=\"#E2783B\" stroke=\"none\"/><circle cx=\"51\" cy=\"28\" r=\"2\" fill=\"#E2783B\" stroke=\"none\"/><\/g><\/svg><p>Nỗi đau và kỳ vọng ẩn<\/p><\/div>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng bulb\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" style=\"flex:none; width:72px; height:72px\"><g transform=\"scale(1.1250)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 40 C 14 34, 12 26, 14 20 C 17 10, 26 6, 32 6 C 38 6, 47 10, 50 20 C 52 26, 50 34, 42 40 V46 H22 Z\"/><line x1=\"24\" y1=\"54\" x2=\"40\" y2=\"54\"/><line x1=\"27\" y1=\"60\" x2=\"37\" y2=\"60\"/><\/g><\/svg><p>Một câu insight<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-32", "label": "B1 · 36", "session": 1, "part": "s6", "title": "Khách hàng trải qua doanh nghiệp theo hành trình nào?", "activity": "", "points": [], "notes": "① MỞ\n\"Ở Phần 3, mỗi nhóm đã có trong tay một con người cụ thể: một anh Minh, một chị Mai, một chị Nga, một chị Lan. Bây giờ tôi muốn anh chị đi theo người đó – từ khoảnh khắc họ lần đầu nghe tên doanh nghiệp, cho đến lúc họ kể với bạn bè về doanh nghiệp. Họ đi qua bao nhiêu phòng ban? Bao nhiêu người? Và ở đâu họ muốn bỏ cuộc?\" Dừng một nhịp.\n\n② GIẢNG\nPhần 4 kéo dài khoảng 45 phút và là phần cuối của buổi hôm nay. Nếu Phần 3 trả lời câu hỏi \"khách hàng là ai và họ nghĩ gì\", thì Phần 4 trả lời câu hỏi \"họ trải qua doanh nghiệp như thế nào\". Chúng ta sẽ đi qua sáu ý:\n– Hành vi mua trong thời đại số không còn là một cái phễu, mà là một vòng lặp.\n– Rất nhiều quyết định đã được đưa ra trước khi khách hàng gặp chúng ta.\n– Công cụ bản đồ hành trình khách hàng: sáu giai đoạn, năm lớp thông tin.\n– Bốn khoảnh khắc sự thật và đường cảm xúc – nơi cần tập trung nguồn lực.\n– Hành trình trong B2B: nhiều người, nhiều vai trò.\n– Và cuối cùng là nghịch lý tổ chức: khách hàng đi một hành trình liền mạch, còn doanh nghiệp lại được tổ chức thành các phòng ban riêng rẽ.\nPhần này trang bị công cụ; ở Buổi 2, mỗi nhóm sẽ dùng chính các công cụ này để vẽ bản đồ hành trình cho persona của mình trên khổ A1.\n\n③ MINH HỌA\nHãy nghĩ tới trải nghiệm đặt một chuyến bay. Anh chị có thể thấy quảng cáo, đọc đánh giá, so sánh giá trên ứng dụng, đặt vé, nhận email xác nhận, làm thủ tục, lên máy bay, nhận hành lý, rồi có thể viết một dòng nhận xét. Hơn mười điểm chạm, do ít nhất năm bộ phận khác nhau phụ trách, và có khi cả đối tác bên ngoài. Nhưng trong trí nhớ của hành khách, đó chỉ là \"một chuyến bay\", tốt hoặc tệ.\n\n④ LIÊN HỆ\nVới nhà quản lý cấp cao, bản đồ hành trình không chỉ là công cụ marketing. Nó là một công cụ quản trị: nó cho thấy trách nhiệm đang bị chia cắt ở đâu, và khoản đầu tư tiếp theo nên đặt vào điểm nào để tạo ra khác biệt lớn nhất.\n\n★ CÂU CHỐT: \"Khách hàng không trải nghiệm từng phòng ban. Họ trải nghiệm cả một hành trình.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Nếu phải đoán, hành trình của khách hàng anh chị đi qua bao nhiêu điểm chạm – và có ai trong công ty nhìn thấy toàn bộ hành trình đó không?\"\nNếu lớp im lặng: hỏi nhanh một học viên cụ thể về ngành của họ, cùng đếm các điểm chạm chính.\nCâu trả lời có thể gặp: \"Khoảng hai mươi điểm chạm, mỗi phòng nắm một đoạn\" → phản hồi: đó là tình trạng rất phổ biến, và là lý do chúng ta cần bản đồ hành trình.\n\n⑥ CHUYỂN Ý\n\"Hãy bắt đầu từ cách khách hàng ngày nay ra quyết định mua.\"", "html": "<section id=\"b1-32\" data-transition=\"push\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; justify-content:center; gap:24px\">\n<div style=\"display:flex; flex-direction:row; align-items:center; justify-content:space-between\"><p style=\"font-size:280px; font-weight:800; line-height:1; color:#E2783B\">04<\/p><svg aria-label=\"Con đường hành trình với điểm đánh dấu\" width=\"320\" height=\"320\" viewBox=\"0 0 320 320\" style=\"width:320px; height:320px\"><g transform=\"scale(5)\" fill=\"none\" stroke=\"#1E2533\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 54 C 20 54, 18 38, 32 38 S 46 22, 58 22\"/><circle cx=\"10\" cy=\"54\" r=\"3\"/><path d=\"M58 8 C 52 8, 50 13, 50 16 C 50 21, 58 28, 58 28 C 58 28, 66 21, 66 16\" stroke=\"#E2783B\"/><\/g><\/svg><\/div>\n<h1 style=\"font-size:88px; font-weight:700; line-height:1.15; color:#1E2533\">Khách hàng trải qua doanh nghiệp theo hành trình nào?<\/h1>\n<\/section>"}, {"id": "b1-33", "label": "B1 · 37", "session": 1, "part": "s6", "title": "Hành trình mua của khách hàng số là một vòng lặp, không phải một phễu", "activity": "", "points": ["Tìm kiếm · trước khi mua", "Chia sẻ · nguồn tìm kiếm của người sau", "DigiNet: bài \"bẫy giá\" của Hùng, 500 lượt chia sẻ"], "notes": "① MỞ\n\"Hai mươi năm trước, hành trình mua hàng được dạy như một cái phễu: khách chú ý, quan tâm, khao khát, rồi mua. Doanh nghiệp kiểm soát phần lớn thông tin khách nhận được. Hôm nay, anh chị có kiểm soát được những gì khách đọc về mình không?\"\n\n② GIẢNG\nMô hình AIDA – Chú ý, Quan tâm, Khao khát, Hành động – mô tả tốt thời kỳ quảng cáo một chiều. Giữa thập niên 2000, Dentsu đề xuất mô hình AISAS để phản ánh hành vi của người tiêu dùng có Internet: Chú ý – Quan tâm – Tìm kiếm – Hành động – Chia sẻ. Hai chữ S mới làm thay đổi bản chất của hành trình. Chữ S thứ nhất, Tìm kiếm: trước khi mua, khách chủ động tra cứu, đọc đánh giá, hỏi trong các nhóm cộng đồng. Chữ S thứ hai, Chia sẻ: sau khi dùng, khách kể lại trải nghiệm. Và điều quan trọng nhất: nội dung khách hàng hôm nay chia sẻ trở thành thông tin mà khách hàng ngày mai tìm kiếm. Phễu trở thành vòng lặp – và quyền lực dịch chuyển từ người bán sang người mua.\n\n③ MINH HỌA\nCase DigiNet: Hùng, một freelancer trẻ, đăng ký gói khuyến mãi 99 nghìn mỗi tháng. Đến tháng thứ 13, hóa đơn thành 199 nghìn mà không có thông báo trước. Hùng viết một bài về \"bẫy giá\", được chia sẻ khoảng 500 lần, rồi chuyển sang đối thủ. Hãy hình dung: trong vài tháng tiếp theo, bao nhiêu người trẻ gõ tên DigiNet lên mạng xã hội và đọc được bài viết đó ở bước Tìm kiếm? Một trải nghiệm tệ ở bước Chia sẻ đã trở thành rào cản ở bước Tìm kiếm của hàng trăm khách hàng tiềm năng. Ngân sách quảng cáo khó có thể bù đắp điều đó.\n\n④ LIÊN HỆ\nVới nhà quản lý, vòng lặp này có hai hệ quả. Một: trải nghiệm sau bán hàng chính là marketing cho lần bán tiếp theo – chi phí chăm sóc khách hàng hiện tại cần được nhìn như một khoản đầu tư vào tăng trưởng. Hai: doanh nghiệp cần theo dõi những gì khách nói về mình ở các kênh mình không sở hữu, không chỉ ở tổng đài và fanpage.\n\n★ CÂU CHỐT: \"Trải nghiệm của khách hàng hôm nay là quảng cáo – tốt hoặc xấu – cho khách hàng ngày mai.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Lần gần nhất anh chị tìm đọc xem khách hàng nói gì về doanh nghiệp mình trên mạng là khi nào? Điều gì làm anh chị bất ngờ?\"\nNếu lớp im lặng: đề nghị mỗi người thử gõ tên doanh nghiệp mình kèm chữ \"review\" hoặc \"lừa đảo\" vào giờ nghỉ.\nCâu trả lời có thể gặp: \"Chúng tôi có đội theo dõi mạng xã hội\" → hỏi tiếp: thông tin đó có đến được với người thiết kế sản phẩm và quy trình không, hay chỉ dừng ở đội truyền thông?\n\n⑥ CHUYỂN Ý\n\"Nếu khách tìm kiếm trước khi mua, thì rất có thể họ đã quyết định trước khi gặp chúng ta. Google gọi đó là ZMOT.\"", "html": "<section id=\"b1-33\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Hành trình mua của khách hàng số là một vòng lặp, không phải một phễu<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Vòng lặp năm bước: chú ý, quan tâm, tìm kiếm (xám nhạt), mua (trắng), chia sẻ (cam); mũi tên cam từ chia sẻ quay về tìm kiếm\" width=\"480\" height=\"416\" viewBox=\"0 0 480 416\" style=\"width:480px; height:416px\"><g transform=\"scale(0.800)\"><circle cx=\"300\" cy=\"260\" r=\"190\" fill=\"none\" stroke=\"#D5DAE1\" stroke-width=\"8\"/><circle cx=\"300\" cy=\"70\" r=\"48\" fill=\"#D5DAE1\"/><circle cx=\"481\" cy=\"201\" r=\"48\" fill=\"#D5DAE1\"/><circle cx=\"412\" cy=\"414\" r=\"48\" fill=\"#8A94A6\"/><circle cx=\"188\" cy=\"414\" r=\"48\" fill=\"#1E2533\"/><circle cx=\"119\" cy=\"201\" r=\"48\" fill=\"#E2783B\"/><path d=\"M170 225 Q300 330 422 225\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"8\" stroke-dasharray=\"22 14\" stroke-linecap=\"round\"/><path d=\"M440 208 L432 250 L400 232 Z\" fill=\"#E2783B\"/><\/g><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:28px\">\n<p><b>Tìm kiếm<\/b> · trước khi mua<\/p>\n<p><b style=\"color:#E2783B\">Chia sẻ<\/b> · nguồn tìm kiếm của người sau<\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng wifi – case DigiNet\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 26 A34 34 0 0 1 56 26\"/><path d=\"M16 35 A22 22 0 0 1 48 35\"/><path d=\"M24 44 A11 11 0 0 1 40 44\"/><circle cx=\"32\" cy=\"53\" r=\"4\" fill=\"#E2783B\" stroke=\"none\"/><\/g><\/svg><p style=\"color:#5B6577\">DigiNet: bài \"bẫy giá\" của Hùng, 500 lượt chia sẻ<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-34", "label": "B1 · 38", "session": 1, "part": "s6", "title": "Khách hàng thường đã quyết định trước khi gặp doanh nghiệp", "activity": "", "points": ["ZMOT · đọc, so sánh, hỏi người quen", "Bị loại trước cả buổi tư vấn đầu tiên", "Life Biz School: 43% so sánh từ 3 trường trở lên"], "notes": "① MỞ\n\"Khi một khách hàng bước vào văn phòng, gọi điện cho nhân viên tư vấn, hay đăng ký buổi giới thiệu của anh chị – theo anh chị, họ đã đi được bao nhiêu phần trăm quãng đường ra quyết định?\"\n\n② GIẢNG\nNăm 2011, Google công bố khái niệm ZMOT – Zero Moment of Truth, \"khoảnh khắc sự thật số không\" – trong cuốn sách của Jim Lecinski. Trước đó, P&G đã nói về \"khoảnh khắc sự thật thứ nhất\": vài giây khách đứng trước kệ hàng. Google chỉ ra rằng trước kệ hàng còn một khoảnh khắc khác: lúc khách cầm điện thoại, tìm kiếm, đọc đánh giá, xem video, hỏi trong nhóm bạn bè. Ở khoảnh khắc đó, danh sách lựa chọn được thu hẹp lại. Doanh nghiệp không xuất hiện, hoặc xuất hiện với những đánh giá tiêu cực, sẽ bị loại khỏi danh sách mà không bao giờ biết mình đã thua. Điều nguy hiểm là: không có một báo cáo nào ghi lại những khách hàng đã loại chúng ta ở ZMOT.\n\n③ MINH HỌA\nCase Life Biz School: 43% người quan tâm so sánh từ ba trường trở lên và cân nhắc kéo dài ba đến sáu tháng – rất dễ rơi vào trạng thái \"phân tích tê liệt\". Trong khi đó, website của trường giới thiệu sáu chương trình khiến 58% người xem cảm thấy rối, không có công cụ so sánh hay tính toán lợi ích đầu tư. Buổi Open Day bị 47% người tham dự đánh giá tiêu cực vì \"giống buổi bán hàng\" và thiếu bằng chứng thực tế từ cựu học viên. Hãy hình dung anh Tuấn, CEO một doanh nghiệp nhỏ, thời gian rất hạn chế: nếu ở ZMOT anh không tìm được câu chuyện của những người giống mình, anh sẽ không bao giờ đến Open Day.\n\n④ LIÊN HỆ\nVới nhà quản lý, câu hỏi cần đặt ra là: khi khách hàng mục tiêu tìm hiểu về chúng ta lúc 11 giờ đêm, họ thấy gì? Nội dung đó do ai tạo ra – doanh nghiệp, hay khách hàng cũ? Và nó có trả lời được nỗi lo lớn nhất của họ không? Ở ZMOT, bằng chứng từ khách hàng thật thường thuyết phục hơn mọi thông điệp quảng cáo.\n\n★ CÂU CHỐT: \"Cuộc cạnh tranh thường đã có kết quả trước khi khách hàng gặp nhân viên bán hàng đầu tiên.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Trong quyết định mua lớn gần nhất của chính anh chị – một chiếc xe, một khóa học, một phần mềm – anh chị đã loại những lựa chọn nào mà chưa từng liên hệ với họ? Vì sao?\"\nNếu lớp im lặng: kể trải nghiệm của giảng viên khi chọn một dịch vụ và đã loại một nhà cung cấp chỉ vì website khó hiểu.\nCâu trả lời có thể gặp: \"Tôi loại vì không thấy giá công khai\" → phản hồi: đó là một điểm đau ở ZMOT mà rất nhiều doanh nghiệp B2B đang mắc phải.\n\n⑥ CHUYỂN Ý\n\"ZMOT chỉ là một đoạn trong hành trình. Để nhìn toàn cảnh, chúng ta cần một công cụ: bản đồ hành trình khách hàng.\"", "html": "<section id=\"b1-34\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Khách hàng thường đã quyết định trước khi gặp doanh nghiệp<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Điện thoại hiển thị ba lựa chọn được chấm điểm, lựa chọn ở giữa viền cam được chọn; kính lúp cam ở góc dưới\" width=\"560\" height=\"520\" viewBox=\"0 0 560 520\" style=\"width:560px; height:520px\"><rect x=\"170\" y=\"10\" width=\"280\" height=\"500\" rx=\"40\" fill=\"#FFFFFF\" stroke=\"#1E2533\" stroke-width=\"8\"/><rect x=\"190\" y=\"70\" width=\"240\" height=\"110\" rx=\"14\" fill=\"none\" stroke=\"#D5DAE1\" stroke-width=\"8\"/><rect x=\"210\" y=\"92\" width=\"120\" height=\"16\" rx=\"6\" fill=\"#D5DAE1\"/><circle cx=\"215\" cy=\"145\" r=\"11\" fill=\"#E2783B\"/><circle cx=\"249\" cy=\"145\" r=\"11\" fill=\"#E2783B\"/><circle cx=\"283\" cy=\"145\" r=\"11\" fill=\"#D5DAE1\"/><circle cx=\"317\" cy=\"145\" r=\"11\" fill=\"#D5DAE1\"/><circle cx=\"351\" cy=\"145\" r=\"11\" fill=\"#D5DAE1\"/><rect x=\"190\" y=\"205\" width=\"240\" height=\"110\" rx=\"14\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"8\"/><rect x=\"210\" y=\"227\" width=\"140\" height=\"16\" rx=\"6\" fill=\"#1E2533\"/><circle cx=\"215\" cy=\"280\" r=\"11\" fill=\"#E2783B\"/><circle cx=\"249\" cy=\"280\" r=\"11\" fill=\"#E2783B\"/><circle cx=\"283\" cy=\"280\" r=\"11\" fill=\"#E2783B\"/><circle cx=\"317\" cy=\"280\" r=\"11\" fill=\"#E2783B\"/><circle cx=\"351\" cy=\"280\" r=\"11\" fill=\"#E2783B\"/><rect x=\"190\" y=\"340\" width=\"240\" height=\"110\" rx=\"14\" fill=\"none\" stroke=\"#D5DAE1\" stroke-width=\"8\"/><rect x=\"210\" y=\"362\" width=\"100\" height=\"16\" rx=\"6\" fill=\"#D5DAE1\"/><circle cx=\"215\" cy=\"415\" r=\"11\" fill=\"#E2783B\"/><circle cx=\"249\" cy=\"415\" r=\"11\" fill=\"#E2783B\"/><circle cx=\"283\" cy=\"415\" r=\"11\" fill=\"#E2783B\"/><circle cx=\"317\" cy=\"415\" r=\"11\" fill=\"#D5DAE1\"/><circle cx=\"351\" cy=\"415\" r=\"11\" fill=\"#D5DAE1\"/><circle cx=\"110\" cy=\"400\" r=\"62\" fill=\"#FFFFFF\" stroke=\"#E2783B\" stroke-width=\"16\"/><line x1=\"64\" y1=\"446\" x2=\"20\" y2=\"495\" stroke=\"#E2783B\" stroke-width=\"22\" stroke-linecap=\"round\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:40px\">\n<p><b style=\"color:#E2783B\">ZMOT<\/b> · đọc, so sánh, hỏi người quen<\/p>\n<p>Bị loại trước cả buổi tư vấn đầu tiên<\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng mũ tốt nghiệp – case Life Biz School\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 24 L32 12 L60 24 L32 36 Z\"/><path d=\"M16 30 V42 C 24 50, 40 50, 48 42 V30\"/><line x1=\"56\" y1=\"26\" x2=\"56\" y2=\"42\"/><\/g><\/svg><p style=\"color:#5B6577\">Life Biz School: 43% so sánh từ 3 trường trở lên<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-35", "label": "B1 · 39", "session": 1, "part": "s6", "title": "Bản đồ hành trình khách hàng: sáu giai đoạn, năm lớp thông tin", "activity": "", "points": ["Cột · Nhận thức → Ủng hộ", "Hàng · làm, nghĩ, điểm chạm, điểm đau, cảm xúc", "TechPharma: mua thuốc cho con ốm lúc nửa đêm"], "notes": "① MỞ\n\"Một bản đồ tốt không vẽ tất cả mọi thứ. Nó vẽ đủ để người xem biết mình đang ở đâu và nên đi tiếp theo hướng nào. Bản đồ hành trình khách hàng cũng vậy.\"\n\n② GIẢNG\nBản đồ hành trình khách hàng (Customer Journey Map) là một hình ảnh trực quan mô tả toàn bộ những gì một persona trải qua với doanh nghiệp. Mẫu các nhóm sẽ dùng có hai trục. Trục ngang là sáu giai đoạn: Nhận thức – khách nhận ra mình có nhu cầu; Tìm hiểu – tìm kiếm thông tin; Cân nhắc – so sánh các lựa chọn; Mua hàng; Sử dụng; và Ủng hộ – chia sẻ, giới thiệu, hoặc rời bỏ. Trục dọc là các lớp thông tin: khách hàng làm gì, nghĩ gì, tiếp xúc qua điểm chạm nào, gặp điểm đau nào, và cảm xúc lên xuống ra sao. Mẫu đầy đủ còn có thêm hàng \"mong muốn\", \"giải pháp\" và \"phòng ban phụ trách\" – ba hàng này chúng ta sẽ dùng nhiều hơn ở Buổi 2. Nguyên tắc quan trọng nhất: bản đồ được vẽ cho MỘT persona cụ thể, trong MỘT tình huống cụ thể. Một bản đồ \"cho mọi khách hàng\" thường không giúp ra quyết định nào cả.\n\n③ MINH HỌA\nCase TechPharma gợi ý một tình huống rất cụ thể: \"mua thuốc cho con ốm lúc nửa đêm\". Chị Mai, 30 tuổi, con hai tuổi đang sốt. Nhận thức: 11 giờ đêm, con sốt cao. Tìm hiểu: chị mở ứng dụng, lo lắng không biết thuốc nào phù hợp. Cân nhắc: chị muốn hỏi dược sĩ nhưng không biết có ai trực không. Mua hàng: đặt siro, chọn giao trong hai giờ. Sử dụng: nhận hàng – và đó là lúc câu chuyện có thể trở thành một khoảnh khắc biết ơn, hoặc một thảm họa. Chỉ với một tình huống, bản đồ đã cho thấy những điểm chạm mà báo cáo doanh số không bao giờ thể hiện: dược sĩ trực đêm, hotline ngoài giờ, người giao hàng.\n\n④ LIÊN HỆ\nVới nhà quản lý, bản đồ hành trình nên được vẽ bởi một nhóm liên phòng ban và dựa trên dữ liệu thật – phỏng vấn, quan sát, dữ liệu vận hành – thay vì giả định trong phòng họp. Giá trị của nó không nằm ở bản vẽ đẹp, mà ở cuộc thảo luận khi các phòng ban cùng nhìn thấy một hành trình.\n\n★ CÂU CHỐT: \"Vẽ bản đồ cho một người cụ thể, trong một tình huống cụ thể – rồi anh chị sẽ thấy những điều mà báo cáo tổng hợp che khuất.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Doanh nghiệp anh chị đã từng vẽ bản đồ hành trình chưa? Nếu có, nó đang nằm ở đâu – trên tường phòng họp, hay trong một thư mục không ai mở?\"\nNếu lớp im lặng: hỏi giơ tay \"đã từng vẽ\", \"đang dùng thường xuyên\".\nCâu trả lời có thể gặp: \"Có vẽ một lần khi làm dự án với tư vấn\" → phản hồi: bản đồ chỉ có giá trị khi được cập nhật và gắn với người chịu trách nhiệm cho từng đoạn.\n\n⑥ CHUYỂN Ý\n\"Trên bản đồ có hàng chục điểm chạm. Nhưng không phải điểm chạm nào cũng quan trọng như nhau.\"", "html": "<section id=\"b1-35\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Bản đồ hành trình khách hàng: sáu giai đoạn, năm lớp thông tin<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Lưới bản đồ hành trình: sáu mũi tên giai đoạn ở trên, bốn hàng ô xám, một ô điểm đau màu cam và đường cảm xúc xám tối nhạt ở dưới\" width=\"640\" height=\"500\" viewBox=\"0 0 640 500\" style=\"width:640px; height:500px\"><path d=\"M10 20 L96 20 L110 50 L96 80 L10 80 L24 50 Z\" fill=\"#1E2533\"/><path d=\"M115 20 L201 20 L215 50 L201 80 L115 80 L129 50 Z\" fill=\"#1E2533\"/><path d=\"M220 20 L306 20 L320 50 L306 80 L220 80 L234 50 Z\" fill=\"#1E2533\"/><path d=\"M325 20 L411 20 L425 50 L411 80 L325 80 L339 50 Z\" fill=\"#1E2533\"/><path d=\"M430 20 L516 20 L530 50 L516 80 L430 80 L444 50 Z\" fill=\"#1E2533\"/><path d=\"M535 20 L621 20 L635 50 L621 80 L535 80 L549 50 Z\" fill=\"#1E2533\"/><rect x=\"15\" y=\"105\" width=\"90\" height=\"48\" rx=\"8\" fill=\"#D5DAE1\"/><rect x=\"120\" y=\"105\" width=\"90\" height=\"48\" rx=\"8\" fill=\"#D5DAE1\"/><rect x=\"225\" y=\"105\" width=\"90\" height=\"48\" rx=\"8\" fill=\"#D5DAE1\"/><rect x=\"330\" y=\"105\" width=\"90\" height=\"48\" rx=\"8\" fill=\"#D5DAE1\"/><rect x=\"435\" y=\"105\" width=\"90\" height=\"48\" rx=\"8\" fill=\"#D5DAE1\"/><rect x=\"540\" y=\"105\" width=\"90\" height=\"48\" rx=\"8\" fill=\"#D5DAE1\"/><rect x=\"15\" y=\"175\" width=\"90\" height=\"48\" rx=\"8\" fill=\"#D5DAE1\"/><rect x=\"120\" y=\"175\" width=\"90\" height=\"48\" rx=\"8\" fill=\"#D5DAE1\"/><rect x=\"225\" y=\"175\" width=\"90\" height=\"48\" rx=\"8\" fill=\"#D5DAE1\"/><rect x=\"330\" y=\"175\" width=\"90\" height=\"48\" rx=\"8\" fill=\"#D5DAE1\"/><rect x=\"435\" y=\"175\" width=\"90\" height=\"48\" rx=\"8\" fill=\"#D5DAE1\"/><rect x=\"540\" y=\"175\" width=\"90\" height=\"48\" rx=\"8\" fill=\"#D5DAE1\"/><rect x=\"15\" y=\"245\" width=\"90\" height=\"48\" rx=\"8\" fill=\"#D5DAE1\"/><rect x=\"120\" y=\"245\" width=\"90\" height=\"48\" rx=\"8\" fill=\"#D5DAE1\"/><rect x=\"225\" y=\"245\" width=\"90\" height=\"48\" rx=\"8\" fill=\"#D5DAE1\"/><rect x=\"330\" y=\"245\" width=\"90\" height=\"48\" rx=\"8\" fill=\"#D5DAE1\"/><rect x=\"435\" y=\"245\" width=\"90\" height=\"48\" rx=\"8\" fill=\"#D5DAE1\"/><rect x=\"540\" y=\"245\" width=\"90\" height=\"48\" rx=\"8\" fill=\"#D5DAE1\"/><rect x=\"15\" y=\"315\" width=\"90\" height=\"48\" rx=\"8\" fill=\"#D5DAE1\"/><rect x=\"120\" y=\"315\" width=\"90\" height=\"48\" rx=\"8\" fill=\"#D5DAE1\"/><rect x=\"225\" y=\"315\" width=\"90\" height=\"48\" rx=\"8\" fill=\"#D5DAE1\"/><rect x=\"330\" y=\"315\" width=\"90\" height=\"48\" rx=\"8\" fill=\"#E2783B\"/><rect x=\"435\" y=\"315\" width=\"90\" height=\"48\" rx=\"8\" fill=\"#D5DAE1\"/><rect x=\"540\" y=\"315\" width=\"90\" height=\"48\" rx=\"8\" fill=\"#D5DAE1\"/><polyline points=\"60,430 165,405 270,455 375,480 480,440 585,400\" fill=\"none\" stroke=\"#8A94A6\" stroke-width=\"8\" stroke-linejoin=\"round\"/><circle cx=\"60\" cy=\"430\" r=\"12\" fill=\"#8A94A6\"/><circle cx=\"165\" cy=\"405\" r=\"12\" fill=\"#8A94A6\"/><circle cx=\"270\" cy=\"455\" r=\"12\" fill=\"#8A94A6\"/><circle cx=\"375\" cy=\"480\" r=\"12\" fill=\"#8A94A6\"/><circle cx=\"480\" cy=\"440\" r=\"12\" fill=\"#8A94A6\"/><circle cx=\"585\" cy=\"400\" r=\"12\" fill=\"#8A94A6\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:40px\">\n<p><b>Cột<\/b> · Nhận thức → Ủng hộ<\/p>\n<p><b style=\"color:#E2783B\">Hàng<\/b> · làm, nghĩ, điểm chạm, điểm đau, cảm xúc<\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng viên thuốc – case TechPharma\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><g transform=\"rotate(-40 32 32)\"><rect x=\"6\" y=\"21\" width=\"52\" height=\"22\" rx=\"11\"/><line x1=\"32\" y1=\"21\" x2=\"32\" y2=\"43\"/><\/g><\/g><\/svg><p style=\"color:#5B6577\">TechPharma: mua thuốc cho con ốm lúc nửa đêm<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-36", "label": "B1 · 40", "session": 1, "part": "s6", "title": "Bốn khoảnh khắc sự thật quyết định cảm nhận của khách hàng", "activity": "", "points": ["ZMOT tìm hiểu · FMOT chọn mua", "SMOT sử dụng · UMOT chia sẻ", "TechPharma: đặt siro cho con, nhận thuốc viên lúc 2 giờ sáng"], "notes": "① MỞ\n\"Khái niệm 'khoảnh khắc sự thật' được Jan Carlzon, CEO hãng hàng không SAS, phổ biến từ những năm 1980: mỗi lần khách hàng tiếp xúc với nhân viên chỉ kéo dài khoảng mười lăm giây, nhưng chính những giây đó quyết định khách nghĩ gì về cả hãng.\"\n\n② GIẢNG\nNgày nay, chúng ta thường nói về bốn khoảnh khắc sự thật nối với nhau thành một vòng. ZMOT – khoảnh khắc số không: khi khách tìm hiểu trên mạng, như vừa bàn. FMOT – khoảnh khắc thứ nhất, khái niệm P&G sử dụng từ giữa những năm 2000: khi khách đứng trước lựa chọn tại điểm bán, trên kệ hàng hay trên trang thanh toán, và quyết định trong vài giây. SMOT – khoảnh khắc thứ hai: khi khách sử dụng sản phẩm và kiểm chứng lời hứa. UMOT – khoảnh khắc tối thượng, theo Brian Solis: khi khách chia sẻ trải nghiệm của mình, và chia sẻ đó trở thành ZMOT của người tiếp theo. Vòng tròn khép lại. Ý nghĩa quản trị: nguồn lực có hạn, nên hãy đầu tư có chủ đích vào những khoảnh khắc có sức nặng cảm xúc lớn nhất, thay vì dàn đều cho mọi điểm chạm.\n\n③ MINH HỌA\nTiếp tục câu chuyện chị Mai trong case TechPharma. Chị đặt siro hạ sốt cho con hai tuổi qua ứng dụng. Đơn hàng giao đến là thuốc dạng viên dành cho người lớn. Chị phát hiện ra lúc 2 giờ sáng, gọi hotline thì đã ngoài giờ làm việc. Đó là một SMOT thất bại – đúng vào lúc khách hàng lo lắng và dễ tổn thương nhất. Hệ quả nằm ngay ở UMOT: chị xóa ứng dụng và kể lại trong một cộng đồng khoảng 5.000 bà mẹ. Và câu chuyện đó trở thành ZMOT cho hàng nghìn khách hàng tiềm năng khác. Một sai sót kho vận nhỏ, nhân với một khoảnh khắc cảm xúc lớn, nhân với vòng lặp chia sẻ.\n\n④ LIÊN HỆ\nNhà quản lý nên hỏi: trong hành trình của khách hàng chúng ta, đâu là khoảnh khắc khách lo lắng nhất, cần giúp đỡ nhất? Ai đang có mặt ở khoảnh khắc đó – một nhân viên được trao quyền, hay một tổng đài tự động ngoài giờ?\n\n★ CÂU CHỐT: \"Không phải điểm chạm nào cũng như nhau. Hãy thắng ở những khoảnh khắc khách hàng cần chúng ta nhất.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Với khách hàng của anh chị, khoảnh khắc sự thật quan trọng nhất là khoảnh khắc nào – và hiện ai trong tổ chức đang 'sở hữu' khoảnh khắc đó?\"\nNếu lớp im lặng: gợi ý theo ngành – ngân hàng (lúc thẻ bị khóa ở nước ngoài), bất động sản (lúc bàn giao nhà), phần mềm (tuần đầu triển khai).\nCâu trả lời có thể gặp: \"Lúc giao hàng, nhưng giao hàng là đối tác thuê ngoài\" → phản hồi: khách hàng không phân biệt; đối tác là một phần trải nghiệm của thương hiệu anh chị.\n\n⑥ CHUYỂN Ý\n\"Làm thế nào để biết khoảnh khắc nào nặng cảm xúc nhất? Chúng ta vẽ thêm một đường lên bản đồ: đường cảm xúc.\"", "html": "<section id=\"b1-36\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Bốn khoảnh khắc sự thật quyết định cảm nhận của khách hàng<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Vòng elip xám nối bốn điểm tròn: cam bên trái, xám nhạt ở trên, trắng bên phải, trắng ở dưới, mũi tên quay về điểm cam\" width=\"600\" height=\"480\" viewBox=\"0 0 600 480\" style=\"width:600px; height:480px\"><ellipse cx=\"300\" cy=\"240\" rx=\"240\" ry=\"170\" fill=\"none\" stroke=\"#D5DAE1\" stroke-width=\"8\"/><circle cx=\"60\" cy=\"240\" r=\"50\" fill=\"#E2783B\"/><circle cx=\"300\" cy=\"70\" r=\"56\" fill=\"#8A94A6\"/><circle cx=\"540\" cy=\"240\" r=\"60\" fill=\"#1E2533\"/><circle cx=\"300\" cy=\"410\" r=\"56\" fill=\"#1E2533\"/><path d=\"M96 318 L136 336 L108 364 Z\" fill=\"#D5DAE1\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:40px\">\n<p><b style=\"color:#E2783B\">ZMOT<\/b> tìm hiểu · <b>FMOT<\/b> chọn mua<\/p>\n<p><b>SMOT<\/b> sử dụng · <b>UMOT<\/b> chia sẻ<\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng viên thuốc – case TechPharma\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><g transform=\"rotate(-40 32 32)\"><rect x=\"6\" y=\"21\" width=\"52\" height=\"22\" rx=\"11\"/><line x1=\"32\" y1=\"21\" x2=\"32\" y2=\"43\"/><\/g><\/g><\/svg><p style=\"color:#5B6577\">TechPharma: đặt siro cho con, nhận thuốc viên lúc 2 giờ sáng<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-37", "label": "B1 · 41", "session": 1, "part": "s6", "title": "Đường cảm xúc chỉ ra nơi khách hàng dễ rời bỏ nhất", "activity": "", "points": ["Điểm đáy · nơi cần can thiệp", "Đỉnh và kết thúc · điều được nhớ lại", "Life Biz School: đóng 220 triệu, 6 tuần không một thông tin"], "notes": "① MỞ\n\"Anh chị hãy nhớ lại kỳ nghỉ gần nhất của mình. Anh chị nhớ gì? Thường không phải là trung bình của từng ngày, mà là một khoảnh khắc đẹp nhất – và ngày cuối cùng.\"\n\n② GIẢNG\nĐường cảm xúc là lớp thông tin quan trọng nhất trên bản đồ hành trình, vì nó biến một danh sách điểm chạm thành một câu chuyện có lên có xuống. Có hai điều cần đọc trên đường này. Thứ nhất, điểm đáy: nơi cảm xúc xuống thấp nhất, nơi khách dễ bỏ cuộc, hủy đơn, hoặc bắt đầu tìm đối thủ. Đây là nơi cần can thiệp trước tiên. Thứ hai, đỉnh và kết thúc: nhà tâm lý học Daniel Kahneman, người đoạt giải Nobel kinh tế, chỉ ra quy luật Peak-End – con người đánh giá một trải nghiệm chủ yếu dựa trên khoảnh khắc cường độ cao nhất và khoảnh khắc kết thúc, chứ không phải trung bình của toàn bộ. Hệ quả quản trị: không cần hoàn hảo ở mọi điểm, nhưng phải xử lý được điểm đáy, thiết kế có chủ đích một đỉnh, và chăm chút phần kết.\n\n③ MINH HỌA\nCase Life Biz School có một đường cảm xúc rất điển hình. Học viên đi từ kỳ vọng, sang hoài nghi, kiệt sức, rồi tự hào khi tốt nghiệp. Điểm đáy đầu tiên là \"vùng chết\" bốn đến tám tuần sau khi nộp hồ sơ: 23% học viên rơi vào cảm giác hối tiếc sau khi mua. Anh Minh, 28 tuổi, đóng 220 triệu – tương đương bảy đến chín tháng lương – rồi chờ sáu tuần đến ngày khai giảng mà không nhận được một email hay video nào. Anh bắt đầu so sánh với khóa học trực tuyến 80 triệu và suýt hủy. Câu chuyện \"220 triệu mà im lặng sáu tuần\" lan ra. Điểm đáy thứ hai là giai đoạn tháng 8 đến 15, khi 15% học viên rời rụng. Đỉnh cảm xúc đã có sẵn – lễ tốt nghiệp – nhưng phần kết lại là cảm giác \"bị bỏ rơi\" của 40% cựu học viên.\n\n④ LIÊN HỆ\nNhà quản lý nên đặt câu hỏi cho đội ngũ: điểm đáy trong hành trình của khách hàng chúng ta nằm ở đâu, có số liệu nào chứng minh, và ai đang chịu trách nhiệm cho khoảng thời gian đó? Rất thường, điểm đáy nằm ở những khoảng \"trống\" giữa hai phòng ban.\n\n★ CÂU CHỐT: \"Khách hàng không nhớ trung bình. Họ nhớ đỉnh cao nhất, đáy sâu nhất và cách mọi chuyện kết thúc.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Trong hành trình khách hàng của anh chị, đâu là một 'vùng im lặng' – khi khách đã trả tiền nhưng chưa nhận được giá trị?\"\nNếu lớp im lặng: gợi ý – thời gian chờ bàn giao căn hộ, chờ lắp đặt, chờ triển khai phần mềm, chờ duyệt hồ sơ vay.\nCâu trả lời có thể gặp: \"Khách chờ bàn giao nhà hai năm\" → phản hồi: hai năm là một khoảng trống cảm xúc rất lớn; một bản tin tiến độ định kỳ có thể biến điểm đáy thành sự yên tâm.\n\n⑥ CHUYỂN Ý\n\"Cho tới giờ, chúng ta nói về hành trình của một người. Nhưng trong B2B, quyết định mua thường có nhiều người tham gia.\"", "html": "<section id=\"b1-37\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Đường cảm xúc chỉ ra nơi khách hàng dễ rời bỏ nhất<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Đường cảm xúc màu cam đi lên, rơi xuống đáy sâu trong vùng xám, rồi đi lên đỉnh màu trắng và kết thúc ở điểm xám nhạt\" width=\"680\" height=\"480\" viewBox=\"0 0 680 480\" style=\"width:680px; height:480px\"><rect x=\"300\" y=\"20\" width=\"150\" height=\"440\" rx=\"12\" fill=\"#D5DAE1\" fill-opacity=\"0.4\"/><line x1=\"20\" y1=\"240\" x2=\"660\" y2=\"240\" stroke=\"#D5DAE1\" stroke-width=\"8\" stroke-dasharray=\"18 12\"/><path d=\"M30 220 C 100 110, 190 110, 250 180 C 300 240, 330 410, 375 410 C 430 410, 470 260, 520 160 C 560 90, 610 90, 650 130\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"8\" stroke-linecap=\"round\"/><circle cx=\"375\" cy=\"410\" r=\"20\" fill=\"#1E2533\"/><circle cx=\"585\" cy=\"98\" r=\"20\" fill=\"#1E2533\"/><circle cx=\"650\" cy=\"130\" r=\"16\" fill=\"#8A94A6\"/><\/svg>\n<div style=\"flex:1; display:flex; flex-direction:column; gap:40px\">\n<p><b>Điểm đáy<\/b> · nơi cần can thiệp<\/p>\n<p><b>Đỉnh<\/b> và <b>kết thúc<\/b> · điều được nhớ lại<\/p>\n<div style=\"display:flex; flex-direction:row; gap:24px; align-items:center\"><svg aria-label=\"Biểu tượng mũ tốt nghiệp – case Life Biz School\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" style=\"flex:none; width:80px; height:80px\"><g transform=\"scale(1.25)\" fill=\"none\" stroke=\"#E2783B\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 24 L32 12 L60 24 L32 36 Z\"/><path d=\"M16 30 V42 C 24 50, 40 50, 48 42 V30\"/><line x1=\"56\" y1=\"26\" x2=\"56\" y2=\"42\"/><\/g><\/svg><p style=\"color:#5B6577\">Life Biz School: đóng 220 triệu, 6 tuần không một thông tin<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>"}, {"id": "b1-38", "label": "B1 · 42", "session": 1, "part": "s6", "title": "Trong B2B, mỗi vai trò có một hành trình riêng", "activity": "", "points": ["Người mua · hiệu quả đầu tư, rủi ro", "Người dùng · dễ dùng, ít xáo trộn", "BizManage: CEO ký hợp đồng, kế toán vẫn dùng Excel"], "notes": "① MỞ\n\"Trong B2C, người trả tiền và người sử dụng thường là một. Trong B2B, người ký hợp đồng có thể không bao giờ mở phần mềm ra dùng. Vậy chúng ta đang thiết kế trải nghiệm cho ai?\"\n\n② GIẢNG\nWebster và Wind, từ năm 1972, đã mô tả khái niệm \"trung tâm mua hàng\" (buying center): quyết định mua của một tổ chức có sự tham gia của nhiều vai trò. Người dùng – những người làm việc hằng ngày với sản phẩm. Người ảnh hưởng – thường là chuyên gia kỹ thuật, đánh giá tiêu chuẩn. Người quyết định – có quyền phê duyệt cuối cùng. Người mua – thực hiện thủ tục, đàm phán. Người gác cổng – kiểm soát luồng thông tin tới những người còn lại. Mỗi vai trò có mối quan tâm, nỗi sợ và thước đo thành công khác nhau: người quyết định lo về hiệu quả đầu tư và rủi ro; người phụ trách kỹ thuật lo về bảo mật và tích hợp; người dùng lo về việc phải học lại, phải thay đổi thói quen. Vì vậy, trong B2B, vẽ bản đồ hành trình cũng là vẽ bản đồ quyền lực và ảnh hưởng. Chu kỳ ra quyết định dài, thường từ ba đến mười hai tháng, và hành trình không kết thúc khi ký hợp đồng – doanh thu chỉ thực sự đến khi khách gia hạn.\n\n③ MINH HỌA\nCase BizManage có đủ các vai trò này. Anh Khoa, CEO – người mua – cần thấy hiệu quả đầu tư rõ ràng trong sáu tháng. Anh Đức, trưởng bộ phận công nghệ – người ảnh hưởng – lo về bảo mật, API và khả năng tích hợp hệ thống cũ. Chị Nga, trưởng phòng kế toán – người dùng – cần một công cụ \"dễ như Excel\". Kết quả: anh Khoa đầu tư 200 triệu, nhưng sau năm tháng triển khai, chỉ 12 trên 50 nhân viên sử dụng, và bộ phận chăm sóc khách hàng không trả lời được câu hỏi của anh về hiệu quả đầu tư. BizManage đã bán thành công cho người mua, nhưng thất bại với người dùng – và cuối cùng mất luôn người mua.\n\n④ LIÊN HỆ\nVới các doanh nghiệp B2B trong lớp, hãy tự hỏi: đội ngũ bán hàng đang chăm sóc ai, và đội triển khai đang chăm sóc ai? Có ai chịu trách nhiệm cho trải nghiệm của người dùng cuối không? Trong mô hình thuê bao, 85% doanh thu có thể đến từ việc gia hạn – nghĩa là người dùng cuối, dù không ký hợp đồng, lại nắm lá phiếu quan trọng nhất.\n\n★ CÂU CHỐT: \"Trong B2B, anh chị bán cho người ký hợp đồng, nhưng giữ khách nhờ người sử dụng.\"\n\n⑤ TƯƠNG TÁC\nCâu hỏi: \"Trong khách hàng doanh nghiệp của anh chị, ai là người ký, ai là người dùng – và anh chị đang hiểu ai rõ hơn?\"\nNếu lớp im lặng: hỏi trực tiếp học viên làm B2B về một hợp đồng bị mất khi gia hạn.\nCâu trả lời có thể gặp: \"Chúng tôi chủ yếu làm việc với phòng mua hàng\" → phản hồi: phòng mua hàng thường chỉ tối ưu giá; giá trị trải nghiệm cần được nói tới người dùng và người quyết định.\n\n⑥ CHUYỂN Ý\n\"Hành trình của khách hàng – dù B2C hay B2B – luôn đi xuyên qua nhiều phòng ban của chúng ta. Và đó chính là vấn đề.\"", "html": "<section id=\"b1-38\" data-transition=\"fade\" style=\"background:#FFFFFF; color:#1E2533; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:60px; font-weight:500; line-height:1.3; padding:112px 128px; display:flex; flex-direction:column; gap:48px\">\n<h2 style=\"font-size:88px; font-weight:800; line-height:1.12; color:#1E2533\">Trong B2B, mỗi vai trò có một hành trình riêng<\/h2>\n<div style=\"display:flex; flex-direction:row; gap:64px; align-items:center\">\n<svg stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Ba người màu trắng, xám nhạt và cam, mỗi người đi một con đường khác nhau tới cùng một mục tiêu\" width=\"544\" height=\"384\" viewBox=\"0 0 544 384\" style=\"width:544px; height:384px\"><g transform=\"scale(0.800)\"><circle cx=\"60\" cy=\"56\" r=\"26\" fill=\"#1E2533\"/><path d=\"M24 134 Q60 76 96 134 Z\" fill=\"#1E2533\"/><circle cx=\"60\" cy=\"216\" r=\"26\" fill=\"#8A94A6\"/><path d=\"M24 294 Q60 236 96 294 Z\" fill=\"#8A94A6\"/><circle cx=\"60\" cy=
